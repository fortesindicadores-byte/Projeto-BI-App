<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tipos de Pneus — Prolog</title>
<script>try{if(!sessionStorage.getItem("gem_hub"))location.replace("../");}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);}
.brand h1{font-size:16px;font-weight:700;color:var(--orange);}
.brand p{font-size:10px;color:var(--text2);margin-top:2px;}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.back-btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:5px 8px;display:flex;align-items:center;color:var(--orange);text-decoration:none;}
.status-badge{font-size:10px;color:var(--text);background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:3px 10px;white-space:nowrap;}
.csv-btn{background:rgba(59,179,59,.15);border:1px solid rgba(59,179,59,.35);border-radius:4px;padding:5px 10px;color:var(--green);font-family:'Montserrat';font-size:10px;font-weight:800;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;}
.main{padding:22px 24px 80px;}
.kpis{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;}
.kpi{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:12px 18px;min-width:150px;}
.kpi .l{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.kpi .v{font-size:26px;font-weight:800;margin-top:2px;}
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:18px 20px 16px;margin-bottom:16px;backdrop-filter:blur(16px);}
.tbl-title{font-size:16px;font-weight:800;margin-bottom:3px;}
.tbl-sub{font-size:11px;color:var(--text2);margin-bottom:14px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:var(--card);color:var(--text);font-size:11px;font-weight:700;padding:8px 8px 12px;border-bottom:1px solid rgba(255,255,255,.10);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;text-align:left;}
th.num,td.num{text-align:right;}
td{padding:9px 8px;color:var(--text);white-space:nowrap;border-bottom:1px solid rgba(255,255,255,.04);}
tbody tr:hover{background:rgba(255,255,255,.035);}
.pill{display:inline-block;min-width:34px;text-align:center;padding:2px 8px;border-radius:5px;font-weight:800;color:#0C1017;background:var(--orange);}
.mut{color:var(--text3);}
.loading{text-align:center;color:var(--text3);padding:40px;}
.gate{max-width:560px;margin:80px auto;text-align:center;background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:38px;}
/* mobile — mesmo padrão dos demais painéis */
@media(max-width:768px){
  .header{padding:8px 12px 10px;gap:8px;}
  .brand h1{font-size:13px;}
  .brand p{display:none;}
  .status-badge{font-size:8px;padding:2px 6px;}
  .csv-btn{font-size:9px;padding:4px 8px;}
  .main{padding:14px 12px 60px;}
  .kpis{gap:8px;}
  .kpi{flex:1 1 calc(50% - 4px);min-width:0;padding:10px 12px;}
  .kpi .v{font-size:20px;}
  .tbl-section{padding:12px 10px;}
  table{font-size:11px;}
  thead th{font-size:9px;padding:6px 6px 8px;letter-spacing:0;}
  td{padding:7px 6px;}
}
</style>
</head>
<body>
<header class="header">
  <a href="./" class="back-btn" title="Voltar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
  <div class="brand"><h1>Tipos de Pneus</h1><p>Todos os tipos cadastrados no Prolog (leitura da API) — Marca · Modelo · Medida</p></div>
  <div class="header-right"><button class="csv-btn" onclick="baixarCSV()" title="Baixar CSV">CSV</button><span class="status-badge" id="status">Carregando…</span></div>
</header>
<main class="main"><div id="content"><div class="loading">Lendo a base de Pneus (Prolog/Conlog)…</div></div></main>
<script>
const SUPABASE_URL='https://ewbzeqsneeylwkxtcpme.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV3YnplcXNuZWV5bHdreHRjcG1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4NzY2MTcsImV4cCI6MjA5NzQ1MjYxN30.W8W6Yunt6Z8NB73qpOD8eqYlrsgMRgEG-siYsJFwDwE';
const UNIDADE_MAP={1676:'MCC T1',1677:'MCC T2',37:'CGR',1906:'CBA T1 WH',1907:'CBA T1',1878:'CBA T2',20:'FLP',30:'GRL',24:'BLC',2517:'NFR',26:'PLT',38:'PIR',2277:'RON',2550:'ANG'};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
let LINHAS=[];

async function fetchTires(){
  const bids=Object.keys(UNIDADE_MAP);
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const one=bid=>fetch(`${SUPABASE_URL}/rest/v1/snapshot?branch_id=eq.${bid}&endpoint=eq.tires&select=branch_id,data`,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}}).then(r=>r.ok?r.json():null).catch(()=>null);
  const out=[];
  for(let i=0;i<bids.length;i+=3){
    const batch=bids.slice(i,i+3);
    const res=await Promise.all(batch.map(async bid=>{for(let a=0;a<5;a++){const o=await one(bid);if(o!==null)return o;await sleep(700);}return [];}));
    res.flat().forEach(r=>{const uni=UNIDADE_MAP[r.branch_id]||('Unidade '+r.branch_id);(Array.isArray(r.data)?r.data:[]).forEach(t=>{t._uni=uni;out.push(t);});});
    set('status','Lendo… '+out.length+' pneus');
  }
  return out;
}
function render(tires){
  if(!tires.length){document.getElementById('content').innerHTML='<div class="loading">Sem pneus retornados. Confira se o loader já rodou.</div>';return;}
  // agrega por tipo = Marca · Modelo · Medida (com sulcos)
  const map={};
  tires.forEach(t=>{
    const marca=(t.marca||'—').trim(), modelo=(t.modelo||'—').trim(), medida=(t.medida||'—').trim(), sulcos=t.sulcos||'';
    const k=marca+'|'+modelo+'|'+medida+'|'+sulcos;
    const g=map[k]=map[k]||{marca,modelo,medida,sulcos,qtd:0,novos:0,recap:0,unis:new Set()};
    g.qtd++; if((t.cicloVida||1)===1)g.novos++; else g.recap++; if(t._uni)g.unis.add(t._uni);
  });
  const lista=Object.values(map).sort((a,b)=>b.qtd-a.qtd);
  LINHAS=lista;
  const totalPneus=tires.length, totalTipos=lista.length;
  const marcas=new Set(tires.map(t=>(t.marca||'—').trim())).size;
  const medidas=new Set(tires.map(t=>(t.medida||'—').trim())).size;
  let h=`<div class="kpis">
    <div class="kpi"><div class="l">Tipos distintos</div><div class="v" style="color:var(--orange)">${totalTipos}</div></div>
    <div class="kpi"><div class="l">Pneus (total)</div><div class="v">${totalPneus.toLocaleString('pt-BR')}</div></div>
    <div class="kpi"><div class="l">Marcas</div><div class="v">${marcas}</div></div>
    <div class="kpi"><div class="l">Medidas</div><div class="v">${medidas}</div></div>
  </div>`;
  h+=`<div class="tbl-section"><div class="tbl-title">Tipos de pneus cadastrados</div>
    <div class="tbl-sub">Distintos por Marca · Modelo · Medida — ordenado pela quantidade de pneus</div>
    <div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Marca</th><th>Modelo</th><th>Medida</th><th class="num">Sulcos</th><th class="num">Pneus</th><th class="num">Novos</th><th class="num">Recap.</th><th>Unidades</th></tr></thead><tbody>`+
    lista.map((g,i)=>`<tr><td class="mut">${i+1}</td><td><b>${esc(g.marca)}</b></td><td>${esc(g.modelo)}</td><td>${esc(g.medida)}</td>
      <td class="num">${g.sulcos||'—'}</td><td class="num"><span class="pill">${g.qtd}</span></td><td class="num">${g.novos}</td><td class="num">${g.recap}</td>
      <td class="mut">${[...g.unis].sort().join(', ')}</td></tr>`).join('')+`</tbody></table></div></div>`;
  document.getElementById('content').innerHTML=h;
}
function baixarCSV(){
  if(!LINHAS.length)return;
  const head=['Marca','Modelo','Medida','Sulcos','Pneus','Novos','Recapados','Unidades'];
  const rows=LINHAS.map(g=>[g.marca,g.modelo,g.medida,g.sulcos,g.qtd,g.novos,g.recap,[...g.unis].sort().join(' ')]);
  const csv=[head,...rows].map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
  const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('﻿'+csv);a.download='tipos_pneus.csv';document.body.appendChild(a);a.click();document.body.removeChild(a);
}
(async function(){
  try{
    const tires=await fetchTires();
    render(tires);
    const now=new Date();
    set('status','Atualizado '+now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML='<div class="gate"><h2>Erro ao carregar</h2><p>Não consegui ler a base de Pneus. Tente recarregar.</p></div>';
    set('status','Erro');
  }
})();
</script>
<script src="../assets/mobile.js"></script>
<script src="../assets/sortable-table.js"></script>
</body>
</html>
