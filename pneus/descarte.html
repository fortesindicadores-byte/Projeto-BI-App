<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Descarte de Pneus</title>
<script>try{if(!sessionStorage.getItem("gem_hub"))location.replace("../");}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="../assets/pdf-export.js"></script>
<script src="../assets/excel-export.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===================== RESET & BASE ===================== */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  button, input, select, textarea { font-family: 'Montserrat', -apple-system, sans-serif; }

  :root {
    --red:       #F97316;
    --red-dark:  #C2410C;
    --red-soft:  #FF6666;
    --red-glow:  rgba(249,115,22,0.08);
    --bg:        #0C1017;
    --card:      #141B26;
    --card2:     #1A2335;
    --surface:   rgba(20,27,38,0.55);
    --surface2:  rgba(255,255,255,0.06);
    --border:    rgba(255,255,255,0.07);
    --border2:   #1E2D40;
    --text:      #F1F5F9;
    --text-muted:#94A3B8;
    --text3:     #475569;
    --green:     #3BB33B;
    --yellow:    #f39c12;
    --orange:    #e67e22;
    --blue:      #38BDF8;
    --font:      'Montserrat', -apple-system, sans-serif;
    --header-bg: rgba(12,16,23,0.75);
  }

  /* ===== LIGHT MODE ===== */
  body.light-mode {
    --bg:        #F0F0F0;
    --surface:   #FFFFFF;
    --surface2:  rgba(0,0,0,0.05);
    --border:    rgba(0,0,0,0.08);
    --text:      #1a1a1a;
    --text-muted:#555555;
    --text3:     #777777;
    --red-soft:  #EA580C;
    --green:     #1E9E32;
  }

  body.light-mode {
    background: #F0F0F0;
  }

  /* Sidebar continua escura no modo claro */
  body.light-mode .sidebar {
    background: #141414;
    border-right-color: transparent;
  }
  body.light-mode .sidebar .nav-item { color: #999; }
  body.light-mode .sidebar .nav-item:hover { color: #fff; background: rgba(255,255,255,0.06); }
  body.light-mode .sidebar .nav-item.active { color: var(--red); }
  body.light-mode .sidebar-footer { color: #777; }

  /* Cards: brancos sólidos sobre fundo cinza (estilo referência) */
  body.light-mode .card,
  body.light-mode .adh-card,
  body.light-mode .adh-table-wrap {
    background: rgba(128,128,128,.14) !important;
    border: none !important;
    box-shadow: none !important;
    color: #111;
  }
  body.light-mode .card-title,
  body.light-mode .adh-table-title,
  body.light-mode .adh-card-value { color: #111; }
  body.light-mode .adh-table tbody td { color: #111; }
  body.light-mode .farol-dot { color: #111; }
  body.light-mode .adh-table tbody tr { border-bottom-color: rgba(0,0,0,0.025); }
  body.light-mode .adh-table tbody tr:hover { background: rgba(0,0,0,0.03); }
  body.light-mode .adh-table thead tr { background: rgba(0,0,0,0.04); }
  body.light-mode .adh-table thead th { color: #555; }

  body {
    background:
      radial-gradient(ellipse at 10% 25%, rgba(249,115,22,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 90% 75%, rgba(56,189,248,0.05) 0%, transparent 50%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ===================== SIDEBAR ===================== */
  .sidebar {
    position: fixed; top: 0; left: 0;
    width: 220px; height: 100vh;
    background: #141414;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    z-index: 100;
  }

  .sidebar-logo {
    padding: 24px 20px 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-logo .brand {
    font-size: 20px; font-weight: 700;
    color: var(--red); letter-spacing: 1px;
  }

  .sidebar-logo .sub {
    font-size: 11px; color: var(--text-muted);
    margin-top: 2px; text-transform: uppercase; letter-spacing: 1px;
  }

  .nav { padding: 16px 0; flex: 1; }

  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 20px; cursor: pointer;
    font-size: 13px; color: var(--text-muted);
    transition: all 0.2s; border-left: 3px solid transparent;
    user-select: none;
  }

  .nav-item:hover { color: var(--text); background: var(--surface2); }

  .nav-item.active {
    color: var(--red); border-left-color: var(--red);
    background: var(--red-glow);
  }

  .nav-item .icon { font-size: 16px; width: 20px; text-align: center; }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted);
  }

  /* ===================== MAIN ===================== */
  .main {
    margin-left: 0;
    min-height: 100vh;
    display: flex; flex-direction: column;
  }

  .topbar {
    background: #0E121A;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }

  /* Topbar mantém cor escura nos dois modos */
  body.light-mode .topbar { background: #0E121A; }
  body.light-mode .topbar-sub { color: #94A3B8; }
  body.light-mode .status-badge { color: #94A3B8; }
  body.light-mode .theme-btn { color: #94A3B8; background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.1); }
  body.light-mode .ms-btn { color: #F1F5F9; }
  body.light-mode .ms-panel { background: #111; }
  body.light-mode .ms-option { color: #eee; }
  body.light-mode .ms-search { color: #eee; }

  .topbar-row1 {
    height: 48px;
    display: flex; align-items: center;
    gap: 14px;
    padding: 0 24px;
  }

  .topbar-title { font-size: 16px; font-weight: 700; color: var(--red); letter-spacing: 0.3px; }
  body.light-mode .topbar-title { color: var(--red); }
  .topbar-sub   { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

  .topbar-right { display: flex; align-items: center; gap: 8px; }

  .icon-btn {
    background: rgba(249,115,22,0.12);
    border: 1px solid rgba(249,115,22,0.25);
    border-radius: 5px; padding: 5px 7px;
    cursor: pointer; color: var(--red);
    display: flex; align-items: center;
    transition: background 0.15s;
  }
  .icon-btn:hover  { background: rgba(249,115,22,0.25); }
  .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .theme-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 7px;
    cursor: pointer; color: var(--text-muted);
    display: flex; align-items: center;
    transition: background 0.15s;
  }
  .theme-btn:hover { background: rgba(255,255,255,0.12); }

  .status-badge {
    font-size: 10px; font-weight: 600;
    background: rgba(249,115,22,0.10);
    border: 1px solid rgba(249,115,22,0.20);
    border-radius: 4px; padding: 3px 10px;
    color: var(--text-muted); white-space: nowrap;
  }

  /* ===== FILTER BAR ===== */
  .filter-bar {
    display: flex; align-items: center;
    gap: 8px; padding: 8px 24px;
    flex-wrap: wrap;
  }

  .ms-wrap { position: relative; }

  .ms-btn {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--red);
    border-radius: 5px; padding: 6px 12px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: #F1F5F9; cursor: pointer;
    white-space: nowrap; min-width: 100px;
    font-family: var(--font);
    transition: border-color 0.15s, background 0.15s;
  }
  .ms-btn:hover, .ms-btn.open {
    border-color: var(--red);
    background: rgba(249,115,22,0.12);
  }
  .ms-btn .ms-arrow { margin-left: auto; opacity: 0.5; font-size: 9px; }
  .ms-btn .ms-count {
    background: var(--red); color: #fff;
    border-radius: 10px; padding: 1px 6px;
    font-size: 9px; margin-left: 4px;
  }

  .ms-panel {
    position: absolute; top: calc(100% + 4px); left: 0;
    background: #111;
    border: 1px solid var(--border);
    border-radius: 8px; min-width: 200px;
    max-height: 260px; overflow-y: auto;
    box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    z-index: 200; display: none;
  }
  .ms-panel.open { display: block; }

  .ms-search {
    width: 100%; border: none;
    border-bottom: 1px solid var(--border);
    background: transparent; color: var(--text);
    padding: 8px 12px; font-size: 12px;
    outline: none; font-family: var(--font);
  }

  .ms-option {
    display: flex; align-items: center;
    padding: 6px 12px; font-size: 12px;
    cursor: pointer; color: var(--text);
    transition: background 0.1s; gap: 8px;
  }
  .ms-option:hover { background: var(--surface2); }
  .ms-option label { display: flex; align-items: center; gap: 8px; flex: 1; cursor: pointer; }
  .ms-option input[type=checkbox] { accent-color: var(--red); cursor: pointer; flex-shrink: 0; }
  .ms-option.select-all { border-bottom: 1px solid var(--border); font-weight: 700; font-size: 11px; color: var(--text-muted); }

  /* botão "Apenas" por opção */
  .ms-only {
    margin-left: auto; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--red); opacity: 0; padding: 2px 5px;
    border: 1px solid rgba(249,115,22,0.3); border-radius: 3px;
    background: transparent; cursor: pointer; font-family: var(--font);
    flex-shrink: 0;
    transition: opacity 0.15s;
  }
  .ms-option:hover .ms-only { opacity: 1; }

  .content { padding: 28px; flex: 1; min-width: 0; }  /* flex item precisa de min-width:0 p/ encolher (senão a tabela larga estoura a página) */

  /* ===================== LOADING ===================== */
  .loading-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 200; gap: 16px;
  }

  .loading-overlay.hidden { display: none; }

  .spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text { font-size: 14px; color: var(--text-muted); }

  /* ===================== PAGES ===================== */
  .page { display: none; }
  .page.active { display: block; }

  /* ===================== CARDS KPI ===================== */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px; margin-bottom: 24px;
  }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    position: relative; overflow: hidden;
  }

  .kpi-card::before {
    content: '';
    position: absolute; top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--red);
  }

  .kpi-label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 8px;
  }

  .kpi-value {
    font-size: 32px; font-weight: 700;
    line-height: 1;
  }

  .kpi-sub {
    font-size: 11px; color: var(--text-muted);
    margin-top: 6px;
  }

  .kpi-value.red    { color: var(--red); }
  .kpi-value.green  { color: var(--green); }
  .kpi-value.yellow { color: var(--yellow); }
  .kpi-value.orange { color: var(--orange); }

  /* ===================== SECTION ===================== */
  .section-title {
    font-size: 13px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  .section-title::after {
    content: ''; flex: 1; height: 1px;
    background: var(--border);
  }

  /* ===================== GRID 2 COL ===================== */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px; margin-bottom: 24px;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px; margin-bottom: 24px;
  }

  @media (max-width: 900px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
  }

  /* ===================== PAINEL ADERÊNCIA ===================== */
  .adh-hero {
    margin-bottom: 32px;
  }

  .adh-label {
    font-size: 10px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 6px;
  }

  .adh-value {
    font-size: 57px; font-weight: 800;
    line-height: 1;
  }

  .adh-deltas {
    display: flex; gap: 20px; margin-top: 12px;
  }

  .adh-delta {
    font-size: 13px; color: var(--text-muted);
  }

  .adh-delta b {
    font-size: 17px; font-weight: 700;
    display: block; margin-top: 2px;
  }

  /* 3 CARDS */
  .adh-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px; margin-bottom: 28px;
  }

  .adh-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 16px;
    display: flex; flex-direction: column; gap: 3px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  .adh-card-label {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.5px;
    color: var(--text-muted);
  }

  .adh-card-value {
    font-size: 24px; font-weight: 800;
    line-height: 1.1; margin-top: 2px;
    color: var(--text);
  }

  .adh-card-green .adh-card-value { color: var(--green); }
  .adh-card-yellow .adh-card-value { color: var(--yellow); }
  .adh-card-red .adh-card-value    { color: var(--red-soft); }

  .adh-card-sub {
    font-size: 10px; font-weight: 600;
    color: var(--text-muted); margin-top: 5px;
  }

  .adh-card-rule {
    font-size: 10px; color: var(--text-muted); opacity: 0.7;
  }

  /* GRÁFICOS LADO A LADO (mensal + por unidade) */
  .adh-charts {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px; margin-bottom: 24px;
  }

  /* TABELAS LADO A LADO */
  .adh-tables {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px; margin-bottom: 24px;
  }

  .adh-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  .adh-table-title {
    font-size: 15px; font-weight: 800;
    padding: 14px 18px 10px;
    color: var(--text);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .adh-table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }

  .adh-table thead tr { background: rgba(20,28,40,0.65); }

  .adh-table thead th {
    padding: 8px 18px; text-align: left;
    font-weight: 600; font-size: 11px;
    color: var(--text-muted); white-space: nowrap;
    letter-spacing: 0.4px;
  }
  .adh-table thead th.col-dias { text-align: right; }

  .adh-table tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.012);
    transition: background 0.12s;
  }
  .adh-table tbody tr:last-child { border-bottom: none; }
  .adh-table tbody tr:hover { background: rgba(255,255,255,0.03); }

  .adh-table tbody td {
    padding: 9px 18px; white-space: nowrap;
    font-size: 13px; color: var(--text);
  }

  /* badge dias */
  .td-dias {
    display: inline-block;
    font-weight: 700; font-size: 12px;
    border-radius: 5px; padding: 3px 10px;
    min-width: 32px; text-align: center;
  }
  .td-dias.vencida  { color: var(--red-soft); }
  .td-dias.atencao  { color: var(--yellow); }
  .td-dias.prazo    { color: var(--green); }

  /* legenda do gráfico */
  .chart-legend {
    display: flex; gap: 18px; margin-bottom: 12px;
  }
  .lg-item {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted); font-weight: 600;
  }
  .lg-dot {
    width: 11px; height: 11px; border-radius: 2px; display: inline-block;
  }

  /* farol */
  .farol-dot {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 500;
  }
  .farol-dot::before {
    content: ''; width: 7px; height: 7px;
    border-radius: 50%; display: inline-block;
  }
  .farol-dot { color: var(--text); }
  .farol-dot.vencida::before { background: var(--red-soft); }
  .farol-dot.atencao::before { background: var(--yellow); }
  .farol-dot.prazo::before   { background: var(--green); }
  .farol-dot.sem::before     { background: var(--text-muted); }

  @media (max-width: 900px) {
    .adh-cards  { grid-template-columns: 1fr; }
    .adh-tables { grid-template-columns: 1fr; }
    .adh-charts { grid-template-columns: 1fr; }
    .adh-value  { font-size: 52px; }
  }

  /* ===================== CARD ===================== */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 18px 14px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  .card-title {
    font-size: 15px; font-weight: 800;
    margin-bottom: 14px; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  /* ===================== TABELA ===================== */
  .table-wrap {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }

  table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }

  thead tr {
    background: var(--red);
  }

  thead th {
    padding: 10px 14px;
    text-align: left; font-weight: 600;
    font-size: 12px; letter-spacing: 0.5px;
    color: #fff; white-space: nowrap;
  }

  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.012);
    transition: background 0.15s;
  }

  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }

  tbody td {
    padding: 9px 14px; color: var(--text);
    white-space: nowrap;
  }

  /* ===================== BADGES ===================== */
  .badge {
    display: inline-block;
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600;
  }

  .badge-red     { background: rgba(249,115,22,0.2);   color: #FB923C; }
  .badge-green   { background: rgba(46,204,113,0.2); color: var(--green); }
  .badge-yellow  { background: rgba(243,156,18,0.2); color: var(--yellow); }
  .badge-orange  { background: rgba(230,126,34,0.2); color: var(--orange); }
  .badge-gray    { background: rgba(136,136,136,0.2);color: var(--text-muted); }

  /* ===================== CHART CONTAINER ===================== */
  .chart-wrap {
    position: relative; height: 220px;
  }

  /* ===================== ADERÊNCIA GAUGE ===================== */
  .gauge-wrap {
    display: flex; align-items: center;
    justify-content: center; flex-direction: column;
    gap: 4px; padding: 8px 0;
  }

  .gauge-value {
    font-size: 48px; font-weight: 700;
  }

  .gauge-label {
    font-size: 12px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px;
  }

  .gauge-meta {
    font-size: 12px; color: var(--text-muted);
    margin-top: 4px;
  }

  /* ===================== PROGRESS BAR ===================== */
  .progress-bar-wrap { margin-bottom: 10px; }

  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 12px; margin-bottom: 4px;
  }

  .progress-bar {
    height: 8px; background: var(--border);
    border-radius: 4px; overflow: hidden;
  }

  .progress-fill {
    height: 100%; border-radius: 4px;
    transition: width 0.6s ease;
  }

  /* ===================== EIXOS VIEW ===================== */
  .eixo-filter {
    display: flex; gap: 10px; margin-bottom: 20px;
    flex-wrap: wrap; align-items: center;
  }

  .eixo-filter select, .eixo-filter input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text); border-radius: 6px;
    padding: 8px 12px; font-size: 13px;
    outline: none;
  }

  .eixo-filter select:focus, .eixo-filter input:focus {
    border-color: var(--red);
  }

  .vehicle-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px; margin-bottom: 16px;
  }

  .vehicle-header {
    display: flex; align-items: center;
    gap: 16px; margin-bottom: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.012);
  }

  .vehicle-placa {
    font-size: 18px; font-weight: 700;
    color: var(--red);
  }

  .vehicle-info {
    font-size: 12px; color: var(--text-muted);
    display: flex; gap: 16px; flex-wrap: wrap;
  }

  .vehicle-info span strong { color: var(--text); }

  .axle-container {
    display: flex; gap: 24px;
    align-items: flex-start; flex-wrap: wrap;
  }

  .axle {
    display: flex; flex-direction: column;
    align-items: center; gap: 8px;
  }

  .axle-label {
    font-size: 10px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 1px;
  }

  .axle-tires {
    display: flex; flex-direction: column; gap: 6px;
  }

  .axle-side {
    display: flex; gap: 4px;
  }

  .tire-box {
    width: 90px; background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 8px;
    font-size: 11px; cursor: pointer;
    transition: all 0.2s; position: relative;
  }

  .tire-box:hover { border-color: var(--red); }

  .tire-box.bloquear { border-color: var(--red); background: rgba(249,115,22,0.1); }
  .tire-box.recapar  { border-color: var(--orange); background: rgba(230,126,34,0.1); }
  .tire-box.regular  { border-color: var(--yellow); background: rgba(243,156,18,0.08); }
  .tire-box.bom      { border-color: var(--green); background: rgba(46,204,113,0.05); }
  .tire-box.vazio    { border-color: var(--border); opacity: 0.4; }

  .tire-pos {
    font-size: 10px; color: var(--text-muted);
    margin-bottom: 4px;
  }

  .tire-serial {
    font-weight: 600; font-size: 11px;
    margin-bottom: 3px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis;
  }

  .tire-mm {
    font-size: 13px; font-weight: 700;
    margin: 2px 0;
  }

  .tire-marca {
    font-size: 10px; color: var(--text-muted);
    margin-top: 2px;
  }

  .tire-dot {
    font-size: 10px; color: var(--text-muted);
  }

  .tire-pressure {
    font-size: 10px; margin-top: 3px;
  }

  .tire-pressure.nok { color: var(--red); font-weight: 600; }
  .tire-pressure.ok  { color: var(--text-muted); }

  .axle-divider {
    width: 2px; height: 100%;
    background: var(--border); align-self: stretch;
    margin: 0 4px;
  }

  /* ===================== EMPTY STATE ===================== */
  .empty {
    text-align: center; padding: 48px;
    color: var(--text-muted); font-size: 14px;
  }

  /* ===================== TOOLTIP ===================== */
  .tooltip-info {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 16px;
    font-size: 12px; margin-bottom: 16px;
    color: var(--text-muted);
    display: flex; gap: 8px; align-items: flex-start;
  }

  .search-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text); border-radius: 6px;
    padding: 8px 12px; font-size: 13px;
    outline: none; width: 260px;
  }

  .search-box:focus { border-color: var(--red); }

  .table-controls {
    display: flex; gap: 10px;
    margin-bottom: 14px; align-items: center;
    flex-wrap: wrap;
  }

  /* ===================== SAÚDE DOS PNEUS ===================== */
  .saude-cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px; margin-bottom: 24px;
  }

  .saude-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 16px;
    display: flex; flex-direction: column; gap: 3px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
  body.light-mode .saude-card {
    background: rgba(128,128,128,.14) !important;
    border: none !important;
    box-shadow: none !important;
    color: #111;
  }

  .saude-card .sc-label {
    font-size: 10px; font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.5px;
  }

  .saude-card .sc-value {
    font-size: 24px; font-weight: 800;
    color: var(--text); line-height: 1.1; margin-top: 2px;
  }
  body.light-mode .saude-card .sc-value { color: #111; }

  .saude-card .sc-sub {
    font-size: 10px; color: var(--text-muted); margin-top: 5px;
  }
  .saude-card .sc-sub b { font-weight: 700; }

  @media (max-width: 1000px) {
    .saude-cards { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 540px) {
    .saude-cards { grid-template-columns: 1fr; }
  }

  /* gráfico + pesos lado a lado */
  .saude-chart-row {
    display: grid;
    grid-template-columns: 1fr 440px;
    gap: 14px; margin-bottom: 24px;
    align-items: stretch;
  }
  .saude-chart-row > .card { display: flex; flex-direction: column; }

  .pesos-title {
    font-size: 13px; font-weight: 800;
    color: var(--red); text-transform: uppercase;
    letter-spacing: 0.6px; margin-bottom: 14px;
  }

  .pesos-head {
    display: grid;
    grid-template-columns: 105px 1fr 38px;
    gap: 10px;
    font-size: 9px; font-weight: 700;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: 0.8px; padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .pesos-head span:last-child { text-align: right; }

  .pesos-row {
    display: grid;
    grid-template-columns: 105px 1fr 38px;
    gap: 10px; align-items: center;
    font-size: 12px; color: var(--text-muted);
    padding: 9px 0;
    border-bottom: 1px solid rgba(255,255,255,0.012);
  }

  .pr-desc {
    font-size: 10px; color: var(--text-muted);
    opacity: 0.85; line-height: 1.4;
  }
  body.light-mode .pesos-row { border-bottom-color: rgba(0,0,0,0.025); color: #555; }
  .pesos-row:last-of-type { border-bottom: none; }
  .pesos-row b { color: var(--text); font-weight: 800; font-size: 13px; text-align: right; }
  body.light-mode .pesos-row b { color: #111; }

  .pesos-note {
    font-size: 10px; color: var(--text-muted);
    margin-top: 12px; line-height: 1.5; opacity: 0.8;
  }

  .chart-chips {
    display: flex; gap: 6px; flex-wrap: wrap;
  }

  .chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius: 5px; padding: 5px 12px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text-muted); cursor: pointer;
    font-family: var(--font);
    transition: all 0.15s;
  }
  .chip:hover { color: var(--text); border-color: rgba(249,115,22,0.4); }
  .chip.active {
    background: rgba(249,115,22,0.15);
    border-color: var(--red);
    color: var(--red);
  }
  body.light-mode .chip { background: rgba(0,0,0,0.04); color: #555; }
  body.light-mode .chip.active { background: rgba(249,115,22,0.10); color: var(--red); }

  /* ===== VISÃO DE EIXOS — VERTICAL ===== */
  .eixos-duplo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) { .eixos-duplo { grid-template-columns: 1fr; } }

  .veh-vert {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }

  .veh-vert-head {
    text-align: center; margin-bottom: 14px;
  }
  .veh-vert-placa {
    font-size: 22px; font-weight: 800; color: var(--text);
  }
  .veh-vert-info {
    font-size: 13px; color: var(--text-muted); margin-top: 4px;
    display: flex; gap: 12px; flex-wrap: wrap; justify-content: center;
  }
  .veh-vert-info strong { color: var(--text); }
  .veh-vert-score {
    font-size: 14px; font-weight: 700; margin-top: 6px;
  }

  .axle-v {
    display: flex; align-items: center; gap: 10px;
    justify-content: center;
  }

  .axle-v-label {
    font-size: 11px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.8px;
    text-align: center; margin: 10px 0 4px;
  }

  .axle-bar {
    width: 44px; height: 5px;
    background: var(--border); border-radius: 3px;
    flex-shrink: 0;
  }

  .axle-side-v { display: flex; gap: 4px; }

  .tire-v {
    width: 140px; height: 232px; background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px; padding: 8px 9px;
    font-size: 12px; overflow: hidden;
    display: flex; flex-direction: column; gap: 1px;
  }
  .tire-v.bom      { border-color: var(--green); }
  .tire-v.regular  { border-color: var(--yellow); }
  .tire-v.recapar  { border-color: var(--orange); }
  .tire-v.bloquear { border-color: var(--red-soft); }
  .tire-v .tv-pos    { font-size: 13px; color: var(--text-muted); text-transform: uppercase; }
  .tire-v .tv-serial { font-weight: 700; font-size: 15px; }
  .tire-v .tv-mm     { font-size: 18px; font-weight: 800; margin: 2px 0; }
  .tire-v .tv-sub    { color: var(--text-muted); font-size: 12.5px; line-height: 1.45; }

  .title-dot {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; margin-right: 9px;
  }

  /* Tabela orçamentária: células compactas e limpas (estilo DRE) */
  .orc-table thead th, .orc-table tbody td, .orc-table tfoot td { padding: 9px 14px; font-size: 13px; }

  /* Resumo acima da tabela */
  .orc-summary {
    padding: 4px 18px 16px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 4px;
  }
  .orc-total {
    display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px;
  }
  .orc-total span {
    font-size: 10px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.6px;
  }
  .orc-total b { font-size: 30px; font-weight: 800; color: var(--text); line-height: 1; }
  .orc-stats {
    display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px;
  }
  .orc-stat { display: flex; flex-direction: column; gap: 2px; }
  .orc-stat span { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.4px; }
  .orc-stat b { font-size: 17px; font-weight: 800; color: var(--text); }
  @media (max-width: 760px) {
    .orc-stats { grid-template-columns: repeat(2, 1fr); }
    .orc-total b { font-size: 26px; }
  }

  .sug-item {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 12px 0; font-size: 13px; line-height: 1.6;
    border-bottom: 1px solid rgba(255,255,255,0.012);
  }
  .sug-item:last-child { border-bottom: none; }
  .sug-icon { display: none; }

  /* ===== LAUDO POR EIXO ===== */
  .laudo { display: flex; flex-direction: column; gap: 14px; }
  .le { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .le-h { background: rgba(249,115,22,0.10); color: var(--orange); font-weight: 800;
    font-size: 11px; letter-spacing: .6px; text-transform: uppercase; padding: 8px 12px; }
  body.light-mode .le-h { background: rgba(249,115,22,0.12); }
  .lp { padding: 9px 12px; border-top: 1px solid rgba(255,255,255,0.04); font-size: 12.5px; line-height: 1.55; }
  body.light-mode .lp { border-top-color: rgba(0,0,0,0.05); }
  .lp-top { color: var(--text); }
  .lp-e { font-size: 13px; }
  .lp-ac { color: var(--text2, var(--text-muted)); margin-top: 2px; }
  .lp-al { color: var(--text); margin-top: 3px; font-size: 12px;
    background: rgba(255,102,102,0.07); border-left: 2px solid var(--red-soft); padding: 4px 8px; border-radius: 3px; }
  .lv { margin: 8px 12px 10px; padding: 9px 11px; font-size: 12.5px; line-height: 1.55;
    background: rgba(255,102,102,0.10); border: 1px solid rgba(255,102,102,0.30); border-radius: 6px; color: var(--text); }
  .lv-fix { color: var(--text-muted); }
  .le-acao { padding: 10px 12px; font-size: 13px; line-height: 1.6; color: var(--text); border-top: 1px solid rgba(255,255,255,0.04); }
  body.light-mode .le-acao { border-top-color: rgba(0,0,0,0.05); }
  .le-atencao { background: rgba(243,156,18,0.10); border: 1px solid rgba(243,156,18,0.30); border-radius: 8px; padding: 10px 13px; font-size: 12.5px; line-height: 1.6; color: var(--text); }
  .le-resumo { border: 1px dashed var(--border); border-radius: 8px; padding: 11px 13px; font-size: 12.5px; line-height: 1.7; }
  .rs { display: inline-block; padding: 2px 9px; border-radius: 12px; font-weight: 700; font-size: 11px; margin: 0 2px; }
  .rs-red { background: rgba(255,102,102,0.15); color: var(--red-soft); }
  .rs-org { background: rgba(243,156,18,0.15); color: var(--yellow); }
  .rs-grn { background: rgba(59,179,59,0.15); color: var(--green); }
  .rs-cpk { color: var(--text-muted); font-size: 11px; margin-top: 7px; }

  .sug-list {
    margin: 8px 0 0 18px; padding: 0;
  }
  .sug-list li {
    margin-bottom: 6px; line-height: 1.6;
    color: var(--text-muted);
  }
  .sug-list li b { color: var(--text); }
  body.light-mode .sug-list li { color: #555; }
  body.light-mode .sug-list li b { color: #111; }
  .sug-item b { font-weight: 700; }
  .sug-ganho { color: var(--green); font-weight: 700; }

  .drill-select {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--red);
    border-radius: 5px; padding: 6px 10px;
    font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--text); cursor: pointer;
    font-family: var(--font); outline: none;
  }
  .drill-select option { background: #111; color: #eee; }
  body.light-mode .drill-select { background: rgba(0,0,0,0.04); color: #111; }
  body.light-mode .drill-select option { background: #fff; color: #111; }

  @media (max-width: 900px) {
    .saude-chart-row { grid-template-columns: 1fr; }
  }

  /* ===== MOBILE: tabelas com expandir ===== */
  .row-toggle {
    display: none;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-muted);
    padding: 2px 8px; cursor: pointer;
    font-size: 12px; line-height: 1;
    font-family: var(--font); margin-left: 8px;
  }
  body.light-mode .row-toggle { background: rgba(0,0,0,0.05); color: #555; }

  tr.detail-row { display: none; }
  tr.detail-row td { padding: 10px 16px 14px; }

  .kv {
    display: flex; flex-wrap: wrap; gap: 6px 18px;
    font-size: 12px; color: var(--text-muted); line-height: 1.7;
  }
  .kv b { color: var(--text); font-weight: 700; }
  body.light-mode .kv b { color: #111; }

  /* Gráficos lado a lado quebram mais cedo para não cortar no tablet */
  @media (max-width: 1100px) {
    .grid-2, .grid-3 { grid-template-columns: 1fr; }
    .saude-chart-row { grid-template-columns: 1fr; }
  }

  /* Grid children não estouram por causa dos canvas */
  .grid-2 > .card, .grid-3 > .card, .saude-chart-row > .card { min-width: 0; }
  .card, .adh-table-wrap { min-width: 0; }

  @media (max-width: 768px) {
    .content { padding: 14px; }

    /* Topbar compacta: título fixo à esquerda, todos os botões à direita */
    .topbar-row1 { height: auto; flex-wrap: nowrap; gap: 8px; padding: 6px 10px; }
    .topbar-row1 img { height: 21px !important; }
    .topbar-brand { gap: 8px !important; overflow: hidden; }
    .topbar-title { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar-sub { display: none; }
    .back-btn { order: 3; }
    .topbar-right { margin-left: auto; gap: 5px; flex-shrink: 0; }
    .status-badge { font-size: 8px; padding: 2px 5px; }
    .icon-btn, .theme-btn { padding: 3px 5px; }
    .icon-btn svg, .theme-btn svg { width: 12px; height: 12px; }
    .filter-bar { padding: 4px 10px 7px; gap: 5px; }
    .ms-btn { min-width: 0; font-size: 9px; padding: 4px 8px; }

    /* Tipografia reduzida */
    .adh-value { font-size: 40px; }
    .adh-label { font-size: 9px; }
    .adh-delta { font-size: 11px; }
    .adh-delta b { font-size: 14px; }
    .saude-card .sc-value { font-size: 18px; }
    .saude-card { padding: 11px 12px; }
    .saude-card .sc-label { font-size: 9px; }
    .saude-card .sc-sub { font-size: 9px; }
    .card { padding: 14px 12px 10px; }
    .card-title, .adh-table-title { font-size: 12px; }
    .chip { font-size: 9px; padding: 4px 8px; }
    .lg-item { font-size: 10px; }

    /* Tabelas */
    .adh-table .dcol { display: none; }
    .row-toggle { display: inline-block; }
    tr.detail-row.open { display: table-row; }
    .adh-table tbody td, .adh-table thead th { padding-left: 10px; padding-right: 10px; }

    /* Eixos: caixas fluidas — largura e fontes se adaptam à tela */
    .axle-v { gap: 5px; width: 100%; }
    .axle-side-v { gap: 3px; flex: 1; min-width: 0; }
    .axle-side-v:first-child { justify-content: flex-end; }
    .tire-v {
      width: auto; flex: 1; min-width: 0; max-width: 108px;
      padding: clamp(4px, 1.4vw, 8px);
    }
    .tire-v .tv-pos    { font-size: clamp(7px, 2vw, 11px); }
    .tire-v .tv-serial { font-size: clamp(9px, 2.6vw, 13px); }
    .tire-v .tv-mm     { font-size: clamp(10px, 3vw, 15px); }
    .tire-v .tv-sub    { font-size: clamp(7px, 2vw, 11px); word-break: break-word; }
    .axle-bar { width: clamp(8px, 3vw, 18px); }

    /* Cards em pares */
    .saude-cards { grid-template-columns: repeat(2, 1fr) !important; gap: 10px; }
    .adh-cards { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  }

  /* Celulares estreitos: cabeçalho do veículo menor */
  @media (max-width: 480px) {
    .veh-vert-placa { font-size: 18px; }
    .veh-vert-info { font-size: 11px; gap: 8px; }
    .veh-vert-score { font-size: 12px; }
  }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text" id="loadingText">Carregando dados da API...</div>
</div>

<!-- MAIN -->
<main class="main">
  <header class="topbar">
    <div class="topbar-row1">
      <div class="topbar-brand" style="display:flex;align-items:center;gap:14px;flex:1;min-width:0">
        <div style="min-width:0">
          <div class="topbar-title" id="pageTitle">Descarte de Pneus</div>
          <div class="topbar-sub">Gestão de Pneus · Frota</div>
        </div>
      </div>
      <div class="topbar-right">
        <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Alternar modo claro/escuro">
          <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button class="icon-btn" onclick="loadData(true)" id="btnRefresh" title="Atualizar dados">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>

// ============================================================
// MOTOR DE FILTROS (unidade, marca, modelo) — sobre os PNEUS
//   SEL[key] = 'all'  -> todos os valores marcados
//   SEL[key] = Set    -> subconjunto explícito marcado
//   As opções de um filtro vêm dos pneus já filtrados pelos OUTROS (cascata).
// ============================================================
const FILTER_KEYS = ['branch','marca','modelo','motivo'];
let SEL = { branch:'all', marca:'all', modelo:'all', motivo:'all' };

function distinctSorted(arr) {
  return [...new Set(arr.filter(v => v !== null && v !== undefined && v !== ''))].sort();
}

// um pneu passa pelos filtros (ignorando a dimensão 'except')
function tirePass(t, except) {
  if (except !== 'branch' && FILTERS.branch.length && !FILTERS.branch.includes(t.unidade)) return false;
  if (except !== 'marca'  && FILTERS.marca.length  && !FILTERS.marca.includes(t.marca || '—')) return false;
  if (except !== 'modelo' && FILTERS.modelo.length && !FILTERS.modelo.includes(t.modelo || '—')) return false;
  return true;
}

// valores disponíveis p/ um filtro, dado TODOS os outros (cascata)
function optionsFor(key) {
  const ok = DATA.tires.filter(t => tirePass(t, key));
  if (key === 'branch') return distinctSorted(ok.map(t => t.unidade));
  if (key === 'marca')  return distinctSorted(ok.map(t => t.marca || '—'));
  if (key === 'modelo') return distinctSorted(ok.map(t => t.modelo || '—'));
  if (key === 'motivo') return distinctSorted(DATA.tires.filter(t => t.status==='DISPOSAL' && tirePass(t,'motivo')).map(t => motivoCurto(t.motivoDescarte)));
  return [];
}

function syncFiltersFromSel() {
  FILTER_KEYS.forEach(key => {
    FILTERS[key] = SEL[key] === 'all' ? [] : [...SEL[key]];
  });
}

function renderFilterOptions(key) {
  const container = document.getElementById('opts-' + key);
  if (!container) return;

      + '<label><input type="checkbox" ' + (isCk(v) ? 'checked' : '') + ' data-key="' + key + '" data-val="' + v + '" onchange="onFilterChange(\'' + key + '\')"> ' + v + '</label>'
      + '<button class="ms-only" onclick="onlyFilter(\'' + key + '\',\'' + safe + '\')">Apenas</button>'
      + '</div>';
  }).join('');

  const todos = document.querySelector('#panel-' + key + ' .select-all input');
  const nCk = values.filter(isCk).length;
  if (todos) { todos.checked = values.length > 0 && nCk === values.length; todos.indeterminate = nCk > 0 && nCk < values.length; }

  const cnt = document.getElementById('cnt-' + key);
  if (cnt) {
    if (sel !== 'all' && nCk < values.length) { cnt.textContent = nCk; cnt.style.display = ''; }
    else cnt.style.display = 'none';
  }
}

function applyFilterChange() {
  syncFiltersFromSel();
  FILTER_KEYS.forEach(renderFilterOptions);
  renderDescarte();
}

function onFilterChange(key) {
  const inputs  = [...document.querySelectorAll('#opts-' + key + ' input')];
  const checked = inputs.filter(c => c.checked).map(c => c.dataset.val);
  SEL[key] = checked.length === inputs.length ? 'all' : new Set(checked);
  applyFilterChange();
}

function onlyFilter(key, val) {
  if (SEL[key] !== 'all' && SEL[key].size === 1 && SEL[key].has(String(val))) SEL[key] = 'all';
  else SEL[key] = new Set([String(val)]);
  applyFilterChange();
}

function selectAll(panelId, cb) {
  const key = panelId.replace('panel-', '');

}

function populateFilters() {

}

function getFilteredTires() {

// ============================================================

const getGrid = () => ({ color: document.body.classList.contains('light-mode') ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.06)' });
const getTick = (sz) => ({ color: document.body.classList.contains('light-mode') ? '#444444' : '#94A3B8', font:{ family:'Montserrat', size: sz || 11 } });

// ============================================================
// SEMÂNTICA DE DESCARTE
//   em uso     = status INSTALLED || DISPOSAL
//   descartado = status DISPOSAL
//   % descarte = descartados / em uso  (0 em uso => 0%)
//   motivo vazio => "Sem motivo informado"
// ============================================================
const EM_USO = t => t.status === 'INSTALLED' || t.status === 'DISPOSAL';
const DESCARTADO = t => t.status === 'DISPOSAL';
const motivoDe = t => (t.motivoDescarte && String(t.motivoDescarte).trim()) ? String(t.motivoDescarte).trim() : 'Sem motivo informado';

function clusterPct(p) { return p < 20 ? 'green' : p <= 40 ? 'yellow' : 'red'; }
function corCluster(c) { return c === 'green' ? '#3BB33B' : c === 'yellow' ? '#f39c12' : '#FF6666'; }

// de-para de motivos -> categorias curtas/agrupadas (MAIÚSCULAS)
function motivoCurto(m){
  const s=(m||'').toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();
  if(!s) return 'SEM MOTIVO';
  const has=(...ks)=>ks.some(k=>s.includes(k));
  if(has('BAIXA PRESS','VAZIO','SOBRECARGA')) return 'BAIXA PRESSÃO/SOBRECARGA';
  if(has('SUPERAQUEC','CALOR','QUEIMAD')) return 'SUPERAQUECIMENTO';
  if(has('FADIGA','DOT')) return 'FADIGA/DOT';
  if(has('INFILTRA')) return 'INFILTRAÇÃO';
  if(has('PICOTA')) return 'PICOTAGEM';
  if(has('LINER','BOLHA')) return 'LINER/BOLHA';
  if(has('CADASTRO','VENDID','DEVOLVID','VENDA','EXTRAVIO','RECOLHIDO','TERCEIROS','EMPILHADEIRA')) return 'ADMINISTRATIVO';
  if(has('IMPACTO','ACIDENTE','MANOBRA','FRENAGEM','ATRITO','BURACO','TRAVAMENTO')) return 'IMPACTO/ACIDENTE';
  if(has('ESTOURO','RUPTURA','ZIPER')) return 'RUPTURA/ESTOURO';
  if(has('CONSERTO','MANCHOES','MANCHÕES','REPARO','REPARADA','COBERTURA')) return 'CONSERTO/REPARO';
  if(has('VIDA UTIL','DESGASTE','APARENTES','PREVISAO')) return 'DESGASTE/VIDA ÚTIL';
  if(has('CORTE','OBJETO CORTANTE','PENETR','PERFUR')) return 'CORTE/PERFURAÇÃO';
  if(has('CINTA','LONA','DESLOCAMENTO','SEPARA','DESAGREGA','OXIDA')) return 'CINTAS/LONAS';
  if(has('TALAO')) return 'TALÃO';
  if(has('FLANCO','LATERAL')) return 'FLANCO/LATERAL';
  if(has('BANDA DE RODAGEM','ARRANCAMENTO','SOLTURA','OMBRO')) return 'BANDA DE RODAGEM';
  // motivo novo sem palavra-chave conhecida => vira seu PRÓPRIO cluster (identificável p/ depois virar regra)
  return s;
}

// filtro de MOTIVO: aplica-se SÓ aos descartados (não ao total, p/ não distorcer o %)
function motivoPass(t){ return !FILTERS.motivo.length || FILTERS.motivo.includes(motivoCurto(t.motivoDescarte)); }

// dimensão atual da tabela de descarte
let descDim = 'unidade';

function renderDescarte() {
  if (!DATA.tires || !DATA.tires.length) return;
  const tires = getFilteredTires();
  const nTotal = tires.length;                       // total de pneus que a seleção TEVE (todos os status)

}

// ============================================================
// TABELA DE DESCARTE POR DIMENSÃO (toggle UNIDADE/MOTIVO/MARCA/MODELO)
// ============================================================
function renderDescarteTable() {
  if (!DATA.tires || !DATA.tires.length) return;
  const tires = getFilteredTires();
  const descartados = tires.filter(t => DESCARTADO(t) && motivoPass(t));

  const theadEl = document.getElementById('theadDesc');
  const tbodyEl = document.getElementById('tbodyDescUnidade');

  if (descDim === 'motivo') {
    theadEl.innerHTML = '<tr><th>Motivo</th><th class="col-dias"># Descartados</th><th class="col-dias">% do Total</th></tr>';
    const tot = descartados.length || 1;
    const grp = {};
    descartados.forEach(t => { const m = motivoCurto(t.motivoDescarte); grp[m] = (grp[m] || 0) + 1; });
    const rows = Object.entries(grp).map(([k, n]) => ({ k, desc: n, share: (n / tot) * 100 }))
      .sort((a, b) => b.desc - a.desc);
    tbodyEl.innerHTML = rows.map(r =>
      '<tr>'
      + '<td>' + r.k + '</td>'
      + '<td class="col-dias" style="text-align:right">' + r.desc.toLocaleString('pt-BR') + '</td>'
      + '<td class="col-dias" style="text-align:right">' + r.share.toFixed(1).replace('.', ',') + '%</td>'
      + '</tr>'
    ).join('') || '<tr><td colspan="3" style="text-align:center;color:var(--text-muted);padding:20px">Sem dados</td></tr>';
    return;
  }

  // UNIDADE / MARCA / MODELO — TT Pneus = total que a dimensão TEVE (todos os status)
  const dimLabel = { unidade: 'Unidade', marca: 'Marca', modelo: 'Modelo' }[descDim];
  const dimGet = { unidade: t => t.unidade || '—', marca: t => t.marca || '—', modelo: t => t.modelo || '—' }[descDim];
  theadEl.innerHTML = '<tr><th>' + dimLabel + '</th><th class="col-dias">TT Pneus</th><th class="col-dias"># Descartados</th><th class="col-dias">% Descarte</th></tr>';

  const grp = {};
  tires.forEach(t => {
    const k = dimGet(t);
    if (!grp[k]) grp[k] = { total: 0, desc: 0 };
    grp[k].total++;
    if (DESCARTADO(t) && motivoPass(t)) grp[k].desc++;
  });
  const rows = Object.entries(grp).map(([k, o]) => ({
    k, total: o.total, desc: o.desc, pct: o.total ? (o.desc / o.total) * 100 : 0
  })).sort((a, b) => b.pct - a.pct);

  tbodyEl.innerHTML = rows.map(r => {
    const cor = corCluster(clusterPct(r.pct));
    return '<tr>'
      + '<td>' + r.k + '</td>'
      + '<td class="col-dias" style="text-align:right">' + r.total.toLocaleString('pt-BR') + '</td>'
      + '<td class="col-dias" style="text-align:right">' + r.desc.toLocaleString('pt-BR') + '</td>'
      + '<td class="col-dias" style="text-align:right"><span class="td-dias" style="color:' + cor + '">' + r.pct.toFixed(1).replace('.', ',') + '%</span></td>'
      + '</tr>';
  }).join('') || '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:20px">Sem dados</td></tr>';
}

// ============================================================
// LOAD DATA — busca o snapshot na rede e monta DATA.tires/vehicles
// ============================================================
async function fetchSnapshotFromNetwork() {
  const branchIds = Object.keys(UNIDADE_MAP);
  const merged = { vehicles: [], tires: [], inspections: [] };
  const updatedAts = [];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const fetchBranch = bid => fetch(SUPABASE_URL + '/rest/v1/snapshot?branch_id=eq.' + bid + '&select=endpoint,branch_id,data,updated_at', {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  }).then(r => r.ok ? r.json() : null).catch(() => null);
  const perBranch = [];
  const CHUNK = 3;
  for (let i = 0; i < branchIds.length; i += CHUNK) {
    const batch = branchIds.slice(i, i + CHUNK);
    const res = await Promise.all(batch.map(async bid => {
      for (let a = 0; a < 5; a++) {
        const out = await fetchBranch(bid);
        if (out !== null) return out;
        await sleep(800);
      }
      return [];
    }));
    perBranch.push(...res);
  }
  perBranch.flat().forEach(r => {
    const uni = UNIDADE_MAP[r.branch_id] || ('Unidade ' + r.branch_id);
    const arr = Array.isArray(r.data) ? r.data : [];
    if (r.updated_at) updatedAts.push(new Date(r.updated_at));
    if (!merged[r.endpoint]) return;
    for (const rec of arr) { rec.unidade = uni; rec.branchId = r.branch_id; merged[r.endpoint].push(rec); }
  });
  if (!merged.tires.length && !merged.vehicles.length) throw new Error('Sem dados no Supabase — aguarde a primeira carga do loader');
  const ult = (updatedAts.sort((a, b) => b - a)[0] || new Date()).getTime();
  return { data: { vehicles: merged.vehicles, tires: merged.tires, inspections: merged.inspections }, ult };
}

function aplicarDados(data, ult, prefixo) {
  // Paleteira não é veículo de frota rodante — fora do painel
  const foraIds = new Set((data.vehicles || []).filter(v => /PALETEIRA/i.test(v.tipo || '')).map(v => v.id));
  if (foraIds.size) {
    data.vehicles = data.vehicles.filter(v => !foraIds.has(v.id));
    data.tires    = (data.tires || []).filter(t => !foraIds.has(t.veiculoId));
  }
  DATA = data;
  document.getElementById('lastUpdate').textContent = (prefixo || '🔄 Dados de: ') + formatCacheTime(ult);
  populateFilters();
  renderDescarte();
}

const CACHE_TTL = 3 * 60 * 60 * 1000;
const IDB_NAME = 'bipneus', IDB_STORE = 'cache', IDB_KEY = 'snapshot';
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(IDB_NAME, 1);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains(IDB_STORE)) r.result.createObjectStore(IDB_STORE); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbGet() {
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(IDB_KEY);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => rej(req.error);
    });
  } catch (e) { return null; }
}
async function idbSet(val) {
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const req = db.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(val, IDB_KEY);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    });
  } catch (e) {}
}
function formatCacheTime(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

async function loadData(forceRefresh) {
  const btn = document.getElementById('btnRefresh');
  btn.disabled = true;
  let shownFromCache = false, cachedUlt = null;
  try {
    if (!forceRefresh) {
      const cached = await idbGet();
      if (cached && cached.data && cached.data.tires && cached.data.tires.length) {
        cachedUlt = cached.ult;
        aplicarDados(cached.data, cached.ult || cached.ts);
        shownFromCache = true;
        hideLoading();
        if (Date.now() - cached.ts < CACHE_TTL) { btn.disabled = false; return; }
      }
    }
    if (!shownFromCache) showLoading('Carregando dados...');
    const fresh = await fetchSnapshotFromNetwork();
    if (shownFromCache && cachedUlt && fresh.ult <= cachedUlt) {
      await idbSet({ ts: Date.now(), ult: cachedUlt, data: DATA });
    } else {
      await idbSet({ ts: Date.now(), ult: fresh.ult, data: fresh.data });
      aplicarDados(fresh.data, fresh.ult);
    }
  } catch (e) {
    console.error(e);
    if (!shownFromCache) {
      const cached = await idbGet();
      if (cached && cached.data && cached.data.tires) {
        aplicarDados(cached.data, cached.ult || cached.ts, '⚠️ Cache: ');
      } else {
        alert('Erro ao carregar dados: ' + e.message);
      }
    }
  } finally {
    hideLoading();
    document.getElementById('btnRefresh').disabled = false;
  }
}

// ============================================================
// LOADING
// ============================================================
function showLoading(msg) {
  document.getElementById('loadingOverlay').classList.remove('hidden');
  document.getElementById('loadingText').textContent = msg || 'Carregando...';
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}

// ============================================================
// INIT
// ============================================================
loadData();
</script>
