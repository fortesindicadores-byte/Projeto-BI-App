<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1656 950" width="1656" height="950">
<!-- ============================================================
     STAND-IN VETORIAL do caminhão de neon da CONLOG na estrada.
     Redesenho feito à mão a partir da imagem de referência, porque
     a foto original não chegou como arquivo nesta sessão. Quando o
     JPG entrar, trocar a variável gem-foto em assets/fundo.css e
     apagar este arquivo.
     ============================================================ -->
<defs>
  <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#05090f"/>
    <stop offset="45%"  stop-color="#0a141e"/>
    <stop offset="100%" stop-color="#101d29"/>
  </linearGradient>
  <linearGradient id="asfalto" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#0d151d"/>
    <stop offset="35%"  stop-color="#080c12"/>
    <stop offset="100%" stop-color="#04070a"/>
  </linearGradient>
  <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#F97316" stop-opacity=".38"/>
    <stop offset="100%" stop-color="#F97316" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="reflb" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#dbeafe" stop-opacity=".22"/>
    <stop offset="100%" stop-color="#dbeafe" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="halo" cx="52%" cy="46%" r="55%">
    <stop offset="0%"   stop-color="#F97316" stop-opacity=".16"/>
    <stop offset="60%"  stop-color="#F97316" stop-opacity=".04"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="farol" cx="50%" cy="50%" r="50%">
    <stop offset="0%"   stop-color="#ffffff" stop-opacity=".95"/>
    <stop offset="35%"  stop-color="#ffedd5" stop-opacity=".45"/>
    <stop offset="100%" stop-color="#ffedd5" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vinheta" cx="50%" cy="48%" r="72%">
    <stop offset="52%"  stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity=".78"/>
  </radialGradient>

  <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="13" result="g1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="4"  result="g2"/>
    <feMerge><feMergeNode in="g1"/><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="borrao" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
</defs>

<!-- céu, horizonte e estrada -->
<rect width="1656" height="950" fill="url(#ceu)"/>
<g fill="#0b1622" opacity=".85">
  <path d="M0 612 L190 596 L360 606 L540 590 L700 604 L900 594 L1120 606 L1360 588 L1656 600 L1656 640 L0 640 Z"/>
</g>
<g fill="#ffffff" opacity=".5">
  <circle cx="140"  cy="86"  r="1.6"/><circle cx="430" cy="52" r="1.3"/><circle cx="742" cy="112" r="1.5"/>
  <circle cx="1058" cy="66" r="1.4"/><circle cx="1284" cy="120" r="1.2"/><circle cx="1520" cy="74" r="1.6"/>
  <circle cx="266"  cy="168" r="1.1"/><circle cx="960" cy="176" r="1.1"/>
</g>
<rect y="626" width="1656" height="324" fill="url(#asfalto)"/>
<!-- faixas da pista, em fuga -->
<g fill="#e2e8f0" opacity=".30">
  <path d="M250 936 L318 936 L286 906 L232 906 Z"/>
  <path d="M372 878 L430 878 L406 856 L358 856 Z"/>
  <path d="M470 830 L520 830 L500 812 L458 812 Z"/>
  <path d="M548 792 L592 792 L576 778 L538 778 Z"/>
  <path d="M612 762 L650 762 L636 750 L604 750 Z"/>
</g>
<g fill="#e2e8f0" opacity=".22">
  <path d="M1414 700 L1656 676 L1656 690 L1414 714 Z"/>
</g>
<rect width="1656" height="950" fill="url(#halo)"/>

<!-- reflexos molhados sob o caminhão -->
<g filter="url(#borrao)">
  <rect x="960"  y="690" width="430" height="200" fill="url(#refl)"/>
  <rect x="640"  y="640" width="330" height="170" fill="url(#reflb)"/>
  <rect x="250"  y="620" width="420" height="150" fill="url(#reflb)" opacity=".7"/>
</g>

<g filter="url(#neon)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- ── carreta (laranja), em fuga para a esquerda ── -->
  <g stroke="#F97316" stroke-width="6">
    <path d="M232 356 L860 192"/>
    <path d="M232 356 L232 590"/>
    <path d="M232 590 L860 600"/>
    <path d="M860 192 L860 600"/>
    <path d="M818 206 L818 596"/>
    <path d="M240 574 L856 584"/>
    <path d="M826 196 h30 v26 h-30 z"/>
  </g>

  <!-- CONLOG, acompanhando a perspectiva da lateral -->
  <g transform="rotate(-8.5 512 450)">
    <g stroke="#F97316" stroke-width="5.5" font-family="'Trebuchet MS',Verdana,Geneva,sans-serif"
       font-size="104" font-weight="700" font-style="italic" letter-spacing="4">
      <text x="316" y="478" fill="none">CONLOG</text>
    </g>
    <g stroke="#F1F5F9" stroke-width="5">
      <ellipse cx="418" cy="444" rx="21" ry="46" transform="rotate(22 418 444)"/>
    </g>
  </g>

  <!-- rodado da carreta -->
  <g stroke="#F1F5F9" stroke-width="5">
    <ellipse cx="322" cy="638" rx="26" ry="34"/>
    <ellipse cx="368" cy="642" rx="26" ry="34"/>
    <ellipse cx="414" cy="646" rx="26" ry="34"/>
  </g>
  <g stroke="#F97316" stroke-width="5">
    <path d="M462 626 H648 V666 H462 Z"/>
    <path d="M236 596 v34 M262 598 v30"/>
  </g>

  <!-- ── cavalo mecânico (branco) ── -->
  <g stroke="#F1F5F9" stroke-width="6">
    <!-- teto e defletor -->
    <path d="M898 262 Q902 196 972 188 L1268 178 Q1330 178 1344 214 L1352 262"/>
    <path d="M898 262 Q1120 232 1352 262"/>
    <!-- contorno da lateral + frente -->
    <path d="M886 700 V300 Q886 268 916 262 L1352 262 Q1372 262 1374 292 L1382 640 Q1382 700 1352 706"/>
    <path d="M886 700 H1352"/>
    <!-- para-brisa -->
    <path d="M1086 300 L1346 300 Q1360 300 1361 316 L1366 430 Q1366 444 1352 444 L1088 440 Q1076 440 1076 428 L1074 314 Q1074 302 1086 300 Z"/>
    <!-- janela da porta -->
    <path d="M918 322 L1044 310 Q1054 310 1054 322 V444 Q1054 456 1044 456 L920 458 Q910 458 910 446 V332 Q910 324 918 322 Z"/>
    <!-- recorte da porta + degrau -->
    <path d="M910 470 V690"/>
    <path d="M1058 300 V470"/>
    <path d="M934 528 h48 v20 h-48 z"/>
    <path d="M950 620 h74 v26 h-74 z"/>
    <!-- retrovisor -->
    <path d="M1058 292 q-34 6 -34 34 v112 q0 22 24 22"/>
    <!-- grade e vincos da frente -->
    <path d="M1170 470 Q1276 462 1362 472"/>
    <path d="M1176 508 Q1278 500 1364 510"/>
    <path d="M1180 546 Q1280 538 1366 548"/>
    <path d="M1184 584 Q1282 576 1368 586"/>
    <path d="M1152 458 V614 M1392 452 V620"/>
    <!-- vinco lateral -->
    <path d="M886 470 H1076"/>
    <!-- rodas -->
    <circle cx="978" cy="686" r="66"/><circle cx="978" cy="686" r="34"/>
    <circle cx="726" cy="654" r="48"/><circle cx="726" cy="654" r="24"/>
    <!-- chassi -->
    <path d="M660 640 H886"/>
  </g>

  <!-- para-choque e saia (laranja) -->
  <g stroke="#F97316" stroke-width="6">
    <path d="M1074 638 H1372 Q1390 638 1390 660 L1392 716 Q1392 736 1372 736 H1080 Q1064 736 1064 718 L1060 658 Q1060 638 1074 638 Z"/>
    <path d="M1092 676 h84 v34 h-84 z"/>
    <path d="M1200 700 H1370"/>
    <path d="M1064 700 L1030 706 L1032 736 H1064"/>
    <path d="M886 706 H1064"/>
  </g>
</g>

<!-- faróis acesos -->
<g>
  <ellipse cx="1196" cy="656" rx="40" ry="22" fill="url(#farol)"/>
  <ellipse cx="1366" cy="650" rx="36" ry="20" fill="url(#farol)"/>
</g>

<rect width="1656" height="950" fill="url(#vinheta)"/>
</svg>
