<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<!-- ============================================================
     STAND-IN VETORIAL do letreiro de neon da CONLOG.
     Redesenho feito à mão para o fundo dos painéis rodar enquanto
     a foto original não entra no repositório. Quando o JPG chegar,
     é só trocar a variável gem-foto em assets/fundo.css e apagar isto.
     ============================================================ -->
<defs>
  <!-- parede de tijolos, fiadas alternadas -->
  <pattern id="tijolo" width="160" height="76" patternUnits="userSpaceOnUse">
    <rect width="160" height="76" fill="#131519"/>
    <g fill="none" stroke="#1c1f25" stroke-width="3">
      <path d="M0 38 H160 M0 76 H160"/>
      <path d="M80 0 V38 M0 38 V76 M160 38 V76"/>
    </g>
    <g fill="#16191e">
      <rect x="4" y="3" width="72" height="32"/><rect x="84" y="3" width="72" height="32"/>
      <rect x="-36" y="41" width="72" height="32"/><rect x="44" y="41" width="72" height="32"/><rect x="124" y="41" width="72" height="32"/>
    </g>
  </pattern>

  <!-- brilho do neon: dois borrões sob o traço -->
  <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="14" result="g1"/>
    <feGaussianBlur in="SourceGraphic" stdDeviation="6"  result="g2"/>
    <feMerge><feMergeNode in="g1"/><feMergeNode in="g1"/><feMergeNode in="g2"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <radialGradient id="halo" cx="50%" cy="52%" r="62%">
    <stop offset="0%"   stop-color="#F97316" stop-opacity=".20"/>
    <stop offset="55%"  stop-color="#F97316" stop-opacity=".05"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="vinheta" cx="50%" cy="50%" r="75%">
    <stop offset="55%"  stop-color="#000000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000000" stop-opacity=".72"/>
  </radialGradient>
</defs>

<rect width="1600" height="1000" fill="url(#tijolo)"/>
<rect width="1600" height="1000" fill="url(#halo)"/>

<g filter="url(#neon)" fill="none" stroke-linecap="round" stroke-linejoin="round">

  <!-- ── carreta (laranja) ── -->
  <g stroke="#F97316" stroke-width="7">
    <path d="M112 690 V400 L812 158"/>
    <path d="M112 690 H770"/>
    <path d="M812 158 V640"/>
    <path d="M770 690 V648"/>
  </g>

  <!-- CONLOG -->
  <g stroke="#F97316" stroke-width="6" font-family="'Trebuchet MS',Verdana,Geneva,sans-serif"
     font-size="132" font-weight="700" font-style="italic" letter-spacing="3">
    <text x="172" y="556" fill="none">CONLOG</text>
  </g>
  <g stroke="#F1F5F9" stroke-width="6">
    <ellipse cx="318" cy="512" rx="22" ry="46" transform="rotate(24 318 512)"/>
  </g>

  <!-- ── cavalo mecânico (branco) ── -->
  <g stroke="#F1F5F9" stroke-width="7">
    <!-- contorno da cabine -->
    <path d="M844 862 V352 Q844 268 926 250 L1204 214 Q1358 206 1382 300 L1408 596 V836 Q1408 864 1376 864 H872 Q844 864 844 862 Z"/>
    <!-- para-brisa -->
    <path d="M1052 318 L1364 296 Q1378 296 1379 312 L1387 452 Q1388 466 1374 466 L1056 470 Q1044 470 1044 458 L1040 332 Q1040 320 1052 318 Z"/>
    <!-- janela da porta -->
    <path d="M886 344 L1004 328 Q1014 328 1014 340 V456 Q1014 468 1004 468 L888 470 Q878 470 878 458 V356 Q878 346 886 344 Z"/>
    <!-- recorte da porta + maçaneta -->
    <path d="M878 484 V812"/>
    <path d="M902 572 h56 v18 h-56 z"/>
    <!-- retrovisor -->
    <path d="M1016 302 v148"/>
    <path d="M1000 300 q-26 4 -26 30 v112 q0 22 22 22"/>
    <!-- grade -->
    <path d="M1152 596 H1392 M1152 636 H1394 M1156 676 H1396 M1160 716 H1398"/>
    <!-- vinco lateral -->
    <path d="M844 596 H1120"/>
    <!-- rodas do cavalo -->
    <circle cx="944" cy="806" r="82"/><circle cx="944" cy="806" r="42"/>
    <circle cx="700" cy="800" r="70"/><circle cx="700" cy="800" r="34"/>
    <!-- chassi entre a carreta e a cabine -->
    <path d="M600 726 H830"/>
  </g>

  <!-- rodas da carreta -->
  <g stroke="#F1F5F9" stroke-width="6">
    <ellipse cx="222" cy="760" rx="26" ry="46"/>
    <ellipse cx="290" cy="760" rx="26" ry="46"/>
    <ellipse cx="358" cy="760" rx="26" ry="46"/>
    <path d="M132 736 h44 M132 764 h44"/>
    <path d="M400 736 H568 V784 H400 Z"/>
  </g>

  <!-- para-choque (laranja) -->
  <g stroke="#F97316" stroke-width="7">
    <path d="M1006 764 H1406 Q1420 764 1420 780 V842 Q1420 858 1404 858 H1006 Q992 858 992 842 V780 Q992 764 1006 764 Z"/>
    <path d="M1030 796 h74 v34 h-74 z"/>
    <path d="M1160 812 H1400"/>
  </g>
</g>

<rect width="1600" height="1000" fill="url(#vinheta)"/>
</svg>
