<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="build" content="202608192100">
<title>Farol Frota — Gestão em Movimento</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;}
.brand h1{font-size:16px;font-weight:700;color:var(--orange);}
.brand p{font-size:10px;color:var(--text2);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:8px;}
.back-btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:5px 7px;cursor:pointer;color:var(--orange);display:flex;align-items:center;text-decoration:none;}
.back-btn:hover{background:rgba(249,115,22,.3);}
.main{padding:36px 32px 80px;}
.intro{font-size:12px;color:var(--text2);margin-bottom:22px;line-height:1.6;max-width:860px;}
.intro b{color:var(--text);}
.sec-title{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.8px;margin:26px 0 12px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,260px));gap:14px;}
.fcard{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:18px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:6px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);transition:border-color .15s,transform .15s;}
.fcard:hover{border-color:rgba(249,115,22,.5);transform:translateY(-2px);}
.fcard .cod{font-size:20px;font-weight:800;color:var(--orange);}
.fcard .nome{font-size:11px;color:var(--text2);min-height:28px;}
.fcard .go{font-size:10px;font-weight:800;color:var(--orange);text-transform:uppercase;letter-spacing:.6px;margin-top:6px;}
.fcard.geral{grid-column:span 2;background:rgba(249,115,22,.10);border-color:rgba(249,115,22,.35);}
.fcard.geral .cod{font-size:22px;}
.loading{text-align:center;color:var(--text3);padding:60px;font-size:13px;}
.gate{max-width:560px;margin:80px auto;text-align:center;background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:38px 34px;backdrop-filter:blur(16px);}
.gate h2{font-size:18px;font-weight:800;margin-bottom:10px;}
.gate p{font-size:13px;color:var(--text2);line-height:1.6;}
@media(max-width:768px){.main{padding:20px 16px 60px;}.fcard.geral{grid-column:span 1;}}
</style>
<script src="../assets/gviz-cache.js?v=202609050530"></script>
</head>
<body>
<header class="header">
  <div class="brand"><h1>Farol Frota</h1><p>Farol semanal dos indicadores — visão geral e por unidade (somente admin)</p></div>
  <div class="header-right"><a href="../" class="back-btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a></div>
</header>
<main class="main">
  <div id="content"><div class="loading">Verificando acesso…</div></div>
</main>
<script>
const SUPABASE_URL='https://lozwipoeacpvplgkrxkq.supabase.co';
const SUPABASE_KEY='sb_publishable_ggKEEebc5zjgQDVsF92Upw_6uoLmKe9';
// mesmas unidades do portal (códigos do FCA) — CBA e MCC separadas por projeto/tier
const UNIDADES={
  'BLC':'Balneário Camboriú',
  'CBA T1':'Cuiabá — Empurrada (T1)','CBA T1 WH':'Cuiabá — Apoio/Empilhadeiras (T1 WH)','CBA T2':'Cuiabá — CDD (T2)',
  'CGR':'Campo Grande','FLP':'Florianópolis','GRL':'Guarulhos',
  'MCC T1':'Cachoeiras de Macacu — Empurrada (T1)','MCC T2':'Cachoeiras de Macacu — CDI (T2)',
  'NFR':'Nova Friburgo','PIR':'Piraí','PLT':'Pelotas','RON':'Rondonópolis'
};
function gate(t,m){document.getElementById('content').innerHTML=`<div class="gate"><h2>${t}</h2><p>${m}</p></div>`;}
(async function(){
  let sb;
  try{ sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){ gate('Erro','Falha ao iniciar o Supabase.'); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ gate('Login necessário','Entre pelo <b>hub</b> para acessar o Farol.'); return; }
  const {data:prof}=await sb.from('fca_profiles').select('is_admin').eq('user_id',session.user.id).maybeSingle();
  if(!prof||!prof.is_admin){ gate('Apenas administradores','O Farol é acessado pelos admins. As unidades recebem o farol da sua operação <b>por e-mail</b>, toda segunda-feira às 14h.'); return; }
  const cards=Object.keys(UNIDADES).sort().map(c=>
    `<a class="fcard" href="unidade.html?u=${encodeURIComponent(c)}"><div class="cod">${c}</div><div class="nome">${UNIDADES[c]}</div><div class="go">Abrir farol →</div></a>`).join('');
  document.getElementById('content').innerHTML=`
    <div class="intro">Retrato semanal dos indicadores da frota. O e-mail automático sai <b>toda segunda-feira às 14h</b> para os destinatários liberados no
    <b>Gerenciar Acessos</b> — cada gestor recebe o farol da(s) sua(s) unidade(s); quem tem "Todas" recebe o consolidado. Aqui dentro a visão é ao vivo.</div>
    <div class="sec-title">Consolidado</div>
    <div class="grid"><a class="fcard geral" href="geral.html"><div class="cod">Farol Geral</div><div class="nome">Todas as unidades — visão corporativa de todos os indicadores</div><div class="go">Abrir farol →</div></a></div>
    <div class="sec-title">Por unidade</div>
    <div class="grid">${cards}</div>`;
})();
</script>
<script src="../assets/mobile.js?v=202608220020"></script>
<script src="../assets/ctrlk.js"></script>
<script src="../assets/build-check.js?v=202608192100"></script>
</body>
</html>
