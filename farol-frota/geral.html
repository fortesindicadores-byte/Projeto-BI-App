<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farol Geral — Farol Frota</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="farol.css">
</head>
<body>
<header class="header">
  <div class="brand"><h1>Farol Geral</h1><p>Todas as unidades — retrato semanal dos indicadores da frota</p></div>
  <div class="header-right">
    <a href="./" class="back-btn" title="Voltar ao hub do Farol"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="theme-btn" id="themeBtn" title="Modo claro/escuro"></button>
    <span class="status-badge" id="status">Carregando…</span>
  </div>
</header>
<main class="main">
  <div class="hero">
    <div class="hero-main">
      <div class="hero-label">FAROL DA FROTA — MÉDIA DAS ADERÊNCIAS DA SEMANA</div>
      <div class="hero-value" id="hero-farois">—</div>
      <div class="hero-deltas" id="hero-resumo"></div>
    </div>
  </div>
  <div id="content"><div class="loading">Verificando acesso…</div></div>
</main>
<script src="farol-core.js"></script>
<script>
(async function(){
  const r=await farolGate();
  if(!r.ok){document.getElementById('content').innerHTML=`<div class="gate"><h2>Acesso restrito</h2><p>${r.msg}</p></div>`;document.getElementById('status').textContent='—';return;}
  document.getElementById('content').innerHTML='<div class="loading">Lendo as abas do Farol…</div>';
  try{
    await farolLoad();
    renderFarol(document.getElementById('content'),null);
    const stats=renderHeroDots(document.getElementById('hero-resumo'),null);
    const score=avgA([stats.sv,stats.se,stats.cf,stats.pv,stats.al,stats.os]);
    document.getElementById('hero-farois').innerHTML=score==null?'—':`<span class="${clsPctMeta(score,97,90)}">${pct1(score)}</span>`;
    const now=new Date();
    document.getElementById('status').textContent='Atualizado '+now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){
    console.error(e);
    document.getElementById('content').innerHTML='<div class="gate"><h2>Erro ao carregar</h2><p>Não consegui ler a planilha do Farol. Confira o compartilhamento ("qualquer pessoa com o link — leitor") e recarregue.</p></div>';
    document.getElementById('status').textContent='Erro ao carregar dados';
  }
})();
const _sun=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const _moon=`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);const b=document.getElementById('themeBtn');if(b)b.innerHTML=t==='light'?_moon:_sun;}
applyTheme(localStorage.getItem('bi_theme')||'dark');
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));
</script>
</body>
</html>
