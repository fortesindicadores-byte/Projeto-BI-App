<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Papéis e Responsabilidades</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../assets/excel-export.js"></script>
<style>
:root{--bg:#0C1017;--card:#141B26;--card2:#1A2335;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;}.brand h1{font-size:16px;font-weight:800;color:var(--orange);}.brand p{font-size:10px;color:#94A3B8;margin-top:2px;font-style:italic;}
.header-right{flex-shrink:0;display:flex;align-items:center;gap:8px;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--orange);display:flex;align-items:center;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.32);}
.theme-btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 6px;cursor:pointer;color:var(--orange);display:flex;align-items:center;}
.theme-btn:hover{background:rgba(249,115,22,.32);}
.main{padding:28px 28px 60px;}
.page-title{font-size:19px;font-weight:800;color:var(--text);margin-bottom:3px;}
.page-title b{color:var(--orange);}
.page-sub{font-size:13px;color:var(--text2);margin-bottom:24px;}
/* Legenda de donos */
.owners{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px;}
.owner-leg{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text2);font-weight:600;}
.owner-leg i{width:12px;height:12px;border-radius:3px;}
/* Tabela */
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:18px 20px 16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;}
thead th{position:sticky;top:0;background:var(--card);color:var(--text);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:8px 8px 12px;border-bottom:1px solid rgba(255,255,255,.10);white-space:nowrap;vertical-align:bottom;z-index:2;}
tbody td{padding:13px 8px;border:none;vertical-align:middle;color:var(--text);line-height:1.5;}
tbody tr:hover{background:rgba(255,255,255,.035);}
td.bloco{font-weight:700;color:var(--text);white-space:nowrap;}
td.desc{color:var(--text2);min-width:340px;}
td.dono{white-space:nowrap;}
.chip{display:inline-block;padding:4px 11px;border-radius:20px;font-size:11px;font-weight:700;background:var(--oc-bg);color:var(--oc);border:1px solid var(--oc-bd);}
body.light-mode .header{background:rgba(12,16,23,.97);}
body.light-mode .main{background:#F0F0F0;--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);}
body.light-mode .tbl-section{background:rgba(128,128,128,.14);border:none;box-shadow:none;--text:#1a1a1a;--text2:#444444;}
body.light-mode thead th{background:#F0F0F0;border-bottom-color:rgba(0,0,0,.10);}
body.light-mode .chip{color:#1a1a1a!important;}

@media(max-width:768px){
  .header{padding:8px 12px 10px;}.brand h1{font-size:14px;}
  .main{padding:16px 14px 40px;}
  .page-title{font-size:21px;}
  table{font-size:12px;}
  thead th,tbody td{padding:9px 8px;}
  td.desc{min-width:220px;}
}
</style>
<script>try{if(!sessionStorage.getItem("gem_hub"))location.replace("../");}catch(e){}</script>
</head>
<body>
<header class="header">
  <div class="brand"><h1>Papéis e Responsabilidades</h1><p>Planejamento Estratégico · Frota</p></div>
  <div class="header-right">
    <a href="../" class="btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="theme-btn" id="themeBtn" title="Modo claro/escuro"></button>
  </div>
</header>

<main class="main">
  <div class="page-title">Papéis e Responsabilidades <b>| Frota</b></div>
  <div class="page-sub">Blocos de gestão, descrição da responsabilidade e o dono de cada um.</div>

  <div class="owners">
    <span class="owner-leg"><i style="background:#F97316"></i>Renan Fortes</span>
    <span class="owner-leg"><i style="background:#38BDF8"></i>Felipe Monsores</span>
    <span class="owner-leg"><i style="background:#3BB33B"></i>Katiuce Cordeiro</span>
    <span class="owner-leg"><i style="background:#A78BFA"></i>Pedro Pieroni</span>
    <span class="owner-leg"><i style="background:#F472B6"></i>Marina Siqueira</span>
    <span class="owner-leg"><i style="background:#2DD4BF"></i>Emili Ariza</span>
  </div>

  <div class="tbl-section"><div class="tbl-wrap">
    <table>
      <thead><tr><th>Bloco</th><th>Descrição</th><th>Dono</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div></div>
</main>

<script>
const OWNERS={
  'Renan Fortes':  {c:'#F97316',bg:'rgba(249,115,22,.15)',bd:'rgba(249,115,22,.4)'},
  'Felipe Monsores':{c:'#38BDF8',bg:'rgba(56,189,248,.15)',bd:'rgba(56,189,248,.4)'},
  'Katiuce Cordeiro':{c:'#3BB33B',bg:'rgba(59,179,59,.15)',bd:'rgba(59,179,59,.4)'},
  'Pedro Pieroni': {c:'#A78BFA',bg:'rgba(167,139,250,.15)',bd:'rgba(167,139,250,.4)'},
  'Marina Siqueira':{c:'#F472B6',bg:'rgba(244,114,182,.15)',bd:'rgba(244,114,182,.4)'},
  'Emili Ariza':   {c:'#2DD4BF',bg:'rgba(45,212,191,.15)',bd:'rgba(45,212,191,.4)'},
};
const ROWS=[
  ['Governança','Definir metodologias e ritos de gestão do corporativo, garantindo rotina, padrões e execução das decisões.','Renan Fortes'],
  ['Custos','Garantir controle de orçamento e remunerado, com gestão à vista e fechamento mensal padronizado.','Renan Fortes'],
  ['Projetos','Garantir e validar projetos que otimizem processos e melhorem a qualidade e a execução do time.','Renan Fortes'],
  ['Disponibilidade','Garantir disponibilidade com controle de descontos, manutenções e documentos.','Felipe Monsores'],
  ['Xadrez de Frota','Garantir alocação eficiente da frota (recebimento, desmobilização e otimizações).','Felipe Monsores'],
  ['Capacitação Técnica','Garantir a capacitação técnica e desenvolvimento da ponta em conhecimento técnico de frota.','Felipe Monsores'],
  ['Contratos de Manutenção','Garantir controle de contratos e pagamentos, evitando custos indevidos.','Katiuce Cordeiro'],
  ['Km Rodado','Garantir governança do km e reduzir gap do R$/km (realizado vs remunerado/orçado).','Katiuce Cordeiro'],
  ['Descarte de Resíduos','Garantir conformidade legal do descarte e documentação dos fornecedores.','Katiuce Cordeiro'],
  ['Pneus','Garantir performance e custo de pneus com rotina e processos padronizados.','Pedro Pieroni'],
  ['Stress Test','Garantir aderência ao Stress Test e tratar faltantes rapidamente.','Pedro Pieroni'],
  ['CIVF','Garantir aderência ao CIVF com evidências e correção de pendências.','Pedro Pieroni'],
  ['Conformidade da Frota','Garantir conformidade por checklist e correção rápida de itens críticos.','Pedro Pieroni'],
  ['Estoque','Garantir acuracidade e níveis corretos de estoque (ruptura e overstock).','Pedro Pieroni'],
  ['Demarco','Garantir Nível 1 nas auditorias com qualidade e segurança.','Pedro Pieroni'],
  ['DPO/VPO','Garantir sustentabilidade nas auditorias via aderência ao checkpoint e plano de ação.','Katiuce Cordeiro'],
  ['Combustível','Garantir eficiência e controle de custo do combustível (consumo e preço).','Emili Ariza'],
];
document.getElementById('tb').innerHTML=ROWS.map(([b,d,o])=>{
  const c=OWNERS[o]||{c:'#94A3B8',bg:'rgba(148,163,184,.15)',bd:'rgba(148,163,184,.4)'};
  return `<tr style="--oc:${c.c};--oc-bg:${c.bg};--oc-bd:${c.bd}"><td class="bloco">${b}</td><td class="desc">${d}</td><td class="dono"><span class="chip">${o}</span></td></tr>`;
}).join('');

const _sun=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const _moon=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);const b=document.getElementById('themeBtn');if(b)b.innerHTML=t==='light'?_moon:_sun;}
(function(){const t=localStorage.getItem('bi_theme')||'dark';applyTheme(t);document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));})();
</script>
</body>
</html>
