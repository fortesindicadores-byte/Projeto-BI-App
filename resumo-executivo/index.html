<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resumo Executivo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;order:1;}.brand h1{font-size:17px;font-weight:800;color:var(--orange);}.brand p{font-size:10px;color:#94A3B8;margin-top:2px;font-style:italic;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:8px;}
.status-badge{font-size:9px;color:#F1F5F9;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:2px 8px;white-space:nowrap;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--orange);display:flex;align-items:center;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.32);}
.header-filters{flex-basis:100%;order:3;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.filter-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:120px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;}.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:4px;min-width:200px;max-height:320px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-search{padding:7px 10px;border-bottom:1px solid #1e2d40;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ms-search input{flex:1;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:11px;outline:none;}
.ms-list{overflow-y:auto;flex:1;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all-opt{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input[type=checkbox]{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.ms-only{margin-left:auto;font-size:8px;color:var(--orange);padding:1px 5px;border-radius:2px;cursor:pointer;opacity:0;transition:opacity .12s;flex-shrink:0;}
.ms-opt:hover .ms-only{opacity:1;}.ms-only:hover{background:rgba(249,115,22,.2);}
.main{padding:20px 24px;}
.hero{margin-bottom:18px;padding:2px;}
.hero .lbl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;}
.hero .val{font-size:48px;font-weight:800;line-height:1;margin-top:3px;}
.hero .sub{font-size:12px;color:var(--text2);margin-top:5px;}
.quad{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.box{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:0 0 14px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);overflow:hidden;display:flex;flex-direction:column;}
.box h2{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:11px 18px;display:flex;align-items:center;gap:8px;}
.box.pos h2{background:rgba(59,179,59,.16);color:#3BB33B;}
.box.neg h2{background:rgba(255,102,102,.15);color:#FF6666;}
.box.at  h2{background:rgba(234,179,8,.16);color:#EAB308;}
.box.next h2{background:rgba(56,189,248,.14);color:#38BDF8;}
.box ul{list-style:none;padding:10px 18px 0;display:flex;flex-direction:column;gap:9px;flex:1;}
.box li{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;line-height:1.4;color:var(--text);}
.box li .mk{flex-shrink:0;font-weight:800;opacity:.8;}
.box.pos li .mk{color:#3BB33B;}.box.neg li .mk{color:#FF6666;}.box.at li .mk{color:#EAB308;}.box.next li .mk{color:#38BDF8;}
.box li b{font-weight:700;}
.box li.hl{border:1px solid;border-radius:6px;padding:7px 10px;margin-top:auto;font-weight:600;}
.box.pos li.hl{background:rgba(59,179,59,.15);border-color:rgba(59,179,59,.4);}
.box.neg li.hl{background:rgba(255,102,102,.13);border-color:rgba(255,102,102,.4);}
.box.at li.hl{background:rgba(234,179,8,.15);border-color:rgba(234,179,8,.4);}
.box.next li.hl{background:rgba(56,189,248,.13);border-color:rgba(56,189,248,.4);}
.empty{padding:6px 18px;color:var(--text3);font-size:11.5px;font-style:italic;}
.foot{margin-top:14px;font-size:10px;color:var(--text3);font-style:italic;text-align:center;}
.loading{text-align:center;color:var(--text3);padding:50px;}
body.light-mode .main{background:#F0F0F0;--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);--red:#ff0000;--green:#0E8C0E;}
body.light-mode .box{background:rgba(128,128,128,.14)!important;border-color:transparent!important;box-shadow:none!important;--text:#1a1a1a;--text3:#666666;}
@media(max-width:820px){.main{padding:12px;}.quad{grid-template-columns:1fr;}}
@media(max-width:768px){
  .header{padding:8px 12px 10px;}
  .header-right{gap:4px;}
  .brand h1{font-size:14px;}
  .brand p{font-size:9px;}
  .status-badge{font-size:8px;padding:2px 6px;}
  .btn{padding:3px 5px;}
  .btn svg{width:13px;height:13px;}
  .header-filters{gap:5px;margin-top:8px;}
  .filter-group{flex:0 0 calc(50% - 3px);}
  .ms-wrap{width:100%;}
  .ms-btn{width:100%;min-width:0;font-size:8px;padding:4px 8px;}
  .main{padding:12px;}
  /* Hero menor */
  .hero{margin-bottom:14px;}
  .hero .lbl{font-size:10px;}
  .hero .val{font-size:34px;}
  .hero .sub{font-size:10.5px;}
  /* Quadrantes empilhados em 1 coluna, textos compactos */
  .quad{grid-template-columns:1fr;gap:12px;}
  .box h2{font-size:12px;padding:9px 13px;}
  .box ul{padding:9px 13px 0;gap:7px;}
  .box li{font-size:11.5px;gap:7px;line-height:1.35;}
  .box li.hl{padding:6px 9px;}
  .box li b{word-break:break-word;}
  .empty{padding:5px 13px;font-size:10.5px;}
  .foot{font-size:9px;}
}
@media(max-width:480px){
  .hero .val{font-size:30px;}
  .box li{font-size:11px;}
  .box h2{font-size:11.5px;}
}
</style>

<body>
<header class="header">
  <div class="brand"><h1>Resumo Executivo</h1><p>Frota — leitura automática dos indicadores</p></div>
  <div class="header-right">
    <a href="../" class="btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="btn" id="themeBtn" title="Modo claro/escuro"></button>
    <button class="btn" onclick="carregar()" title="Atualizar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>
    <span class="status-badge" id="status">Carregando…</span>
  </div>
  <div class="header-filters">
    <div class="filter-group"><span class="filter-label">Vigência</span><div class="ms-wrap" id="ms-vig"><button class="ms-btn" onclick="toggleMs('ms-vig')"><span class="ms-lbl">Vigência</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  </div>
</header>

<main class="main">
  <div class="hero" id="hero"></div>
  <div class="quad" id="quad"><div class="loading">Carregando…</div></div>
  <div class="foot" id="foot"></div>
</main>

<script>
const SRC={
  ics:'https://docs.google.com/spreadsheets/d/1xGl1Xrk2sPS9zWghEuecFMNBHwmeLiZ02U-QpO8cDPY/gviz/tq?sheet='+encodeURIComponent('Consolidado ICs'),
  dre:'https://docs.google.com/spreadsheets/d/1qcTy2ppLCGBKKqZCxCYWCTL9kTAuWfHBMyBfWJOyih8/gviz/tq?sheet='+encodeURIComponent('Consolidado DRE'),
  km:'https://docs.google.com/spreadsheets/d/1wCoRGsvOgmIvfLW4F9Sxr-5AX9Go-aFlRVjrQ_B2ilM/gviz/tq?sheet='+encodeURIComponent('Dispersão de km'),
  rsl:'https://docs.google.com/spreadsheets/d/1ZZdvG_RK5cTBLdPl3TWCbNeqw-Y4fTYwWsQV4w-e__A/gviz/tq?sheet='+encodeURIComponent('R$/L'),
  kmlEf:'https://docs.google.com/spreadsheets/d/1ZZdvG_RK5cTBLdPl3TWCbNeqw-Y4fTYwWsQV4w-e__A/gviz/tq?sheet='+encodeURIComponent('Km/L'),
  dpo:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?sheet=DPO',
  demarco:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?sheet=Demarco',
  fca:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?gid=216663799'
};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DEPARA={'CDD CAMBORIU':'BLC','CDD CUIABA':'CBA','CUIABA EMPURRADA':'CBA','CUIABA':'CBA','CDD FLORIANOPOLIS':'FLP','CDD GUARULHOS':'GRL','CDD NOVA FRIBURGO':'NFR','CDD PELOTAS':'PEL','CDD RIO DE JANEIRO':'CGR','CDD RONDONOPOLIS':'RON','CDI MACACU':'MCC','MACACU EMPURRADA':'MCC','PIRAI EMPURRADA':'PIR'};
const IC=[{c:2,l:'Disponibilidade'},{c:3,l:'Preventivas',good:95},{c:4,l:'Consumo Km/L'},{c:5,l:'Aferições'},{c:6,l:'Checklist T1/T2'},{c:7,l:'Checklist Apoio'},{c:8,l:'Conformidade'},{c:9,l:'Stress Test Cam.'},{c:10,l:'Stress Test Emp.'},{c:11,l:'SLA'},{c:12,l:'CIVF'}];
let ICS=[],VIGS=[],XP={};

function parseD(v){if(v==null)return null;const m=String(v).match(/Date\((\d+),(\d+),(\d+)/);return m?new Date(+m[1],+m[2],+m[3]):null;}
function vigKeyN(d){return d?d.getFullYear()*100+d.getMonth():0;}
function vigLbl(d){return d?MESES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2):'';}
function n1(v){return v==null||!isFinite(v)?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});}
function r0(v){return v==null||!isFinite(v)?'—':Math.round(v);}
function NK(s){return String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
function NF(s){let x=String(s==null?'':s);const i=x.indexOf(':');if(i>=0)x=x.slice(i+1);return NK(x);}

// ── multi-select ──
function _buildMs(wrap,renderFn,getAllFn){if(!(wrap._sel instanceof Set))wrap._sel=new Set();const sel=wrap._sel,list=wrap.querySelector('.ms-list'),srch=wrap.querySelector('.ms-search input');const render=(q='')=>{renderFn(list,sel,q);syncBadge(wrap);};list.addEventListener('change',e=>{const box=e.target;if(box.classList.contains('ms-all')){sel.clear();}else if(sel.size===0){if(!box.checked){const all=getAllFn?getAllFn():[];all.forEach(v=>{if(v!==box.dataset.v)sel.add(v);});}}else{if(box.checked)sel.add(box.dataset.v);else sel.delete(box.dataset.v);if(getAllFn){const all=getAllFn();if(all.length>0&&all.every(v=>sel.has(v)))sel.clear();}}render(srch.value);atualizar();});list.addEventListener('click',e=>{const only=e.target.closest('.ms-only');if(!only)return;e.preventDefault();e.stopPropagation();sel.clear();sel.add(only.dataset.v);render(srch.value);atualizar();});srch.addEventListener('input',()=>render(srch.value));srch.addEventListener('click',e=>e.stopPropagation());render();}
function buildMsFilter(id,items){const wrap=document.getElementById(id);if(!wrap)return;_buildMs(wrap,(list,sel,q)=>{const f=q.toLowerCase(),shown=items.filter(v=>String(v).toLowerCase().includes(f)),allChk=sel.size===0;list.innerHTML=(!q?`<label class="ms-opt all-opt"><input type="checkbox" class="ms-all" ${allChk?'checked':''}> Todas</label>`:'')+shown.map(v=>{const ve=String(v).replace(/"/g,'&quot;');return `<label class="ms-opt"><input type="checkbox" data-v="${ve}" ${allChk||sel.has(v)?'checked':''}> ${v}<span class="ms-only" data-v="${ve}">only</span></label>`;}).join('');},()=>items);}
function syncBadge(wrap){const cnt=wrap.querySelector('.ms-cnt'),n=wrap._sel?wrap._sel.size:0;if(cnt){cnt.textContent=n;cnt.style.display=n?'':'none';}}
function toggleMs(id){document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p.closest('.ms-wrap').id!==id)p.classList.remove('open');});const panel=document.querySelector(`#${id} .ms-panel`);panel.classList.toggle('open');if(panel.classList.contains('open')){const inp=panel.querySelector('input[type=text]');if(inp)setTimeout(()=>inp.focus(),50);}}
function getMsValues(id){const wrap=document.getElementById(id);if(!wrap)return[];return wrap._sel?[...wrap._sel]:[];}
document.addEventListener('click',e=>{if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));});

function gviz(url){return new Promise((res,rej)=>{const fn='_gv'+Math.floor(Math.random()*1e9);const s=document.createElement('script');const clr=()=>{try{delete window[fn];s.remove();}catch(e){}};window[fn]=r=>{clr();try{if(r.status!=='ok')throw 0;res((r.table.rows||[]).map(x=>(x.c||[]).map(c=>c?c.v:null)));}catch(e){rej(e);}};s.onerror=()=>{clr();rej(0);};s.src=url+(url.includes('?')?'&':'?')+'tqx=out:json;responseHandler:'+fn;document.head.appendChild(s);});}
function rd(k){try{return JSON.parse(localStorage.getItem('re_'+k));}catch(e){return null;}}
function wr(k,v){try{localStorage.setItem('re_'+k,JSON.stringify(v));}catch(e){}}

function compDPO(rows){const hdr=rows[0]||[];let li=-1;for(let i=hdr.length-1;i>=1;i--){if(rows.slice(1).some(r=>/Nível/i.test(String(r[i]||'')))){li=i;break;}}const out={ok:[],bad:[],sem:'',tot:0};if(li<0)return out;out.sem=String(hdr[li]||'');const seen={};rows.slice(1).forEach(r=>{const code=String(r[0]||'').trim();const m=String(r[li]||'').match(/Nível\s*(\d+)/i);if(!code||!m)return;const lv=+m[1];out.tot++;(lv>=3?out.ok:out.bad).push({code,lv});});return out;}
// Demarco: ESCALA INVERTIDA — Nível 1 = top (melhor); evolução = nível diminuiu vs semestre anterior
function compDemarco(rows){const hdr=rows[0]||[];let li=-1;for(let i=hdr.length-1;i>=1;i--){if(rows.slice(1).some(r=>/Nível/i.test(String(r[i]||'')))){li=i;break;}}const out={top:[],bad:[],improved:[],worsened:[],sem:''};if(li<0)return out;out.sem=String(hdr[li]||'');const pj=li-1;rows.slice(1).forEach(r=>{const code=String(r[0]||'').trim();const m=String(r[li]||'').match(/Nível\s*(\d+)/i);if(!code||!m)return;const lv=+m[1];const pm=pj>=1?String(r[pj]||'').match(/Nível\s*(\d+)/i):null;const prev=pm?+pm[1]:null;if(lv===1)out.top.push(code);if(lv>=4)out.bad.push({code,lv});if(prev!=null&&lv<prev)out.improved.push({code,prev,lv});if(prev!=null&&lv>prev)out.worsened.push({code,prev,lv});});return out;}
// conta DRE → pacote
const PAC={'Combustíveis Veiculos e Equipamentos':'Combustível','Combustíveis':'Combustível','Fluídos (Arla)':'Combustível','Arla':'Combustível','Estorno de ICMS não Aproveitado':'Combustível','ICMS Crédito Presumido':'Combustível','Manutenção de Veículos e Equipamentos':'Manutenção','Materiais e Ferramentas de Oficina':'Manutenção','Lavação de Veículos':'Manutenção','Manutenção de Carrocerias':'Manutenção','Personalização/Padronização de Veículos':'Manutenção','Personalização e Padronização de Veículos':'Manutenção','Contratos de Manutenção Fabricante':'Manutenção','Consertos e Recapagens de Pneus':'Pneus','Pneus e Camaras':'Pneus','Recapagens e Outros Serviços':'Pneus','Pneus Novos':'Pneus','IPVA e Licenciamento de Veículos':'Seguros e licenças','Seguro de Veículos e Equipamentos':'Seguros e licenças'};
function compFCA(rows){const today=new Date();today.setHours(0,0,0,0);const recs=[];rows.forEach(r=>{const d=parseD(r[1]);if(!d)return;const st=String(r[8]||'');const prazo=parseD(r[7]);const concl=/conclu/i.test(st)?'C':/andamento/i.test(st)?'A':'N';const venc=concl==='C'?false:(prazo&&prazo<today);recs.push({k:vigKeyN(d),concl,venc});});return recs;}

function carregar(){
  const c=rd('data2');
  if(c){try{applyData(c);document.getElementById('status').textContent='Atualizando…';}catch(e){}}else document.getElementById('status').textContent='Carregando…';
  Promise.all([gviz(SRC.ics),gviz(SRC.dre).catch(()=>null),gviz(SRC.km).catch(()=>null),gviz(SRC.rsl).catch(()=>null),gviz(SRC.kmlEf).catch(()=>null),gviz(SRC.dpo).catch(()=>null),gviz(SRC.fca).catch(()=>null),gviz(SRC.demarco).catch(()=>null)]).then(a=>{
    const d={ics:a[0],dre:a[1],km:a[2],rsl:a[3],kmlEf:a[4],dpo:a[5],fca:a[6],demarco:a[7]};wr('data2',d);applyData(d);
    const now=new Date();document.getElementById('status').textContent=`${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }).catch(e=>{console.error(e);if(!c)document.getElementById('status').textContent='Erro ao carregar';});
}

function applyData(d){
  const selV=getMsValues('ms-vig');
  XP={};
  if(d.dre)try{XP.dre=d.dre.filter(r=>parseD(r[9])&&String(r[12]||'').trim()!=='Receita Líquida').map(r=>({vk:vigKeyN(parseD(r[9])),rem:+r[1]||0,real:+r[2]||0,cta:String(r[12]||'').trim()}));}catch(e){}
  if(d.demarco)try{XP.dmc=compDemarco(d.demarco);}catch(e){}
  if(d.km)try{XP.km=d.km.filter(r=>parseD(r[0])).map(r=>({vk:vigKeyN(parseD(r[0])),rem:+r[31]||0,real:+r[32]||0}));}catch(e){}
  // R$/L: lookup preço remunerado
  const L1={},L2={};
  if(d.rsl)d.rsl.forEach(r=>{const p=NK(r[0]),dt=parseD(r[3]);if(!p||!dt)return;const ym=vigKeyN(dt),f=NF(r[23]),v=+r[22]||0;if(!(v>0))return;(L1[p+'|'+ym+'|'+f]=L1[p+'|'+ym+'|'+f]||{s:0,n:0}).s+=v;L1[p+'|'+ym+'|'+f].n++;(L2[p+'|'+ym]=L2[p+'|'+ym]||{s:0,n:0}).s+=v;L2[p+'|'+ym].n++;});
  const remP=(p,ym,f)=>{let e=L1[p+'|'+ym+'|'+f]||L2[p+'|'+ym];return e&&e.n>0?e.s/e.n:null;};
  if(d.kmlEf)try{XP.kmlEf=d.kmlEf.filter(r=>parseD(r[0])).map(r=>{const vk=vigKeyN(parseD(r[0]));return{vk,lit:+r[23]||0,tot:+r[25]||0,km:+r[22]||0,remKmL:+r[4]||0,rp:remP(NK(r[14]),vk,NF(r[20]))};});}catch(e){}
  if(d.dpo)try{XP.dpo=compDPO(d.dpo);}catch(e){}
  if(d.fca)try{XP.fca=compFCA(d.fca);}catch(e){}
  ICS=d.ics.filter(r=>r[0]&&r[1]&&parseD(r[0])).map(r=>{const vigD=parseD(r[0]);return{vigD,vk:vigKeyN(vigD),unidade:String(r[1]).trim(),ic:IC.map(x=>r[x.c]!=null?+r[x.c]*100:null),pont:r[13]!=null?+r[13]:null};});
  const vm=new Map();ICS.forEach(o=>vm.set(o.vk,o.vigD));VIGS=[...vm.values()].sort((a,b)=>vigKeyN(a)-vigKeyN(b));
  const vigItems=VIGS.map(d=>vigLbl(d));
  const comDados=vigItems.filter(v=>ICS.some(o=>vigLbl(o.vigD)===v&&o.pont!=null));const base=comDados.length?comDados:vigItems;
  const vw=document.getElementById('ms-vig');
  if(selV.length)vw._sel=new Set(selV.filter(v=>vigItems.includes(v)));else if(base.length)vw._sel=new Set([base[base.length-1]]);
  buildMsFilter('ms-vig',vigItems);
  atualizar();
}

function band(v){return v==null?'':v>=90?'g':v>=80?'y':v>=70?'o':'r';}
const cap=v=>v==null?null:Math.min(100,Math.max(0,v));
function avg(a){const f=a.filter(v=>v!=null);return f.length?f.reduce((x,y)=>x+y,0)/f.length:null;}
function sumAtt(rows,pk){let rem=0,real=0,h=false;(rows||[]).forEach(o=>{if(pk.has(o.vk)){rem+=o.rem;real+=o.real;h=true;}});return h&&rem?(real/rem-1)*100:null;} // desvio % real vs rem
function rlDev(pk){let lit=0,tot=0,remxl=0,litrem=0;(XP.kmlEf||[]).forEach(o=>{if(pk.has(o.vk)){lit+=o.lit;if(o.tot>0)tot+=o.tot;if(o.rp>0){remxl+=o.rp*o.lit;litrem+=o.lit;}}});if(!lit||!litrem)return null;return ((tot/lit)/(remxl/litrem)-1)*100;}
function kmlAtt(pk){let km=0,lit=0,rs=0,cnt=0;(XP.kmlEf||[]).forEach(o=>{if(pk.has(o.vk)){km+=o.km;lit+=o.lit;if(o.remKmL>0){rs+=o.remKmL;cnt++;}}});if(!lit||!cnt)return null;return (km/lit)/(rs/cnt)*100;}
function rkmDev(pk){let cr=0,cR=0,kr=0,kR=0;(XP.dre||[]).forEach(o=>{if(pk.has(o.vk)){cr+=o.rem;cR+=o.real;}});(XP.km||[]).forEach(o=>{if(pk.has(o.vk)){kr+=o.rem;kR+=o.real;}});if(!kR||!kr||!cr)return null;return ((cR/kR)/(cr/kr)-1)*100;}

function atualizar(){
  if(!ICS.length)return;
  const selV=getMsValues('ms-vig');
  const cands=(selV.length?VIGS.filter(d=>selV.includes(vigLbl(d))):VIGS.slice()).sort((a,b)=>vigKeyN(a)-vigKeyN(b));
  const selD=cands.length?cands[cands.length-1]:VIGS[VIGS.length-1];if(!selD)return;
  const pk=new Set(cands.map(vigKeyN));
  const yr=selD.getFullYear(),mi=selD.getMonth();
  const rows=ICS.filter(o=>pk.has(o.vk));
  const pos=[],neg=[],at=[],next=[];
  // ── ICs nível empresa (média) ──
  const comp=IC.map((d,i)=>({l:d.l,good:d.good||90,v:cap(avg(rows.map(o=>o.ic[i])))}));
  // Consumo Km/L vem do painel de combustível (real km/l ÷ remunerado), não do Consolidado ICs
  const kix=IC.findIndex(x=>x.l==='Consumo Km/L');if(kix>=0){const kv=kmlAtt(pk);if(kv!=null)comp[kix].v=cap(kv);}
  comp.forEach(c=>{if(c.v==null)return;if(c.v>=c.good)pos.push(`<b>${c.l}:</b> ${r0(c.v)}%`);else if(c.v<80)neg.push(`<b>${c.l}:</b> ${r0(c.v)}%`+(c.v<70?' (crítico)':''));});
  // ── piores unidades nos 2 ICs mais fracos ──
  const unis=[...new Set(rows.map(o=>o.unidade))];
  const weak=comp.filter(c=>c.v!=null&&c.v<85).sort((a,b)=>a.v-b.v).slice(0,2);
  weak.forEach(w=>{if(w.l==='Consumo Km/L')return;const i=IC.findIndex(x=>x.l===w.l);const arr=unis.map(u=>({u,v:cap(avg(rows.filter(o=>o.unidade===u).map(o=>o.ic[i])))})).filter(x=>x.v!=null).sort((a,b)=>a.v-b.v).slice(0,3);if(arr.length)neg.push(`<b>${w.l} — piores:</b> `+arr.map(x=>`${x.u.replace('CDD ','').replace('CDI ','')} ${r0(x.v)}%`).join(', '));});
  // ── financeiro / dispersão (desvio real vs remunerado) ──
  const cD=sumAtt(XP.dre,pk),kD=sumAtt(XP.km,pk),rk=rkmDev(pk),rl=rlDev(pk);
  if(cD!=null){(cD<=0?pos:neg).push(`<b>Custos da frota:</b> ${cD<=0?Math.abs(cD).toFixed(1)+'% abaixo':cD.toFixed(1)+'% acima'} do remunerado`);}
  if(kD!=null){(kD<=5?pos:neg).push(`<b>Dispersão de km:</b> ${kD.toFixed(1)}%`+(kD>5?' (acima da meta de 5%)':''));}
  if(rk!=null&&rk>2)neg.push(`<b>R$/km:</b> ${rk.toFixed(1)}% acima do remunerado`);
  if(rl!=null){(rl<=0?pos:neg).push(`<b>Combustível (R$/L):</b> ${rl<=0?Math.abs(rl).toFixed(1)+'% abaixo':rl.toFixed(1)+'% acima'} do remunerado`);}
  // ── DPO ──
  const dpoN4=XP.dpo?XP.dpo.ok.filter(x=>x.lv>=4):[];
  if(XP.dpo){const n3=XP.dpo.ok.filter(x=>x.lv===3);if(n3.length)pos.push(`<b>DPO/VPO sustentável (Nível 3):</b> ${n3.map(x=>x.code).join(', ')}`);if(XP.dpo.bad.length)neg.push(`<b>DPO/VPO não sustentável:</b> ${XP.dpo.bad.map(x=>x.code+' (N'+x.lv+')').join(', ')} — ${XP.dpo.sem}`);}
  // ── Demarco (Nível 1 = top, escala invertida) ──
  if(XP.dmc){if(XP.dmc.top.length)pos.push(`<b>Demarco Nível 1 (top):</b> ${XP.dmc.top.join(', ')}`);if(XP.dmc.improved.length)pos.push(`<b>Demarco — evolução:</b> ${XP.dmc.improved.map(x=>x.code+' (N'+x.prev+'→N'+x.lv+')').join(', ')}`);if(XP.dmc.bad.length)neg.push(`<b>Demarco — pior nível:</b> ${XP.dmc.bad.map(x=>x.code+' (N'+x.lv+')').join(', ')}`);if(XP.dmc.worsened.length)at.push(`<b>Demarco — piora:</b> ${XP.dmc.worsened.map(x=>x.code+' (N'+x.prev+'→N'+x.lv+')').join(', ')}`);}
  // ── pacotes de custo (desvio real vs remunerado) ──
  const pacAgg={};(XP.dre||[]).forEach(o=>{if(!pk.has(o.vk))return;const p=PAC[o.cta]||'Outros';(pacAgg[p]=pacAgg[p]||{rem:0,real:0});pacAgg[p].rem+=o.rem;pacAgg[p].real+=o.real;});
  ['Manutenção','Combustível','Pneus'].forEach(p=>{const v=pacAgg[p];if(!v||!v.rem)return;const dev=(v.real/v.rem-1)*100;if(dev>3)neg.push(`<b>Custo ${p}:</b> ${dev.toFixed(1)}% acima do remunerado`);else if(dev<-3)pos.push(`<b>Custo ${p}:</b> ${Math.abs(dev).toFixed(1)}% abaixo do remunerado`);});
  // ── FCA (acumulado no ano até a vigência) ──
  if(XP.fca){const sel=XP.fca.filter(r=>Math.floor(r.k/100)===yr&&(r.k%100)<=mi);if(sel.length){const tt=sel.length,consol=sel.reduce((s,r)=>s+(r.concl==='C'?100:r.concl==='A'?50:0),0)/tt,prazo=sel.filter(r=>!r.venc).length/tt*100;if(consol>=85)pos.push(`<b>FCA:</b> consolidação de ${r0(consol)}% das ações`);else neg.push(`<b>FCA:</b> consolidação de só ${r0(consol)}% (${tt} ações)`);if(prazo<70)at.push(`<b>FCA:</b> ${r0(100-prazo)}% das ações vencidas — repactuar prazos`);}}
  // ── unidades saudáveis / críticas ──
  const uScore=unis.map(u=>({u,p:avg(rows.filter(o=>o.unidade===u).map(o=>o.pont))})).filter(x=>x.p!=null);
  const saud=uScore.filter(x=>x.p>=90),crit=uScore.filter(x=>x.p<70);
  if(saud.length)pos.push(`<b>${saud.length} unidade(s) saudável(is):</b> ${saud.sort((a,b)=>b.p-a.p).slice(0,5).map(x=>x.u.replace('CDD ','').replace('CDI ','')).join(', ')}`);
  if(crit.length)neg.push(`<b>${crit.length} unidade(s) crítica(s):</b> ${crit.sort((a,b)=>a.p-b.p).map(x=>x.u.replace('CDD ','').replace('CDI ','')+' ('+n1(x.p)+')').join(', ')}`);
  // ── ATENÇÃO: tendências (queda 2+ meses até selD) ──
  const ytd=VIGS.filter(d=>d.getFullYear()===yr&&d.getMonth()<=mi);
  const pontByVig=d2=>avg(ICS.filter(o=>o.vk===vigKeyN(d2)).map(o=>o.pont));
  const serie=ytd.map(pontByVig);let fall=0;for(let i=serie.length-1;i>0;i--){if(serie[i]!=null&&serie[i-1]!=null&&serie[i]<serie[i-1]-0.3)fall++;else break;}
  if(fall>=2)at.push(`<b>Pontuação da frota em queda</b> há ${fall} meses`);
  // unidades em queda
  unis.forEach(u=>{const s=ytd.map(d2=>avg(ICS.filter(o=>o.unidade===u&&o.vk===vigKeyN(d2)).map(o=>o.pont)));let f=0;for(let i=s.length-1;i>0;i--){if(s[i]!=null&&s[i-1]!=null&&s[i]<s[i-1]-0.5)f++;else break;}if(f>=3)at.push(`<b>${u.replace('CDD ','').replace('CDI ','')}:</b> pontuação caindo há ${f} meses`);});
  // indicadores em nível REGULAR (80–90) — nem positivo nem negativo
  comp.forEach(c=>{if(c.v!=null&&c.v>=80&&c.v<c.good)at.push(`<b>${c.l}:</b> ${r0(c.v)}% — nível regular, acompanhar`);});
  // unidades em nível regular/atenção (70–90)
  const reg=uScore.filter(x=>x.p>=70&&x.p<90);
  if(reg.length)at.push(`<b>${reg.length} unidade(s) em nível regular:</b> ${reg.sort((a,b)=>a.p-b.p).map(x=>x.u.replace('CDD ','').replace('CDI ','')+' ('+n1(x.p)+')').join(', ')}`);
  // quedas recentes mês a mês (IC da frota caiu >2pp vs mês anterior, mas ainda ≥80)
  const prevD=ytd.length>1?ytd[ytd.length-2]:null;let maxDrop=null;
  if(prevD){const pr=ICS.filter(o=>o.vk===vigKeyN(prevD)),cu=ICS.filter(o=>o.vk===vigKeyN(selD));IC.forEach((d,i)=>{const cv=cap(avg(cu.map(o=>o.ic[i]))),pv=cap(avg(pr.map(o=>o.ic[i])));if(cv!=null&&pv!=null&&cv>=80&&cv<pv-2){at.push(`<b>${d.l}</b> caiu de ${r0(pv)}% para ${r0(cv)}% vs ${vigLbl(prevD)}`);if(!maxDrop||(pv-cv)>maxDrop.drop)maxDrop={l:d.l,pv,cv,drop:pv-cv};}});}
  // FCA: andamento alto sem concluir
  if(XP.fca){const sel=XP.fca.filter(r=>Math.floor(r.k/100)===yr&&(r.k%100)<=mi);if(sel.length){const and=sel.filter(r=>r.concl==='A').length/sel.length*100;if(and>=40)at.push(`<b>FCA:</b> ${r0(and)}% das ações em andamento — monitorar para não vencer`);}}
  if(!at.length&&weak.length)at.push(`Acompanhar de perto: ${weak.map(w=>w.l).join(' e ')} abaixo do esperado.`);
  // ── PRÓXIMOS PASSOS (ações sugeridas a partir dos negativos) ──
  if(weak.some(w=>/Disponib|Prevent/.test(w.l)))next.push(`<b>Manutenção:</b> plano de ação nas unidades com baixa disponibilidade/preventivas`);
  if(kD!=null&&kD>5)next.push(`<b>Dispersão de km:</b> investigar o desvio entre km remunerado e realizado (${kD.toFixed(1)}% acima) — apurar causas`);
  if(rl!=null&&rl>0)next.push(`<b>Combustível:</b> avaliar modelo de remuneração / consumo (R$/L ${rl.toFixed(1)}% acima)`);
  if(XP.fca){const sel=XP.fca.filter(r=>Math.floor(r.k/100)===yr&&(r.k%100)<=mi);if(sel.length){const concl=sel.filter(r=>r.concl==='C').length/sel.length*100;if(concl<70)next.push(`<b>FCA:</b> acelerar conclusão das ações (${r0(concl)}% concluídas)`);}}
  if(XP.dpo&&XP.dpo.bad.length)next.push(`<b>Auditoria:</b> recuperar pilar DPO/VPO em ${XP.dpo.bad.map(x=>x.code).join(', ')}`);
  if(crit.length)next.push(`<b>Acompanhamento:</b> reunião focada nas unidades críticas (${crit.map(x=>x.u.replace('CDD ','').replace('CDI ','')).join(', ')})`);
  // ── destaques (1 por quadrante, na cor do quadrante) ──
  let best=null,worst=null;cands.forEach(d=>{const p=pontByVig(d);if(p!=null){if(!best||p>best.p)best={d,p};if(!worst||p<worst.p)worst={d,p};}}); // respeita o filtro de vigência
  const worstU=uScore.slice().sort((a,b)=>a.p-b.p)[0];
  const hl=t=>t?`<li class="hl"><span class="mk">★</span><span>${t}</span></li>`:'';
  const bestTxt=best?(cands.length===1?`<b>Pontuação de ${vigLbl(best.d)}:</b> ${n1(best.p)} pts`:`<b>Melhor mês de pontuação:</b> ${vigLbl(best.d)} (${n1(best.p)} pts)`):'';
  const posHl=hl(bestTxt)+(dpoN4.length?hl(`<b>DPO/VPO Nível ${Math.max(...dpoN4.map(x=>x.lv))}:</b> ${dpoN4.map(x=>x.code).join(', ')} — pilar de excelência`):'');
  const negHl=hl(worstU?`<b>Unidade mais crítica:</b> ${worstU.u.replace('CDD ','').replace('CDI ','')} (${n1(worstU.p)} pts)`:'');
  const atHl=hl(maxDrop?`<b>Maior queda recente:</b> ${maxDrop.l} ${r0(maxDrop.pv)}%→${r0(maxDrop.cv)}% vs ${vigLbl(prevD)}`:(best&&worst&&vigKeyN(worst.d)!==vigKeyN(best.d)?`<b>Pior mês de pontuação:</b> ${vigLbl(worst.d)} (${n1(worst.p)} pts)`:''));
  const nextHl=hl(next.length?`<b>Prioridade:</b> `+next[0].replace(/<\/?b>/g,''):'');

  const lbl=cands.length>1?vigLbl(cands[0]).toUpperCase()+'–'+vigLbl(selD).toUpperCase()+' · média':vigLbl(selD).toUpperCase();
  // Pontuação Geral da Frota = média da pontuação (todos os indicadores) das unidades no período
  const pg=avg(uScore.map(x=>x.p));const FARC={g:'#3BB33B',y:'#EAB308',o:'#F97316',r:'#FF6666'};
  document.getElementById('hero').innerHTML=`<div class="lbl">Pontuação Geral da Frota</div><div class="val" style="color:${FARC[band(pg)]||'var(--text)'}">${n1(pg)}</div><div class="sub">pontuação geral de todos os indicadores · ${lbl}</div>`;
  const li=(arr,mk)=>arr.length?arr.map(t=>`<li><span class="mk">${mk}</span><span>${t}</span></li>`).join(''):'<div class="empty">Nada relevante neste período.</div>';
  document.getElementById('quad').innerHTML=
    `<div class="box pos"><h2>▲ Pontos Positivos</h2><ul>${li(pos,'+')}${posHl}</ul></div>`+
    `<div class="box neg"><h2>▼ Pontos Negativos</h2><ul>${li(neg,'−')}${negHl}</ul></div>`+
    `<div class="box at"><h2>! Pontos de Atenção</h2><ul>${li(at,'!')}${atHl}</ul></div>`+
    `<div class="box next"><h2>⇒ Próximos Passos</h2><ul>${li(next,'⇒')}${nextHl}</ul></div>`;
  document.getElementById('foot').textContent=`Vigência ${lbl} · gerado automaticamente dos indicadores (ICs, Custos, Dispersão, R$/km, R$/L, DPO/VPO, FCA)`;
}

const _sun=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const _moon=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);const b=document.getElementById('themeBtn');if(b)b.innerHTML=t==='light'?_moon:_sun;if(ICS.length)atualizar();}
(function(){const t=localStorage.getItem('bi_theme')||'dark';document.body.classList.toggle('light-mode',t==='light');document.getElementById('themeBtn').innerHTML=t==='light'?_moon:_sun;document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));})();

carregar();
