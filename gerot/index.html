<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;order:1;}.brand h1{font-size:17px;font-weight:800;color:var(--orange);}.brand p{font-size:10px;color:#94A3B8;margin-top:2px;font-style:italic;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:8px;}
.status-badge{font-size:9px;color:#F1F5F9;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:2px 8px;white-space:nowrap;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--orange);display:flex;align-items:center;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.32);}
.header-filters{flex-basis:100%;order:3;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.filter-label{display:none;}
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:120px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;}.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-btn svg{flex-shrink:0;opacity:.8;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:4px;min-width:220px;max-height:300px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-search{padding:7px 10px;border-bottom:1px solid #1e2d40;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ms-search input{flex:1;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:11px;outline:none;}
.ms-search input::placeholder{color:var(--text3);}
.ms-list{overflow-y:auto;flex:1;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all-opt{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input[type=checkbox]{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.ms-list::-webkit-scrollbar{width:4px;}.ms-list::-webkit-scrollbar-thumb{background:#2a3a50;border-radius:2px;}
.ms-only{margin-left:auto;font-size:8px;color:var(--orange);padding:1px 5px;border-radius:2px;cursor:pointer;opacity:0;transition:opacity .12s;flex-shrink:0;}
.ms-opt:hover .ms-only{opacity:1;}.ms-only:hover{background:rgba(249,115,22,.2);}
.main{padding:18px 24px;}
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px 4px 12px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.tbl-head{padding:0 10px 10px;}.tbl-head h2{font-size:15px;font-weight:800;color:var(--text);}.tbl-sub{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:640px;}
thead th{background:var(--card);font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;white-space:nowrap;text-align:right;}
thead th.lft{text-align:left;}
thead th.ctr{text-align:center;}
thead tr.cols th{border-bottom:1px solid rgba(255,255,255,.12);}
.sep-l{border-left:1px solid rgba(255,255,255,.13);}
tbody td{padding:11px 10px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;text-align:right;color:var(--text);}
tbody td.kpi{text-align:left;color:var(--text);font-weight:700;white-space:normal;}
tbody tr:hover{background:rgba(255,255,255,.035);}
tbody tr:last-child td{border-bottom:none;}
.atg{font-weight:800;color:#0C1017;border-radius:4px;padding:3px 8px;display:inline-block;min-width:46px;text-align:center;}
.loading{text-align:center;color:var(--text3);padding:40px;}
body.light-mode .main{background:#F0F0F0;--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);--red:#ff0000;--green:#0E8C0E;}
body.light-mode .tbl-section{background:rgba(128,128,128,.14)!important;border:none!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#555555;}
body.light-mode tbody td{border-bottom-color:rgba(0,0,0,.06);}
body.light-mode thead th{background:#F0F0F0;}
@media(max-width:768px){
  .header{padding:8px 12px 10px;}
  .brand h1{font-size:14px;}
  .brand p{font-size:9px;}
  .header-right{gap:4px;}
  .status-badge{font-size:8px;padding:2px 6px;}
  .btn{padding:3px 5px;}
  .btn svg{width:13px;height:13px;}
  .header-filters{gap:5px;margin-top:8px;}
  .filter-group{flex:0 0 calc(50% - 3px);}
  .ms-wrap{width:100%;}
  .ms-btn{width:100%;min-width:0;font-size:8px;padding:4px 6px;}
  .main{padding:12px;}
  .tbl-head h2{font-size:14px;}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{font-size:11px;min-width:0;}
  thead th{font-size:9px;padding:6px 6px;letter-spacing:.3px;}
  tbody td{padding:9px 6px;}
  tbody td.kpi{white-space:normal;}
  .atg{min-width:38px;padding:2px 6px;}
}
</style>

<body>
<header class="header">
  <div class="brand"><h1>Reunião de Planejamento Mensal</h1><p>Gerot</p></div>
  <div class="header-right">
    <a href="../" class="btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="btn" id="themeBtn" title="Modo claro/escuro"></button>
    <button class="btn" onclick="carregar()" title="Atualizar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>
    <span class="status-badge" id="status">Carregando…</span>
  </div>
  <div class="header-filters">
    <div class="filter-group"><span class="filter-label">Unidade</span><div class="ms-wrap" id="ms-unidade"><button class="ms-btn" onclick="toggleMs('ms-unidade')"><span class="ms-lbl">Unidade</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="filter-group"><span class="filter-label">Vigência</span><div class="ms-wrap" id="ms-vig"><button class="ms-btn" onclick="toggleMs('ms-vig')"><span class="ms-lbl">Vigência</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  </div>
</header>

<main class="main">
  <div class="tbl-section"><div class="tbl-head"><h2>Indicadores</h2><div class="tbl-sub" id="tbl-sub"></div></div><div class="tbl-wrap"><div id="tbl"><div class="loading">Carregando…</div></div></div></div>
</main>

<script>
let RECORDS=[], VIGS=[];
const FILTROS=['unidade','vig'];

// vig helpers: chave interna 'YYYY-MM' ↔ exibição 'MM/YYYY'
const vigDisp = k => k ? k.slice(5)+'/'+k.slice(0,4) : '';
const vigKeyFromDisp = d => { const p=String(d).split('/'); return p.length===2 ? p[1]+'-'+p[0] : d; };
const vigMonth = k => +k.slice(5);
const vigYear  = k => +k.slice(0,4);

function num(v,dec){return v==null||!isFinite(v)?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:dec,maximumFractionDigits:dec});}
function pctTxt(v,dec){return v==null||!isFinite(v)?'-':num(v,dec)+'%';}
// Bateu a meta = verde · não bateu = vermelho. É binário de propósito: o que
// fica vermelho aqui é o que vira FCA na RPM — real abaixo da meta não é "quase".
const BATEU = 99.995;   // atgMeta é capado em 100, então só chega aqui quem atingiu
function heat(atg){
  if(atg==null||!isFinite(atg))return null;
  return atg>=BATEU ? {bg:'#7BC47F',fg:'#0C1017'} : {bg:'#F0918B',fg:'#0C1017'};
}
function atgCell(atg){
  if(atg==null||!isFinite(atg))return '<span style="color:var(--text3)">-</span>';
  const c=heat(atg);
  // quem não bateu nunca pode aparecer como "100%" — seria um 100% vermelho
  const txt=atg>=BATEU ? '100%'
          : (Math.round(atg)>=100 ? num(Math.floor(atg*10)/10,1)+'%' : Math.round(atg)+'%');
  return `<span class="atg" style="background:${c.bg};color:${c.fg}">${txt}</span>`;
}
function avg(arr){const v=arr.filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}

// ── valor de um indicador no formato dele (% · km/L · hh:mm:ss · mm · contagem) ──
function valTxt(ind,v){
  if(v==null||!isFinite(v))return '-';
  const f=ind.fmt;
  if(f==='kml') return num(v,2);
  if(f==='time'){const s=Math.round(v),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`;}
  if(f==='mm')    return num(v,1)+' mm';
  if(f==='count') return num(v,0);
  return pctTxt(v,1);
}
// meta com o sinal da direção (só os adicionais do Gerot têm direção)
function metaTxt(ind,v){
  if(v==null||!isFinite(v))return '-';
  return (ind.dir ? (ind.dir==='lower'?'≤ ':'≥ ') : '') + valTxt(ind,v);
}

// ── MULTI-SELECT (padrão) ──
function _buildMs(wrap,renderFn,getAllFn){
  if(!(wrap._sel instanceof Set))wrap._sel=new Set();
  const sel=wrap._sel,list=wrap.querySelector('.ms-list'),srch=wrap.querySelector('.ms-search input');
  const render=(q)=>{renderFn(list,sel,q!==undefined?q:(srch.value||''));syncBadge(wrap);};
  wrap._render=render;
  if(!wrap._wired){
    wrap._wired=true;
    list.addEventListener('change',e=>{const box=e.target;if(box.classList.contains('ms-all')){sel.clear();}else if(sel.size===0){if(!box.checked){const all=getAllFn?getAllFn():[];all.forEach(v=>{if(v!==box.dataset.v)sel.add(v);});}}else{if(box.checked)sel.add(box.dataset.v);else sel.delete(box.dataset.v);if(getAllFn){const all=getAllFn();if(all.length>0&&all.every(v=>sel.has(v)))sel.clear();}}render(srch.value);atualizar();});
    list.addEventListener('click',e=>{const only=e.target.closest('.ms-only');if(!only)return;e.preventDefault();e.stopPropagation();sel.clear();sel.add(only.dataset.v);render(srch.value);atualizar();});
    srch.addEventListener('input',()=>render(srch.value));srch.addEventListener('click',e=>e.stopPropagation());
  }
  render();
}
function buildMsFilter(id,items){const wrap=document.getElementById(id);if(!wrap)return;wrap._items=items;_buildMs(wrap,(list,sel,q)=>{const it=wrap._items||[],f=q.toLowerCase(),shown=it.filter(v=>String(v).toLowerCase().includes(f)),allChk=sel.size===0;list.innerHTML=(!q?`<label class="ms-opt all-opt"><input type="checkbox" class="ms-all" ${allChk?'checked':''}> Todos</label>`:'')+shown.map(v=>{const ve=String(v).replace(/"/g,'&quot;');return `<label class="ms-opt"><input type="checkbox" data-v="${ve}" ${allChk||sel.has(v)?'checked':''}> ${v}<span class="ms-only" data-v="${ve}">only</span></label>`;}).join('');},()=>wrap._items||[]);}
function syncBadge(wrap){const cnt=wrap.querySelector('.ms-cnt'),n=wrap._sel?wrap._sel.size:0;if(cnt){cnt.textContent=n;cnt.style.display=n?'':'none';}}
function toggleMs(id){document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p.closest('.ms-wrap').id!==id)p.classList.remove('open');});const panel=document.querySelector(`#${id} .ms-panel`);panel.classList.toggle('open');if(panel.classList.contains('open')){const inp=panel.querySelector('input[type=text]');if(inp)setTimeout(()=>inp.focus(),50);}}
function getMsValues(id){const wrap=document.getElementById(id);if(!wrap)return[];return wrap._sel?[...wrap._sel]:[];}
document.addEventListener('click',e=>{if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));});

function atualizar(){
  if(!RECORDS.length)return;
  const tbl=document.getElementById('tbl');
  const selUnits=getMsValues('ms-unidade');
  const selVigDisp=getMsValues('ms-vig');
  // período = vigências selecionadas (média delas); padrão: última com dados
  const perVigs=(selVigDisp.length?selVigDisp.map(vigKeyFromDisp).filter(v=>VIGS.includes(v)):[VIGS[VIGS.length-1]]).sort();
  const selK=perVigs[perVigs.length-1];
  if(!selK){tbl.innerHTML='<div class="loading">Sem dados</div>';return;}
  const ytdVigs=VIGS.filter(k=>vigYear(k)===vigYear(selK)&&vigMonth(k)<=vigMonth(selK));
  const perSet=new Set(perVigs), ytdSet=new Set(ytdVigs);
  const subEl=document.getElementById('tbl-sub');
  if(subEl)subEl.textContent=perVigs.length<=1?vigDisp(selK):`${vigDisp(perVigs[0])} – ${vigDisp(selK)} · acumulado de ${perVigs.length} vigências`;

  const unitOk=r=>selUnits.length===0||selUnits.includes(r.unit);
  let html='<table><thead><tr class="cols"><th class="lft">Indicador</th><th>Meta</th><th>Real</th><th>% de Ating.</th><th class="sep-l">% Ating. YTD</th></tr></thead><tbody>';
  // Acumulado da janela (não média de meses): 1/0 e pneus ponderados pelas
  // linhas; % por filial vem do escopo 'ano' do Ginfo (GerotBase.acumFor).
  const acumPer=perVigs.length>1?GerotBase.acumFor(perVigs):null;
  const acumYtd=ytdVigs.length>1?GerotBase.acumFor(ytdVigs):null;
  // Indicadores-chave (mesmos do Frota de Elite, mesma base) + os adicionais
  // que só existem aqui no Gerot. Tudo é indicador — uma tabela só.
  const adicionais=GerotBase.INDICADORES_GEROT||[];
  GerotBase.INDICADORES.concat(adicionais).forEach(ind=>{
    const soGerot=adicionais.indexOf(ind)>=0;
    // os adicionais não entram no acumFor (não são ponderáveis): média das vigências
    const per=soGerot ? RECORDS.filter(r=>r.field===ind.field&&unitOk(r)&&perSet.has(r.vig))
                      : (acumPer||RECORDS.filter(r=>perSet.has(r.vig))).filter(r=>r.field===ind.field&&unitOk(r));
    const ytd=soGerot ? RECORDS.filter(r=>r.field===ind.field&&unitOk(r)&&ytdSet.has(r.vig))
                      : (acumYtd||RECORDS.filter(r=>ytdSet.has(r.vig))).filter(r=>r.field===ind.field&&unitOk(r));
    if(soGerot&&!per.length&&!ytd.length)return;   // sem dado no período (ex.: Pneus só na vig recente)
    // Saída com OS Crítica é CONTAGEM: janela e YTD SOMAM os meses/unidades
    // (soma dos meses = acumulado exato da tela do Ginfo: jan→jul 125), em vez
    // da média — média de contagem não significa nada.
    const somaC=arr=>{const v=arr.filter(x=>x!=null&&isFinite(x));return v.length?v.reduce((s,x)=>s+x,0):null;};
    const isSoma=ind.field==='osCritica';
    const meta=avg(per.map(r=>r.meta)),  real=isSoma?somaC(per.map(r=>r.real)):avg(per.map(r=>r.real));
    const metaY=avg(ytd.map(r=>r.meta)), realY=isSoma?somaC(ytd.map(r=>r.real)):avg(ytd.map(r=>r.real));
    // % de atingimento AQUI é sempre contra a meta (é daqui que saem os FCAs da
    // RPM) e é calculado em cima do Real e da Meta que estão NA LINHA — senão a
    // média dos atingimentos por unidade contradiz o que a própria linha mostra.
    // O `atg` cru dos registros — a aderência — é o que o Frota de Elite pontua.
    const atgOf=(rl,mt)=>mt!=null?GerotBase.atgDe(rl,mt,ind.dir):null;
    const atg =atgOf(real,meta)  ?? avg(per.map(r=>r.atgMeta!=null?r.atgMeta:r.atg));
    const atgY=atgOf(realY,metaY)?? avg(ytd.map(r=>r.atgMeta!=null?r.atgMeta:r.atg));
    html+=`<tr><td class="kpi">${ind.label}</td><td>${metaTxt(ind,meta)}</td><td>${valTxt(ind,real)}</td><td>${atgCell(atg)}</td><td class="sep-l">${atgCell(atgY)}</td></tr>`;
  });
  html+='</tbody></table>';
  tbl.innerHTML=html;
}

async function carregar(){
  document.getElementById('status').textContent='Carregando…';
  try{
    RECORDS=await GerotBase.load();
    if(!RECORDS.length)throw new Error('sem dados');
    const units=[...new Set(RECORDS.map(r=>r.unit))].sort();
    VIGS=[...new Set(RECORDS.map(r=>r.vig))].sort();
    buildMsFilter('ms-unidade',units);
    buildMsFilter('ms-vig',VIGS.slice().reverse().map(vigDisp));
    atualizar();
    const now=new Date();document.getElementById('status').textContent=`${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){console.error(e);document.getElementById('status').textContent='Erro ao carregar';}
}

const _sun=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const _moon=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);const b=document.getElementById('themeBtn');if(b)b.innerHTML=t==='light'?_moon:_sun;}
(function(){const t=localStorage.getItem('bi_theme')||'dark';applyTheme(t);document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));})();
