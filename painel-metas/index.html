<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;order:1;}.brand h1{font-size:17px;font-weight:800;color:var(--orange);}.brand p{font-size:10px;color:#94A3B8;margin-top:2px;font-style:italic;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:8px;}
.status-badge{font-size:9px;color:#F1F5F9;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:2px 8px;white-space:nowrap;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--orange);display:flex;align-items:center;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.32);}
.header-filters{flex-basis:100%;order:3;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.filter-label{display:none;}
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:120px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;}.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:4px;min-width:200px;max-height:300px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-search{padding:7px 10px;border-bottom:1px solid #1e2d40;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ms-search input{flex:1;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:11px;outline:none;}
.ms-list{overflow-y:auto;flex:1;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all-opt{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input[type=checkbox]{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.ms-only{margin-left:auto;font-size:8px;color:var(--orange);padding:1px 5px;border-radius:2px;cursor:pointer;opacity:0;transition:opacity .12s;flex-shrink:0;}
.ms-opt:hover .ms-only{opacity:1;}.ms-only:hover{background:rgba(249,115,22,.2);}
.main{padding:20px 24px;}
.hero{margin-bottom:18px;padding:2px;}
.hero-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;}
.hero-value{font-size:56px;font-weight:800;line-height:1;margin-top:4px;}
.hero-sub{font-size:13px;color:var(--text2);margin-top:8px;}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:18px;}
.card{min-width:0;background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:18px 20px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.chart-title{font-size:14px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.chart-wrap{position:relative;height:250px;}
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px 8px 12px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.tbl-head{padding:0 8px 10px;}.tbl-head h2{font-size:15px;font-weight:800;color:var(--text);}.tbl-sub{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1000px;}
thead th{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;padding:8px 10px;white-space:nowrap;text-align:right;}
thead th.lft{text-align:left;}
thead tr.vig th{text-align:center;color:var(--orange);border-bottom:1px solid rgba(249,115,22,.3);}
thead tr.cols th{border-bottom:1px solid rgba(255,255,255,.12);}
.sep-l{border-left:1px solid rgba(255,255,255,.13);}
tbody td{padding:10px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;text-align:right;color:var(--text);vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody td.lft{text-align:left;}
tbody td.ind{font-weight:700;min-width:150px;white-space:normal;}
tbody td.desc,tbody td.regra{color:var(--text2);font-size:11px;white-space:normal;min-width:200px;line-height:1.4;}
.pts{background:#0a0f18;border-radius:4px;padding:4px 10px;font-weight:800;display:inline-block;min-width:42px;text-align:center;}
.loading{text-align:center;color:var(--text3);padding:40px;}
body.light-mode .main{background:#F0F0F0;--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);--red:#ff0000;--green:#0E8C0E;}body.light-mode .hero-sep{background:rgba(0,0,0,.18)!important;color:rgba(0,0,0,.2)!important;}
body.light-mode .card,body.light-mode .tbl-section{background:rgba(128,128,128,.14)!important;border:none!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#555555;}
body.light-mode thead th{background:#F0F0F0;}
body.light-mode tbody td{border-bottom-color:rgba(0,0,0,.06);}
body.light-mode .pts{background:#1a1a1a;color:#fff;}
@media(max-width:900px){.charts-row{grid-template-columns:1fr;}.main{padding:12px;}.hero-value{font-size:42px;}}
/* ── Toggle indicadores (só mobile) ── */
.tbl-ind-toggle{display:none;}
/* ── Mobile ── */
@media(max-width:768px){
  .header{padding:8px 12px 10px;}
  .header-right{gap:4px;}
  .brand h1{font-size:14px;}
  .brand p{font-size:9px;}
  .status-badge{font-size:8px;padding:2px 6px;}
  .btn{padding:3px 6px;}
  .btn svg{width:13px;height:13px;}
  .header-filters{gap:5px;margin-top:8px;}
  .filter-group{flex:0 0 100%;}
  .ms-wrap{width:100%;}
  .ms-btn{width:100%;min-width:0;}
  .main{padding:12px;}
  /* Hero */
  .hero{margin-bottom:14px;}
  .hero-value{font-size:36px;}
  .hero-sub{font-size:11px;}
  /* Gráficos: empilhar 1 coluna */
  .charts-row{grid-template-columns:1fr;gap:12px;}
  .chart-wrap{height:220px;}
  /* Tabela Indicadores: ocultar colunas secundárias por padrão */
  .sec-col{display:none;}
  table{min-width:0;}
  /* Botão toggle */
  .tbl-ind-toggle{
    display:inline-flex;align-items:center;gap:6px;
    margin:0 8px 10px;
    background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.3);
    border-radius:4px;padding:5px 12px;
    font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;
    color:var(--orange);cursor:pointer;text-transform:uppercase;letter-spacing:.5px;
  }
  /* Quando expandido: mostrar colunas e permitir scroll horizontal */
  .tbl-expanded .sec-col{display:table-cell;}
  .tbl-expanded table{min-width:1000px;font-size:10px;}
  .tbl-expanded thead th{font-size:9px;padding:6px 4px;}
  .tbl-expanded tbody td{padding:8px 4px;font-size:10px;}
  .tbl-expanded tbody td.desc,.tbl-expanded tbody td.regra{font-size:9px;min-width:140px;}
}
</style>

<body>
<header class="header">
  <div class="brand"><h1>Painel de Metas</h1><p>DRE Frota — Visão Geral</p></div>
  <div class="header-right">
    <a href="../" class="btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="btn" id="themeBtn" title="Modo claro/escuro"></button>
    <button class="btn" onclick="carregar()" title="Atualizar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>
    <span class="status-badge" id="status">Carregando…</span>
  </div>
  <div class="header-filters">
    <div class="filter-group"><span class="filter-label">Vigência</span><div class="ms-wrap" id="ms-vig"><button class="ms-btn" onclick="toggleMs('ms-vig')"><span class="ms-lbl">Vigência</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  </div>
</header>

<main class="main">
  <section class="hero">
    <div class="hero-label">Pontuação Total</div>
    <div class="hero-value" id="h-total">—</div>
    <div class="hero-sub" id="h-sub"></div>
  </section>
  <div class="charts-row">
    <div class="card"><div class="chart-title">Pontuação · Mensal</div><div class="chart-wrap"><canvas id="ch-mensal"></canvas></div></div>
    <div class="card"><div class="chart-title">Pontuação por Indicador</div><div class="chart-wrap"><canvas id="ch-ind"></canvas></div></div>
  </div>
  <div class="tbl-section"><div class="tbl-head"><h2>Indicadores</h2><div class="tbl-sub" id="tbl-sub"></div></div><button class="tbl-ind-toggle" id="tbl-ind-toggle" onclick="toggleIndCols()">+ Ver detalhes</button><div class="tbl-wrap"><div id="tbl"><div class="loading">Carregando…</div></div></div></div>
</main>

<script>
// Fontes: cada indicador é calculado a partir do painel de origem (não mais lido cru da aba Painel de Metas)
const SRC={
  metas:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?gid=199351909',
  km:'https://docs.google.com/spreadsheets/d/1wCoRGsvOgmIvfLW4F9Sxr-5AX9Go-aFlRVjrQ_B2ilM/gviz/tq?sheet='+encodeURIComponent('Dispersão de km'),
  dpo:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?sheet=DPO',
  fca:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?gid=216663799'
};
// Custos de veículos e equipamentos = AV Orçado/Real da Visão Financeira (mesmo DRE Frota)
const DRE_ID='1qcTy2ppLCGBKKqZCxCYWCTL9kTAuWfHBMyBfWJOyih8';
const DRE_TAB_FROTA='Frota', DRE_TAB_RECEITA='Receita Líquida';
// Ranking performance Frota - Unidades = Pontuação do Programa de Reconhecimento (Frota de Elite)
const ELITE_NOMES=['CDI MACACU','CDD PELOTAS','CDD RONDONOPOLIS','CDD NOVA FRIBURGO','CDD RIO DE JANEIRO','CDD FLORIANOPOLIS','CDD CUIABA','CDD GUARULHOS','CDD CAMBORIU','PIRAI EMPURRADA','MACACU EMPURRADA','CUIABA EMPURRADA','CUIABA'];
const ELITE_WEIGHTS={disp:20,prev:15,comb:10,pneus:10,checkT:10,checkWH:10,conf:5,stVeic:5,stEmp:5,sla:5,civf:5};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const META_PONTOS=80;
let ALL=[],VIGS=[],chM=null,chI=null;
// Bandas de pontuação (fração do peso)
function bandHigher(atg){return atg==null?0:atg>=100?1:atg>=99?.75:atg>=98?.5:0;}      // ≥100/99/98 % da meta
function bandLowerRatio(ratio){return ratio==null?0:ratio<=100?1:ratio<=101?.75:ratio<=102?.5:0;} // ≤100/101/102 % da meta
function classify(name){const n=String(name||'').toLowerCase();if(/ranking/.test(n))return'rank';if(/dispers/.test(n))return'disp';if(/dpo|vpo|sustent/.test(n))return'dpo';if(/consolida|fca/.test(n))return'fca';if(/custo/.test(n))return'custo';return'other';}

function parseD(v){if(!v)return null;const m=String(v).match(/^Date\((\d+),(\d+),(\d+)/);if(m)return new Date(+m[1],+m[2],+m[3]);return null;}
function _mesNum(m){if(m==null)return null;if(typeof m==='number'&&m>=1&&m<=12)return m;const s=String(m).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').slice(0,3);const i=MESES.indexOf(s);if(i>=0)return i+1;const n=parseInt(m);return n>=1&&n<=12?n:null;}
function vigKeyN(d){return d?d.getFullYear()*100+d.getMonth():0;}
function vigLbl(d){return d?MESES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2):'';}
function vigColLbl(d){return d?MESES[d.getMonth()]+'. de '+d.getFullYear():'';}
// Eixo X padrão: do 1º mês com dado até DEZEMBRO do último ano
function fullYearVigs(){
  if(!VIGS.length)return [];
  const sorted=[...VIGS].sort((a,b)=>vigKeyN(a)-vigKeyN(b));
  const first=sorted[0],endYear=sorted[sorted.length-1].getFullYear();
  const out=[];let y=first.getFullYear(),m=first.getMonth();
  while(y<endYear||(y===endYear&&m<=11)){out.push(new Date(y,m,1));m++;if(m>11){m=0;y++;}}
  return out;
}
function n1(v){return v==null||!isFinite(v)?'-':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});}
function pctI(v){return v==null||!isFinite(v)?'-':Math.round(v)+'%';}

// ── MULTI-SELECT ──
function _buildMs(wrap,renderFn,getAllFn){if(!(wrap._sel instanceof Set))wrap._sel=new Set();const sel=wrap._sel,list=wrap.querySelector('.ms-list'),srch=wrap.querySelector('.ms-search input');const render=(q='')=>{renderFn(list,sel,q);syncBadge(wrap);};list.addEventListener('change',e=>{const box=e.target;if(box.classList.contains('ms-all')){sel.clear();}else if(sel.size===0){if(!box.checked){const all=getAllFn?getAllFn():[];all.forEach(v=>{if(v!==box.dataset.v)sel.add(v);});}}else{if(box.checked)sel.add(box.dataset.v);else sel.delete(box.dataset.v);if(getAllFn){const all=getAllFn();if(all.length>0&&all.every(v=>sel.has(v)))sel.clear();}}render(srch.value);atualizar();});list.addEventListener('click',e=>{const only=e.target.closest('.ms-only');if(!only)return;e.preventDefault();e.stopPropagation();sel.clear();sel.add(only.dataset.v);render(srch.value);atualizar();});srch.addEventListener('input',()=>render(srch.value));srch.addEventListener('click',e=>e.stopPropagation());render();}
function buildMsFilter(id,items){const wrap=document.getElementById(id);if(!wrap)return;_buildMs(wrap,(list,sel,q)=>{const f=q.toLowerCase(),shown=items.filter(v=>String(v).toLowerCase().includes(f)),allChk=sel.size===0;list.innerHTML=(!q?`<label class="ms-opt all-opt"><input type="checkbox" class="ms-all" ${allChk?'checked':''}> Todas</label>`:'')+shown.map(v=>{const ve=String(v).replace(/"/g,'&quot;');return `<label class="ms-opt"><input type="checkbox" data-v="${ve}" ${allChk||sel.has(v)?'checked':''}> ${v}<span class="ms-only" data-v="${ve}">only</span></label>`;}).join('');},()=>items);}
function syncBadge(wrap){const cnt=wrap.querySelector('.ms-cnt'),n=wrap._sel?wrap._sel.size:0;if(cnt){cnt.textContent=n;cnt.style.display=n?'':'none';}}
function toggleMs(id){document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p.closest('.ms-wrap').id!==id)p.classList.remove('open');});const panel=document.querySelector(`#${id} .ms-panel`);panel.classList.toggle('open');if(panel.classList.contains('open')){const inp=panel.querySelector('input[type=text]');if(inp)setTimeout(()=>inp.focus(),50);}}
function getMsValues(id){const wrap=document.getElementById(id);if(!wrap)return[];return wrap._sel?[...wrap._sel]:[];}
document.addEventListener('click',e=>{if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));});

// fetcher JSONP genérico → devolve a matriz de valores (rows × cols)
function gviz(url){return new Promise((res,rej)=>{const fn='_gv'+Math.floor(Math.random()*1e9);const s=document.createElement('script');const clr=()=>{try{delete window[fn];s.remove();}catch(e){}};window[fn]=r=>{clr();try{if(r.status!=='ok')throw 0;res((r.table.rows||[]).map(x=>(x.c||[]).map(c=>c?c.v:null)));}catch(e){rej(e);}};s.onerror=()=>{clr();rej(0);};s.src=url+(url.includes('?')?'&':'?')+'tqx=out:json;responseHandler:'+fn;document.head.appendChild(s);});}
// fetcher com header (por nome de coluna) → {header,rows}, usado p/ ler o DRE Frota igual à Visão Financeira
async function fetchDreTab(tab){
  const url=`https://docs.google.com/spreadsheets/d/${DRE_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
  const res=await fetch(url); const raw=await res.text();
  const json=JSON.parse(raw.replace(/^[\s\S]*?\(/,'').replace(/\);?\s*$/,''));
  let header=(json.table.cols||[]).map(c=>c&&c.label?c.label:'');
  let rows=json.table.rows.map(r=>r.c.map(c=>c&&c.v!=null?c.v:null));
  if(!header.some(x=>_normEb(x).includes('realizado'))&&rows.length){header=rows[0].map(x=>x==null?'':String(x));rows=rows.slice(1);}
  return {header,rows};
}
const _normEb=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function ebIdx(h,...names){const nc=h.map(_normEb);for(const n of names){const i=nc.indexOf(_normEb(n));if(i>=0)return i;}for(const n of names){const nn=_normEb(n);const i=nc.findIndex(c=>c.includes(nn));if(i>=0)return i;}return -1;}
const _numBR=v=>{if(v==null||v==='')return null;if(typeof v==='number')return v;let s=String(v).replace(/\s|R\$/g,'');if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');const f=parseFloat(s);return isNaN(f)?null:f;};
function mapDre(h){return{orc:ebIdx(h,'orçado','orcado'),rem:ebIdx(h,'remunerado'),real:ebIdx(h,'realizado'),vig:ebIdx(h,'vigência','vigencia'),cta:ebIdx(h,'conta gerencial','conta'),mes:ebIdx(h,'mês','mes'),ano:ebIdx(h,'ano')};}
function dreVigDate(r,m){const mn=m.mes>=0?_mesNum(r[m.mes]):null,an=m.ano>=0?parseInt(r[m.ano]):null;if(mn&&an)return new Date(an,mn-1,1);if(m.vig>=0){const v=r[m.vig];const d=parseD(v);if(d)return d;const s=String(v||'');const mm=s.match(/(\d{1,2})[\/\-](\d{4})/);if(mm)return new Date(+mm[2],+mm[1]-1,1);}return null;}

// ── Cálculo por fonte (mapas indexados por vigKeyN) ──
// Ranking = média da Pontuação do Programa de Reconhecimento (Frota de Elite) por vigência,
// mesma fórmula de calcScore_() do programa-reconhecimento/, calculada em cima do GerotBase.
function eliteScore(fields){let num=0,den=0;for(const f in ELITE_WEIGHTS){const w=ELITE_WEIGHTS[f]/100;const v=fields[f];if(v==null)continue;den+=w;let v01=v/100;if(v01>1)v01=1;num+=w*v01;}return den>0?(num/den)*100:null;}
function compRankingElite(records){
  const byUnitVig={};
  (records||[]).forEach(r=>{if(!ELITE_NOMES.includes(r.unit))return;const key=r.vig+'||'+r.unit;(byUnitVig[key]=byUnitVig[key]||{f:{}}).f[r.field]=r.atg;});
  const byVig={};
  Object.keys(byUnitVig).forEach(key=>{
    const sc=eliteScore(byUnitVig[key].f); if(sc==null)return;
    const vig=key.split('||')[0]; const [y,mo]=vig.split('-').map(Number); if(!y||!mo)return;
    const k=y*100+(mo-1); (byVig[k]=byVig[k]||[]).push(sc);
  });
  const out={};Object.keys(byVig).forEach(k=>{const a=byVig[k];out[k]=a.reduce((s,v)=>s+v,0)/a.length;});
  return out;
}
// Custos de veículos e equipamentos = AV Orçado/Real (custos totais ÷ Receita Líquida) — igual à Visão Financeira
function compCusto(frota,receita){
  const mF=mapDre(frota.header||[]), mR=mapDre(receita.header||[]);
  const cus={}, rec={};
  (frota.rows||[]).forEach(r=>{
    const cta=mF.cta>=0?String(r[mF.cta]||''):'';
    if(_normEb(cta).includes('receita liquida'))return;
    const d=dreVigDate(r,mF); if(!d)return; const k=vigKeyN(d);
    const o=cus[k]=cus[k]||{orc:0,real:0};
    o.orc+=_numBR(r[mF.orc])||0; o.real+=_numBR(r[mF.real])||0;
  });
  (receita.rows||[]).forEach(r=>{
    const d=dreVigDate(r,mR); if(!d)return; const k=vigKeyN(d);
    const o=rec[k]=rec[k]||{orc:0,real:0};
    o.orc+=_numBR(r[mR.orc])||0; o.real+=_numBR(r[mR.real])||0;
  });
  const out={};
  Object.keys(cus).forEach(k=>{
    const c=cus[k], rc=rec[k]; if(!rc)return;
    out[k]={ avOrc: rc.orc?c.orc/Math.abs(rc.orc)*100:null, avReal: rc.real?c.real/Math.abs(rc.real)*100:null };
  });
  return out;
}
// Dispersão = Δ% acumulado (YTD no ano) dos projetos ROTA + Auto Serviço · Painel KM
function compDisp(rows){const mo={};rows.forEach(r=>{const d=parseD(r[0]);if(!d)return;const proj=String(r[14]||'').split('-')[0].trim().toUpperCase();if(!(proj==='ROTA'||proj==='AUTO SERVIÇO'||proj==='AUTO SERVICO'))return;const k=vigKeyN(d);const rem=r[31]!=null?+r[31]:0,real=r[32]!=null?+r[32]:0;const o=mo[k]=mo[k]||{rem:0,real:0};o.rem+=rem;o.real+=real;});const out={},acc={};Object.keys(mo).map(Number).sort((a,b)=>a-b).forEach(k=>{const y=Math.floor(k/100);acc[y]=acc[y]||{rem:0,real:0};acc[y].rem+=mo[k].rem;acc[y].real+=mo[k].real;out[k]=acc[y].rem?((acc[y].real-acc[y].rem)/acc[y].rem*100):null;});return out;}
// DPO/VPO = último semestre (H) com dados; conta unidades abaixo de Nível 3 → 0=100% / 1=50% / 2+=0% (vale p/ todos os meses)
function compDPO(rows){const hdr=rows[0]||[];let li=-1;for(let i=hdr.length-1;i>=1;i--){if(rows.slice(1).some(r=>/Nível/i.test(String(r[i]||'')))){li=i;break;}}if(li<0)return{frac:0,below:null,sem:null};let below=0;rows.slice(1).forEach(r=>{const m=String(r[li]||'').match(/Nível\s*(\d+)/i);if(m&&+m[1]<3)below++;});return{frac:below===0?1:below===1?.5:0,below,sem:String(hdr[li]||'')};}
// FCA: registros (vigKeyN, status C/A/N). Score por status: Concluída=100, Em andamento=50, Não iniciada=0.
function compFCArecs(rows){const recs=[];rows.forEach(r=>{const d=parseD(r[1]);if(!d)return;const st=String(r[8]||'');const concl=/conclu/i.test(st)?'C':/andamento/i.test(st)?'A':'N';recs.push({k:vigKeyN(d),concl});});return recs;}
// Aderência = média do score por status (Concluída=100, Em andamento=50, Não iniciada=0), acumulado de jan até M-2.
// M-2 porque as ações de M e M-1 ainda são recentes demais para julgar. Jan e fev ficam sem dado (sem M-2 válido).
function fcaAderM2(recs,year,monthIdx){const sel=recs.filter(r=>Math.floor(r.k/100)===year&&(r.k%100)<monthIdx-1);if(!sel.length)return null;return sel.reduce((s,r)=>s+(r.concl==='C'?100:r.concl==='A'?50:0),0)/sel.length;}

const barLabels={id:'bl',afterDatasetsDraw(c){const ds=c.data.datasets[0],m=c.getDatasetMeta(0),ctx=c.ctx;ctx.save();ctx.font='700 11px Montserrat';ctx.fillStyle=document.body.classList.contains('light-mode')?'#1a1a1a':'#F1F5F9';ctx.textAlign='center';ctx.textBaseline='bottom';m.data.forEach((b,i)=>{const v=ds.data[i];if(v==null)return;if(ds._on&&!ds._on[i])return;ctx.fillText(n1(v),b.x,b.y-4);});ctx.restore();}};

function chartMensal(){
  const isLight=document.body.classList.contains('light-mode');
  const selVig=getMsValues('ms-vig');
  const XV=fullYearVigs();
  const labels=XV.map(d=>vigLbl(d));
  const data=XV.map(d=>{const rows=ALL.filter(o=>vigKeyN(o.vigD)===vigKeyN(d));return rows.length?rows.reduce((s,o)=>s+(o.pontos||0),0):null;});
  const on=XV.map(d=>selVig.length===0||selVig.includes(vigLbl(d)));
  const hasFocus=selVig.length>0;
  const bg=data.map((v,i)=>{if(v==null)return 'transparent';const a=hasFocus?(on[i]?.85:.2):.65;return v>=META_PONTOS?`rgba(59,179,59,${a})`:`rgba(255,102,102,${a})`;});
  const bc=data.map(v=>v==null?'transparent':(v>=META_PONTOS?'#3BB33B':'#FF6666'));
  const metaLine=XV.map(()=>META_PONTOS);
  const remC=isLight?'#000':'#F1F5F9';
  const grid={color:isLight?'rgba(0,0,0,.08)':'rgba(255,255,255,.06)'};
  const tick={color:isLight?'#444':'#94A3B8',font:{family:'Montserrat',size:11}};
  if(chM)chM.destroy();
  chM=new Chart(document.getElementById('ch-mensal'),{data:{labels,datasets:[
    {type:'bar',data,backgroundColor:bg,borderColor:bc,borderWidth:1,_on:hasFocus?on:XV.map(()=>true),borderRadius:3,maxBarThickness:46,order:2},
    {type:'line',label:'Meta 80%',data:metaLine,borderColor:remC,borderWidth:2,borderDash:[6,4],tension:0,fill:false,pointRadius:4,pointBackgroundColor:remC,order:1}
  ]},plugins:[barLabels],options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:22}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>c.dataset.type==='line'?'Meta '+META_PONTOS:n1(c.raw)+' pts'}}},scales:{x:{grid,ticks:tick},y:{min:0,max:100,grid,ticks:{...tick}}}}});
}
function chartIndicador(){
  const isLight=document.body.classList.contains('light-mode');
  const selVig=getMsValues('ms-vig');
  const vigs=selVig.length?VIGS.filter(d=>selVig.includes(vigLbl(d))):VIGS;
  // MÉDIA dos pontos por indicador nas vigências selecionadas
  const indOrder=[],seen=new Set();
  ALL.forEach(o=>{if(!seen.has(o.indicador)){seen.add(o.indicador);indOrder.push(o.indicador);}});
  const items=indOrder.map(ind=>{const rs=ALL.filter(o=>o.indicador===ind&&vigs.some(d=>vigKeyN(d)===vigKeyN(o.vigD)));const pts=rs.length?rs.reduce((s,o)=>s+(o.pontos||0),0)/rs.length:0;const peso=rs.length?rs[0].peso:(ALL.find(o=>o.indicador===ind)?.peso||0);return{ind,pts,peso};}).filter(x=>x.peso>0);
  const labels=items.map(x=>x.ind);
  const data=items.map(x=>+x.pts.toFixed(1));
  const bg=items.map(x=>{const r=x.peso?x.pts/x.peso:0;const a=.85;return r>=1?`rgba(59,179,59,${a})`:r>0?`rgba(244,161,0,${a})`:`rgba(255,102,102,${a})`;});
  const bc=items.map(x=>{const r=x.peso?x.pts/x.peso:0;return r>=1?'#3BB33B':r>0?'#F4A100':'#FF6666';});
  const grid={color:isLight?'rgba(0,0,0,.08)':'rgba(255,255,255,.06)'};
  const tick={color:isLight?'#444':'#94A3B8',font:{family:'Montserrat',size:9}};
  if(chI)chI.destroy();
  chI=new Chart(document.getElementById('ch-ind'),{type:'bar',data:{labels,datasets:[{data,backgroundColor:bg,borderColor:bc,borderWidth:1,borderRadius:3,maxBarThickness:54}]},plugins:[barLabels],options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:22}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>n1(c.raw)+' pts'}}},scales:{x:{grid,ticks:{...tick,font:{family:'Montserrat',size:11},maxRotation:0,minRotation:0,autoSkip:false,callback:function(v){const l=this.getLabelForValue(v);const words=String(l).split(' ');const lines=[];let cur='';words.forEach(w=>{if((cur+' '+w).trim().length>14){if(cur)lines.push(cur);cur=w;}else{cur=(cur+' '+w).trim();}});if(cur)lines.push(cur);return lines;}}},y:{beginAtZero:true,grid,ticks:tick}}}});
}

function atualizar(){
  if(!ALL.length)return;
  const selVig=getMsValues('ms-vig');
  const vigs=selVig.length?VIGS.filter(d=>selVig.includes(vigLbl(d))):VIGS;
  // Pontuação = MÉDIA das pontuações mensais (cada mês = soma dos pontos dos indicadores)
  const monthScores=vigs.map(d=>ALL.filter(o=>vigKeyN(o.vigD)===vigKeyN(d)).reduce((s,o)=>s+(o.pontos||0),0));
  const total=monthScores.length?monthScores.reduce((a,b)=>a+b,0)/monthScores.length:null;
  const eT=document.getElementById('h-total');eT.textContent=n1(total);eT.style.color=total>=META_PONTOS?'var(--green)':total>=70?'var(--amber)':'var(--red)';
  const lbl=selVig.length?selVig.join(', '):'todas as vigências';
  document.getElementById('h-sub').textContent=`de 100 pontos · meta ${META_PONTOS} · ${lbl}`;
  chartMensal();chartIndicador();renderTable();
}
function renderTable(){
  const tbl=document.getElementById('tbl');
  const selVig=getMsValues('ms-vig');
  // período = vigências selecionadas (coluna Ating./Pontos = MÉDIA delas, igual ao YTD); YTD ancorado na mais recente
  const perDates=(selVig.length?VIGS.filter(d=>selVig.includes(vigLbl(d))):VIGS.slice()).sort((a,b)=>vigKeyN(a)-vigKeyN(b));
  const selD=perDates.length?perDates[perDates.length-1]:(VIGS[VIGS.length-1]||null);
  if(!selD){tbl.innerHTML='<div class="loading">Sem dados</div>';return;}
  const perKeys=new Set(perDates.map(vigKeyN));
  const ytd=VIGS.filter(d=>d.getFullYear()===selD.getFullYear()&&d.getMonth()<=selD.getMonth());
  const avgNN=a=>{const f=a.filter(v=>v!=null);return f.length?f.reduce((s,v)=>s+v,0)/f.length:null;};
  const indOrder=[],seen=new Set();ALL.forEach(o=>{if(!seen.has(o.indicador)){seen.add(o.indicador);indOrder.push(o);}});
  const atgColor=(pts,peso)=>{if(pts==null||!peso)return 'var(--text3)';const f=pts/peso;return f>=1?'var(--green)':f>0?'var(--amber)':'var(--red)';};
  const subEl=document.getElementById('tbl-sub');if(subEl)subEl.textContent=perDates.length<=1?vigLbl(selD).toUpperCase():`${vigLbl(perDates[0]).toUpperCase()} – ${vigLbl(selD).toUpperCase()} · MÉDIA`;
  let html='<table><thead><tr class="cols"><th class="lft">Indicador</th><th class="sec-col">Peso</th><th class="lft sec-col">Descrição</th><th class="lft sec-col">Regra de Atingimento</th><th class="sec-col">Un.</th><th class="sec-col">Meta</th><th>Real</th><th>Ating.</th><th>Pontos</th><th class="sep-l sec-col">Ating. YTD</th><th class="sec-col">Pontos YTD</th></tr></thead><tbody>';
  indOrder.forEach(base=>{
    const ind=base.indicador;
    const per=ALL.filter(x=>x.indicador===ind&&perKeys.has(vigKeyN(x.vigD)));
    const pMeta=avgNN(per.map(o=>o.meta)),pReal=avgNN(per.map(o=>o.real)),pAtg=avgNN(per.map(o=>o.atg));
    const pPts=per.length?per.reduce((s,o)=>s+(o.pontos||0),0)/per.length:null;
    const yr=ALL.filter(x=>x.indicador===ind&&ytd.some(d=>vigKeyN(d)===vigKeyN(x.vigD)));
    const atgY=avgNN(yr.map(o=>o.atg));
    const ptsY=yr.length?yr.reduce((s,o)=>s+(o.pontos||0),0)/yr.length:null;
    html+=`<tr><td class="lft ind">${ind}</td><td class="sec-col">${n1(base.peso)}</td><td class="lft desc sec-col">${(base.desc||'').replace(/\n/g,'<br>')}</td><td class="lft regra sec-col">${(base.regra||'').replace(/\n/g,'<br>')}</td><td class="un sec-col">${base.un||''}</td>`;
    if(per.length){html+=`<td class="sec-col">${n1(pMeta)}</td><td>${n1(pReal)}</td><td style="color:${atgColor(pPts,base.peso)};font-weight:700">${pctI(pAtg)}</td><td><span class="pts">${n1(pPts)}</span></td>`;}else{html+='<td class="sec-col">-</td><td>-</td><td>-</td><td>-</td>';}
    html+=`<td class="sep-l sec-col" style="color:${atgColor(ptsY,base.peso)};font-weight:700">${pctI(atgY)}</td><td class="sec-col"><span class="pts">${n1(ptsY)}</span></td>`;
    html+='</tr>';
  });
  html+='</tbody></table>';
  tbl.innerHTML=indOrder.length?html:'<div class="loading">Sem dados</div>';
}

async function carregar(){
  document.getElementById('status').textContent='Carregando…';
  try{
    // A aba Painel de Metas dá só a ESTRUTURA (indicador, peso, descrição, regra, un) — todo o
    // Meta/Real de cada indicador é calculado a partir do painel de origem correspondente.
    const [mRows,kmRows,dpoRows,fcaRows,frotaTab,receitaTab,eliteRecords]=await Promise.all([
      gviz(SRC.metas),gviz(SRC.km),gviz(SRC.dpo),gviz(SRC.fca),
      fetchDreTab(DRE_TAB_FROTA),fetchDreTab(DRE_TAB_RECEITA),
      window.GerotBase.load()
    ]);
    const rankMap=compRankingElite(eliteRecords), dispMap=compDisp(kmRows), dpo=compDPO(dpoRows), fcaRecs=compFCArecs(fcaRows), custoMap=compCusto(frotaTab,receitaTab);

    ALL=mRows.filter(r=>r[1]&&r[0]&&parseD(r[0])).map(r=>{
      const vigD=parseD(r[0]);const k=vigKeyN(vigD);const mIdx=vigD.getMonth(),yr=vigD.getFullYear();
      const indicador=String(r[1]||'').trim(), peso=r[2]!=null?+r[2]:0, meta=r[6]!=null?+r[6]:null;
      const o={vigD,vig:vigLbl(vigD),indicador,peso,desc:String(r[3]||''),regra:String(r[4]||''),un:String(r[5]||'').trim(),meta,
               real:r[7]!=null?+r[7]:null,atg:r[8]!=null?+r[8]:null,pontos:r[9]!=null?+r[9]:0};
      const tipo=classify(indicador);
      if(tipo==='rank'){               // maior = melhor
        o.real=rankMap[k]!=null?rankMap[k]:null;
        o.atg=(o.real!=null&&meta)?o.real/meta*100:null;
        o.pontos=bandHigher(o.atg)*peso;
      }else if(tipo==='disp'){         // menor = melhor · valor acumulado (YTD)
        o.real=dispMap[k]!=null?dispMap[k]:null;
        o.atg=(o.real!=null&&o.real!==0)?meta/o.real*100:null;
        o.pontos=o.real!=null?bandLowerRatio(meta?o.real/meta*100:null)*peso:0;
      }else if(tipo==='dpo'){          // pilar sustentável · vale p/ todos os meses
        o.real=dpo.frac*100;
        o.atg=meta?o.real/meta*100:o.real;
        o.pontos=dpo.frac*peso;
      }else if(tipo==='fca'){          // maior = melhor · conta só até M-1
        o.real=fcaAderM2(fcaRecs,yr,mIdx);
        o.atg=(o.real!=null&&meta)?o.real/meta*100:null;
        o.pontos=bandHigher(o.atg)*peso;
      }else if(tipo==='custo'){         // menor = melhor · AV Real vs AV Orçado (custo total ÷ Receita Líquida) — igual à Visão Financeira
        const cm=custoMap[k];
        if(cm){ o.meta=cm.avOrc; o.real=cm.avReal; }
        o.atg=(o.real!=null&&o.meta)?o.real/o.meta*100:null;
        o.pontos=bandLowerRatio(o.atg)*peso;
      } // 'other' mantém o que veio da planilha
      return o;
    });
    const vm=new Map();ALL.forEach(o=>{if(o.vigD)vm.set(vigKeyN(o.vigD),o.vigD);});
    VIGS=[...vm.values()].sort((a,b)=>vigKeyN(a)-vigKeyN(b));
    const vigItems=VIGS.map(d=>vigLbl(d));
    const vw=document.getElementById('ms-vig');if(vigItems.length)vw._sel=new Set([vigItems[vigItems.length-1]]); // auto último mês
    buildMsFilter('ms-vig',vigItems);
    atualizar();
    const now=new Date();document.getElementById('status').textContent=`${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){console.error(e);document.getElementById('status').textContent='Erro ao carregar';}
}
