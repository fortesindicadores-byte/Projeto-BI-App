<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCAs</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
/* HEADER — sempre escuro */
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;order:1;}.brand h1{font-size:17px;font-weight:800;color:var(--orange);}.brand p{font-size:10px;color:#94A3B8;margin-top:2px;font-style:italic;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:8px;}
.status-badge{font-size:9px;color:#F1F5F9;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:2px 8px;white-space:nowrap;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--orange);display:flex;align-items:center;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.32);}
.header-filters{flex-basis:100%;order:3;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.filter-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:120px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;}.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:4px;min-width:200px;max-height:300px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.ms-only{margin-left:auto;font-size:8px;color:var(--orange);padding:1px 5px;border-radius:2px;cursor:pointer;white-space:nowrap;flex-shrink:0;opacity:0;transition:opacity .12s;text-transform:uppercase;}
.ms-opt:hover .ms-only{opacity:1;}
.ms-only:hover{background:rgba(249,115,22,.2);}
.main{padding:18px 24px;}
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:8px 12px 12px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1100px;}
thead th{position:sticky;top:0;background:#141B26;color:var(--text);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap;z-index:2;}
tbody td{padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;color:var(--text);line-height:1.45;}
tbody tr:hover{background:rgba(255,255,255,.03);}
td.txt{white-space:normal;min-width:200px;}
td.txtsm{white-space:normal;min-width:150px;color:var(--text2);}
td.center{text-align:center;white-space:nowrap;}
.metric{display:block;margin-top:5px;font-size:10px;color:var(--text2);font-weight:700;}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.chip{display:inline-block;padding:3px 9px;border-radius:5px;font-weight:700;font-size:11px;white-space:nowrap;}
.loading{text-align:center;color:var(--text3);padding:40px;}
/* MODO CLARO — só conteúdo e cards (header escuro) */
body.light-mode .main{background:#F0F0F0;--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);--red:#ff0000;--green:#0E8C0E;}body.light-mode .hero-sep{background:rgba(0,0,0,.18)!important;color:rgba(0,0,0,.2)!important;}
body.light-mode .tbl-section{background:rgba(128,128,128,.14)!important;border:none!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#555555;}
body.light-mode thead th{background:#F0F0F0;}
body.light-mode tbody td{border-bottom-color:rgba(0,0,0,.08);}
@media(max-width:768px){.main{padding:12px;}.header{padding:8px 12px 10px;}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><h1>FCAs</h1><p>Total</p></div>
  <div class="header-right">
    <a href="../" class="btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="btn" id="themeBtn" title="Modo claro/escuro"></button>
    <button class="btn" onclick="carregar()" title="Atualizar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>
    <span class="status-badge" id="status">Carregando…</span>
  </div>
  <div class="header-filters" id="filters"></div>
</header>

<main class="main">
  <div class="tbl-section"><div class="tbl-wrap"><div id="tbl"><div class="loading">Carregando…</div></div></div></div>
</main>

<script>
const SHEET_ID='1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o';
const GID='216663799';
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];

// Mapeamento conta → pacote (mesmo da Visão Financeira)
const PACOTES_MAP={
  'Combustíveis Veiculos e Equipamentos':'Combustíveis','Combustíveis':'Combustíveis',
  'Estorno de ICMS não Aproveitado':'Combustíveis','Fluídos (Arla)':'Combustíveis',
  'Arla':'Combustíveis','ICMS Crédito Presumido':'Combustíveis',
  'Manutenção de Veículos e Equipamentos':'Manutenções','Manutenção de Veículos e Equip.':'Manutenções',
  'Materiais e Ferramentas de Oficina':'Manutenções','Lavação de Veículos':'Manutenções',
  'Manutenção de Carrocerias':'Manutenções','Personalização/Padronização de Veículos':'Manutenções',
  'Personalização/Padronização':'Manutenções','Personalização e Padronização de Veículos':'Manutenções',
  'Contratos de Manutenção Fabricante':'Manutenções','Consertos e Recapagens de Pneus':'Pneus',
  'Pneus e Camaras':'Pneus','Recapagens e Outros Serviços':'Pneus','Pneus Novos':'Pneus',
  'IPVA e Licenciamento de Veículos':'Seguros e licenças','IPVA e Licenciamento':'Seguros e licenças',
  'Seguro de Veículos e Equipamentos':'Seguros e licenças','Seguros':'Seguros e licenças',
};
function getPacote(conta){
  if(PACOTES_MAP[conta])return PACOTES_MAP[conta];
  if(/^I[VC]\s*:/i.test(conta))return 'Indicadores';
  return 'Outros';
}

const FILTROS=[
  {id:'unidade',label:'Unidade'},
  {id:'origem',label:'Origem'},
  {id:'vig',label:'Vigência'},
  {id:'projeto',label:'Projeto'},
  {id:'pacote',label:'Pacote'},
  {id:'conta',label:'Conta'},
  {id:'sprazo',label:'Status Prazo'},
  {id:'status',label:'Status'},
];
const SEL={};FILTROS.forEach(f=>SEL[f.id]=new Set());
let ALL=[];

function parseD(v){if(!v)return null;const m=String(v).match(/^Date\((\d+),(\d+),(\d+)/);if(m)return new Date(+m[1],+m[2],+m[3]);if(v instanceof Date)return v;return null;}
function fmtD(d){return d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear():'-';}
function vigLbl(d){return d?MESES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2):'';}

function statusPrazo(o){
  const concl=/conclu/i.test(o.status||'');
  if(concl)return 'No prazo';
  if(o.prazoD){const hoje=new Date();hoje.setHours(0,0,0,0);if(o.prazoD<hoje)return 'Vencida';}
  return 'No prazo';
}

function fetchTab(){
  return new Promise((resolve,reject)=>{
    const fn='_gvFca'+Math.floor(Math.random()*1e9);
    const s=document.createElement('script');
    const clr=()=>{try{delete window[fn];s.remove();}catch(e){}};
    window[fn]=resp=>{clr();try{
      if(resp.status!=='ok')throw new Error('erro');
      resolve(resp.table.rows.map(r=>(r.c||[]).map(c=>c?(c.v):null)));
    }catch(e){reject(e);}};
    s.onerror=()=>{clr();reject(new Error('sem acesso'));};
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json;responseHandler:${fn}`;
    document.head.appendChild(s);
  });
}

// ── Multi-select ──
function buildFilters(){
  const cont=document.getElementById('filters');cont.innerHTML='';
  FILTROS.forEach(f=>{
    const vals=[...new Set(ALL.map(o=>o[f.id]).filter(v=>v!==''&&v!=null))];
    if(f.id==='vig')vals.sort((a,b)=>{const pa=ALL.find(o=>o.vig===a).vigD,pb=ALL.find(o=>o.vig===b).vigD;return pa-pb;});
    else vals.sort();
    const g=document.createElement('div');g.className='filter-group';
    g.innerHTML=`<span class="filter-label">${f.label}</span>
      <div class="ms-wrap" id="ms-${f.id}">
        <button class="ms-btn" type="button"><span class="ms-lbl">${f.label}</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button>
        <div class="ms-panel"><label class="ms-opt all"><input type="checkbox" class="all-chk" checked> Todos</label>${vals.map(v=>{const dv=String(v).replace(/"/g,'&quot;');return `<label class="ms-opt"><input type="checkbox" data-v="${dv}" checked> ${v}<span class="ms-only" data-v="${dv}">só</span></label>`;}).join('')}</div>
      </div>`;
    cont.appendChild(g);
    const wrap=g.querySelector('.ms-wrap'),panel=wrap.querySelector('.ms-panel');
    wrap.querySelector('.ms-btn').addEventListener('click',e=>{e.stopPropagation();document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p!==panel)p.classList.remove('open');});panel.classList.toggle('open');});
    panel.addEventListener('click',e=>e.stopPropagation());
    const allChk=panel.querySelector('.all-chk'),opts=[...panel.querySelectorAll('input[data-v]')];
    allChk.addEventListener('change',()=>{opts.forEach(o=>o.checked=allChk.checked);updateSel(f.id,panel);});
    opts.forEach(o=>o.addEventListener('change',()=>{allChk.checked=opts.every(x=>x.checked);updateSel(f.id,panel);}));
    panel.querySelectorAll('.ms-only').forEach(only=>only.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();opts.forEach(o=>o.checked=(o.dataset.v===only.dataset.v));allChk.checked=false;updateSel(f.id,panel);}));
  });
}
function updateSel(id,panel){
  const opts=[...panel.querySelectorAll('input[data-v]')];
  const sel=opts.filter(o=>o.checked).map(o=>o.dataset.v);
  SEL[id]=opts.every(o=>o.checked)?new Set():new Set(sel);
  const cnt=panel.closest('.ms-wrap').querySelector('.ms-cnt');const n=SEL[id].size;cnt.textContent=n;cnt.style.display=n?'':'none';
  render();
}
document.addEventListener('click',()=>document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open')));

function passa(o){return FILTROS.every(f=>{const s=SEL[f.id];return s.size===0||s.has(String(o[f.id]));});}

function chipStatus(st){
  if(/conclu/i.test(st))return `<span class="chip" style="background:rgba(59,179,59,.85);color:#06210a">${st}</span>`;
  if(/andamento/i.test(st))return `<span class="chip" style="background:rgba(244,161,0,.9);color:#241900">${st}</span>`;
  return '<span style="color:var(--text3)">—</span>';
}
function fatoCell(fato){
  const linhas=String(fato||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const met=linhas.filter(l=>/^(desvio|atingimento)/i.test(l));
  const main=linhas.filter(l=>!/^(desvio|atingimento)/i.test(l));
  return main.join('<br>')+met.map(m=>`<span class="metric">${m}</span>`).join('');
}

function render(){
  const rows=ALL.filter(passa);
  let html='<table><thead><tr>'+
    '<th>Origem</th><th>Unidade</th><th>Projeto</th><th>Fato</th><th>Causa</th><th>Ação</th><th>Prazo</th><th>Status Prazo</th><th>Status</th>'+
    '</tr></thead><tbody>';
  rows.forEach(o=>{
    const sp=o.sprazo, spCor=sp==='Vencida'?'var(--red)':'var(--green)';
    html+=`<tr>`+
      `<td class="center">${o.origem||'-'}</td>`+
      `<td class="center">${o.unidade||'-'}</td>`+
      `<td class="center">${o.projeto||'-'}</td>`+
      `<td class="txt">${fatoCell(o.fato)}</td>`+
      `<td class="txtsm">${(o.causa||'-').replace(/\n/g,'<br>')}</td>`+
      `<td class="txtsm">${(o.acao||'-').replace(/\n/g,'<br>')}</td>`+
      `<td class="center">${o.prazoD?fmtD(o.prazoD):'-'}</td>`+
      `<td class="center"><span class="dot" style="background:${spCor}"></span>${sp}</td>`+
      `<td class="center">${chipStatus(o.status||'')}</td>`+
    `</tr>`;
  });
  html+='</tbody></table>';
  if(!rows.length)html='<div class="loading">Nenhum FCA com os filtros selecionados</div>';
  document.getElementById('tbl').innerHTML=html;
}

async function carregar(){
  document.getElementById('status').textContent='Carregando…';
  try{
    const rows=await fetchTab();
    ALL=rows.slice(1).filter(r=>r[0]).map(r=>{
      const vigD=parseD(r[1]),prazoD=parseD(r[7]);
      const conta=(String(r[4]||'').split('\n')[0]||'').trim();
      const o={origem:String(r[0]||'').trim(),vigD,vig:vigLbl(vigD),unidade:String(r[2]||'').trim(),projeto:String(r[3]||'').trim(),conta,pacote:getPacote(conta),fato:r[4]||'',causa:r[5]||'',acao:r[6]||'',prazoD,status:String(r[8]||'').trim()};
      o.sprazo=statusPrazo(o);
      return o;
    });
    buildFilters();render();
    const now=new Date();
    document.getElementById('status').textContent=`${ALL.length} FCAs · ${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){console.error(e);document.getElementById('status').textContent='Erro ao carregar';document.getElementById('tbl').innerHTML='<div class="loading">Erro ao carregar dados</div>';}
}

// Tema claro/escuro
const _sun=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const _moon=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);const b=document.getElementById('themeBtn');if(b)b.innerHTML=t==='light'?_moon:_sun;}
(function(){const t=localStorage.getItem('bi_theme')||'dark';applyTheme(t);document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));})();

carregar();
</script>
</body>
</html>
