<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Indisponibilidade · Frota do Dia</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;min-width:190px;}.brand h1{font-size:16px;font-weight:700;color:var(--orange);line-height:1.1;}.brand p{font-size:10px;color:var(--text2);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.35);border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--orange);font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.3);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn.ghost{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--text2);}
.btn.ghost:hover{background:rgba(255,255,255,.1);color:var(--text);}
.btn.green{background:rgba(59,179,59,.15);border-color:rgba(59,179,59,.4);color:var(--green);}
.btn.green:hover{background:rgba(59,179,59,.28);}
.btn.sm{padding:4px 9px;font-size:10px;border-radius:5px;}
.status-badge{font-size:10px;color:var(--text);background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:3px 10px;white-space:nowrap;}
select.uni-sel{background:#0a0f18;border:1px solid #2a3a50;border-radius:6px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:12px;font-weight:700;padding:6px 10px;outline:none;cursor:pointer;}
select.uni-sel option{background:#0f1824;}
.main{padding:20px 24px 70px;}
.cards-row{display:grid;grid-template-columns:repeat(4,minmax(160px,240px));gap:12px;margin-bottom:16px;}
.kpi-card{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:3px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.card-label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.card-value{font-size:24px;font-weight:800;color:var(--text);line-height:1.1;margin-top:2px;}
.card-sub{font-size:10px;color:var(--text2);margin-top:3px;}
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:18px 20px 16px;margin-bottom:16px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.tbl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.tbl-title{font-size:16px;font-weight:800;color:var(--text);}
.tbl-sub{font-size:10px;color:var(--text2);flex:1;min-width:140px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;}
thead th{background:rgba(255,255,255,.04);color:var(--text);font-size:11px;font-weight:700;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.10);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;text-align:left;}
td{padding:10px 8px;border:none;border-top:1px solid rgba(255,255,255,.04);color:var(--text);white-space:nowrap;vertical-align:middle;}
tbody tr:hover{background:rgba(255,255,255,.035);}
td.wrap{white-space:normal;min-width:180px;max-width:340px;}
.chip{display:inline-block;font-size:9.5px;font-weight:800;border-radius:10px;padding:2px 9px;text-transform:uppercase;letter-spacing:.4px;}
.chip.disp{background:rgba(59,179,59,.15);color:var(--green);border:1px solid rgba(59,179,59,.35);}
.chip.ind{background:rgba(255,102,102,.13);color:var(--red);border:1px solid rgba(255,102,102,.35);}
.chip.st{background:rgba(56,189,248,.12);color:var(--blue);border:1px solid rgba(56,189,248,.3);}
.chip.warn{background:rgba(244,161,0,.13);color:var(--amber);border:1px solid rgba(244,161,0,.35);}
.dias-b{font-weight:800;}
.dias-b.hot{color:var(--red);}
.search{background:#0a0f18;border:1px solid #2a3a50;border-radius:6px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:12px;padding:7px 10px;outline:none;min-width:180px;}
.search:focus{border-color:var(--orange);}
.loading{text-align:center;color:var(--text3);padding:60px;font-size:14px;}
.gate{max-width:520px;margin:80px auto;text-align:center;background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:38px 34px;}
.gate .ic{font-size:38px;margin-bottom:14px;}.gate h2{font-size:18px;font-weight:800;margin-bottom:10px;}.gate p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px;}
.gate code{background:rgba(249,115,22,.14);color:var(--orange);padding:2px 7px;border-radius:5px;}
/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:800;backdrop-filter:blur(3px);}
.modal-bg.open{display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;}
.modal{background:#111927;border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:22px 24px;width:100%;max-width:640px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
.modal h3{font-size:15px;font-weight:800;margin-bottom:14px;color:var(--orange);}
.frm{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;}
.frm .full{grid-column:1/-1;}
.fld{display:flex;flex-direction:column;gap:4px;}
.fld label{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:700;}
.fld input,.fld select,.fld textarea{background:#0a0f18;border:1px solid #2a3a50;border-radius:6px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:12px;padding:8px 10px;outline:none;width:100%;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--orange);}
.fld textarea{resize:vertical;min-height:56px;}
.fld select option{background:#0f1824;}
.modal-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.modal-actions .spacer{flex:1;}
.btn.red{background:rgba(255,102,102,.12);border-color:rgba(255,102,102,.35);color:var(--red);}
.btn.red:hover{background:rgba(255,102,102,.25);}
.hint{font-size:10px;color:var(--text3);margin-top:3px;}
body.light-mode{background:#F0F0F0;}
body.light-mode .main{--text:#1a1a1a;--text2:#444;--text3:#666;color:var(--text);}
body.light-mode .kpi-card,body.light-mode .tbl-section{background:#FFF!important;border-color:transparent!important;box-shadow:0 2px 12px rgba(0,0,0,.10)!important;--text:#1a1a1a;--text2:#444;--text3:#555;}
body.light-mode thead th{background:rgba(0,0,0,.05);}
body.light-mode td{border-top-color:rgba(0,0,0,.06);}
body.light-mode .search{background:#fff;border-color:#ccc;color:#1a1a1a;}
@media(max-width:768px){
  .cards-row{grid-template-columns:repeat(2,1fr);}
  .main{padding:14px 12px 60px;}
  .frm{grid-template-columns:1fr;}
  .header-right .status-badge{font-size:8px;padding:2px 6px;}
}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><h1>Indisponibilidade · Frota do Dia</h1><p>abra quando o veículo parar, feche quando voltar — e confirme a frota do dia</p></div>
  <div class="header-right">
    <select class="uni-sel" id="uniSel" style="display:none"></select>
    <a class="btn ghost sm" href="../index.html">← Hub</a>
    <button class="btn ghost sm" id="themeBtn" title="Modo claro/escuro">☀</button>
    <span class="status-badge" id="status-badge">Carregando…</span>
  </div>
</header>
<main class="main">
  <div id="content"><div class="loading">Verificando acesso…</div></div>
</main>

<!-- MODAL evento -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="mTitle">Nova indisponibilidade</h3>
    <div class="frm">
      <div class="fld"><label>Placa *</label><input id="mPlaca" list="placasList" autocomplete="off" placeholder="ABC1D23"><datalist id="placasList"></datalist><div class="hint" id="mPlacaHint"></div></div>
      <div class="fld"><label>Data da parada *</label><input type="date" id="mParada"></div>
      <div class="fld"><label>Grupo</label><select id="mGrupo"><option>CORRETIVA</option><option>PREVENTIVA</option><option>SINISTRO</option><option>DOCUMENTAÇÃO</option><option>OUTROS</option></select></div>
      <div class="fld"><label>Local manutenção</label><select id="mLocal"><option>EXTERNO</option><option>INTERNO</option></select></div>
      <div class="fld full"><label>Descrição do problema</label><textarea id="mDesc" placeholder="ex.: Em execução mecânica — embreagem"></textarea></div>
      <div class="fld"><label>RC/OC</label><input id="mRcoc" placeholder="nº da RC ou OC"></div>
      <div class="fld"><label>Previsão de retorno</label><input type="date" id="mPrev"></div>
      <div class="fld"><label>Status</label><select id="mStatus"><option>Em orçamento</option><option>Aguardando aprovação</option><option>Aguardando peça</option><option selected>Em execução</option><option>Pronto para retirada</option></select></div>
      <div class="fld"><label>Retornou em (fechar)</label><input type="date" id="mRetorno"><div class="hint">preencher só quando o veículo voltar</div></div>
      <div class="fld full"><label>Observação</label><textarea id="mObs"></textarea></div>
    </div>
    <div class="modal-actions">
      <button class="btn red sm" id="mDel" style="display:none">Excluir</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="mCancel">Cancelar</button>
      <button class="btn" id="mSave">Salvar</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL='https://lozwipoeacpvplgkrxkq.supabase.co';
const SUPABASE_KEY='sb_publishable_ggKEEebc5zjgQDVsF92Upw_6uoLmKe9';
const ALL_UNITS=['ANG','BLC','CBA T1','CBA T1 WH','CBA T2','CGR','FLP','GRL','MCC T1','MCC T2','NFR','PIR','PLT','RON'];
let sb=null, PROFILE=null, ADMIN=false, MY_UNITS=[], UNIT=null, USER=null;
let ATIVOS=[];        // frota da base ginfo (todas as unidades) {placa,filial,projeto,tipo,modelo,marca,cod}
let EVENTS=[];        // indisponibilidade da unidade selecionada (abertos+fechados)
let CHECKINS=[];      // check-ins de hoje (todas as unidades — p/ admin ver)
let EDIT_ID=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function gate(ic,t,h){document.getElementById('content').innerHTML=`<div class="gate"><div class="ic">${ic}</div><h2>${t}</h2>${h}</div>`;}
function set(id,t){const e=document.getElementById(id);if(e)e.textContent=t;}
function normU(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
function normP(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function hojeBRT(){return new Date().toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'});}
function fmtD(d){if(!d)return '—';const [y,m,dd]=String(d).slice(0,10).split('-');return `${dd}/${m}/${y}`;}
function diasDesde(d){if(!d)return null;const a=new Date(d+'T12:00:00'),b=new Date(hojeBRT()+'T12:00:00');return Math.max(Math.round((b-a)/86400000),0);}

// ── de-para nome → código (mesmo do SQL/migração) ──
const NAME2COD={
  'CDD CAMBORIU':'BLC','BALNEARIO CAMBORIU':'BLC','CAMBORIU':'BLC',
  'CDD CUIABA':'CBA T2','CUIABA':'CBA T1 WH','CUIABA EMPURRADA':'CBA T1',
  'CDD RIO DE JANEIRO':'CGR','CAMPO GRANDE':'CGR','RIO DE JANEIRO':'CGR',
  'CDD FLORIANOPOLIS':'FLP','FLORIANOPOLIS':'FLP',
  'CDD GUARULHOS':'GRL','GUARULHOS':'GRL',
  'ANHANGUERA':'ANG',
  'CDI MACACU':'MCC T2','MACACU EMPURRADA':'MCC T1','CACHOEIRAS DE MACACU':'MCC T2','MACACU':'MCC T2',
  'CDD NOVA FRIBURGO':'NFR','NOVA FRIBURGO':'NFR',
  'PIRAI EMPURRADA':'PIR','PIRAI':'PIR',
  'CDD PELOTAS':'PLT','PELOTAS':'PLT',
  'CDD RONDONOPOLIS':'RON','RONDONOPOLIS':'RON'
};
function unitCod(nome,projeto){
  const n=normU(nome); if(!n)return null;
  let cod=NAME2COD[n]; if(!cod)return n;
  const p=normU(projeto);
  if(cod.startsWith('CBA')){
    if(/EMPURRAD/.test(p))cod='CBA T1';
    else if(/APOIO|EMPILHADEIRA|ARMAZEM|\bWH\b/.test(p))cod='CBA T1 WH';
    else if(/ROTA|CDD|AUTO SERVICO|VAN/.test(p))cod='CBA T2';
  }else if(cod.startsWith('MCC')){
    if(/EMPURRAD/.test(p))cod='MCC T1';
    else if(/ROTA|CDI|CDD|AUTO SERVICO|VAN/.test(p))cod='MCC T2';
  }
  return cod;
}

// ── carga de dados ──
async function loadAtivos(){
  const {data,error}=await sb.from('ginfo_snapshot').select('data,updated_at').eq('chave','ativos').maybeSingle();
  if(error)throw error;
  if(!data||!Array.isArray(data.data))throw new Error('Base de ativos (robô Ginfo) não encontrada.');
  ATIVOS=data.data.map(r=>{
    const filial=String(r['Filial']||'').trim(), projeto=String(r['Projeto']||'').trim();
    return {
      placa:normP(r['Placa']), filial, projeto,
      tipo:String(r['Tipo Veículo']||'').trim(), modelo:String(r['Modelo']||'').trim(),
      marca:String(r['Marca']||'').trim(), cod:unitCod(filial,projeto)
    };
  }).filter(r=>r.placa);
  return data.updated_at;
}
async function loadEvents(){
  const {data,error}=await sb.from('indisponibilidade').select('*').eq('unidade',UNIT).order('data_parada',{ascending:false}).limit(1500);
  if(error)throw error;
  EVENTS=data||[];
}
async function loadCheckins(){
  const {data,error}=await sb.from('disp_checkins').select('*').eq('data',hojeBRT()).order('created_at',{ascending:false});
  if(error)throw error;
  CHECKINS=data||[];
}

const frota=()=>ATIVOS.filter(a=>a.cod===UNIT);
const abertos=()=>EVENTS.filter(e=>!e.data_retorno);
const fechados=()=>EVENTS.filter(e=>!!e.data_retorno);
const ckHoje=()=>CHECKINS.find(c=>c.unidade===UNIT);

// ── render ──
function render(){
  const fr=frota(), ab=abertos();
  const abertaSet=new Set(ab.map(e=>normP(e.placa)));
  const nInd=fr.filter(a=>abertaSet.has(a.placa)).length + ab.filter(e=>!fr.some(a=>a.placa===normP(e.placa))).length;
  const disp=fr.length?((fr.length-fr.filter(a=>abertaSet.has(a.placa)).length)/fr.length*100):null;
  const ck=ckHoje();

  const q=(window._Q||'').toUpperCase();
  const frFilt=q?fr.filter(a=>a.placa.includes(q)||a.projeto.toUpperCase().includes(q)||a.tipo.toUpperCase().includes(q)||a.modelo.toUpperCase().includes(q)):fr;

  const abRows=ab.map(e=>{
    const d=diasDesde(e.data_parada);
    const atrasada=e.previsao_retorno&&e.previsao_retorno<hojeBRT();
    return `<tr>
      <td><b>${esc(e.placa)}</b></td>
      <td>${esc(e.projeto||'—')}</td>
      <td>${esc(e.tipo_veiculo||e.modelo||'—')}</td>
      <td>${esc(e.grupo||'—')}</td>
      <td class="wrap">${esc(e.descricao_problema||'—')}</td>
      <td>${esc(e.local_manutencao||'—')}</td>
      <td>${esc(e.rc_oc||'—')}</td>
      <td>${fmtD(e.data_parada)}</td>
      <td class="dias-b ${d>=30?'hot':''}">${d==null?'—':d}</td>
      <td>${e.previsao_retorno?`${fmtD(e.previsao_retorno)} ${atrasada?'<span class="chip warn">atrasada</span>':''}`:'—'}</td>
      <td><span class="chip st">${esc(e.status||'—')}</span></td>
      <td style="white-space:nowrap">
        <button class="btn ghost sm" onclick="openModal('${e.id}')">Editar</button>
        <button class="btn green sm" onclick="fecharEvento('${e.id}')">✓ Retornou</button>
      </td>
    </tr>`;
  }).join('');

  const frRows=frFilt.map(a=>{
    const ind=abertaSet.has(a.placa);
    const ev=ind?ab.find(e=>normP(e.placa)===a.placa):null;
    return `<tr>
      <td><b>${esc(a.placa)}</b></td>
      <td>${esc(a.projeto||'—')}</td>
      <td>${esc(a.tipo||'—')}</td>
      <td>${esc(a.modelo||'—')}</td>
      <td>${ind?'<span class="chip ind">Indisponível</span>':'<span class="chip disp">Disponível</span>'}</td>
      <td>${ind
        ?`<button class="btn ghost sm" onclick="openModal('${ev.id}')">Ver / editar</button>`
        :`<button class="btn ghost sm" onclick="openModal(null,'${a.placa}')">Parou? Abrir</button>`}</td>
    </tr>`;
  }).join('');

  const hist=fechados().slice(0,30).map(e=>`<tr>
    <td><b>${esc(e.placa)}</b></td><td>${esc(e.projeto||'—')}</td><td>${esc(e.grupo||'—')}</td>
    <td class="wrap">${esc(e.descricao_problema||'—')}</td>
    <td>${fmtD(e.data_parada)}</td><td>${fmtD(e.data_retorno)}</td>
    <td>${(()=>{const a=new Date(e.data_parada+'T12:00'),b=new Date(e.data_retorno+'T12:00');return Math.max(Math.round((b-a)/86400000),0);})()}</td>
    <td><button class="btn ghost sm" onclick="openModal('${e.id}')">Editar</button></td>
  </tr>`).join('');

  document.getElementById('content').innerHTML=`
  <div class="cards-row">
    <div class="kpi-card"><div class="card-label">Frota (ativos)</div><div class="card-value">${fr.length}</div><div class="card-sub">base do robô Ginfo</div></div>
    <div class="kpi-card"><div class="card-label">Indisponíveis agora</div><div class="card-value" style="color:${nInd?'var(--red)':'var(--green)'}">${nInd}</div><div class="card-sub">${ab.length} evento(s) aberto(s)</div></div>
    <div class="kpi-card"><div class="card-label">Disponibilidade</div><div class="card-value">${disp==null?'—':disp.toFixed(1).replace('.',',')+'%'}</div><div class="card-sub">frota − indisponíveis</div></div>
    <div class="kpi-card"><div class="card-label">Frota do dia</div>
      ${ck?`<div class="card-value" style="color:var(--green);font-size:15px;line-height:1.3;margin-top:6px">✓ Confirmada</div><div class="card-sub">${new Date(ck.created_at).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${esc(ck.nome||'')}</div>`
          :`<div style="margin-top:8px"><button class="btn green" onclick="confirmarDia()">Confirmar frota do dia</button></div><div class="card-sub">revise e confirme — mesmo sem mudanças</div>`}
    </div>
  </div>

  <div class="tbl-section">
    <div class="tbl-head">
      <div class="tbl-title">Indisponíveis agora</div>
      <div class="tbl-sub">1 linha por veículo parado — feche com "✓ Retornou" quando voltar</div>
      <button class="btn" onclick="openModal(null)">+ Nova indisponibilidade</button>
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>Placa</th><th>Projeto</th><th>Tipo/Modelo</th><th>Grupo</th><th>Problema</th><th>Local</th><th>RC/OC</th><th>Parada</th><th>Dias</th><th>Previsão</th><th>Status</th><th></th></tr></thead>
    <tbody>${abRows||'<tr><td colspan="12" style="color:var(--text3)">Nenhum veículo indisponível 🎉</td></tr>'}</tbody></table></div>
  </div>

  <div class="tbl-section">
    <div class="tbl-head">
      <div class="tbl-title">Frota da unidade</div>
      <div class="tbl-sub">${frFilt.length} de ${fr.length} veículos</div>
      <input class="search" id="frotaQ" placeholder="Buscar placa, projeto, tipo…" value="${esc(window._Q||'')}">
    </div>
    <div class="tbl-wrap"><table><thead><tr><th>Placa</th><th>Projeto</th><th>Tipo</th><th>Modelo</th><th>Situação</th><th></th></tr></thead>
    <tbody>${frRows||'<tr><td colspan="6" style="color:var(--text3)">Nenhum veículo da unidade na base de ativos.</td></tr>'}</tbody></table></div>
  </div>

  <div class="tbl-section">
    <div class="tbl-head"><div class="tbl-title">Histórico recente</div><div class="tbl-sub">últimos retornos (30)</div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Placa</th><th>Projeto</th><th>Grupo</th><th>Problema</th><th>Parada</th><th>Retorno</th><th>Dias</th><th></th></tr></thead>
    <tbody>${hist||'<tr><td colspan="8" style="color:var(--text3)">Sem eventos fechados ainda.</td></tr>'}</tbody></table></div>
  </div>`;

  const sq=document.getElementById('frotaQ');
  if(sq){sq.addEventListener('input',()=>{window._Q=sq.value;render();});
        sq.focus&&window._Q&&sq.setSelectionRange(sq.value.length,sq.value.length);}
}

// ── modal ──
function fillPlacasList(){
  document.getElementById('placasList').innerHTML=frota().map(a=>`<option value="${a.placa}">${esc(a.tipo)} · ${esc(a.projeto)}</option>`).join('');
}
function placaHint(){
  const p=normP(document.getElementById('mPlaca').value);
  const a=ATIVOS.find(x=>x.placa===p);
  document.getElementById('mPlacaHint').textContent=a?`${a.filial} · ${a.projeto} · ${a.tipo} · ${a.modelo}`:(p?'placa fora da base de ativos (segue valendo)':'');
}
function openModal(id,placa){
  EDIT_ID=id||null;
  const e=id?EVENTS.find(x=>x.id===id):null;
  document.getElementById('mTitle').textContent=id?'Editar indisponibilidade':'Nova indisponibilidade';
  document.getElementById('mPlaca').value=e?e.placa:(placa||'');
  document.getElementById('mParada').value=e?e.data_parada:hojeBRT();
  document.getElementById('mGrupo').value=e&&e.grupo?e.grupo:'CORRETIVA';
  document.getElementById('mLocal').value=e&&e.local_manutencao?e.local_manutencao:'EXTERNO';
  document.getElementById('mDesc').value=e?(e.descricao_problema||''):'';
  document.getElementById('mRcoc').value=e?(e.rc_oc||''):'';
  document.getElementById('mPrev').value=e?(e.previsao_retorno||''):'';
  document.getElementById('mStatus').value=e&&e.status?e.status:'Em execução';
  document.getElementById('mRetorno').value=e?(e.data_retorno||''):'';
  document.getElementById('mObs').value=e?(e.observacao||''):'';
  document.getElementById('mDel').style.display=id?'':'none';
  fillPlacasList(); placaHint();
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){document.getElementById('modalBg').classList.remove('open');EDIT_ID=null;}

async function saveModal(){
  const placa=normP(document.getElementById('mPlaca').value);
  const parada=document.getElementById('mParada').value;
  if(!placa){alert('Informe a placa.');return;}
  if(!parada){alert('Informe a data da parada.');return;}
  const a=ATIVOS.find(x=>x.placa===placa);
  const payload={
    unidade:UNIT,
    unidade_nome:a?normU(a.filial):null,
    projeto:a?a.projeto:null,
    placa,
    modelo:a?a.modelo:null,
    tipo_veiculo:a?a.tipo:null,
    grupo:document.getElementById('mGrupo').value,
    local_manutencao:document.getElementById('mLocal').value,
    descricao_problema:document.getElementById('mDesc').value.trim()||null,
    rc_oc:document.getElementById('mRcoc').value.trim()||null,
    data_parada:parada,
    previsao_retorno:document.getElementById('mPrev').value||null,
    data_retorno:document.getElementById('mRetorno').value||null,
    status:document.getElementById('mStatus').value,
    observacao:document.getElementById('mObs').value.trim()||null
  };
  if(!EDIT_ID){
    const jaAberta=abertos().some(e=>normP(e.placa)===placa);
    if(jaAberta&&!confirm('Já existe uma indisponibilidade ABERTA para esta placa. Criar outra mesmo assim?'))return;
  }
  const btn=document.getElementById('mSave');btn.disabled=true;
  try{
    if(EDIT_ID){const {error}=await sb.from('indisponibilidade').update(payload).eq('id',EDIT_ID);if(error)throw error;}
    else{const {error}=await sb.from('indisponibilidade').insert(payload);if(error)throw error;}
    closeModal(); await loadEvents(); render();
  }catch(e){alert('Erro ao salvar: '+(e.message||e));}
  btn.disabled=false;
}
async function delModal(){
  if(!EDIT_ID)return;
  if(!confirm('Excluir este registro? (use só para lançamento errado — se o veículo voltou, feche com a data de retorno)'))return;
  try{
    const {error}=await sb.from('indisponibilidade').delete().eq('id',EDIT_ID);if(error)throw error;
    closeModal(); await loadEvents(); render();
  }catch(e){alert('Erro ao excluir: '+(e.message||e));}
}
async function fecharEvento(id){
  const e=EVENTS.find(x=>x.id===id);if(!e)return;
  const d=prompt('Data do retorno (AAAA-MM-DD):',hojeBRT());
  if(!d)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){alert('Data inválida.');return;}
  try{
    const {error}=await sb.from('indisponibilidade').update({data_retorno:d}).eq('id',id);if(error)throw error;
    await loadEvents(); render();
  }catch(err){alert('Erro: '+(err.message||err));}
}
async function confirmarDia(){
  try{
    const {error}=await sb.from('disp_checkins').insert({
      unidade:UNIT, data:hojeBRT(),
      nome:PROFILE&&PROFILE.nome?PROFILE.nome:(USER.email||'').split('@')[0],
      n_indisponiveis:abertos().length
    });
    if(error)throw error;
    await loadCheckins(); render();
  }catch(e){alert('Erro ao confirmar: '+(e.message||e));}
}

// ── troca de unidade ──
async function setUnit(u){
  UNIT=u;
  set('status-badge','Carregando '+u+'…');
  try{ await loadEvents(); await loadCheckins(); render();
    set('status-badge',`${u} · atualizado ${new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`);
  }catch(e){ set('status-badge','Erro ao carregar'); console.error(e); }
}

document.getElementById('mCancel').addEventListener('click',closeModal);
document.getElementById('mSave').addEventListener('click',saveModal);
document.getElementById('mDel').addEventListener('click',delModal);
document.getElementById('mPlaca').addEventListener('input',placaHint);
document.getElementById('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});

function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);document.getElementById('themeBtn').textContent=t==='light'?'🌙':'☀';}
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));
applyTheme(localStorage.getItem('bi_theme')||'dark');

async function initApp(){
  try{ sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){ gate('⚠️','Erro','<p>Falha ao iniciar o Supabase.</p>'); return; }
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ gate('🔒','Login necessário','<p>Entre pelo hub para continuar.</p><a class="btn" href="../index.html">Ir para o hub</a>'); return; }
  USER=session.user;
  const {data:prof,error}=await sb.from('fca_profiles').select('nome,unidade,is_admin').eq('user_id',USER.id).maybeSingle();
  if(error){
    if(/does not exist|find the table|schema cache/i.test(error.message||''))gate('🛠️','Banco não configurado','<p>Rode <code>scripts/disponibilidade-supabase.sql</code> no Supabase primeiro.</p>');
    else gate('⚠️','Erro',`<p>${esc(error.message)}</p>`);
    return;
  }
  PROFILE=prof||{}; ADMIN=!!PROFILE.is_admin;
  MY_UNITS=ADMIN?ALL_UNITS.slice():String(PROFILE.unidade||'').toUpperCase().split(',').map(s=>s.trim()).filter(Boolean);
  if(!MY_UNITS.length){ gate('⛔','Sem acesso','<p>Seu perfil não tem unidade vinculada. Peça o acesso no Gerenciar Acessos do hub.</p><a class="btn ghost" href="../index.html">← Hub</a>'); return; }

  document.getElementById('content').innerHTML='<div class="loading">Carregando frota…</div>';
  try{ await loadAtivos(); }
  catch(e){ gate('⚠️','Erro ao carregar ativos',`<p>${esc(e.message||e)}</p>`); return; }

  if(MY_UNITS.length>1){
    const sel=document.getElementById('uniSel');
    sel.style.display='';
    sel.innerHTML=MY_UNITS.map(u=>`<option value="${u}">${u}</option>`).join('');
    sel.onchange=()=>setUnit(sel.value);
  }
  await setUnit(MY_UNITS[0]);
}
initApp();
</script>
<script src="../assets/mobile.js"></script>
</body>
