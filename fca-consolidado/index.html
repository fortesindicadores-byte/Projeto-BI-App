<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="build" content="202608072300">
<title>FCA · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/gantt-view.js?v=202608072300"></script>
<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;order:1;min-width:160px;}.brand h1{font-size:16px;font-weight:700;color:var(--orange);line-height:1.1;}.brand p{font-size:10px;color:var(--text2);margin-top:2px;}
.brand-eyebrow{display:none;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.header-filters{flex-basis:100%;order:3;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
.hfilter{display:flex;flex-direction:column;gap:3px;}
.hfilter>label{display:none;}
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:130px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;text-align:left;}
.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:4px;min-width:230px;max-height:320px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-search{padding:7px 10px;border-bottom:1px solid #1e2d40;flex-shrink:0;}
.ms-search input{width:100%;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:11px;outline:none;}
.ms-list{overflow-y:auto;flex:1;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-only{margin-left:auto;font-size:8px;color:var(--orange);padding:1px 6px;border-radius:3px;cursor:pointer;opacity:0;transition:opacity .12s;flex-shrink:0;}
.ms-opt:hover .ms-only{opacity:1;}.ms-only:hover{background:rgba(249,115,22,.2);}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all-opt{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input[type=checkbox]{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.35);border-radius:4px;padding:6px 11px;cursor:pointer;color:var(--orange);font-family:'Montserrat',sans-serif;font-weight:700;font-size:11px;display:flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;}
.btn:hover{background:rgba(249,115,22,.3);}
.btn.ghost{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--text2);}
.btn.ghost:hover{background:rgba(255,255,255,.1);color:var(--text);}
.btn.theme{padding:6px 8px;}
.saved-msg{font-size:11px;font-weight:700;color:var(--green);align-self:center;opacity:0;transition:opacity .2s;}
.saved-msg.show{opacity:1;}
.saved-msg.err{color:var(--red);}
.main{padding:20px 24px 60px;}
.intro{font-size:12px;color:var(--text2);margin-bottom:16px;line-height:1.5;}
.intro b{color:var(--text);}
.loading{text-align:center;color:var(--text3);padding:50px;font-size:14px;}

/* ── Gate (telas de acesso) ── */
.gate{max-width:520px;margin:80px auto;text-align:center;background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:38px 34px;backdrop-filter:blur(16px);box-shadow:0 2px 18px rgba(0,0,0,.3);}
.gate .ic{font-size:38px;margin-bottom:14px;}
.gate h2{font-size:18px;font-weight:800;color:var(--text);margin-bottom:10px;}
.gate p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px;}
.gate code{background:rgba(249,115,22,.14);color:var(--orange);padding:2px 7px;border-radius:5px;font-size:12px;}
.gate .btn{display:inline-flex;}

/* ── Resumo ── */
.summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.scard{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px 18px;min-width:120px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.scard .sval{font-size:26px;font-weight:800;line-height:1;}
.scard .slbl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-top:5px;}
.scard.tot .sval{color:var(--orange);}
.scard.con .sval{color:var(--green);}
.scard.and .sval{color:var(--amber);}
.scard.nao .sval{color:var(--red);}
.scard.can .sval{color:var(--text3);}

/* ── Tabela consolidada ── */
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:6px 4px 12px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
table.cons{width:100%;border-collapse:collapse;font-size:12px;min-width:1180px;}
table.cons thead th{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:10px 8px 8px;border-bottom:1px solid rgba(255,255,255,.10);white-space:nowrap;position:sticky;top:var(--hh,0px);background:rgba(15,20,30,.96);z-index:2;}
table.cons td{padding:7px 8px;vertical-align:top;border-top:1px solid rgba(255,255,255,.05);}
table.cons tbody tr:hover{background:rgba(255,255,255,.025);}
.c-uni{font-weight:800;color:var(--text);white-space:nowrap;}
.c-vig,.c-org{color:var(--text2);white-space:nowrap;}
.org-tag{display:inline-block;background:rgba(56,189,248,.16);color:var(--blue);border-radius:4px;padding:1px 7px;font-weight:800;font-size:9.5px;letter-spacing:.6px;}
.org-tag.cst{background:rgba(249,115,22,.18);color:var(--orange);}
.c-fato{font-weight:700;color:var(--text);max-width:220px;}
.c-fato small{display:block;font-weight:600;color:var(--text3);font-size:10px;margin-top:2px;white-space:normal;}
.c-fato .fato-edit{font-weight:700;}
.c-fato .desv-edit{font-weight:600;color:var(--text3);font-size:11px;margin-top:4px;min-height:30px;}
.c-proj{color:var(--text2);max-width:120px;white-space:normal;}
.cons input,.cons textarea,.cons select{background:#0a0f18;border:1px solid #2a3a50;border-radius:6px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:12px;padding:6px 8px;outline:none;width:100%;min-height:34px;}
.cons input:focus,.cons textarea:focus,.cons select:focus{border-color:var(--orange);}
.cons textarea{resize:none;overflow:hidden;line-height:1.4;display:block;}
.cons select option{background:#0f1824;color:#fff;}
.col-causa,.col-acao{min-width:250px;}
.col-acomp{min-width:130px;}
.col-resp{min-width:90px;}
.col-prazo{min-width:115px;}
.col-status{min-width:120px;}
.col-acts{width:52px;}
.acts{display:flex;flex-direction:column;gap:4px;align-items:stretch;}
select.st[data-v="Concluída"]{background:#3BB33B;color:#fff;border-color:#3BB33B;}
select.st[data-v="Em andamento"]{background:#F4A100;color:#0C1017;border-color:#F4A100;font-weight:700;}
select.st[data-v="Não iniciada"]{background:#FF6666;color:#0C1017;border-color:#FF6666;font-weight:700;}
select.st[data-v="Cancelada"]{background:#333333;color:#fff;border-color:#333333;}
.lock-btn{background:transparent;border:none;font-size:17px;line-height:1;cursor:pointer;padding:6px 4px;border-radius:5px;opacity:.45;}
.lock-btn.on{opacity:1;}
.lock-btn:hover{background:rgba(255,255,255,.08);}
.acts .lock-btn{padding:3px 0;font-size:15px;width:100%;border-radius:5px;}
.mini-add{background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.30);color:var(--orange);font-family:'Montserrat',sans-serif;font-size:10px;font-weight:700;border-radius:5px;padding:4px 0;cursor:pointer;white-space:nowrap;width:100%;}
.mini-add:hover{background:rgba(249,115,22,.28);}
.mini-del{background:rgba(255,102,102,.10);border:1px solid rgba(255,102,102,.30);color:var(--red);font-size:11px;font-weight:700;line-height:1;border-radius:5px;padding:5px 0;cursor:pointer;width:100%;}
.mini-del:hover{background:rgba(255,102,102,.25);}
.cell-saving{outline:2px solid rgba(249,115,22,.5)!important;}
.empty{text-align:center;color:var(--text2);padding:40px;}

/* modo claro (cinza translúcido) */
body.light-mode{background:#F0F0F0;}
body.light-mode .main{--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);}
body.light-mode .tbl-section,body.light-mode .scard,body.light-mode .gate{background:rgba(128,128,128,.14)!important;border:none!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#666666;}
body.light-mode table.cons thead th{border-bottom-color:rgba(0,0,0,.12);background:rgba(225,225,225,.96);}
body.light-mode table.cons td{border-top-color:rgba(0,0,0,.07);}
body.light-mode .cons input,body.light-mode .cons textarea,body.light-mode .cons select{background:#fff;border-color:#ccc;color:#1a1a1a;}
body.light-mode select.st[data-v="Concluída"]{background:#3BB33B;color:#fff;}
body.light-mode select.st[data-v="Em andamento"]{background:#F4A100;color:#0C1017;}
body.light-mode select.st[data-v="Não iniciada"]{background:#FF6666;color:#0C1017;}
body.light-mode select.st[data-v="Cancelada"]{background:#333333;color:#fff;}

/* ── Kanban ── */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
.kcol{background:rgba(20,27,38,.55);border:1px solid var(--border);border-radius:10px;min-height:120px;display:flex;flex-direction:column;overflow:hidden;}
.kcol.kover{border-color:var(--orange);background:rgba(249,115,22,.06);}
.kcol-head{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.kcol-head.nao{background:var(--red);color:#0C1017;}
.kcol-head.and{background:#F4A100;color:#0C1017;}
.kcol-head.con{background:var(--green);color:#fff;}
.kcount{background:rgba(0,0,0,.22);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:700;}
.kcol-body{padding:10px;display:flex;flex-direction:column;gap:9px;}
.kempty{color:var(--text3);text-align:center;padding:14px 0;font-size:12px;}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 11px;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.kcard:active{cursor:grabbing;}
.kcard.dragging{opacity:.4;}
.kcard-top{font-size:10px;color:var(--text2);margin-bottom:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.korg{font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:4px;}
.korg.rpm{background:rgba(56,189,248,.18);color:#38BDF8;}
.korg.cst{background:rgba(249,115,22,.18);color:var(--orange);}
.kcard-fato{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.25;}
.kcard-ac{font-size:11.5px;color:var(--text2);margin-top:5px;line-height:1.3;}
.kcard-meta{font-size:10px;color:var(--text2);margin-top:7px;}
.kcard-meta .dim{color:var(--text3);}
.kbadge{font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;margin-left:6px;}
.kbadge.venc{background:rgba(255,102,102,.18);color:var(--red);}
.kbadge.ok{background:rgba(59,179,59,.18);color:var(--green);}
.kbadge.sem{background:rgba(148,163,184,.15);color:var(--text2);}
.kdays{font-size:8.5px;font-weight:800;margin-left:6px;letter-spacing:.3px;white-space:nowrap;}
.kdays.venc{color:var(--red);}
.kdays.ok{color:var(--text2);}
body.light-mode .kcol{background:#fff;border-color:rgba(0,0,0,.10);}
body.light-mode .kcard{background:#F7F7F7;border-color:rgba(0,0,0,.10);}

/* ── Mobile: vira card empilhado ── */
@media(max-width:760px){
  .kanban{grid-template-columns:1fr;}
  .main{padding:16px;}
  .tbl-section{overflow-x:visible;}
  table.cons,table.cons thead,table.cons tbody,table.cons tr,table.cons td{display:block;width:100%;min-width:0;}
  table.cons thead{display:none;}
  table.cons tbody tr{border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:8px;margin-bottom:10px;position:relative;}
  body.light-mode table.cons tbody tr{border-color:rgba(0,0,0,.12);}
  table.cons td{padding:5px 0;border-top:none;}
  .col-causa,.col-acao,.col-resp,.col-prazo,.col-status,.col-acomp,.c-fato,.c-proj{min-width:0;max-width:none;}
  .cell-label{display:block;font-size:9.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .col-acts{width:auto;}
  .col-acts .acts{flex-direction:row;flex-wrap:wrap;}
  .col-acts .lock-btn,.col-acts .mini-add,.col-acts .mini-del{width:auto;padding:5px 10px;}
}
.cell-label{display:none;}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><h1>FCA · Admin</h1><p>Todas as unidades — editar qualquer ação</p></div>
  <div class="header-right">
    <span class="saved-msg" id="savedMsg">Salvo ✓</span>
    <button class="btn" id="viewBtn" onclick="toggleView()" title="Alternar entre Tabela e Kanban">Tabela</button>

    <button class="btn" id="genAllBtn" title="Gera os desvios de CUSTOS (DRE) do último mês — todas as unidades, vazios p/ preencher (aditivo)" onclick="if(confirm('Gerar os desvios de CUSTOS do último mês (todas as unidades)?\n\nAditivo: só adiciona o que ainda não existe (não apaga, não duplica). As unidades preenchem causa/ação no painel.'))location.href='../fca-preenchimento/?gen=all';">Gerar Custos</button>
    <button class="btn" id="syncRpmBtn" title="Gera os desvios de RPM (IC e IV que desviaram) da Base RPM — vazios p/ preencher (aditivo)" onclick="if(confirm('Gerar os desvios de RPM da Base RPM?\n\nTraz IC e IV que desviaram, vazios, para as unidades preencherem no painel.\n\nAditivo: só adiciona o que ainda não existe (não apaga nem sobrescreve o que já foi preenchido).'))location.href='../fca-preenchimento/?sync=rpm';">Gerar RPM</button>
    <button class="btn theme" id="themeBtn" title="Modo claro/escuro">☀</button>
    <a class="btn ghost" href="../fca-preenchimento/" title="Voltar às unidades">← Unidades</a>
    <a class="btn ghost" href="../index.html" title="Voltar ao hub">← Hub</a>
    <button class="btn ghost" id="logoutBtn" title="Sair">Sair</button>
  </div>
  <div class="header-filters">
    <div class="hfilter"><label>Unidade</label><div class="ms-wrap" id="ms-uni"><button class="ms-btn" onclick="toggleMs('ms-uni')"><span class="ms-lbl">Unidade</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="hfilter"><label>Vigência</label><div class="ms-wrap" id="ms-vig"><button class="ms-btn" onclick="toggleMs('ms-vig')"><span class="ms-lbl">Vigência</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="hfilter"><label>Projeto</label><div class="ms-wrap" id="ms-proj"><button class="ms-btn" onclick="toggleMs('ms-proj')"><span class="ms-lbl">Projeto</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="hfilter"><label>Origem</label><div class="ms-wrap" id="ms-org"><button class="ms-btn" onclick="toggleMs('ms-org')"><span class="ms-lbl">Origem</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="hfilter"><label>Fato</label><div class="ms-wrap" id="ms-fato"><button class="ms-btn" onclick="toggleMs('ms-fato')"><span class="ms-lbl">Fato</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="hfilter"><label>Status</label><div class="ms-wrap" id="ms-st"><button class="ms-btn" onclick="toggleMs('ms-st')"><span class="ms-lbl">Status</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="hfilter"><label>Status Prazo</label><div class="ms-wrap" id="ms-prazo"><button class="ms-btn" onclick="toggleMs('ms-prazo')"><span class="ms-lbl">Status Prazo</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="hfilter"><label>Causa</label><div class="ms-wrap" id="ms-causa"><button class="ms-btn" onclick="toggleMs('ms-causa')"><span class="ms-lbl">Causa</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="hfilter"><label>Ação</label><div class="ms-wrap" id="ms-acao"><button class="ms-btn" onclick="toggleMs('ms-acao')"><span class="ms-lbl">Ação</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  </div>
</header>
<main class="main">
  <div id="content"><div class="loading">Verificando acesso…</div></div>
</main>
<script>
// ── Supabase (mesmo projeto do hub/auth) ──
const SUPABASE_URL='https://lozwipoeacpvplgkrxkq.supabase.co';
const SUPABASE_KEY='sb_publishable_ggKEEebc5zjgQDVsF92Upw_6uoLmKe9';
let sb=null, SESSION=null, PROFILE=null;
let _ROWS=[];                 // todos os registros (1 por ação)
const CACHE_KEY='fca_cache_all';
// Km/L e Preço R$/L entram como CAUSA do Custo Combustível — não devem aparecer como fato/ação própria.
function isDriverCombust(fato){
  const s=String(fato||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
  if(/km\s*\/?\s*l/.test(s)) return true;
  if(/r\$\s*\/?\s*l/.test(s)) return true;

// Status do prazo pela data de vencimento: concluída/cancelada não vence; sem prazo à parte.
function prazoState(r){
  const st=String(r.status||DEFAULT_STATUS);

  if(!r.prazo) return 'Sem prazo';
  const d=new Date(String(r.prazo).slice(0,10)+'T00:00:00'); if(isNaN(d)) return 'Sem prazo';

    '<div class="kmodal-row"><div><label>Responsável</label><input id="km-resp" type="text"></div><div><label>Prazo</label><input id="km-prazo" type="date"></div></div>'+
    '<div class="kmodal-row"><div><label>Status</label><select id="km-status">'+_KM_STS.map(s=>'<option>'+s+'</option>').join('')+'</select></div><div><label>Acompanhamento</label><input id="km-acomp" type="text"></div></div>'+
    '<div class="kmodal-foot"><button class="btn ghost" onclick="closeKModal()">Fechar</button></div>'+
  '</div>';
  d.addEventListener('click',e=>{if(e.target===d)closeKModal();});
  document.body.appendChild(d);
  ['km-causa','km-acao','km-resp','km-prazo','km-status','km-acomp'].forEach(id=>{const el=document.getElementById(id);if(el)el.addEventListener('change',persistKModal);});
}
function openKModal(id){
  const r=_ROWS.find(x=>String(x.id)===String(id));if(!r)return;ensureKModal();_kmId=r.id;
  document.getElementById('km-fato').textContent=_firstLine(r.fato)||'—';
  document.getElementById('km-ctx').textContent=[r.origem,r.unidade,projLabel(r.projeto),r.vigencia].filter(Boolean).join(' · ');
  document.getElementById('km-causa').value=r.causa||'';
  document.getElementById('km-acao').value=r.acao||'';
  document.getElementById('km-resp').value=r.responsavel||'';
  document.getElementById('km-prazo').value=r.prazo?String(r.prazo).slice(0,10):'';
  document.getElementById('km-status').value=r.status||DEFAULT_STATUS;
  document.getElementById('km-acomp').value=r.acompanhamento||'';
  document.getElementById('kmodal-ov').style.display='flex';
}
function closeKModal(){const m=document.getElementById('kmodal-ov');if(m)m.style.display='none';_kmId=null;}
async function persistKModal(){
  const id=_kmId,r=_ROWS.find(x=>String(x.id)===String(id));if(!r)return;
  const upd={causa:document.getElementById('km-causa').value||null,acao:document.getElementById('km-acao').value||null,
    responsavel:document.getElementById('km-resp').value||null,prazo:document.getElementById('km-prazo').value||null,
    status:document.getElementById('km-status').value,acompanhamento:document.getElementById('km-acomp').value||null};
  Object.assign(r,upd);render();
  const {error}=await sb.from('fca').update(upd).eq('id',id);
  if(error){flash('Erro ao salvar',true);return;}
  writeCache(CACHE_KEY,_ROWS);flash('Salvo ✓');
}
// Listeners FIXOS no #content (event delegation) — montados 1x; sobrevivem às trocas de innerHTML
function wireDelegation(){
  const c=document.getElementById('content');
  // Kanban drag-and-drop (arrastar card entre buckets muda o status)
  c.addEventListener('dragstart',e=>{const card=e.target.closest&&e.target.closest('.kcard');if(card){e.dataTransfer.setData('text/plain',card.dataset.id);e.dataTransfer.effectAllowed='move';card.classList.add('dragging');}});
  c.addEventListener('dragend',e=>{const card=e.target.closest&&e.target.closest('.kcard');if(card)card.classList.remove('dragging');});
  c.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(col){e.preventDefault();e.dataTransfer.dropEffect='move';col.classList.add('kover');}});
  c.addEventListener('dragleave',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(col)col.classList.remove('kover');});
  c.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col)return;e.preventDefault();col.classList.remove('kover');const id=e.dataTransfer.getData('text/plain');if(id&&col.dataset.status)moveCard(id,col.dataset.status);});
  c.addEventListener('input',e=>{const ta=e.target;if(ta.tagName==='TEXTAREA')autoResize(ta);});
  c.addEventListener('focusout',e=>{const el=e.target;if(el.matches&&el.matches('textarea[data-col],input[type=text][data-col]')){const tr=el.closest('tr');if(tr)saveField(el,tr.dataset.id,el.dataset.col);}});
  c.addEventListener('change',e=>{const el=e.target;if(!el.matches)return;
    if(el.matches('select.st')){el.dataset.v=el.value;const tr=el.closest('tr');if(tr)saveField(el,tr.dataset.id,'status');}
    else if(el.matches('input[type=date][data-col]')){const tr=el.closest('tr');if(tr)saveField(el,tr.dataset.id,'prazo');}});
  c.addEventListener('click',e=>{
    const gv=e.target.closest&&e.target.closest('.gv-row');
    if(gv&&gv.dataset.id){openKModal(gv.dataset.id);return;}
    const kcard=e.target.closest&&e.target.closest('.kcard');
    if(kcard){openKModal(kcard.dataset.id);return;}
    const add=e.target.closest&&e.target.closest('.mini-add');
    if(add){const tr=add.closest('tr');if(tr)addRow(tr.dataset.id,add.dataset.add==='acao');return;}
    const del=e.target.closest&&e.target.closest('.mini-del');
    if(del){const tr=del.closest('tr');if(tr)delRow(tr.dataset.id);return;}
    const b=e.target.closest&&e.target.closest('.lock-btn');if(b){const tr=b.closest('tr');if(tr)toggleLock(b,tr.dataset.id);}});
}

// ── Carregar TODOS os registros (RLS devolve tudo p/ admin) ──
// mescla unidades "(INATIVO)" na unidade base — nunca aparecem em painel/filtro
const _fixInativo=r=>{r.unidade=String(r.unidade||'').replace(/\s*\(INATIVO\)\s*/gi,' ').replace(/\s+/g,' ').trim();return r;};
async function carregar(){
  // 1) pinta na hora com o cache (se houver) — stale-while-revalidate
  const cached=readCache(CACHE_KEY);
  if(cached&&cached.length){ _ROWS=cached.filter(r=>!isDriverCombust(r.fato)).map(_fixInativo); popFiltros(); render(); }
  else document.getElementById('content').innerHTML='<div class="loading">Carregando ações de todas as unidades…</div>';
  // 2) revalida do Supabase em segundo plano
  const {data,error}=await sb.from('fca').select('*').order('unidade',{ascending:true}).order('vigencia',{ascending:false}).order('created_at',{ascending:true});
  if(error){
    if(cached&&cached.length) return;   // já tem cache na tela: ignora erro de rede
    if(/relation .*fca.* does not exist|could not find the table|schema cache/i.test(error.message||'')) gateSetup();
    else gateError(error.message);
    return;
  }
  _ROWS=(data||[]).filter(r=>!isDriverCombust(r.fato)).map(_fixInativo);
  writeCache(CACHE_KEY,_ROWS);
  popFiltros();
  render();
}

// ── Início: exige login + admin (mesmo fluxo do fca-preenchimento) ──
async function initApp(){
  try{ sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }
  catch(e){ gateError('Falha ao iniciar o cliente Supabase.'); return; }
  let session;
  try{ const r=await sb.auth.getSession(); session=r.data.session; }
  catch(e){ gateError('Falha ao verificar a sessão.'); return; }
  if(!session){ gateLogin(); return; }
  SESSION=session;
  const {data:prof,error:profErr}=await sb.from('fca_profiles').select('*').eq('user_id',session.user.id).maybeSingle();
  if(profErr){
    if(/relation .*fca_profiles.* does not exist|could not find the table|schema cache/i.test(profErr.message||'')) gateSetup();
    else gateError(profErr.message);
    return;
  }
  PROFILE=prof||{};
  if(!PROFILE.is_admin){ gateAdmin(); return; }
  carregar();
}
initApp();
