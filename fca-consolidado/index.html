<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FCA · Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;min-width:200px;}.brand h1{font-size:18px;font-weight:800;color:var(--orange);line-height:1.1;}.brand p{font-size:10px;color:var(--text2);margin-top:2px;font-style:italic;}
.brand-eyebrow{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:2px;}
.hfilter{display:flex;flex-direction:column;gap:2px;}
.hfilter label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:6px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:130px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;text-align:left;}
.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);right:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:6px;min-width:230px;max-height:320px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-search{padding:7px 10px;border-bottom:1px solid #1e2d40;flex-shrink:0;}
.ms-search input{width:100%;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:11px;outline:none;}
.ms-list{overflow-y:auto;flex:1;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all-opt{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input[type=checkbox]{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.35);border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--orange);font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.3);}
.btn.ghost{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--text2);}
.btn.ghost:hover{background:rgba(255,255,255,.1);color:var(--text);}
.btn.theme{padding:7px 9px;}
.saved-msg{font-size:11px;font-weight:700;color:var(--green);align-self:center;opacity:0;transition:opacity .2s;}
.saved-msg.show{opacity:1;}
.saved-msg.err{color:var(--red);}
.main{padding:20px 24px 60px;}
.intro{font-size:12px;color:var(--text2);margin-bottom:16px;line-height:1.5;}
.intro b{color:var(--text);}
.loading{text-align:center;color:var(--text3);padding:50px;font-size:14px;}

/* ── Gate (telas de acesso) ── */
.gate{max-width:520px;margin:80px auto;text-align:center;background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:38px 34px;backdrop-filter:blur(16px);box-shadow:0 2px 18px rgba(0,0,0,.3);}
.gate .ic{font-size:38px;margin-bottom:14px;}
.gate h2{font-size:18px;font-weight:800;color:var(--text);margin-bottom:10px;}
.gate p{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:18px;}
.gate code{background:rgba(249,115,22,.14);color:var(--orange);padding:2px 7px;border-radius:5px;font-size:12px;}
.gate .btn{display:inline-flex;}

/* ── Resumo ── */
.summary{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.scard{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px 18px;min-width:120px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.scard .sval{font-size:26px;font-weight:800;line-height:1;}
.scard .slbl{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;margin-top:5px;}
.scard.tot .sval{color:var(--orange);}
.scard.con .sval{color:var(--green);}
.scard.and .sval{color:var(--amber);}
.scard.nao .sval{color:var(--red);}
.scard.can .sval{color:var(--text3);}

/* ── Tabela consolidada ── */
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:6px 4px 12px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);overflow-x:auto;}
table.cons{width:100%;border-collapse:collapse;font-size:12px;min-width:1180px;}
table.cons thead th{font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:10px 8px 8px;border-bottom:1px solid rgba(255,255,255,.10);white-space:nowrap;position:sticky;top:0;background:rgba(15,20,30,.96);z-index:2;}
table.cons td{padding:7px 8px;vertical-align:top;border-top:1px solid rgba(255,255,255,.05);}
table.cons tbody tr:hover{background:rgba(255,255,255,.025);}
.c-uni{font-weight:800;color:var(--text);white-space:nowrap;}
.c-vig,.c-org{color:var(--text2);white-space:nowrap;}
.org-tag{display:inline-block;background:rgba(56,189,248,.16);color:var(--blue);border-radius:4px;padding:1px 7px;font-weight:800;font-size:9.5px;letter-spacing:.6px;}
.org-tag.cst{background:rgba(249,115,22,.18);color:var(--orange);}
.c-fato{font-weight:700;color:var(--text);max-width:200px;}
.c-fato small{display:block;font-weight:600;color:var(--text3);font-size:10px;margin-top:2px;white-space:normal;}
.c-proj{color:var(--text2);max-width:120px;white-space:normal;}
.cons input,.cons textarea,.cons select{background:#0a0f18;border:1px solid #2a3a50;border-radius:6px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:12px;padding:6px 8px;outline:none;width:100%;min-height:34px;}
.cons input:focus,.cons textarea:focus,.cons select:focus{border-color:var(--orange);}
.cons textarea{resize:none;overflow:hidden;line-height:1.4;display:block;}
.cons select option{background:#0f1824;color:#fff;}
.col-causa,.col-acao,.col-acomp{min-width:160px;}
.col-resp{min-width:110px;}
.col-prazo{min-width:130px;}
.col-status{min-width:130px;}
.col-lock{width:42px;text-align:center;}
select.st[data-v="Concluída"]{background:#3BB33B;color:#fff;border-color:#3BB33B;}
select.st[data-v="Em andamento"]{background:#F4A100;color:#0C1017;border-color:#F4A100;font-weight:700;}
select.st[data-v="Não iniciada"]{background:#FF6666;color:#0C1017;border-color:#FF6666;font-weight:700;}
select.st[data-v="Cancelada"]{background:#333333;color:#fff;border-color:#333333;}
.lock-btn{background:transparent;border:none;font-size:17px;line-height:1;cursor:pointer;padding:6px 4px;border-radius:5px;opacity:.45;}
.lock-btn.on{opacity:1;}
.lock-btn:hover{background:rgba(255,255,255,.08);}
.cell-saving{outline:2px solid rgba(249,115,22,.5)!important;}
.empty{text-align:center;color:var(--text2);padding:40px;}

/* modo claro (cinza translúcido) */
body.light-mode{background:#F0F0F0;}
body.light-mode .main{--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);}
body.light-mode .tbl-section,body.light-mode .scard,body.light-mode .gate{background:rgba(128,128,128,.14)!important;border:none!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#666666;}
body.light-mode table.cons thead th{border-bottom-color:rgba(0,0,0,.12);background:rgba(225,225,225,.96);}
body.light-mode table.cons td{border-top-color:rgba(0,0,0,.07);}
body.light-mode .cons input,body.light-mode .cons textarea,body.light-mode .cons select{background:#fff;border-color:#ccc;color:#1a1a1a;}
body.light-mode select.st[data-v="Concluída"]{background:#3BB33B;color:#fff;}
body.light-mode select.st[data-v="Em andamento"]{background:#F4A100;color:#0C1017;}
body.light-mode select.st[data-v="Não iniciada"]{background:#FF6666;color:#0C1017;}
body.light-mode select.st[data-v="Cancelada"]{background:#333333;color:#fff;}

/* ── Mobile: vira card empilhado ── */
@media(max-width:760px){
  .main{padding:16px;}
  .tbl-section{overflow-x:visible;}
  table.cons,table.cons thead,table.cons tbody,table.cons tr,table.cons td{display:block;width:100%;min-width:0;}
  table.cons thead{display:none;}
  table.cons tbody tr{border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:8px;margin-bottom:10px;position:relative;}
  body.light-mode table.cons tbody tr{border-color:rgba(0,0,0,.12);}
  table.cons td{padding:5px 0;border-top:none;}
  .col-causa,.col-acao,.col-resp,.col-prazo,.col-status,.col-acomp,.c-fato,.c-proj{min-width:0;max-width:none;}
  .cell-label{display:block;font-size:9.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .col-lock{position:absolute;top:4px;right:4px;width:auto;}
}
.cell-label{display:none;}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><div class="brand-eyebrow">Gestão em Movimento · BI Frota</div><h1>FCA · Admin</h1><p>todas as unidades — editar qualquer ação</p></div>
  <div class="hfilter"><label>Unidade</label><div class="ms-wrap" id="ms-uni"><button class="ms-btn" onclick="toggleMs('ms-uni')"><span class="ms-lbl">Todas</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  <div class="hfilter"><label>Vigência</label><div class="ms-wrap" id="ms-vig"><button class="ms-btn" onclick="toggleMs('ms-vig')"><span class="ms-lbl">Todas</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  <div class="hfilter"><label>Origem</label><div class="ms-wrap" id="ms-org"><button class="ms-btn" onclick="toggleMs('ms-org')"><span class="ms-lbl">Todas</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  <div class="hfilter"><label>Status</label><div class="ms-wrap" id="ms-st"><button class="ms-btn" onclick="toggleMs('ms-st')"><span class="ms-lbl">Todos</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  <span class="saved-msg" id="savedMsg">Salvo ✓</span>
  <a class="btn ghost" href="../index.html" title="Voltar ao hub">← Hub</a>
  <button class="btn theme" id="themeBtn" title="Modo claro/escuro">☀</button>
  <button class="btn ghost" id="logoutBtn" title="Sair">Sair</button>
</header>
<main class="main">
  <div id="content"><div class="loading">Verificando acesso…</div></div>
</main>
<script>
// ── Supabase (mesmo projeto do hub/auth) ──
const SUPABASE_URL='https://lozwipoeacpvplgkrxkq.supabase.co';
const SUPABASE_KEY='sb_publishable_ggKEEebc5zjgQDVsF92Upw_6uoLmKe9';
let sb=null, SESSION=null, PROFILE=null;
let _ROWS=[];                 // todos os registros (1 por ação)
const STATUS=['Não iniciada','Em andamento','Concluída','Cancelada'];
const DEFAULT_STATUS='Não iniciada';

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── Telas de gate ──
function gate(ic,title,html){
  document.getElementById('content').innerHTML=`<div class="gate"><div class="ic">${ic}</div><h2>${title}</h2>${html}</div>`;
}
function gateLogin(){gate('🔒','Login necessário','<p>Esta é a visão consolidada do FCA, restrita a administradores. Entre pelo hub para continuar.</p><a class="btn" href="../index.html">Ir para o hub</a>');}
function gateAdmin(){gate('⛔','Acesso restrito (somente admin)','<p>Sua conta está logada, mas não tem permissão de administrador. Fale com o responsável para liberar o acesso consolidado.</p><a class="btn ghost" href="../index.html">← Voltar ao hub</a>');}
function gateSetup(){gate('🛠️','Banco ainda não configurado','<p>As tabelas do FCA não foram encontradas. Rode o script <code>scripts/fca-supabase.sql</code> no Supabase primeiro.</p>');}
function gateError(msg){gate('⚠️','Não foi possível carregar',`<p>${esc(msg||'Erro inesperado ao consultar o Supabase.')}</p>`);}

// ── Multi-select (padrão Gestão em Movimento) ──
function syncBadge(w){const c=w.querySelector('.ms-cnt'),n=w._sel?w._sel.size:0;if(c){c.textContent=n;c.style.display=n?'':'none';}}
function _buildMs(w,getItems){
  if(!w)return; if(!(w._sel instanceof Set))w._sel=new Set();
  const sel=w._sel,list=w.querySelector('.ms-list'),srch=w.querySelector('.ms-search input');
  w._render=(q='')=>{const f=(q||'').toLowerCase(),items=getItems(),shown=items.filter(v=>String(v).toLowerCase().includes(f)),all=sel.size===0;
    list.innerHTML=(!q?`<label class="ms-opt all-opt"><input type="checkbox" class="ms-all" ${all?'checked':''}> Todos</label>`:'')+shown.map(v=>`<label class="ms-opt"><input type="checkbox" data-v="${esc(v)}" ${all||sel.has(v)?'checked':''}> ${esc(v)}</label>`).join('');syncBadge(w);};
  list.addEventListener('change',e=>{const b=e.target;if(b.classList.contains('ms-all')){sel.clear();}else if(sel.size===0){if(!b.checked)getItems().forEach(v=>{if(v!==b.dataset.v)sel.add(v);});}else{if(b.checked)sel.add(b.dataset.v);else sel.delete(b.dataset.v);const a=getItems();if(a.length&&a.every(v=>sel.has(v)))sel.clear();}w._render(srch.value);render();});
  srch.addEventListener('input',()=>w._render(srch.value));srch.addEventListener('click',e=>e.stopPropagation());
  w._render();
}
function toggleMs(id){document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p.closest('.ms-wrap').id!==id)p.classList.remove('open');});const p=document.querySelector('#'+id+' .ms-panel');if(p)p.classList.toggle('open');}
function getMsValues(id){const w=document.getElementById(id);return w&&w._sel?[...w._sel]:[];}

let UNI_OPTS=[],VIG_OPTS=[],ORG_OPTS=[],ST_OPTS=[];
function popFiltros(){
  UNI_OPTS=[...new Set(_ROWS.map(r=>r.unidade).filter(Boolean))].sort();
  VIG_OPTS=[...new Set(_ROWS.map(r=>r.vigencia).filter(Boolean))].sort();
  ORG_OPTS=[...new Set(_ROWS.map(r=>r.origem).filter(Boolean))].sort();
  ST_OPTS=[...new Set(_ROWS.map(r=>r.status||DEFAULT_STATUS))].sort();
  [['ms-uni',()=>UNI_OPTS],['ms-vig',()=>VIG_OPTS],['ms-org',()=>ORG_OPTS],['ms-st',()=>ST_OPTS]].forEach(([id])=>{const w=document.getElementById(id);if(w&&w._render)w._render('');});
}

function autoResize(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}

// ── Auto-save de um campo (admin: RLS permite update em qualquer linha) ──
async function saveField(el,id,col){
  if(!id)return;
  const val=el.value;
  el.classList.add('cell-saving');
  const {error}=await sb.from('fca').update({[col]:(col==='prazo'&&!val)?null:val}).eq('id',id);
  el.classList.remove('cell-saving');
  if(error){flash('Erro ao salvar',true);console.error('update',col,error);return;}
  const row=_ROWS.find(r=>r.id===id);if(row)row[col]=val;
  flash('Salvo ✓');
}
async function toggleLock(btn,id){
  const row=_ROWS.find(r=>r.id===id);if(!row)return;
  const nv=!row.locked;
  const {error}=await sb.from('fca').update({locked:nv}).eq('id',id);
  if(error){flash('Erro ao salvar',true);console.error('lock',error);return;}
  row.locked=nv;btn.classList.toggle('on',nv);btn.textContent=nv?'🔒':'🔓';btn.title=nv?'Travado (clique p/ destravar)':'Destravado (clique p/ travar)';
  flash('Salvo ✓');
}
let _flashT=null;
function flash(msg,err){const m=document.getElementById('savedMsg');m.textContent=msg;m.classList.toggle('err',!!err);m.classList.add('show');clearTimeout(_flashT);_flashT=setTimeout(()=>m.classList.remove('show'),2000);}

function summaryHTML(rows){
  const by=s=>rows.filter(r=>(r.status||DEFAULT_STATUS)===s).length;
  return `<div class="summary">
    <div class="scard tot"><div class="sval">${rows.length}</div><div class="slbl">Total de ações</div></div>
    <div class="scard con"><div class="sval">${by('Concluída')}</div><div class="slbl">Concluídas</div></div>
    <div class="scard and"><div class="sval">${by('Em andamento')}</div><div class="slbl">Em andamento</div></div>
    <div class="scard nao"><div class="sval">${by('Não iniciada')}</div><div class="slbl">Não iniciadas</div></div>
    <div class="scard can"><div class="sval">${by('Cancelada')}</div><div class="slbl">Canceladas</div></div>
  </div>`;
}
function rowHTML(r){
  const st=r.status||DEFAULT_STATUS;
  const opts=STATUS.map(s=>`<option ${st===s?'selected':''}>${esc(s)}</option>`).join('');
  const org=String(r.origem||'').toUpperCase()==='CUSTOS'?'cst':'';
  return `<tr data-id="${esc(r.id)}">
    <td class="c-uni"><span class="cell-label">Unidade</span>${esc(r.unidade)}</td>
    <td class="c-vig"><span class="cell-label">Vigência</span>${esc(r.vigencia)}</td>
    <td class="c-org"><span class="cell-label">Origem</span><span class="org-tag ${org}">${esc(r.origem)}</span></td>
    <td class="c-fato"><span class="cell-label">Fato</span>${esc(r.fato)}${r.fato_desvio?`<small>${esc(r.fato_desvio)}</small>`:''}</td>
    <td class="c-proj"><span class="cell-label">Projeto</span>${esc(r.projeto||'—')}</td>
    <td class="col-causa"><span class="cell-label">Causa</span><textarea rows="1" data-col="causa">${esc(r.causa)}</textarea></td>
    <td class="col-acao"><span class="cell-label">Ação</span><textarea rows="1" data-col="acao">${esc(r.acao)}</textarea></td>
    <td class="col-resp"><span class="cell-label">Responsável</span><input type="text" data-col="responsavel" value="${esc(r.responsavel)}"></td>
    <td class="col-prazo"><span class="cell-label">Prazo</span><input type="date" data-col="prazo" value="${esc(r.prazo)}"></td>
    <td class="col-status"><span class="cell-label">Status</span><select class="st" data-col="status" data-v="${esc(st)}">${opts}</select></td>
    <td class="col-acomp"><span class="cell-label">Acompanhamento</span><textarea rows="1" data-col="acompanhamento">${esc(r.acompanhamento)}</textarea></td>
    <td class="col-lock"><span class="cell-label">Trava</span><button class="lock-btn ${r.locked?'on':''}" title="${r.locked?'Travado (clique p/ destravar)':'Destravado (clique p/ travar)'}">${r.locked?'🔒':'🔓'}</button></td>
  </tr>`;
}
function render(){
  const c=document.getElementById('content');
  if(!_ROWS.length){c.innerHTML=summaryHTML([])+'<div class="tbl-section"><div class="empty">Nenhuma ação cadastrada ainda. Assim que as unidades preencherem o FCA, os registros aparecem aqui.</div></div>';return;}
  const fu=getMsValues('ms-uni'),fv=getMsValues('ms-vig'),fo=getMsValues('ms-org'),fs=getMsValues('ms-st');
  const vis=_ROWS.filter(r=>(!fu.length||fu.includes(r.unidade))&&(!fv.length||fv.includes(r.vigencia))&&(!fo.length||fo.includes(r.origem))&&(!fs.length||fs.includes(r.status||DEFAULT_STATUS)));
  let body;
  if(!vis.length){body='<div class="tbl-section"><div class="empty">Nenhuma ação para os filtros selecionados.</div></div>';}
  else{body=`<div class="tbl-section"><table class="cons">
    <thead><tr><th>Unidade</th><th>Vigência</th><th>Origem</th><th>Fato</th><th>Projeto</th><th>Causa</th><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Status</th><th>Acompanhamento</th><th>🔒</th></tr></thead>
    <tbody>${vis.map(rowHTML).join('')}</tbody></table></div>`;}
  c.innerHTML=summaryHTML(vis)+body;
  wireTable();
}
function wireTable(){
  const c=document.getElementById('content');
  c.querySelectorAll('textarea').forEach(autoResize);
  c.querySelectorAll('textarea').forEach(ta=>ta.addEventListener('input',()=>autoResize(ta)));
  // auto-save no blur (texto) e change (select/date)
  c.querySelectorAll('textarea[data-col],input[data-col]').forEach(el=>{
    el.addEventListener('blur',()=>{const tr=el.closest('tr');saveField(el,tr.dataset.id,el.dataset.col);});
  });
  c.querySelectorAll('select.st').forEach(sel=>{
    sel.addEventListener('change',()=>{sel.dataset.v=sel.value;const tr=sel.closest('tr');saveField(sel,tr.dataset.id,'status');});
  });
  c.querySelectorAll('input[type=date][data-col]').forEach(d=>{
    d.addEventListener('change',()=>{const tr=d.closest('tr');saveField(d,tr.dataset.id,'prazo');});
  });
  c.querySelectorAll('.lock-btn').forEach(b=>{
    b.addEventListener('click',()=>{const tr=b.closest('tr');toggleLock(b,tr.dataset.id);});
  });
}

// ── Carregar TODOS os registros (RLS devolve tudo p/ admin) ──
async function carregar(){
  document.getElementById('content').innerHTML='<div class="loading">Carregando ações de todas as unidades…</div>';
  const {data,error}=await sb.from('fca').select('*').order('unidade',{ascending:true}).order('vigencia',{ascending:false}).order('created_at',{ascending:true});
  if(error){
    if(/relation .*fca.* does not exist|could not find the table|schema cache/i.test(error.message||'')) gateSetup();
    else gateError(error.message);
    return;
  }
  _ROWS=data||[];
  popFiltros();
  render();
}

// tema
function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);document.getElementById('themeBtn').textContent=t==='light'?'🌙':'☀';}
document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));
applyTheme(localStorage.getItem('bi_theme')||'dark');
document.getElementById('logoutBtn').addEventListener('click',async()=>{try{if(sb)await sb.auth.signOut();}catch(e){}location.href='../index.html';});

_buildMs(document.getElementById('ms-uni'),()=>UNI_OPTS);
_buildMs(document.getElementById('ms-vig'),()=>VIG_OPTS);
_buildMs(document.getElementById('ms-org'),()=>ORG_OPTS);
_buildMs(document.getElementById('ms-st'),()=>ST_OPTS);
document.addEventListener('click',e=>{if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));});

// ── Início: exige login + admin (mesmo fluxo do fca-preenchimento) ──
async function initApp(){
  try{ sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }
  catch(e){ gateError('Falha ao iniciar o cliente Supabase.'); return; }
  let session;
  try{ const r=await sb.auth.getSession(); session=r.data.session; }
  catch(e){ gateError('Falha ao verificar a sessão.'); return; }
  if(!session){ gateLogin(); return; }
  SESSION=session;
  const {data:prof,error:profErr}=await sb.from('fca_profiles').select('*').eq('user_id',session.user.id).maybeSingle();
  if(profErr){
    if(/relation .*fca_profiles.* does not exist|could not find the table|schema cache/i.test(profErr.message||'')) gateSetup();
    else gateError(profErr.message);
    return;
  }
  PROFILE=prof||{};
  if(!PROFILE.is_admin){ gateAdmin(); return; }
  carregar();
}
initApp();
</script>
