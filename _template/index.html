<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Nome do Painel — Subtítulo</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  --bg:      #0C1017;
  --card:    #141B26;
  --card2:   #1A2335;
  --border:  #1E2D40;
  --orange:  #F97316;
  --blue:    #38BDF8;
  --text:    #F1F5F9;
  --text2:   #94A3B8;
  --text3:   #475569;
  --green:   #3BB33B;
  --red:     #FF6666;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:
    radial-gradient(ellipse at 10% 25%, rgba(249,115,22,.06) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 75%, rgba(56,189,248,.05) 0%, transparent 50%),
    var(--bg);
  color:var(--text);
  font-family:'Montserrat',-apple-system,sans-serif;
  font-size:13px;min-height:100vh;
}

/* ── HEADER ── */
.header{
  background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);
  padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.brand{flex:1;order:1;}
.brand h1{font-size:16px;font-weight:700;color:var(--orange);}
.brand p{font-size:10px;color:var(--text2);margin-top:2px;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:8px;}
.status-badge{
  font-size:10px;color:var(--text);
  background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);
  border-radius:4px;padding:3px 10px;white-space:nowrap;
}
.access-badge{
  font-size:10px;color:var(--text2);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:4px;padding:3px 10px;white-space:nowrap;
}
.refresh-btn{
  background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);
  border-radius:4px;padding:5px 7px;cursor:pointer;color:var(--orange);
  display:flex;align-items:center;
}
.refresh-btn:hover{background:rgba(249,115,22,.25);}
.header-filters{
  flex-basis:100%;order:3;margin-top:10px;
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;
}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.filter-label{display:none;}

/* ── MAIN ── */
.main{max-width:1400px;margin:0 auto;padding:20px 24px 40px;}

/* ── CARDS ── */
.cards-row{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px;}
.kpi-card{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;
}
.card-label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
.card-value{font-size:20px;font-weight:800;color:var(--text);line-height:1.1;}
.card-delta-v{font-size:15px;font-weight:700;margin-top:4px;}
.card-delta-p{font-size:10px;color:var(--text2);margin-top:2px;}
.cg{color:var(--green);} .cr{color:var(--red);}
.cg-t{color:var(--green);font-weight:700;} .cr-t{color:var(--red);font-weight:700;}

/* ── GRÁFICOS ── */
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px;}
.chart-title{font-size:15px;font-weight:800;color:var(--text);text-transform:uppercase;letter-spacing:.5px;}
.chart-sub{font-size:10px;color:var(--text2);margin-top:3px;margin-bottom:14px;}
.chart-wrap{position:relative;height:230px;}

/* ── MOBILE ── */
@media(max-width:768px){
  .main{padding:12px 10px;}
  .header{padding:8px 12px 10px;}
  .header-right{flex-direction:column;align-items:flex-end;gap:4px;}
  .header-right .refresh-btn{display:none;}
  .cards-row{grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:4px;}
  .kpi-card{padding:7px 5px;min-width:0;overflow:hidden;}
  .card-label{font-size:6.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-value{font-size:12px;white-space:nowrap;}
  .card-delta-v{font-size:11px;white-space:nowrap;}
  .card-delta-p{font-size:8px;white-space:nowrap;}
  .charts-row{grid-template-columns:1fr;gap:12px;margin-bottom:14px;}
}
</style>
</head>
<body>

<!-- ══════ HEADER ══════ -->
<header class="header">
  <div class="brand">
    <h1>Nome do Painel</h1>          <!-- TODO: atualizar -->
    <p>Subtítulo do painel</p>       <!-- TODO: atualizar -->
  </div>
  <div class="header-right">
    <button class="refresh-btn" onclick="atualizar()" title="Atualizar dados">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
      </svg>
    </button>
    <span class="status-badge" id="status-badge">Carregando…</span>
    <span class="access-badge" id="access-badge" style="display:none"></span>
  </div>
  <div class="header-filters">

    <!-- Ano: multi-select (obrigatório em todos os painéis) -->
    <div class="filter-group">
      <span class="filter-label">Ano</span>
      <div class="ms-wrap" id="ms-ano">
        <button class="ms-btn" onclick="toggleMs('ms-ano')">
          <span class="ms-lbl">Ano</span><span class="ms-cnt"></span>
          <svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg>
        </button>
        <div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Digite para pesquisar…"></div><div class="ms-list"></div></div>
      </div>
    </div>

    <!-- TODO: adicionar demais filtros (Vigência, Unidade, Projeto…) -->
  </div>
</header>

<!-- ══════ CONTEÚDO ══════ -->
<main class="main">

  <!-- KPI Cards -->
  <div class="cards-row">
    <div class="kpi-card">
      <div class="card-label">Métrica 1</div>
      <div class="card-value" id="c-m1">—</div>
    </div>
    <!-- TODO: adicionar mais cards -->
  </div>

  <!-- Gráficos -->
  <div class="charts-row">
    <div class="chart-card">
      <div class="chart-title">Título do Gráfico</div>
      <div class="chart-sub">Subtítulo</div>
      <div class="chart-wrap"><canvas id="ch-main"></canvas></div>
    </div>
  </div>

</main>

<script>
// ═══════════════════════════════════
// CONFIGURAÇÃO — atualizar
// ═══════════════════════════════════
const SHEET_ID  = 'SEU_SHEET_ID_AQUI';
const SHEET_TAB = 'Nome da Aba';

// ═══════════════════════════════════
// UTILITÁRIOS
// ═══════════════════════════════════
const fmt    = v => { const neg=+v<0,a=Math.abs(+v); let s; if(a>=1e9) s=(a/1e9).toFixed(2)+' bi'; else if(a>=1e6) s=(a/1e6).toFixed(2)+' mi'; else if(a>=1e5) s=(a/1e3).toFixed(2)+'k'; else s=Math.round(a).toLocaleString('pt-BR'); return (neg?'-':'')+s; };
const pct    = v => v==null||!isFinite(v) ? '-' : (v>=0?'+':'')+v.toFixed(1)+'%';
const pctInt = v => v==null||!isFinite(v) ? '-' : (v>=0?'+':'')+Math.round(v)+'%';
const pp     = v => v==null||!isFinite(v) ? '-' : (v>=0?'+':'')+v.toFixed(2)+' pp';
const set    = (id,val) => { const e=document.getElementById(id); if(e) e.textContent=val; };
const colI   = (el,bad) => { if(el) el.style.color = bad ? 'var(--red)' : 'var(--green)'; };

// ═══════════════════════════════════
// FETCH DADOS (Google Sheets)
// ═══════════════════════════════════
async function fetchData(){
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_TAB)}`;
  const res=await fetch(url);
  const txt=await res.text();
  const json=JSON.parse(txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
  return json.table.rows.map(r=>r.c.map(c=>c&&c.v!=null?c.v:null));
}

// ═══════════════════════════════════
// ÚLTIMO ACESSO
// ═══════════════════════════════════
function initAccessLog(){
  let name=localStorage.getItem('bi_user_name');
  if(!name){
    name=prompt('Qual é o seu nome?')||'Desconhecido';
    localStorage.setItem('bi_user_name',name);
  }
  const lastRaw=localStorage.getItem('bi_last_access');
  if(lastRaw){
    const d=new Date(lastRaw);
    const lastUser=localStorage.getItem('bi_last_user')||name;
    const badge=document.getElementById('access-badge');
    badge.textContent=`Último acesso: ${d.toLocaleDateString('pt-BR')} ${d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${lastUser}`;
    badge.style.display='';
  }
  localStorage.setItem('bi_last_access',new Date().toISOString());
  localStorage.setItem('bi_last_user',name);
}

// ═══════════════════════════════════
// RENDER — implementar aqui
// ═══════════════════════════════════
let allRows=[], lastF=null;

function atualizar(){
  // TODO: implementar lógica de filtros e render
  const now=new Date();
  set('status-badge',`Atualizado ${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`);
}

// ═══════════════════════════════════
// INIT
// ═══════════════════════════════════
async function init(){
  try{
    allRows=await fetchData();
    if(allRows[0]&&typeof allRows[0][0]==='string') allRows.shift(); // remove header
    atualizar();
    setInterval(atualizar,30*60*1000);
  }catch(e){
    console.error(e);
    set('status-badge','Erro ao carregar dados');
  }
}

let _resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(_resizeTimer);
  _resizeTimer=setTimeout(()=>{ if(lastF) atualizar(); },400);
});

document.addEventListener('DOMContentLoaded',()=>{ initAccessLog(); init(); });
</script>
<script src="../assets/filters-toggle.js"></script>
<script src="../assets/mobile.js"></script>
<script src="../assets/ctrlk.js"></script>
</body>
</html>
