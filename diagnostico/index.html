<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;order:1;}.brand h1{font-size:17px;font-weight:800;color:var(--orange);}.brand p{font-size:10px;color:#94A3B8;margin-top:2px;font-style:italic;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:8px;}
.status-badge{font-size:9px;color:#F1F5F9;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:2px 8px;white-space:nowrap;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--orange);display:flex;align-items:center;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.32);}
.header-filters{flex-basis:100%;order:3;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.filter-label{display:none;}
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:120px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;}.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:4px;min-width:220px;max-height:320px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-search{padding:7px 10px;border-bottom:1px solid #1e2d40;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ms-search input{flex:1;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:11px;outline:none;}
.ms-list{overflow-y:auto;flex:1;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all-opt{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input[type=checkbox]{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.ms-only{margin-left:auto;font-size:8px;color:var(--orange);padding:1px 5px;border-radius:2px;cursor:pointer;opacity:0;transition:opacity .12s;flex-shrink:0;}
.ms-opt:hover .ms-only{opacity:1;}.ms-only:hover{background:rgba(249,115,22,.2);}
.main{padding:20px 24px;}
.resumo{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px;}
.rz{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:12px 20px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);min-width:130px;}
.rz-lbl{font-size:9.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px;}
.rz-lbl i{width:10px;height:10px;border-radius:50%;display:inline-block;}
.rz-val{font-size:30px;font-weight:800;margin-top:4px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;}
.uc{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:16px 18px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);border-top:3px solid var(--text3);}
.uc.g{border-top-color:#3BB33B;}.uc.y{border-top-color:#EAB308;}.uc.o{border-top-color:#F97316;}.uc.r{border-top-color:#FF6666;}
.uc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
.uc-name{font-size:15px;font-weight:800;}
.uc-code{font-size:9px;color:var(--text3);font-weight:600;margin-top:1px;}
.uc-score{font-size:26px;font-weight:800;line-height:1;text-align:right;}
.uc-score small{font-size:9px;color:var(--text2);font-weight:600;display:block;text-transform:uppercase;letter-spacing:.5px;}
.uc-score.g{color:#3BB33B;}.uc-score.y{color:#EAB308;}.uc-score.o{color:#F97316;}.uc-score.r{color:#FF6666;}
.uc .n4{background:rgba(59,179,59,.18);border:1px solid rgba(59,179,59,.45);color:#3BB33B;font-weight:800;font-size:11px;border-radius:6px;padding:6px 10px;margin:8px 0 2px;}
.diag{margin-top:10px;display:flex;flex-direction:column;gap:5px;}
.dg{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.35;}
.dg .ic{flex-shrink:0;margin-top:1px;}
.dg.al{color:var(--text);}.dg.fo{color:var(--text2);}
.dg b{font-weight:700;}
.dg-sec{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--text3);margin-top:8px;margin-bottom:1px;}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.chip{font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:5px;display:flex;align-items:center;gap:4px;}
.chip.g{background:rgba(59,179,59,.16);color:#3BB33B;}.chip.y{background:rgba(234,179,8,.16);color:#EAB308;}.chip.o{background:rgba(249,115,22,.16);color:#F97316;}.chip.r{background:rgba(255,102,102,.14);color:#FF6666;}
.chip .tr{font-size:8px;}
.loading{text-align:center;color:var(--text3);padding:50px;}
body.light-mode .main{background:#F0F0F0;--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);--red:#ff0000;--green:#0E8C0E;}
body.light-mode .rz,body.light-mode .uc{background:rgba(128,128,128,.14)!important;border:none!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#555555;}
@media(max-width:768px){
  /* Header compacto */
  .header{padding:8px 12px 10px;}
  .header-right{gap:4px;}
  .brand h1{font-size:15px;}
  .brand p{font-size:8.5px;}
  .status-badge{font-size:8px;padding:2px 6px;}
  .btn{padding:3px 6px;}.btn svg{width:13px;height:13px;}
  /* Filtros full-width ~2 por linha */
  .header-filters{gap:6px;margin-top:8px;}
  .filter-label{display:none;}
  .filter-group{flex:0 0 calc(50% - 3px);}
  .ms-wrap{width:100%;}
  .ms-btn{width:100%;min-width:0;font-size:9px;padding:5px 8px;}
  .ms-panel{min-width:0;width:100%;}
  /* Main */
  .main{padding:12px;}
  /* Resumo: cards menores, lado a lado, sem estourar */
  .resumo{gap:8px;margin-bottom:14px;}
  .rz{flex:1 1 calc(50% - 4px);min-width:0;padding:10px 12px;}
  .rz-lbl{font-size:9px;}
  .rz-val{font-size:24px;}
  /* Grid de unidades: 1 coluna */
  .grid{grid-template-columns:1fr;gap:12px;}
  .uc{padding:14px 14px;}
  .uc-name{font-size:14px;}
  .uc-score{font-size:23px;}
  /* Diagnósticos: fontes/quebra de linha p/ não estourar */
  .dg{font-size:11px;line-height:1.3;}
  .dg b{font-weight:700;overflow-wrap:anywhere;word-break:break-word;}
  .dg span{overflow-wrap:anywhere;word-break:break-word;min-width:0;}
  .dg-sec{font-size:8.5px;}
  /* Chips: menores e sem overflow */
  .chips{gap:4px;margin-top:8px;}
  .chip{font-size:9px;padding:3px 6px;max-width:100%;overflow:hidden;}
  .n4{font-size:10px;padding:5px 9px;}
}
@media(max-width:480px){
  .brand h1{font-size:14px;}
  /* Resumo: 1ª linha 2 cols, mantém legível em telas estreitas */
  .resumo{gap:6px;}
  .rz{padding:9px 10px;}
  .rz-val{font-size:21px;}
  .ms-btn{font-size:8px;padding:4px 6px;}
  .uc{padding:12px 12px;}
  .uc-name{font-size:13px;}
  .uc-score{font-size:21px;}
  .dg{font-size:10.5px;}
  .chip{font-size:8.5px;padding:2px 5px;}
}
</style>

<body>
<header class="header">
  <div class="brand"><h1>Diagnóstico</h1><p>Inteligência de Frota — cruzamento de indicadores por unidade</p></div>
  <div class="header-right">
    <a href="../" class="btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="btn" id="themeBtn" title="Modo claro/escuro"></button>
    <button class="btn" onclick="carregar()" title="Atualizar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>

    <div class="filter-group"><span class="filter-label">Vigência</span><div class="ms-wrap" id="ms-vig"><button class="ms-btn" onclick="toggleMs('ms-vig')"><span class="ms-lbl">Vigência</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="filter-group"><span class="filter-label">Unidade</span><div class="ms-wrap" id="ms-uni"><button class="ms-btn" onclick="toggleMs('ms-uni')"><span class="ms-lbl">Unidade</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  </div>
</header>

<main class="main">
  <div class="resumo" id="resumo"></div>
  <div class="grid" id="grid"><div class="loading">Carregando…</div></div>

<script>
const SRC={
  ics:'https://docs.google.com/spreadsheets/d/1xGl1Xrk2sPS9zWghEuecFMNBHwmeLiZ02U-QpO8cDPY/gviz/tq?sheet='+encodeURIComponent('Consolidado ICs'),
  dpo:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?sheet=DPO',
  fca:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?gid=216663799'
};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
// de-para: unidade (ICs) → código (DPO/FCA)
const DEPARA={'CDD CAMBORIU':'BLC','CDD CUIABA':'CBA','CUIABA EMPURRADA':'CBA','CUIABA':'CBA','CDD FLORIANOPOLIS':'FLP','CDD GUARULHOS':'GRL','CDD NOVA FRIBURGO':'NFR','CDD PELOTAS':'PEL','CDD RIO DE JANEIRO':'CGR','CDD RONDONOPOLIS':'RON','CDI MACACU':'MCC','MACACU EMPURRADA':'MCC','PIRAI EMPURRADA':'PIR'};

// ── Fonte real dos ICs: aba "Base RPM" (gid=0) — MESMA FONTE do Frota de Elite ──
// Recalcula os ICs da base bruta; dispensa a aba "Consolidado ICs" (parou em maio). CSV pois gviz trunca. ic em 0-100.
const BASE_RPM_URL=`https://docs.google.com/spreadsheets/d/1xGl1Xrk2sPS9zWghEuecFMNBHwmeLiZ02U-QpO8cDPY/export?format=csv&gid=0`;
const RPM_WEIGHTS={'IC: % de Disponibilidade Equipamentos':20,'IC: % de Aderência às Preventivas':15,'IC: Consumo Km/l':10,'IC: % de Aderência às Aferições':10,'IC: Aderência ao Checklist - T1 e T2':10,'IC: Aderência ao Checklist - Apoio':10,'IC: % de conformidade da Frota':5,'IC: Aderência ao Stress Test - Caminhões':5,'IC: Aderência ao Stress Test - Empilhadeiras':5,'IC: SLA de atendimento':5,'IC: Aderência à Conformidade':5};
const RPM_ORDER=Object.keys(RPM_WEIGHTS);
const RPM_FIELD_RAW={'IC: % de Disponibilidade Equipamentos':'disp','IC: % de Aderência às Preventivas':'prev','IC: Consumo Km/l':'comb','IC: % de Aderência às Aferições':'pneus','IC: Aderência ao Checklist - T1 e T2':'checkT','IC: Aderência ao Checklist - Apoio':'checkWH','IC: % de conformidade da Frota':'conf','IC: Aderência ao Stress Test - Caminhões':'stVeic','IC: Aderência ao Stress Test - Empilhadeiras':'stEmp','IC: SLA de atendimento':'civf','IC: Aderência à Conformidade':'sla'};
function rpmNorm(s){let str=String(s||''),cleaned='';for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);if(c>=0x200B&&c<=0x200D)continue;if(c===0xFEFF)continue;if(c===0x00A0){cleaned+=' ';continue;}cleaned+=str.charAt(i);}const nfd=cleaned.trim().toLowerCase().normalize('NFD');let res='';for(let j=0;j<nfd.length;j++){const cc=nfd.charCodeAt(j);if(cc>=0x0300&&cc<=0x036F)continue;if(cc===0xFF1A){res+=':';continue;}res+=nfd.charAt(j);}return res.replace(/\s+/g,' ');}
const RPM_FIELD={},RPM_CANON={};Object.entries(RPM_FIELD_RAW).forEach(([k,v])=>RPM_FIELD[rpmNorm(k)]=v);RPM_ORDER.forEach(k=>RPM_CANON[rpmNorm(k)]=k);
function rpmToNum(v){if(v==null)return null;let s=String(v).trim();if(!s||s==='—'||s==='-'||s==='null')return null;s=s.replace('%','').trim().replace(/\./g,'').replace(',','.');const n=parseFloat(s);return Number.isNaN(n)?null:n;}
function rpmScore(icVals){let num=0,den=0;for(const nm of RPM_ORDER){const w=(RPM_WEIGHTS[nm]||0)/100,kN=rpmNorm(nm);let v=icVals.get(kN);if(v==null)continue;den+=w;let v01=v/100;if(v01>1)v01=1;num+=w*v01;}return den<=0?null:(num/den)*100;}
const _RPM_MES={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};
function rpmVigYMD(v){if(v==null)return null;const s=String(v).trim();let m=s.match(/Date\((\d+),(\d+),(\d+)/);if(m)return[+m[1],+m[2],+m[3]];m=s.toLowerCase().match(/([a-zç]{3,})\.?[\s/\-]+(\d{4})/);if(m&&_RPM_MES[m[1].slice(0,3)])return[+m[2],_RPM_MES[m[1].slice(0,3)]-1,1];m=s.match(/^(\d{4})-(\d{2})/);if(m)return[+m[1],+m[2]-1,1];if(s.includes('/')){const p=s.split('/');if(p.length>=3){const y=p[2].length===4?+p[2]:+p[0];const mo=+p[1];const d=p[2].length===4?+p[0]:+p[2];return[y,mo-1,d||1];}if(p.length===2){const a=p[0].trim(),b=p[1].trim();if(b.length===4)return[+b,+a-1,1];if(a.length===4)return[+a,+b-1,1];}}return null;}
function parseCSV(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i];if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}else if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!=='\r')cur+=c;}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}
const RPM_UNIS=['CDD CAMBORIU','CDD CUIABA','CDD FLORIANOPOLIS','CDD GUARULHOS','CDD NOVA FRIBURGO','CDD PELOTAS','CDD RIO DE JANEIRO','CDD RONDONOPOLIS','CDI MACACU','CUIABA','CUIABA EMPURRADA','MACACU EMPURRADA','PIRAI EMPURRADA'],UNI_SET=new Set(RPM_UNIS);
function pivotRPM(grid){
  if(!grid.length)return[];
  const header=grid[0].map(s=>String(s).trim()),H={};header.forEach((h,i)=>{H[rpmNorm(h)]=i;});
  const col=(...ns)=>{for(const n of ns){const k=rpmNorm(n);if(k in H)return H[k];}return -1;};
  const iUni=col('Unidade'),iVig=col('Vigência','Vigencia'),iKpi=col('KPI'),iAt=col('% de Ating.','% de Ating','% Ating.','% Ating');
  if(iUni<0||iVig<0||iKpi<0||iAt<0)return[];
  const combos=new Map();
  for(let r=1;r<grid.length;r++){const row=grid[r];const kpiN=rpmNorm(row[iKpi]);if(!(kpiN in RPM_CANON))continue;const at=rpmToNum(row[iAt]);if(at==null)continue;const ymd=rpmVigYMD(row[iVig]);if(!ymd)continue;const unit=String(row[iUni]||'').trim().toUpperCase();if(!UNI_SET.has(unit))continue;const key=ymd.join('-')+'||'+unit;if(!combos.has(key))combos.set(key,{ymd,unit,icVals:new Map(),fields:{}});const o=combos.get(key);o.icVals.set(kpiN,at);o.fields[RPM_FIELD[kpiN]]=at;}
  const out=[];
  for(const o of combos.values()){const f=o.fields,gv=k=>(f[k]==null?null:f[k]);
    out.push({vigD:new Date(o.ymd[0],o.ymd[1],o.ymd[2]),unidade:o.unit,
      ic:[gv('disp'),gv('prev'),gv('comb'),gv('pneus'),gv('checkT'),gv('checkWH'),gv('conf'),gv('stVeic'),gv('stEmp'),gv('civf'),gv('sla')],
      pont:rpmScore(o.icVals)});}
  return out;
}
// ICs (col, rótulo). valores 0-1
const IC=[
  {c:2,l:'Disponibilidade'},{c:3,l:'Preventivas'},{c:4,l:'Km/L'},{c:5,l:'Aferições'},
  {c:6,l:'Checklist T1/T2'},{c:7,l:'Checklist Apoio'},{c:8,l:'Conformidade'},
  {c:9,l:'Stress Cam.'},{c:10,l:'Stress Emp.'},{c:11,l:'SLA'},{c:12,l:'CIVF'}
];
let ICS=[],VIGS=[],DPO={},FCAREC=[];

function parseD(v){if(v==null)return null;const m=String(v).match(/Date\((\d+),(\d+),(\d+)/);return m?new Date(+m[1],+m[2],+m[3]):null;}
function vigKeyN(d){return d?d.getFullYear()*100+d.getMonth():0;}
function vigLbl(d){return d?MESES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2):'';}
function n1(v){return v==null||!isFinite(v)?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});}
// faixas ≥90 g · ≥80 y · ≥70 o · <70 r
function band(v){return v==null?'':v>=90?'g':v>=80?'y':v>=70?'o':'r';}
const FAR={g:'#3BB33B',y:'#EAB308',o:'#F97316',r:'#FF6666'};

// ── MULTI-SELECT ──
function _buildMs(wrap,renderFn,getAllFn){if(!(wrap._sel instanceof Set))wrap._sel=new Set();const sel=wrap._sel,list=wrap.querySelector('.ms-list'),srch=wrap.querySelector('.ms-search input');const render=(q)=>{renderFn(list,sel,q!==undefined?q:(srch.value||''));syncBadge(wrap);};wrap._render=render;if(!wrap._wired){wrap._wired=true;list.addEventListener('change',e=>{const box=e.target;if(box.classList.contains('ms-all')){sel.clear();}else if(sel.size===0){if(!box.checked){const all=getAllFn?getAllFn():[];all.forEach(v=>{if(v!==box.dataset.v)sel.add(v);});}}else{if(box.checked)sel.add(box.dataset.v);else sel.delete(box.dataset.v);if(getAllFn){const all=getAllFn();if(all.length>0&&all.every(v=>sel.has(v)))sel.clear();}}render(srch.value);atualizar();});list.addEventListener('click',e=>{const only=e.target.closest('.ms-only');if(!only)return;e.preventDefault();e.stopPropagation();sel.clear();sel.add(only.dataset.v);render(srch.value);atualizar();});srch.addEventListener('input',()=>render(srch.value));srch.addEventListener('click',e=>e.stopPropagation());}render();}
function buildMsFilter(id,items){const wrap=document.getElementById(id);if(!wrap)return;wrap._items=items;_buildMs(wrap,(list,sel,q)=>{const it=wrap._items||[],f=q.toLowerCase(),shown=it.filter(v=>String(v).toLowerCase().includes(f)),allChk=sel.size===0;list.innerHTML=(!q?`<label class="ms-opt all-opt"><input type="checkbox" class="ms-all" ${allChk?'checked':''}> Todas</label>`:'')+shown.map(v=>{const ve=String(v).replace(/"/g,'&quot;');return `<label class="ms-opt"><input type="checkbox" data-v="${ve}" ${allChk||sel.has(v)?'checked':''}> ${v}<span class="ms-only" data-v="${ve}">only</span></label>`;}).join('');},()=>wrap._items||[]);}
function setMsOptions(id,items){const wrap=document.getElementById(id);if(!wrap)return;wrap._items=items;if(wrap._sel&&wrap._sel.size){[...wrap._sel].forEach(v=>{if(!items.includes(v))wrap._sel.delete(v);});}if(wrap._render)wrap._render();}
// ── FILTROS DEPENDENTES (cascata) ──
// uma linha ICS passa por todos os filtros MENOS o indicado em `except`
function rowPassesExcept(o,sv,su,except){
  if(except!=='vig'&&sv.length&&!sv.includes(vigLbl(o.vigD)))return false;
  if(except!=='uni'&&su.length&&!su.includes(o.unidade))return false;
  return true;
}
function refreshCascade(){
  const sv=getMsValues('ms-vig'),su=getMsValues('ms-uni');
  const vigs=[...new Set(ICS.filter(o=>rowPassesExcept(o,sv,su,'vig')).map(o=>o.vigD?vigKeyN(o.vigD):0).filter(Boolean))]
    .sort((a,b)=>a-b).map(k=>{const o=ICS.find(x=>x.vigD&&vigKeyN(x.vigD)===k);return vigLbl(o.vigD);});
  setMsOptions('ms-vig',vigs);
  const unis=[...new Set(ICS.filter(o=>rowPassesExcept(o,sv,su,'uni')).map(o=>o.unidade).filter(Boolean))].sort();
  setMsOptions('ms-uni',unis);
}
function syncBadge(wrap){const cnt=wrap.querySelector('.ms-cnt'),n=wrap._sel?wrap._sel.size:0;if(cnt){cnt.textContent=n;cnt.style.display=n?'':'none';}}
function toggleMs(id){document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p.closest('.ms-wrap').id!==id)p.classList.remove('open');});const panel=document.querySelector(`#${id} .ms-panel`);panel.classList.toggle('open');if(panel.classList.contains('open')){const inp=panel.querySelector('input[type=text]');if(inp)setTimeout(()=>inp.focus(),50);}}
function getMsValues(id){const wrap=document.getElementById(id);if(!wrap)return[];return wrap._sel?[...wrap._sel]:[];}
document.addEventListener('click',e=>{if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));});

function gviz(url){return new Promise((res,rej)=>{const fn='_gv'+Math.floor(Math.random()*1e9);const s=document.createElement('script');const clr=()=>{try{delete window[fn];s.remove();}catch(e){}};window[fn]=r=>{clr();try{if(r.status!=='ok')throw 0;res((r.table.rows||[]).map(x=>(x.c||[]).map(c=>c?c.v:null)));}catch(e){rej(e);}};s.onerror=()=>{clr();rej(0);};s.src=url+(url.includes('?')?'&':'?')+'tqx=out:json;responseHandler:'+fn;document.head.appendChild(s);});}

// DPO: por código → nível do último H com dados; <3 = não sustentável. Vários sufixos (T1/T2) → pior nível.
function compDPO(rows){const hdr=rows[0]||[];let li=-1;for(let i=hdr.length-1;i>=1;i--){if(rows.slice(1).some(r=>/Nível/i.test(String(r[i]||'')))){li=i;break;}}const out={};if(li<0)return out;const sem=String(hdr[li]||'');rows.slice(1).forEach(r=>{const code=String(r[0]||'').trim().split(' ')[0];const m=String(r[li]||'').match(/Nível\s*(\d+)/i);if(!code||!m)return;const lv=+m[1];if(out[code]==null||lv<out[code].lv)out[code]={lv,sem};});return out;}
// FCA: registros por código+vigência
function compFCA(rows){const today=new Date();today.setHours(0,0,0,0);const recs=[];rows.forEach(r=>{const d=parseD(r[1]);if(!d)return;const code=String(r[2]||'').trim().replace(/\s*\([^)]*\)\s*$/,'').split(' ')[0];const st=String(r[8]||'');const prazo=parseD(r[7]);const concl=/conclu/i.test(st)?'C':/andamento/i.test(st)?'A':'N';const venc=concl==='C'?false:(prazo&&prazo<today);recs.push({k:vigKeyN(d),code,concl,venc});});return recs;}

function carregar(){
  document.getElementById('status').textContent='Carregando…';
  Promise.all([fetch(BASE_RPM_URL).then(r=>r.text()).then(t=>pivotRPM(parseCSV(t))),gviz(SRC.dpo).catch(()=>null),gviz(SRC.fca).catch(()=>null)]).then(([ic,dp,fc])=>{
    ICS=(ic||[]).filter(o=>o&&o.vigD).map(o=>{const vigD=new Date(o.vigD);return{vigD,vk:vigKeyN(vigD),unidade:o.unidade,ic:o.ic,pont:o.pont};});
    DPO=dp?compDPO(dp):{};FCAREC=fc?compFCA(fc):[];
    const vm=new Map();ICS.forEach(o=>vm.set(o.vk,o.vigD));VIGS=[...vm.values()].sort((a,b)=>vigKeyN(a)-vigKeyN(b));
    const vigItems=VIGS.map(d=>vigLbl(d));
    const comDados=vigItems.filter(v=>ICS.some(o=>vigLbl(o.vigD)===v&&o.pont!=null));
    const base=comDados.length?comDados:vigItems;
    const vw=document.getElementById('ms-vig');if(base.length)vw._sel=new Set([base[base.length-1]]);
    buildMsFilter('ms-vig',vigItems);
    buildMsFilter('ms-uni',[...new Set(ICS.map(o=>o.unidade))].sort());
    atualizar();
    const now=new Date();document.getElementById('status').textContent=`${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }).catch(e=>{console.error(e);document.getElementById('status').textContent='Erro ao carregar';});
}

// streak de queda: nº de meses consecutivos caindo até a vigência selecionada
function fallStreak(series){let s=0;for(let i=series.length-1;i>0;i--){if(series[i]!=null&&series[i-1]!=null&&series[i]<series[i-1]-0.5)s++;else break;}return s;}

// ── MOTOR DE DIAGNÓSTICO por unidade ──
function diagnose(uni,selD,perKeys){
  const yr=selD.getFullYear(),mi=selD.getMonth();
  const code=DEPARA[uni]||'';
  const ytd=VIGS.filter(d=>d.getFullYear()===yr&&d.getMonth()<=mi);
  // valores = MÉDIA das vigências selecionadas (1 mês = aquele mês)
  const sel=ICS.filter(o=>o.unidade===uni&&perKeys.has(o.vk));
  if(!sel.length)return null;
  const avgOf=arr=>{const f=arr.filter(v=>v!=null);return f.length?f.reduce((a,b)=>a+b,0)/f.length:null;};
  const icCur=IC.map((d,i)=>avgOf(sel.map(o=>o.ic[i])));
  // séries por IC (jan→selD) p/ tendência
  const serie=i=>ytd.map(d=>{const o=ICS.find(x=>x.unidade===uni&&x.vk===vigKeyN(d));return o?o.ic[i]:null;});
  const pont=avgOf(sel.map(o=>o.pont));
  const forcas=[],alertas=[];let dpoN4=null;
  const cap=v=>v==null?null:Math.min(100,v);
  // por IC
  IC.forEach((d,i)=>{
    const v=cap(icCur[i]);if(v==null)return;
    const st=fallStreak(serie(i));
    if(v<70)alertas.push({sev:'r',msg:`<b>${d.l}</b> crítico (${Math.round(v)}%)`});
    else if(v<80&&st>=2)alertas.push({sev:'o',msg:`<b>${d.l}</b> em queda há ${st} meses (${Math.round(v)}%)`});
    else if(v>=95)forcas.push({sev:'g',msg:`<b>${d.l}</b> em alto nível (${Math.round(v)}%)`});
  });
  // cruzamentos
  const get=l=>{const i=IC.findIndex(x=>x.l===l);return i<0?null:cap(icCur[i]);};
  const disp=get('Disponibilidade'),prev=get('Preventivas'),kml=get('Km/L'),sla=get('SLA');
  if(disp!=null&&prev!=null&&disp<85&&prev<85)alertas.push({sev:'r',msg:`<b>Manutenção comprometida</b> — disponibilidade e preventivas baixas (frota/oficina)`});
  if(kml!=null&&kml<80&&disp!=null&&disp<85)alertas.push({sev:'o',msg:`<b>Eficiência operacional ruim</b> — Km/L e disponibilidade abaixo do esperado`});
  // DPO
  if(code&&DPO[code]){const lv=DPO[code].lv;if(lv<3)alertas.push({sev:'r',msg:`<b>Pilar DPO/VPO não sustentável</b> (Nível ${lv} · ${DPO[code].sem})`});else if(lv>=4)dpoN4=lv;else forcas.push({sev:'g',msg:`<b>DPO/VPO sustentável</b> (Nível ${lv} — fortaleza)`});}
  // FCA (acumulado até a vigência, por código)
  if(code){const sel=FCAREC.filter(r=>r.code===code&&Math.floor(r.k/100)===yr&&(r.k%100)<=mi);if(sel.length){const tt=sel.length,consol=sel.reduce((s,r)=>s+(r.concl==='C'?100:r.concl==='A'?50:0),0)/tt,prazo=sel.filter(r=>!r.venc).length/tt*100;if(consol<50)alertas.push({sev:'r',msg:`<b>FCA: consolidação baixa</b> (${Math.round(consol)}% · ${tt} ações)`});else if(consol<85)alertas.push({sev:'o',msg:`<b>FCA: consolidação parcial</b> (${Math.round(consol)}% · ${tt} ações)`});else forcas.push({sev:'g',msg:`<b>FCA consolidado</b> (${Math.round(consol)}%)`});if(prazo<70)alertas.push({sev:'r',msg:`<b>FCA: ${Math.round(100-prazo)}% das ações vencidas</b> — repactuar prazos`});}}
  // pontuação geral / tendência
  const pontSerie=ytd.map(d=>{const o=ICS.find(x=>x.unidade===uni&&x.vk===vigKeyN(d));return o?o.pont:null;});
  const pst=fallStreak(pontSerie);
  if(pst>=3)alertas.push({sev:'o',msg:`<b>Tendência de queda geral</b> — pontuação caindo há ${pst} meses`});
  // chips dos ICs (com tendência)
  const chips=IC.map((d,i)=>{const v=cap(icCur[i]);if(v==null)return null;const st=fallStreak(serie(i));return{l:d.l,v:Math.round(v),cls:band(v),tr:st>=2?'▼':''};}).filter(Boolean);
  return {uni,code,pont,cls:band(pont),forcas,alertas,chips,dpoN4};
}

function atualizar(){
  if(!ICS.length)return;
  refreshCascade();
  const selVig=getMsValues('ms-vig'),selUni=getMsValues('ms-uni');
  const cands=(selVig.length?VIGS.filter(d=>selVig.includes(vigLbl(d))):VIGS.slice()).sort((a,b)=>vigKeyN(a)-vigKeyN(b));
  const selD=cands.length?cands[cands.length-1]:(VIGS[VIGS.length-1]||null);
  if(!selD)return;
  const perKeys=new Set(cands.map(vigKeyN)); // vigências selecionadas → indicadores = MÉDIA delas
  let unis=[...new Set(ICS.map(o=>o.unidade))];
  if(selUni.length)unis=unis.filter(u=>selUni.includes(u));
  const diags=unis.map(u=>diagnose(u,selD,perKeys)).filter(Boolean).sort((a,b)=>(a.pont==null?999:a.pont)-(b.pont==null?999:b.pont)); // piores primeiro
  // resumo
  const cnt={g:0,y:0,o:0,r:0};diags.forEach(d=>cnt[d.cls]++);
  document.getElementById('resumo').innerHTML=
    `<div class="rz"><div class="rz-lbl"><i style="background:#3BB33B"></i>Saudáveis</div><div class="rz-val" style="color:#3BB33B">${cnt.g}</div></div>`+
    `<div class="rz"><div class="rz-lbl"><i style="background:#EAB308"></i>Regulares</div><div class="rz-val" style="color:#EAB308">${cnt.y}</div></div>`+
    `<div class="rz"><div class="rz-lbl"><i style="background:#F97316"></i>Atenção</div><div class="rz-val" style="color:#F97316">${cnt.o}</div></div>`+
    `<div class="rz"><div class="rz-lbl"><i style="background:#FF6666"></i>Críticas</div><div class="rz-val" style="color:#FF6666">${cnt.r}</div></div>`+
    `<div class="rz"><div class="rz-lbl">${cands.length>1?'Período · média':'Vigência'}</div><div class="rz-val" style="font-size:18px;padding-top:9px">${cands.length>1?vigLbl(cands[0]).toUpperCase()+'–'+vigLbl(selD).toUpperCase():vigLbl(selD).toUpperCase()}</div></div>`;
  // cards
  const ICO={r:'⛔',o:'⚠️',y:'•',g:'✓'};
  document.getElementById('grid').innerHTML=diags.map(d=>{
    const al=d.alertas.length?`<div class="dg-sec">Alertas</div>`+d.alertas.map(a=>`<div class="dg al"><span class="ic">${ICO[a.sev]}</span><span>${a.msg}</span></div>`).join(''):'';
    const fo=d.forcas.length?`<div class="dg-sec">Forças</div>`+d.forcas.slice(0,4).map(a=>`<div class="dg fo"><span class="ic">${ICO[a.sev]}</span><span>${a.msg}</span></div>`).join(''):'';
    const semDiag=(!d.alertas.length&&!d.forcas.length)?`<div class="dg fo" style="margin-top:8px">Sem alertas relevantes neste mês.</div>`:'';
    const chips=`<div class="dg-sec" style="margin:12px 0 4px">Todos os ICs</div><div class="chips" style="margin-top:0">`+d.chips.map(c=>`<span class="chip ${c.cls}" title="${c.l}">${c.l.length>10?c.l.slice(0,9)+'…':c.l} ${c.v}%<span class="tr">${c.tr}</span></span>`).join('')+`</div>`;
    const n4=d.dpoN4?`<div class="n4">★ DPO/VPO Nível ${d.dpoN4}</div>`:'';
    return `<div class="uc ${d.cls}"><div class="uc-top"><div><div class="uc-name">${d.uni}</div><div class="uc-code">${d.code||'—'}</div></div><div class="uc-score ${d.cls}">${n1(d.pont)}<small>Pontuação</small></div></div>${n4}<div class="diag">${al}${fo}${semDiag}</div>${chips}</div>`;
  }).join('')||'<div class="loading">Sem dados</div>';
}
