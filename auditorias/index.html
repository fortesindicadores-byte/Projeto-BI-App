<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="build" content="202608061817">
<title>Auditorias</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1017;--card:#141B26;--card2:#1A2335;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
/* HEADER — sempre escuro nos dois modos */
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;order:1;}.brand h1{font-size:16px;font-weight:700;color:var(--orange);}.brand p{font-size:10px;color:#94A3B8;margin-top:2px;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:8px;}
.status-badge{font-size:9px;color:#F1F5F9;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:2px 8px;white-space:nowrap;}
.refresh-btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--orange);display:flex;align-items:center;justify-content:center;transition:background .15s;}
.refresh-btn:hover{background:rgba(249,115,22,.32);}
.theme-btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 6px;cursor:pointer;color:var(--orange);display:flex;align-items:center;}
.theme-btn:hover{background:rgba(249,115,22,.32);}
.back-btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;display:flex;align-items:center;color:var(--orange);text-decoration:none;}
.back-btn:hover{background:rgba(249,115,22,.32);}
.main{padding:20px 24px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:56px;}
.tbl-section{background:transparent;border:none;padding:0;box-shadow:none;}
.tbl-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:14px;}
table{width:100%;border-collapse:collapse;table-layout:fixed;border-radius:8px;overflow:hidden;}
th:first-child,td:first-child{width:26%;}
thead th{background:#0C1017;color:#fff;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:10px 8px;text-align:center;border:1px solid rgba(255,255,255,.08);}
thead th.uni{text-align:left;}
td{text-align:center;font-size:11px;font-weight:700;padding:3px;border:none;background:transparent;}
.niv{display:block;border-radius:7px;padding:10px 6px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.uni-card{display:block;border-radius:7px;padding:10px 12px;background:rgba(255,255,255,.05);color:var(--text);font-weight:700;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.niv.empty-niv{background:rgba(255,255,255,.05);color:var(--text3);box-shadow:none;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
.legend span{display:flex;align-items:center;gap:5px;font-size:9px;color:var(--text2);}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;}
.loading{text-align:center;color:var(--text3);padding:30px;font-size:12px;}
/* MODO CLARO — só conteúdo e cards (header continua escuro) */
body.light-mode .main{background:#EFF1F4;--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);--red:#ff0000;--green:#0E8C0E;}body.light-mode .hero-sep{background:rgba(0,0,0,.18)!important;color:rgba(0,0,0,.2)!important;}
body.light-mode .tbl-section{background:transparent!important;border:none!important;box-shadow:none!important;padding:0!important;--text:#1a1a1a;--text2:#444444;--text3:#555555;}
body.light-mode .uni-card{background:rgba(0,0,0,.05);}
body.light-mode .niv.empty-niv{background:rgba(0,0,0,.05);color:#999;}
@media(max-width:768px){
  .header{padding:8px 12px 10px;}
  .header-right{gap:4px;}
  .header-right .refresh-btn{display:none;}
  .brand h1{font-size:14px;}
  .brand p{font-size:9px;}
  .status-badge{font-size:8px;padding:2px 6px;}
  .theme-btn{padding:3px 5px;}
  .theme-btn svg{width:13px;height:13px;}
  .main{padding:12px;}
  /* 2 tabelas empilhadas em 1 coluna */
  .grid{grid-template-columns:1fr;gap:24px;}
  .tbl-title{font-size:15px;margin-bottom:10px;}
  /* poucas colunas: reduzir fonte para caber a largura */
  thead th{font-size:9px;padding:8px 4px;letter-spacing:.3px;}
  td{font-size:10px;padding:9px 4px;}
  td.uni{padding-left:8px;}
  /* fallback: rolagem horizontal se ainda estourar */
  #tbl-demarco,#tbl-dpo{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}
@media(max-width:480px){
  .grid{gap:18px;}
  th:first-child,td:first-child{width:30%;}
  thead th{font-size:8px;padding:7px 3px;}
  td{font-size:9px;padding:8px 3px;}
  td.uni{padding-left:6px;}
}
</style>
<script>try{if(!sessionStorage.getItem("gem_hub"))location.replace("../");}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="../assets/excel-export.js"></script>
<script src="../assets/pdf-export.js"></script>
</head>
<body>
<header class="header">
  <div class="brand">
    <h1>Auditorias</h1>
    <p>Consolidado Geral — Demarco &amp; DPO/VPO</p>
  </div>
  <div class="header-right">
    <a href="../" class="back-btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="theme-btn" id="themeBtn" title="Modo claro/escuro"></button>
    <button class="refresh-btn" onclick="carregar()" title="Atualizar dados">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
    </button>
    <span class="status-badge" id="status-badge">Carregando…</span>
  </div>
</header>

<main class="main">
  <div class="grid">
    <div class="tbl-section"><div class="tbl-title">Demarco</div><div id="tbl-demarco"><div class="loading">Carregando…</div></div></div>
    <div class="tbl-section"><div class="tbl-title">DPO/VPO</div><div id="tbl-dpo"><div class="loading">Carregando…</div></div></div>
  </div>
</main>

<script>
const SHEET_ID='1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o';

// Mapas de cor por nível — fiéis às planilhas (esquemas diferentes por aba)
const CORES={
  Demarco:{                              // escala INVERTIDA: Nível 1 = melhor, Nível 5 = pior
    'Nível 1':{bg:'#1565C0',fg:'#fff'},   // azul (melhor)
    'Nível 2':{bg:'#3BB33B',fg:'#fff'},   // verde
    'Nível 3':{bg:'#F4C20D',fg:'#0C1017'},// amarelo
    'Nível 4':{bg:'#EA4335',fg:'#fff'},   // vermelho
    'Nível 5':{bg:'#9B1C1C',fg:'#fff'},   // vermelho escuro (pior)
  },
  DPO:{                                   // Nível 0 = pior, Nível 4 = excepcional
    'Nível 0':{bg:'#404040',fg:'#fff'},   // cinza escuro (neutro/pior)
    'Nível 1':{bg:'#C8C8C8',fg:'#0C1017'},// cinza claro (neutro)
    'Nível 2':{bg:'#F4A100',fg:'#0C1017'},// âmbar
    'Nível 3':{bg:'#5FA84F',fg:'#fff'},   // verde (fortaleza)
    'Nível 4':{bg:'#6FA8DC',fg:'#0C1017'},// azul (excepcional)
  }
};

function fetchTab(tab){
  return new Promise((resolve,reject)=>{
    const fn='_gvAud'+Math.floor(Math.random()*1e9);
    const s=document.createElement('script');
    const cleanup=()=>{try{delete window[fn];s.remove();}catch(e){}};
    window[fn]=resp=>{cleanup();try{
      if(resp.status!=='ok')throw new Error(resp.errors?.[0]?.message||'erro');
      const rows=resp.table.rows.map(r=>(r.c||[]).map(c=>c&&c.v!=null?String(c.v).trim():''));
      resolve(rows);
    }catch(e){reject(e);}};
    s.onerror=()=>{cleanup();reject(new Error('sem acesso'));};
    s.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(tab)}&tqx=out:json;responseHandler:${fn}`;
    document.head.appendChild(s);
  });
}

function render(tab,rows,elId,legId){
  if(!rows.length){document.getElementById(elId).innerHTML='<div class="loading">Sem dados</div>';return;}
  const head=rows[0];                 // UNIDADE | 1H25 | 2H25 | 1H26 | 2H26
  const body=rows.slice(1).filter(r=>r[0]);
  const mapa=CORES[tab]||{};
  // mantém a coluna UNIDADE + só os períodos que têm ao menos um dado
  const keep=head.map((_,i)=>i).filter(i=>i===0||body.some(r=>{const v=(r[i]||'').trim();return v&&v!=='—';}));
  let html='<table><thead><tr>';
  keep.forEach(i=>{html+=`<th class="${i===0?'uni':''}">${head[i]||''}</th>`;});
  html+='</tr></thead><tbody>';
  body.forEach(r=>{
    html+='<tr>';
    keep.forEach(i=>{
      const v=r[i]||'';
      if(i===0){html+=`<td class="uni"><span class="uni-card">${v}</span></td>`;return;}
      const c=mapa[v];
      if(c)html+=`<td><span class="niv" style="background:${c.bg};color:${c.fg}">${v}</span></td>`;
      else html+=`<td><span class="niv empty-niv">${v||'—'}</span></td>`;
    });
    html+='</tr>';
  });
  html+='</tbody></table>';
  document.getElementById(elId).innerHTML=html;
}

async function carregar(){
  document.getElementById('status-badge').textContent='Carregando…';
  try{
    const [dem,dpo]=await Promise.all([fetchTab('Demarco'),fetchTab('DPO')]);
    render('Demarco',dem,'tbl-demarco','leg-demarco');
    render('DPO',dpo,'tbl-dpo','leg-dpo');
    const now=new Date();
    document.getElementById('status-badge').textContent=`Atualizado ${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){console.error(e);document.getElementById('status-badge').textContent='Erro ao carregar';}
}

// Tema claro/escuro — padrão dos painéis
const _sun=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
const _moon=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);const b=document.getElementById('themeBtn');if(b)b.innerHTML=t==='light'?_moon:_sun;}
(function(){const t=localStorage.getItem('bi_theme')||'dark';applyTheme(t);document.getElementById('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));})();

carregar();
if(window.initPdfExport) initPdfExport({fileBase:'auditorias'});   // botão PDF no header + export por botão direito (Excel/PNG)
</script>
<script src="../assets/mobile.js"></script>
<script src="../assets/sortable-table.js"></script>
<script src="../assets/build-check.js?v=202608061817"></script>
</body>
