<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scorecard</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;order:1;}.brand h1{font-size:17px;font-weight:800;color:var(--orange);}.brand p{font-size:10px;color:#94A3B8;margin-top:2px;font-style:italic;}
.header-right{flex-shrink:0;order:2;display:flex;align-items:center;gap:8px;}
.status-badge{font-size:9px;color:#F1F5F9;background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:2px 8px;white-space:nowrap;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.3);border-radius:4px;padding:4px 8px;cursor:pointer;color:var(--orange);display:flex;align-items:center;text-decoration:none;}
.btn:hover{background:rgba(249,115,22,.32);}
.header-filters{flex-basis:100%;order:3;margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;}
.filter-group{display:flex;flex-direction:column;gap:3px;}
.filter-label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:120px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;}.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);left:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:4px;min-width:220px;max-height:320px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-search{padding:7px 10px;border-bottom:1px solid #1e2d40;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.ms-search input{flex:1;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:11px;outline:none;}
.ms-list{overflow-y:auto;flex:1;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all-opt{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input[type=checkbox]{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.ms-only{margin-left:auto;font-size:8px;color:var(--orange);padding:1px 5px;border-radius:2px;cursor:pointer;opacity:0;transition:opacity .12s;flex-shrink:0;}
.ms-opt:hover .ms-only{opacity:1;}.ms-only:hover{background:rgba(249,115,22,.2);}
.main{padding:20px 24px;}
.hero{margin-bottom:18px;display:flex;align-items:flex-end;gap:28px;flex-wrap:wrap;}
.hero-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:1px;}
.hero-value{font-size:56px;font-weight:800;line-height:1;margin-top:4px;}
.hero-sub{font-size:12px;color:var(--text2);margin-top:6px;}
.legend{display:flex;gap:14px;align-items:center;font-size:10px;color:var(--text2);margin-bottom:14px;flex-wrap:wrap;}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}
.sec-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--text);margin:0 0 12px;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:26px;}
.kpi{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:12px 14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);border-left:3px solid var(--text3);}
.kpi.g{border-left-color:var(--green);}.kpi.a{border-left-color:var(--amber);}.kpi.r{border-left-color:var(--red);}
.kpi-lbl{font-size:9.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;line-height:1.3;min-height:25px;}
.kpi-val{font-size:24px;font-weight:800;margin-top:6px;}
.kpi-val.g{color:var(--green);}.kpi-val.a{color:var(--amber);}.kpi-val.r{color:var(--red);}
.kpi-meta{font-size:9px;color:var(--text3);margin-top:2px;}
.tbl-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:14px 4px 12px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.tbl-head{padding:0 12px 10px;}.tbl-head h2{font-size:15px;font-weight:800;color:var(--text);}.tbl-sub{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.tbl-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:1100px;}
thead th{background:var(--card);font-size:9.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.4px;padding:9px 6px;white-space:nowrap;text-align:center;}
thead th.lft{text-align:left;padding-left:12px;}
thead th.cols{border-bottom:1px solid rgba(255,255,255,.12);}
tbody td{padding:7px 6px;text-align:center;white-space:nowrap;color:var(--text);}
tbody td.lft{text-align:left;padding-left:12px;}
tbody td.rank{font-weight:800;color:var(--text2);width:34px;}
tbody td.uni{font-weight:700;min-width:170px;}
tbody tr+tr td{border-top:1px solid rgba(255,255,255,.04);}
tbody tr:hover td{background:rgba(255,255,255,.03);}
.cell{display:inline-block;min-width:50px;padding:4px 6px;border-radius:4px;font-weight:700;}
.pont{font-weight:800;font-size:13px;}
.loading{text-align:center;color:var(--text3);padding:40px;}
body.light-mode .main{background:#F0F0F0;--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);}
body.light-mode .kpi,body.light-mode .tbl-section{background:rgba(128,128,128,.14)!important;border-color:transparent!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#555555;}
body.light-mode thead th{background:#F0F0F0;}
body.light-mode tbody tr+tr td{border-top-color:rgba(0,0,0,.05);}
@media(max-width:768px){.main{padding:12px;}.hero-value{font-size:42px;}.cards{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><h1>Scorecard</h1><p>Visão Consolidada — Frota</p></div>
  <div class="header-right">
    <a href="../" class="btn" title="Voltar ao Hub"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <button class="btn" id="themeBtn" title="Modo claro/escuro"></button>
    <button class="btn" onclick="carregar()" title="Atualizar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg></button>
    <span class="status-badge" id="status">Carregando…</span>
  </div>
  <div class="header-filters">
    <div class="filter-group"><span class="filter-label">Vigência</span><div class="ms-wrap" id="ms-vig"><button class="ms-btn" onclick="toggleMs('ms-vig')"><span class="ms-lbl">Vigência</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
    <div class="filter-group"><span class="filter-label">Unidade</span><div class="ms-wrap" id="ms-uni"><button class="ms-btn" onclick="toggleMs('ms-uni')"><span class="ms-lbl">Unidade</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><svg width="12" height="12" viewBox="0 0 12 12"><circle cx="5" cy="5" r="4" stroke="#94A3B8" stroke-width="1.5" fill="none"/><line x1="8.5" y1="8.5" x2="11" y2="11" stroke="#94A3B8" stroke-width="1.5"/></svg><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  </div>
</header>

<main class="main">
  <section class="hero">
    <div><div class="hero-label">Pontuação Geral · Frota</div><div class="hero-value" id="h-pont">—</div><div class="hero-sub" id="h-sub"></div></div>
  </section>
  <div class="legend"><span><i style="background:var(--green)"></i>≥ 85% — Adequado</span><span><i style="background:var(--amber)"></i>70–85% — Atenção</span><span><i style="background:var(--red)"></i>&lt; 70% — Crítico</span></div>
  <h2 class="sec-title">Indicadores Principais</h2>
  <div class="cards" id="cards"><div class="loading">Carregando…</div></div>
  <div class="tbl-section"><div class="tbl-head"><h2>Ranking de Unidades</h2><div class="tbl-sub" id="tbl-sub"></div></div><div class="tbl-wrap"><div id="tbl"><div class="loading">Carregando…</div></div></div></div>
</main>

<script>
const SRC={
  ics:'https://docs.google.com/spreadsheets/d/1xGl1Xrk2sPS9zWghEuecFMNBHwmeLiZ02U-QpO8cDPY/gviz/tq?sheet='+encodeURIComponent('Consolidado ICs'),
  km:'https://docs.google.com/spreadsheets/d/1wCoRGsvOgmIvfLW4F9Sxr-5AX9Go-aFlRVjrQ_B2ilM/gviz/tq?sheet='+encodeURIComponent('Dispersão de km'),
  dpo:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?sheet=DPO',
  fca:'https://docs.google.com/spreadsheets/d/1oW3mss0pXVI6gaDU2z5cDAKvW40LWHCQXpanqSvb12o/gviz/tq?gid=216663799'
};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
// ICs (col, label curto) — valores 0-1 (fração)
const IC=[
  {c:2,l:'Disponibilidade'},{c:3,l:'Preventivas'},{c:4,l:'Consumo Km/L'},{c:5,l:'Aferições'},
  {c:6,l:'Checklist T1/T2'},{c:7,l:'Checklist Apoio'},{c:8,l:'Conformidade Frota'},
  {c:9,l:'Stress Test Cam.'},{c:10,l:'Stress Test Emp.'},{c:11,l:'SLA Atendimento'},{c:12,l:'Aderência Conf.'}
];
let ICS=[],VIGS=[],XPANEL={};

function parseD(v){if(v==null)return null;const m=String(v).match(/Date\((\d+),(\d+),(\d+)/);return m?new Date(+m[1],+m[2],+m[3]):null;}
function vigKeyN(d){return d?d.getFullYear()*100+d.getMonth():0;}
function vigLbl(d){return d?MESES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2):'';}
function pct1(v){return v==null||!isFinite(v)?'—':v.toFixed(1)+'%';}
function n1(v){return v==null||!isFinite(v)?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});}
// farol p/ indicadores "maior = melhor" (%): ≥85 verde, ≥70 ambar, <70 vermelho
function band(v){return v==null?'':v>=85?'g':v>=70?'a':'r';}
function cellBg(cls){return cls==='g'?'rgba(59,179,59,.20)':cls==='a'?'rgba(244,161,0,.20)':cls==='r'?'rgba(255,102,102,.18)':'transparent';}
function cellFg(cls){return cls==='g'?'#3BB33B':cls==='a'?'#F4A100':cls==='r'?'#FF6666':'var(--text3)';}

// ── MULTI-SELECT ──
function _buildMs(wrap,renderFn,getAllFn){if(!(wrap._sel instanceof Set))wrap._sel=new Set();const sel=wrap._sel,list=wrap.querySelector('.ms-list'),srch=wrap.querySelector('.ms-search input');const render=(q='')=>{renderFn(list,sel,q);syncBadge(wrap);};list.addEventListener('change',e=>{const box=e.target;if(box.classList.contains('ms-all')){sel.clear();}else if(sel.size===0){if(!box.checked){const all=getAllFn?getAllFn():[];all.forEach(v=>{if(v!==box.dataset.v)sel.add(v);});}}else{if(box.checked)sel.add(box.dataset.v);else sel.delete(box.dataset.v);if(getAllFn){const all=getAllFn();if(all.length>0&&all.every(v=>sel.has(v)))sel.clear();}}render(srch.value);atualizar();});list.addEventListener('click',e=>{const only=e.target.closest('.ms-only');if(!only)return;e.preventDefault();e.stopPropagation();sel.clear();sel.add(only.dataset.v);render(srch.value);atualizar();});srch.addEventListener('input',()=>render(srch.value));srch.addEventListener('click',e=>e.stopPropagation());render();}
function buildMsFilter(id,items){const wrap=document.getElementById(id);if(!wrap)return;_buildMs(wrap,(list,sel,q)=>{const f=q.toLowerCase(),shown=items.filter(v=>String(v).toLowerCase().includes(f)),allChk=sel.size===0;list.innerHTML=(!q?`<label class="ms-opt all-opt"><input type="checkbox" class="ms-all" ${allChk?'checked':''}> Todas</label>`:'')+shown.map(v=>{const ve=String(v).replace(/"/g,'&quot;');return `<label class="ms-opt"><input type="checkbox" data-v="${ve}" ${allChk||sel.has(v)?'checked':''}> ${v}<span class="ms-only" data-v="${ve}">only</span></label>`;}).join('');},()=>items);}
function syncBadge(wrap){const cnt=wrap.querySelector('.ms-cnt'),n=wrap._sel?wrap._sel.size:0;if(cnt){cnt.textContent=n;cnt.style.display=n?'':'none';}}
function toggleMs(id){document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p.closest('.ms-wrap').id!==id)p.classList.remove('open');});const panel=document.querySelector(`#${id} .ms-panel`);panel.classList.toggle('open');if(panel.classList.contains('open')){const inp=panel.querySelector('input[type=text]');if(inp)setTimeout(()=>inp.focus(),50);}}
function getMsValues(id){const wrap=document.getElementById(id);if(!wrap)return[];return wrap._sel?[...wrap._sel]:[];}
document.addEventListener('click',e=>{if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));});

function gviz(url){return new Promise((res,rej)=>{const fn='_gv'+Math.floor(Math.random()*1e9);const s=document.createElement('script');const clr=()=>{try{delete window[fn];s.remove();}catch(e){}};window[fn]=r=>{clr();try{if(r.status!=='ok')throw 0;res((r.table.rows||[]).map(x=>(x.c||[]).map(c=>c?c.v:null)));}catch(e){rej(e);}};s.onerror=()=>{clr();rej(0);};s.src=url+(url.includes('?')?'&':'?')+'tqx=out:json;responseHandler:'+fn;document.head.appendChild(s);});}

// ── Indicadores cross-painel (nível empresa) ──
function compDisp(rows){const mo={};rows.forEach(r=>{const d=parseD(r[0]);if(!d)return;const proj=String(r[14]||'').split('-')[0].trim().toUpperCase();if(!(proj==='ROTA'||proj==='AUTO SERVIÇO'||proj==='AUTO SERVICO'))return;const k=vigKeyN(d);const rem=r[31]!=null?+r[31]:0,real=r[32]!=null?+r[32]:0;const o=mo[k]=mo[k]||{rem:0,real:0};o.rem+=rem;o.real+=real;});const out={},acc={};Object.keys(mo).map(Number).sort((a,b)=>a-b).forEach(k=>{const y=Math.floor(k/100);acc[y]=acc[y]||{rem:0,real:0};acc[y].rem+=mo[k].rem;acc[y].real+=mo[k].real;out[k]=acc[y].rem?((acc[y].real-acc[y].rem)/acc[y].rem*100):null;});return out;}
function compDPO(rows){const hdr=rows[0]||[];let li=-1;for(let i=hdr.length-1;i>=1;i--){if(rows.slice(1).some(r=>/Nível/i.test(String(r[i]||'')))){li=i;break;}}if(li<0)return{frac:0,below:null,sem:null};let below=0,tot=0;rows.slice(1).forEach(r=>{const m=String(r[li]||'').match(/Nível\s*(\d+)/i);if(m){tot++;if(+m[1]<3)below++;}});return{frac:below===0?1:below===1?.5:0,below,tot,sem:String(hdr[li]||'')};}
function compFCA(rows){const today=new Date();today.setHours(0,0,0,0);const recs=[];rows.forEach(r=>{const d=parseD(r[1]);if(!d)return;const st=String(r[8]||'');const prazo=parseD(r[7]);const concl=/conclu/i.test(st)?'C':/andamento/i.test(st)?'A':'N';const venc=concl==='C'?false:(prazo&&prazo<today);recs.push({k:vigKeyN(d),concl,venc});});return recs;}
function fcaAderAte(recs,year,monthIdx){const sel=recs.filter(r=>Math.floor(r.k/100)===year&&(r.k%100)<=monthIdx);if(!sel.length)return null;const tt=sel.length,noP=sel.filter(r=>!r.venc).length,cc=sel.filter(r=>r.concl==='C').length;return((noP/tt*100)+(cc/tt*100))/2;}

function atualizar(){
  if(!ICS.length)return;
  const selVig=getMsValues('ms-vig'),selUni=getMsValues('ms-uni');
  const cands=(selVig.length?VIGS.filter(d=>selVig.includes(vigLbl(d))):VIGS.slice()).sort((a,b)=>vigKeyN(a)-vigKeyN(b));
  const selD=cands.length?cands[cands.length-1]:(VIGS[VIGS.length-1]||null);
  if(!selD){return;}
  const perKeys=new Set(cands.map(vigKeyN));
  const rows=ICS.filter(o=>perKeys.has(vigKeyN(o.vigD))&&(selUni.length===0||selUni.includes(o.unidade)));
  const periodo=cands.length<=1?vigLbl(selD).toUpperCase():`${vigLbl(cands[0]).toUpperCase()} – ${vigLbl(selD).toUpperCase()} · MÉDIA`;
  document.getElementById('tbl-sub').textContent=periodo;

  // ── Hero: Pontuação geral (média das linhas filtradas) ──
  const pts=rows.map(o=>o.pont).filter(v=>v!=null);
  const pontGeral=pts.length?pts.reduce((a,b)=>a+b,0)/pts.length:null;
  const eP=document.getElementById('h-pont');eP.textContent=pontGeral!=null?n1(pontGeral):'—';
  const cP=band(pontGeral);eP.style.color=cellFg(cP);
  document.getElementById('h-sub').textContent=`de 100 pontos · ${selUni.length?selUni.length+' unidade(s)':rows.length?[...new Set(rows.map(o=>o.unidade))].length+' unidades':'—'} · ${periodo}`;

  // ── Cards: média por IC (×100) + cross-painel ──
  const avgIC=ci=>{const vs=rows.map(o=>o.ic[ci]).filter(v=>v!=null);return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length*100:null;};
  let cards=IC.map((d,i)=>({lbl:d.l,val:avgIC(i),fmt:'pct'}));
  // cross-painel (nível empresa, ignora filtro de unidade pois usam outra nomenclatura)
  const yr=selD.getFullYear(),mi=selD.getMonth();
  if(XPANEL.fca){const v=fcaAderAte(XPANEL.fca,yr,mi);cards.push({lbl:'Aderência FCA',val:v,fmt:'pct',xp:1});}
  if(XPANEL.disp){const v=XPANEL.disp[vigKeyN(selD)];cards.push({lbl:'Dispersão de km (YTD)',val:v,fmt:'pctlow',xp:1});}
  if(XPANEL.dpo){const v=XPANEL.dpo.frac*100;cards.push({lbl:'DPO/VPO Sustentável',val:v,fmt:'pct',xp:1,meta:XPANEL.dpo.sem?XPANEL.dpo.sem+' · '+XPANEL.dpo.below+'/'+XPANEL.dpo.tot+' abaixo N3':''});}
  const cardsHtml=cards.map(c=>{
    let cls,disp;
    if(c.fmt==='pctlow'){ // menor melhor (dispersão, meta 5%)
      disp=c.val==null?'—':c.val.toFixed(1)+'%';cls=c.val==null?'':(c.val<=5?'g':c.val<=6?'a':'r');
    }else{disp=c.val==null?'—':Math.round(c.val)+'%';cls=band(c.val);}
    return `<div class="kpi ${cls}"><div class="kpi-lbl">${c.lbl}${c.xp?' ·':''}</div><div class="kpi-val ${cls}">${disp}</div>${c.meta?`<div class="kpi-meta">${c.meta}</div>`:(c.xp?'<div class="kpi-meta">nível empresa</div>':'')}</div>`;
  }).join('');
  document.getElementById('cards').innerHTML=cardsHtml||'<div class="loading">Sem dados</div>';

  // ── Ranking de unidades (média no período por unidade) ──
  const unis=[...new Set(rows.map(o=>o.unidade))];
  const data=unis.map(u=>{
    const ur=rows.filter(o=>o.unidade===u);
    const ic=IC.map((d,i)=>{const vs=ur.map(o=>o.ic[i]).filter(v=>v!=null);return vs.length?vs.reduce((a,b)=>a+b,0)/vs.length*100:null;});
    const pv=ur.map(o=>o.pont).filter(v=>v!=null);const pont=pv.length?pv.reduce((a,b)=>a+b,0)/pv.length:null;
    return {u,ic,pont};
  }).sort((a,b)=>(b.pont==null?-1:b.pont)-(a.pont==null?-1:a.pont));
  let html='<table><thead><tr class="cols"><th class="lft">#</th><th class="lft">Unidade</th>'+IC.map(d=>`<th>${d.l}</th>`).join('')+'<th>Pontuação</th></tr></thead><tbody>';
  data.forEach((r,idx)=>{
    html+=`<tr><td class="rank">${idx+1}º</td><td class="lft uni">${r.u}</td>`;
    r.ic.forEach(v=>{const cl=band(v);html+=`<td><span class="cell" style="background:${cellBg(cl)};color:${cellFg(cl)}">${v==null?'—':Math.round(v)+'%'}</span></td>`;});
    const cp=band(r.pont);html+=`<td><span class="cell pont" style="background:${cellBg(cp)};color:${cellFg(cp)}">${r.pont==null?'—':n1(r.pont)}</span></td></tr>`;
  });
  html+='</tbody></table>';
  document.getElementById('tbl').innerHTML=data.length?html:'<div class="loading">Sem dados com os filtros</div>';
}

async function carregar(){
  document.getElementById('status').textContent='Carregando…';
  try{
    const icRows=await gviz(SRC.ics);
    // cross-painel: best-effort (não bloqueia se falhar)
    const [kmR,dpoR,fcaR]=await Promise.all([gviz(SRC.km).catch(()=>null),gviz(SRC.dpo).catch(()=>null),gviz(SRC.fca).catch(()=>null)]);
    XPANEL={};
    if(kmR)try{XPANEL.disp=compDisp(kmR);}catch(e){}
    if(dpoR)try{XPANEL.dpo=compDPO(dpoR);}catch(e){}
    if(fcaR)try{XPANEL.fca=compFCA(fcaR);}catch(e){}
    ICS=icRows.filter(r=>r[0]&&r[1]&&parseD(r[0])).map(r=>{const vigD=parseD(r[0]);return{vigD,unidade:String(r[1]).trim(),ic:IC.map(d=>r[d.c]!=null?+r[d.c]:null),pont:r[13]!=null?+r[13]:null};});
    const vm=new Map();ICS.forEach(o=>vm.set(vigKeyN(o.vigD),o.vigD));
    VIGS=[...vm.values()].sort((a,b)=>vigKeyN(a)-vigKeyN(b));
    const vigItems=VIGS.map(d=>vigLbl(d));
    // auto: última vigência COM dados (pontuação preenchida)
    const comDados=vigItems.filter(v=>ICS.some(o=>vigLbl(o.vigD)===v&&o.pont!=null));
    const base=comDados.length?comDados:vigItems;
    const vw=document.getElementById('ms-vig');if(base.length)vw._sel=new Set([base[base.length-1]]);
    buildMsFilter('ms-vig',vigItems);
    buildMsFilter('ms-uni',[...new Set(ICS.map(o=>o.unidade))].sort());
    atualizar();
    const now=new Date();document.getElementById('status').textContent=`${now.toLocaleDateString('pt-BR')} ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`;
  }catch(e){console.error(e);document.getElementById('status').textContent='Erro ao carregar';}
}
