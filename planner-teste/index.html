<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="build" content="202608081300">
<title>Painel de Gestão · Planner</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================================
   PAINEL DE GESTÃO — lê o planner oficial. Layout do "Task Board"
   (risco de prazo na lateral do card) nos TONS LARANJA/PRETO, os
   mesmos do /planner-teste-2/ — lá o card usa faixa-rótulo no topo,
   aqui o risco lateral; a paleta é a mesma nos dois.
   A urgência vira intensidade de laranja: vencida em laranja forte,
   no prazo em âmbar apagado.
   ============================================================ */

:root{
  /* ══ PALETA MEDIDA na imagem de referência (amostragem por pixel) ══
     foto de fundo  topo-esq #283D67 · topo-centro #101F46 · direita
                    #213352 · rodapé #0C1323  → o degradê abaixo repete
                    esse tom, já que não temos a foto;
     sidebar        #141C30   painel #0D1520   card #222531
     card DONE      #161B27
     azul   #1986B1 (borda) · #0C8BB9 (barra)
     vermelho #DD5B60 (borda) · #E05852 (barra)
     trilho #262934
     textos  título #FFFFFF · card #EEF2FA · coluna #676F83 ·
             id #4C505C · lateral #B2BCD2 · seção #505B75 ·
             card apagado #9196A2                                    */
  /* fundo do visao-financeira: gradiente sutil laranja + azul sobre o --bg */
  --fundo:
    radial-gradient(ellipse at 10% 25%, rgba(249,115,22,.06) 0%, transparent 50%),
    radial-gradient(ellipse at 90% 75%, rgba(56,189,248,.05) 0%, transparent 50%),
    #0C1017;
  --app:      rgba(10,13,20,.36);
  --side:     rgba(14,18,28,.38);
  --linha:    rgba(255,255,255,.06);
  --card:     rgba(28,34,48,.52);
  --brilho:   linear-gradient(180deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,0) 46%);
  --card-brd: rgba(255,255,255,.07);
  --txt:      #EEF2FA;
  --txt2:     #B2BCD2;
  --txt3:     #676F83;
  --txt4:     #4C505C;
  --hover:    rgba(255,255,255,.06);
  --azul:     #2E90E8;
  --azul-b:   #2E90E8;
  --verde:    #3BB33B;
  --vermelho: #FF5252;
  --verm-b:   #E05852;
  --cinza:    #5B657C;
  --trilho:   #262934;
  --sombra:   0 2px 10px rgba(0,0,0,.30);
}
body.claro{
  --fundo: #F0F0F0;
  --app:      rgba(255,255,255,.34);
  --side:     rgba(255,255,255,.36);
  --linha:    rgba(15,23,42,.10);
  --card:     rgba(255,255,255,.72);
  --brilho:   linear-gradient(180deg, rgba(255,255,255,.6) 0%, rgba(255,255,255,0) 46%);
  --card-brd: rgba(15,23,42,.10);
  --txt:      #161D2B;
  --txt2:     #4A5568;
  --txt3:     #737D91;
  --txt4:     #8B94A6;
  --hover:    rgba(15,23,42,.05);
  --azul:     #1B6FC4;
  --azul-b:   #1B6FC4;
  --verde:    #0E8C0E;
  --vermelho: #E03131;
  --verm-b:   #D2453F;
  --cinza:    #939CAF;
  --trilho:   rgba(15,23,42,.13);
  --sombra:   0 2px 8px rgba(15,23,42,.10);
}

*{margin:0;padding:0;box-sizing:border-box;}
/* barra de rolagem no tom do painel — a padrão vem branca e salta aos olhos */
@supports not selector(::-webkit-scrollbar){
  *{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--txt3) 42%,transparent) transparent;}
}
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--txt3) 42%,transparent);
  border:3px solid transparent;background-clip:content-box;border-radius:9px;}
::-webkit-scrollbar-thumb:hover{background:color-mix(in srgb,var(--txt3) 72%,transparent);
  background-clip:content-box;}
::-webkit-scrollbar-corner{background:transparent;}
::-webkit-scrollbar-button{display:none;width:0;height:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Montserrat',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:13px;color:var(--txt);
  background:var(--fundo);
  overflow:hidden;
}

/* ── painel do app, flutuando sobre a foto ── */
.app{
  position:absolute;inset:34px;display:flex;
  border-radius:22px;overflow:hidden;
  border:1px solid rgba(255,255,255,.10);box-shadow:0 24px 60px rgba(0,0,0,.5);
}
.app::before{content:'';position:absolute;inset:0;background:var(--app);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:0;}
.side,.board{position:relative;z-index:1;}

/* ── barra lateral ── */
.side{
  width:256px;flex:0 0 256px;display:flex;flex-direction:column;
  background:var(--side);border-right:1px solid var(--linha);padding:16px 10px 12px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.s-top{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;}
.s-top b{flex:1;font-size:13.5px;font-weight:600;}
.s-search{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;margin-bottom:14px;}
.s-search:hover{background:var(--hover);}
.s-search input{flex:1;min-width:0;background:transparent;border:0;outline:0;
  font-family:inherit;font-size:12.5px;color:var(--txt);}
.s-search input::placeholder{color:var(--txt2);}
.s-kbd{font-size:10.5px;color:var(--txt3);white-space:nowrap;}
.s-sec{display:flex;align-items:center;gap:6px;padding:16px 8px 8px;
  font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:1.1px;}
.s-sec b{flex:1;font-weight:600;}
.s-sec svg{opacity:.7;}
.s-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:0;border-radius:7px;
  background:transparent;color:var(--txt2);font-family:inherit;font-size:12.5px;font-weight:500;
  text-align:left;cursor:pointer;}
.s-item:hover{background:var(--hover);color:var(--txt);}
.s-item.on{background:var(--hover);color:var(--txt);font-weight:600;}
.s-item.pai{color:var(--txt);font-weight:600;cursor:default;}
.s-item.pai:hover{background:transparent;}
.s-item.filho{padding-left:26px;}
.s-item .n{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:600;}
.s-user{margin-top:auto;display:flex;align-items:center;gap:9px;padding:12px 8px 2px;border-top:1px solid var(--linha);}
.s-user div{flex:1;min-width:0;}
.s-user b{display:block;font-size:12px;font-weight:600;line-height:1.2;}
.s-sair{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;
  color:var(--txt3);text-decoration:none;flex:0 0 26px;}
.s-sair:hover{background:var(--hover);color:var(--txt);}
.s-user i{display:block;font-size:9.5px;font-style:normal;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}

/* ── área do quadro ── */
.board{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;gap:6px;padding:20px 24px 14px;}
.top h1{flex:1;font-size:21px;font-weight:600;letter-spacing:-.3px;}
.tool{display:flex;align-items:center;gap:7px;background:transparent;border:0;border-radius:7px;
  padding:6px 10px;color:var(--txt2);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;}
.tool:hover{background:var(--hover);color:var(--txt);}
.tool.on{background:var(--hover);color:var(--txt);}
.menu-wrap{position:relative;}
.menu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:40;min-width:214px;
  background:var(--brilho), var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--card-brd);border-radius:10px;padding:6px;
  box-shadow:0 18px 40px rgba(0,0,0,.5);}
body.claro .menu{box-shadow:0 18px 40px rgba(15,23,42,.16);}
.menu.open{display:block;}
.menu button,.menu label{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:7px;
  background:transparent;color:var(--txt);font-family:inherit;font-size:12.5px;text-align:left;cursor:pointer;}
.menu button:hover,.menu label:hover{background:var(--hover);}
.menu .tit{padding:8px 9px 4px;font-size:10px;font-weight:600;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1px;}
.menu input[type=checkbox]{accent-color:var(--azul);width:14px;height:14px;flex:0 0 14px;cursor:pointer;}
.menu .rol{max-height:250px;overflow:auto;}

/* ── colunas ── */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
  padding:0 24px 24px;overflow:auto;align-items:start;}
.col{display:flex;flex-direction:column;min-height:56px;border-radius:10px;}
.col.over{background:rgba(46,155,214,.10);box-shadow:0 0 0 1px rgba(46,155,214,.35) inset;}
.chead{display:flex;align-items:center;gap:8px;padding:2px 2px 12px;}
.cname{font-size:10.5px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:1.3px;}
.cnum{font-size:10.5px;font-weight:600;color:var(--txt3);}
.ic{display:flex;align-items:center;justify-content:center;width:20px;height:20px;flex:0 0 20px;
  background:transparent;border:0;border-radius:5px;color:var(--txt3);cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;line-height:1;padding:0;}
.ic:hover{background:var(--hover);color:var(--txt);}
.chead .ic:first-of-type{margin-left:auto;}
.cbody{display:flex;flex-direction:column;gap:10px;}
.col.rec .cbody{display:none;}

/* ── card: chip-rótulo no topo em degradê laranja → cor do painel
      (padrão do hub); prazo em VERDE/VERMELHO, as cores das barras
      do FCA Gerencial. Sem risco lateral. ── */
.card{position:relative;overflow:hidden;background:var(--brilho), var(--card);
  border:1px solid var(--card-brd);border-radius:10px;padding:0 0 12px;cursor:grab;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sombra);}
.card.venc{--pz:var(--vermelho);} .card.ok{--pz:var(--verde);}
.card.sem,.card.bkl{--pz:var(--cinza);}
.card:active{cursor:grabbing;} .card.arrasta{opacity:.35;}
.card:hover{border-color:rgba(249,115,22,.45);}
.card.fim{opacity:.55;} .card.fim:hover{opacity:.95;}
.chip{display:flex;align-items:center;gap:7px;height:26px;padding:0 12px;margin-bottom:11px;
  font-size:10px;font-weight:700;letter-spacing:.4px;color:#FFF7ED;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg, rgba(249,115,22,.92) 0%, rgba(249,115,22,.42) 46%, rgba(249,115,22,0) 100%);
  border-bottom:1px solid rgba(249,115,22,.28);}
body.claro .chip{color:#3A1D07;}
.chip i{width:11px;height:11px;flex:0 0 11px;border-radius:3px;border:1.5px solid rgba(255,247,237,.8);}
body.claro .chip i{border-color:rgba(58,29,7,.7);}
.chip b{margin-left:auto;font-weight:600;opacity:.6;font-size:9px;letter-spacing:.5px;}
.ctit{font-size:13px;font-weight:600;line-height:1.32;padding:0 13px;}
.cmeta{margin-top:6px;font-size:10.5px;color:var(--txt2);padding:0 13px;}
.cmeta .atraso{color:var(--vermelho);font-weight:600;}
.cfoot{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:24px;padding:0 13px;}
.bar{flex:1;height:5px;border-radius:3px;background:var(--trilho);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:3px;background:var(--pz,var(--cinza));}

.avs{display:flex;align-items:center;margin-left:auto;}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#0b1119;background:var(--av,#94A3B8);flex:0 0 24px;
  box-shadow:0 1px 4px rgba(0,0,0,.25);}
.add-av{width:24px;height:24px;border-radius:50%;margin-left:auto;background:transparent;
  border:1px dashed var(--trilho);color:var(--txt3);font-family:inherit;font-size:13px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;}
.add-av:hover{border-color:var(--verde);color:var(--verde);}
.cvazia{padding:12px 2px;font-size:12px;color:var(--txt3);}

/* ── visões Tabela / Relatório / Resumo ── */
.cols.solto{display:block;}
.tab-wrap{overflow:auto;border:1px solid var(--card-brd);border-radius:10px;background:var(--card);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
table.tab{width:100%;border-collapse:collapse;font-size:12px;}
table.tab thead th{position:sticky;top:0;z-index:2;background:var(--card);text-align:left;
  padding:11px 12px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;
  letter-spacing:.8px;border-bottom:1px solid var(--card-brd);white-space:nowrap;}
table.tab td{padding:11px 12px;border-bottom:1px solid var(--linha);color:var(--txt2);vertical-align:top;
  white-space:nowrap;}
table.tab td.forte{color:var(--txt);font-weight:600;}
table.tab td.livre{white-space:normal;min-width:230px;line-height:1.45;}
table.tab td.suave{color:var(--txt3);}
table.tab td.num{text-align:right;white-space:nowrap;}
table.tab tbody tr{cursor:pointer;}
table.tab tbody tr:hover{background:var(--hover);}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;}
.atraso{color:var(--vermelho);font-weight:600;}

.resumo{display:flex;flex-direction:column;gap:14px;}
.heros{display:flex;gap:44px;}
.hl{font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:1.1px;}
.hn{font-size:40px;font-weight:800;line-height:1.05;letter-spacing:-1px;margin-top:2px;}
.faixas{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;font-size:10.5px;color:var(--txt2);}
.faixas i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px;}
.faixas .obs{color:var(--txt3);font-style:italic;}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.kpi{background:var(--card);border:1px solid var(--card-brd);border-radius:10px;padding:12px 14px 13px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.kpi .pt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;}
.kpi .kl{font-size:9.5px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.7px;}
.kpi b{display:block;margin-top:6px;font-size:26px;font-weight:800;line-height:1;}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.bloco{background:var(--card);border:1px solid var(--card-brd);border-radius:10px;padding:14px 16px 12px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}
.bloco h3{font-size:11px;font-weight:700;color:var(--txt);text-transform:uppercase;letter-spacing:1.1px;}
.bhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bhead h3{flex:1;margin:0;}
.toggle{display:flex;border:1px solid var(--card-brd);border-radius:7px;overflow:hidden;}
.toggle button{background:transparent;border:0;color:var(--txt3);font-family:inherit;font-size:10px;
  font-weight:700;text-transform:uppercase;letter-spacing:.7px;padding:6px 14px;cursor:pointer;}
.toggle button:hover{color:var(--txt);background:var(--hover);}
.toggle button.on{background:var(--vermelho);color:#0F0B07;}
.graf{display:flex;align-items:flex-end;gap:6px;height:190px;margin-top:14px;}
.gcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;}
.gv{font-size:9.5px;font-weight:800;color:var(--txt2);height:14px;}
.gbar{width:100%;border-radius:4px 4px 0 0;min-height:2px;}
.gl{margin-top:6px;font-size:9px;font-weight:600;color:var(--txt3);white-space:nowrap;}
table.res-tab td,table.res-tab th{border-bottom:1px solid var(--linha);}
table.res-tab tbody tr:hover{background:var(--hover);}
.pctcell{display:inline-block;min-width:52px;text-align:center;padding:3px 10px;border-radius:6px;
  font-weight:800;font-size:11px;color:#0F0B07;}
@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr);}.dois{grid-template-columns:1fr;}}


/* ── modal ── */
.mbg{display:none;position:fixed;inset:0;z-index:80;background:rgba(3,6,11,.55);backdrop-filter:blur(2px);
  align-items:center;justify-content:center;padding:20px;}
.mbg.open{display:flex;}
.modal{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--brilho), var(--card);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--card-brd);border-radius:14px;padding:22px 24px;box-shadow:0 30px 70px rgba(0,0,0,.6);}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;}
.f{margin-bottom:13px;}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.f3 .f{margin-bottom:0;}
.f label{display:block;font-size:10px;font-weight:600;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;}
.f input,.f select,.f textarea{width:100%;background:var(--hover);border:1px solid var(--card-brd);
  border-radius:8px;color:var(--txt);font-family:inherit;font-size:13px;padding:9px 11px;outline:0;}
body.claro .f input,body.claro .f select,body.claro .f textarea{background:#fff;border-color:#d7dce4;}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--azul);}
.f textarea{resize:vertical;min-height:70px;line-height:1.45;}
.f select option{background:#141d2b;color:#fff;}
body.claro .f select option{background:#fff;color:#0f172a;}
input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;}
.macoes{display:flex;justify-content:space-between;gap:10px;margin-top:18px;}
.b{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;}
.b.pri{background:var(--azul);color:#fff;}
.b.gho{background:transparent;color:var(--txt2);border:1px solid var(--card-brd);}
.b.del{background:transparent;color:var(--vermelho);border:1px solid rgba(228,100,92,.4);}

/* ── telas menores ── */
@media(max-width:1180px){ .cols{grid-template-columns:repeat(2,1fr);} }
@media(max-width:860px){
  body{overflow:auto;}
  .app{position:static;inset:auto;min-height:100%;border-radius:0;flex-direction:column;box-shadow:none;}
  .side{width:auto;flex:none;flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center;
    border-right:0;border-bottom:1px solid var(--linha);padding:10px;}
  .s-sec,.s-item.filho,.s-item.pai,.s-user,.s-top{display:none;}
  .s-search{margin:0;flex:1 0 100%;background:var(--hover);}
  .cols{grid-template-columns:1fr;overflow:visible;padding:0 14px 24px;}
  .top{padding:14px 14px 10px;}
  .top h1{font-size:18px;}
}
</style>
</head>
<body>

<div class="app">
  <!-- ══════════ barra lateral ══════════ -->
  <aside class="side">
    <div class="s-top">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 13l10 5 10-5"/></svg>
      <b>Painel de Gestão</b>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
    </div>

    <label class="s-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".8"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input type="text" id="busca" placeholder="Pesquisar" autocomplete="off">
      <span class="s-kbd">Ctrl + K</span>
    </label>

    <div class="s-sec"><b>Visões</b></div>
    <button class="s-item on" data-ver="kanban">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h5v16H4zM10 4h5v11h-5zM16 4h4v7h-4z"/></svg>
      Quadro
    </button>
    <button class="s-item" data-ver="tabela">

<script>
'use strict';
const SUPABASE_URL='https://lozwipoeacpvplgkrxkq.supabase.co';
const SUPABASE_KEY='sb_publishable_ggKEEebc5zjgQDVsF92Upw_6uoLmKe9';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ── etapas do quadro ↔ status gravados no planner oficial ──
// O que aparece na coluna é o RÓTULO; o que vai para o banco é o
// status que o /planner-corporativo/ já usa. 'Backlog' é a única
// etapa nova (hoje nenhuma ação está nela).
const ETAPAS=[
  {k:'Backlog',       rot:'Backlog'},
  {k:'Não iniciada',  rot:'Planejando'},
  {k:'Em andamento',  rot:'Em execução'},
  {k:'Concluída',     rot:'Concluído'},
];
const CHAVES=ETAPAS.map(e=>e.k);
const ROTULO=Object.fromEntries(ETAPAS.map(e=>[e.k,e.rot]));
const STATUS=[...CHAVES,'Cancelada'];
const PADRAO='Não iniciada';
const PROG={'Backlog':0,'Não iniciada':15,'Em andamento':55,'Concluída':100,'Cancelada':100};
// Backlog é fila de ideias: sem prazo, fica fora de qualquer conta
const CONTA=r=>!(r.status==='Backlog' && !r.prazo);
const ASSUNTOS=['Governança','Custos','Projetos','Disponibilidade','Xadrez de Frota','Capacitação Técnica',
  'Contratos de Manutenção','Contratos de Locação','Km Rodado','Descarte de Resíduos','Pneus','Stress Test','CIVF',
  'Conformidade da Frota','Estoque','Demarco','DPO/VPO','Combustível','Manutenção','MTBF','MTTR',
  'Blitz de Segurança','Checklist','Viagens','Processos'];

let sb=null, LINHAS=[], NOMES=[], EU='';
let BUSCA='', VISAO='', VER='kanban', RESUMO_POR='assunto', RESP=new Set(), ASS=new Set();
const RECOLHIDAS=new Set();

/* ── utilidades ── */
const hoje=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
function estadoPrazo(r){
  if(r.status==='Backlog') return 'bkl';        // fila de ideias: não tem prazo
  if(r.status==='Concluída'||r.status==='Cancelada') return 'ok';
  if(!r.prazo) return 'sem';
  return new Date(r.prazo+'T00:00:00') < hoje() ? 'venc' : 'ok';
}
const dias=iso=>Math.round((new Date(iso+'T00:00:00')-hoje())/86400000);
const dataBR=iso=>iso?iso.split('-').reverse().join('/'):'';
const desde=iso=>iso?(Date.now()-new Date(iso))/864e5:Infinity;
function iniciais(n){
  const p=String(n||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  return (p.length>1?p[0][0]+p[p.length-1][0]:p[0].slice(0,2)).toUpperCase();
}
function cor(n){let h=0;const s=String(n||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return `hsl(${Math.abs(h)%360} 52% 68%)`;}
const nomeFmt=s=>{s=String(s||'').trim().replace(/\s+/g,' ');if(!s)return '';
  const p=s.split(' ');return p.length>1?p[0]+' '+p[p.length-1]:p[0];};
// no lugar do número da referência: assunto + um id curto e estável
const idCurto=r=>String(r.id).replace(/[^0-9a-z]/gi,'').slice(-6).toUpperCase();

/* ── dados ── */
const doBanco=d=>({id:d.id,assunto:d.assunto||'',acao:d.acao||'',resp:d.responsavel||'',
  prazo:d.prazo||'',status:STATUS.includes(d.status)?d.status:PADRAO,
  obs:d.acompanhamento||'',criado:d.created_at||''});

async function carregar(){
  const {data,error}=await sb.from('planner').select('*').order('created_at',{ascending:true});
  if(error){ $('cols').innerHTML=`<div class="cvazia">Erro ao carregar: ${esc(error.message)}</div>`; return; }
  LINHAS=(data||[]).map(doBanco);
  montaMenus(); render();
}

/* ── filtros ── */
function daVisao(r,v){
  if(v==='minhas')   return !!EU && nomeFmt(r.resp)===EU;
  if(v==='vencidas') return estadoPrazo(r)==='venc';
  if(v==='semprazo') return !r.prazo && r.status!=='Backlog';
  if(v==='semresp')  return !r.resp;
  if(v==='recentes') return desde(r.criado)<=7;
  if(v==='concl3s')  return r.status==='Concluída' && desde(r.criado)<=21;
  return true;
}
function passa(r){
  if(BUSCA && ![r.acao,r.assunto,r.resp,r.obs].some(x=>String(x||'').toLowerCase().includes(BUSCA))) return false;
  if(RESP.size && !RESP.has(r.resp)) return false;
  if(ASS.size && !ASS.has(r.assunto)) return false;
  return daVisao(r,VISAO);
}

/* ── render ── */
function card(r){
  const pz=estadoPrazo(r);
  const fim=(r.status==='Concluída'||r.status==='Cancelada')?' fim':'';
  const pct=PROG[r.status]!=null?PROG[r.status]:0;
  let meta;
  if(r.status==='Backlog') meta='';             // Backlog não fala de prazo
  else if(!r.prazo) meta='sem prazo';
  else if(pz==='venc') meta=`<span class="atraso">${dataBR(r.prazo)} · ${Math.abs(dias(r.prazo))}d de atraso</span>`;
  else meta=dataBR(r.prazo)+(r.status==='Concluída'||r.status==='Cancelada'?'':` · ${dias(r.prazo)}d`);
  const av=r.resp
    ? `<div class="avs"><span class="av" style="--av:${cor(r.resp)}" title="${esc(r.resp)}">${esc(iniciais(r.resp))}</span></div>`
    : `<button class="add-av" title="Definir responsável">+</button>`;
  // barra = quanto a ação andou (pela etapa), na cor do PRAZO:
  // vermelha se vencida, azul se no prazo, cinza sem prazo
  // sem prazo não há o que medir: Backlog não mostra barra
  const barra = r.status==='Backlog' ? '<div class="bar" style="visibility:hidden"></div>'
              : `<div class="bar"><i style="width:${Math.max(pct,4)}%"></i></div>`;
  return `<article class="card ${pz}${fim}" draggable="true" data-id="${esc(r.id)}">
    <div class="chip"><i></i>${esc(r.assunto||'Sem assunto')}<b>${idCurto(r)}</b></div>
    <div class="ctit">${esc(r.acao)||'(sem título)'}</div>
    ${meta?`<div class="cmeta">${meta}</div>`:''}
    <div class="cfoot">${barra}${av}</div>
  </article>`;
}
function render(){
  const vis=LINHAS.filter(passa);
  $('cols').className = VER==='kanban' ? 'cols' : 'cols solto';
  if(VER==='tabela'){ $('cols').innerHTML=htmlTabela(vis); pintaLateral(); return; }
  if(VER==='relatorio'){ $('cols').innerHTML=htmlRelatorio(vis); pintaLateral(); return; }
  if(VER==='resumo'){ $('cols').innerHTML=htmlResumo(vis); pintaLateral(); return; }
  $('cols').innerHTML=ETAPAS.map(e=>{
    const cards=vis.filter(r=>(r.status||PADRAO)===e.k)
      .sort((a,b)=>(a.prazo||'9999-99-99').localeCompare(b.prazo||'9999-99-99'));
    return `<section class="col${RECOLHIDAS.has(e.k)?' rec':''}" data-etapa="${esc(e.k)}">
      <div class="chead">
        <span class="cname">${e.rot}</span><span class="cnum">${cards.length}</span>
        <button class="ic" title="Nova ação" data-novo="${esc(e.k)}">+</button>
        <button class="ic" title="Recolher coluna" data-rec="${esc(e.k)}">···</button>
      </div>
      <div class="cbody">${cards.length?cards.map(card).join(''):'<div class="cvazia">—</div>'}</div>
    </section>`;
  }).join('');
  pintaLateral();
}
function pintaLateral(){
  document.querySelectorAll('.n[data-n]').forEach(el=>{
    el.textContent=LINHAS.filter(r=>daVisao(r,el.dataset.n)).length||'';
  });
  document.querySelectorAll('.s-item[data-vis]').forEach(b=>
    b.classList.toggle('on',!!b.dataset.vis && VISAO===b.dataset.vis));
  document.querySelectorAll('.s-item[data-ver]').forEach(b=>
    b.classList.toggle('on',VER===b.dataset.ver));
  $('btPessoas').classList.toggle('on',RESP.size>0);
  $('btFiltro').classList.toggle('on',ASS.size>0);
}

/* ══════════ VISÕES: Tabela · Relatório · Resumo ══════════ */
const pctTxt=(a,b)=>b?Math.round(a/b*100)+'%':'—';
function chip(st){
  const c={'Backlog':'var(--cinza)','Não iniciada':'var(--vermelho)','Em andamento':'#F4A100',
           'Concluída':'var(--azul)','Cancelada':'#6B7280'}[st]||'var(--cinza)';
  return `<span class="tag" style="background:color-mix(in srgb,${c} 22%,transparent);
    color:${c};border:1px solid color-mix(in srgb,${c} 45%,transparent)">${ROTULO[st]||esc(st)}</span>`;
}
function htmlTabela(rows){
  if(!rows.length) return '<div class="cvazia">Nenhuma ação com os filtros atuais</div>';
  const ord=[...rows].sort((a,b)=>(a.prazo||'9999-99-99').localeCompare(b.prazo||'9999-99-99'));
  return `<div class="tab-wrap"><table class="tab">
    <thead><tr><th>Assunto</th><th>Ação</th><th>Responsável</th><th>Prazo</th><th>Etapa</th><th>Situação</th></tr></thead>
    <tbody>${ord.map(r=>{
      const pz=estadoPrazo(r);
      const sit=pz==='bkl'?'<span style="color:var(--txt3)">—</span>'
              :(pz==='venc'?`<span class="atraso">Vencida · ${Math.abs(dias(r.prazo))}d</span>`
              :(pz==='sem'?'<span style="color:var(--txt3)">Sem prazo</span>'
              :`<span style="color:var(--verde)">No prazo</span>`));
      return `<tr data-id="${esc(r.id)}"><td>${esc(r.assunto)||'—'}</td><td class="forte">${esc(r.acao)||'—'}</td>
        <td>${esc(r.resp)||'—'}</td><td>${r.status==='Backlog'?'—':(r.prazo?dataBR(r.prazo):'—')}</td><td>${chip(r.status)}</td><td>${sit}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}
function htmlRelatorio(rows){
  if(!rows.length) return '<div class="cvazia">Nenhuma ação com os filtros atuais</div>';
  const ord=[...rows].sort((a,b)=>(a.prazo||'9999-99-99').localeCompare(b.prazo||'9999-99-99'));
  return `<div class="tab-wrap"><table class="tab rel">
    <thead><tr><th>Assunto</th><th>Ação</th><th>Acompanhamento</th><th>Responsável</th><th>Prazo</th><th>Etapa</th></tr></thead>
    <tbody>${ord.map(r=>`<tr data-id="${esc(r.id)}">
      <td>${esc(r.assunto)||'—'}</td><td class="forte livre">${esc(r.acao)||'—'}</td>
      <td class="livre suave">${esc(r.obs)||'—'}</td><td>${esc(r.resp)||'—'}</td>
      <td>${r.status==='Backlog'?'—':(r.prazo?dataBR(r.prazo):'—')}</td><td>${chip(r.status)}</td></tr>`).join('')}</tbody></table></div>`;
}
function htmlResumo(rows){
  // ── regra do FCA Gerencial, copiada de fca-gerencial/index.html ──
  // prazo: Concluída conta como "No prazo"; senão, prazo < hoje = Vencida
  // pPrazo = noPrazo/tt · pConcl = concluídas/tt
  // total  = (concl*100 + andamento*50 + não iniciada*0) / tt
  // faixas: <70% crítico · 70–85% atenção · ≥85% adequado
  const base=rows.filter(r=>r.status!=='Backlog' && r.status!=='Cancelada');
  const met=lista=>{
    const tt=lista.length; let noP=0,venc=0,concl=0,andam=0,nini=0;
    lista.forEach(o=>{
      const vencida = o.status!=='Concluída' && o.prazo && new Date(o.prazo+'T00:00:00')<hoje();
      vencida?venc++:noP++;
      if(o.status==='Concluída')concl++; else if(o.status==='Em andamento')andam++; else nini++;
    });
    return {tt,noP,venc,concl,andam,nini,
      pPrazo:tt?noP/tt*100:null, pConcl:tt?concl/tt*100:null,
      total:tt?(concl*100+andam*50)/tt:null};
  };
  const faixa=v=>v==null?'var(--txt3)':(v<70?'#FF5252':(v<85?'#F4A100':'#3BB33B'));
  const pc=v=>v==null?'—':Math.round(v)+'%';
  const g=met(base);

  const kpi=(rot,val,cor)=>`<div class="kpi"><span class="pt" style="background:${cor}"></span>
      <span class="kl">${rot}</span><b>${val}</b></div>`;

  // ── séries mensais pelo mês do PRAZO (Backlog fica de fora) ──
  const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const meses=[]; const ref=new Date(); ref.setDate(1); ref.setHours(0,0,0,0);
  for(let i=7;i>=-4;i--){ const d=new Date(ref); d.setMonth(d.getMonth()-i); meses.push(d); }
  const serie=getP=>meses.map(d=>{
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    return {lbl:MES[d.getMonth()]+'/'+String(d.getFullYear()).slice(2),
            v:getP(met(base.filter(r=>r.prazo&&r.prazo.slice(0,7)===k)))};
  });
  const grafico=(titulo,dados)=>`<div class="bloco"><h3>${titulo}</h3><div class="graf">
      ${dados.map(d=>`<div class="gcol">
        <div class="gv">${d.v==null?'':Math.round(d.v)+'%'}</div>
        <div class="gbar" style="height:${d.v==null?0:Math.max(d.v,2)}%;
             background:color-mix(in srgb,${faixa(d.v)} 30%,transparent);
             border:1px solid ${faixa(d.v)}"></div>
        <div class="gl">${d.lbl}</div></div>`).join('')}
    </div></div>`;

  // ── tabela: Assunto (padrão) ou Pessoa ──
  const campo = RESUMO_POR==='resp' ? 'resp' : 'assunto';
  const g2={}; base.forEach(r=>{const k=r[campo]||'—';(g2[k]=g2[k]||[]).push(r);});
  const itens=Object.entries(g2).map(([k,l])=>({k,...met(l)}))
    .sort((a,b)=>(b.total??-1)-(a.total??-1)||b.tt-a.tt);

  return `<div class="resumo">
    <div class="heros">
      <div><div class="hl">Aderência ao prazo</div>
           <div class="hn" style="color:${faixa(g.pPrazo)}">${pc(g.pPrazo)}</div></div>
      <div><div class="hl">Aderência à conclusão</div>
           <div class="hn" style="color:${faixa(g.pConcl)}">${pc(g.pConcl)}</div></div>
    </div>
    <div class="faixas">
      <span><i style="background:#FF5252"></i>&lt; 70% — Crítico</span>
      <span><i style="background:#F4A100"></i>≥ 70% e &lt; 85% — Atenção</span>
      <span><i style="background:#3BB33B"></i>≥ 85% — Adequado</span>
      <span class="obs">Backlog e canceladas fora da conta</span>
    </div>
    <div class="kpis">
      ${kpi('Total de ações',g.tt,'var(--txt3)')}
      ${kpi('Concluídas',g.concl,'#3BB33B')}
      ${kpi('Em execução',g.andam,'#F4A100')}
      ${kpi('Planejando',g.nini,'#FF5252')}
      ${kpi('No prazo',g.noP,'#3BB33B')}
      ${kpi('Fora do prazo',g.venc,'#FF5252')}
    </div>
    <div class="dois">
      ${grafico('Aderência ao prazo · mensal',serie(m=>m.pPrazo))}
      ${grafico('Aderência à conclusão · mensal',serie(m=>m.pConcl))}
    </div>
    <div class="bloco">
      <div class="bhead"><h3>Aderência por ${campo==='resp'?'pessoa':'assunto'}</h3>
        <div class="toggle">
          <button class="${campo==='assunto'?'on':''}" data-por="assunto">Assunto</button>
          <button class="${campo==='resp'?'on':''}" data-por="resp">Pessoa</button>
        </div></div>
      <table class="tab res-tab"><thead><tr>
        <th>${campo==='resp'?'Pessoa':'Assunto'}</th><th class="num">TT ações</th>
        <th class="num">Conclusão</th><th class="num">Prazo</th><th class="num">Total</th>
      </tr></thead><tbody>
        ${itens.map(it=>`<tr>
          <td class="forte">${esc(it.k)}</td>
          <td class="num">${it.tt}</td>
          <td class="num" style="color:${faixa(it.pConcl)};font-weight:800">${pc(it.pConcl)}</td>
          <td class="num" style="color:${faixa(it.pPrazo)};font-weight:800">${pc(it.pPrazo)}</td>
          <td class="num"><span class="pctcell" style="background:${faixa(it.total)}">${pc(it.total)}</span></td>
        </tr>`).join('')}
      </tbody></table>
    </div>
  </div>`;
}

/* ── menus do topo ── */
function abreMenu(id){
  document.querySelectorAll('.menu.open').forEach(m=>{if(m.id!==id)m.classList.remove('open');});
  $(id).classList.toggle('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.menu-wrap')) document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
});
function montaMenus(){
  const pessoas=[...new Set([...NOMES,...LINHAS.map(r=>r.resp).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'pt'));
  $('lstPessoas').innerHTML=pessoas.length
    ? pessoas.map(n=>`<label><input type="checkbox" data-p="${esc(n)}" ${RESP.has(n)?'checked':''}> ${esc(n)}</label>`).join('')
    : '<div class="tit">ninguém cadastrado</div>';
  const assuntos=[...new Set([...LINHAS.map(r=>r.assunto).filter(Boolean),...ASSUNTOS])].sort((a,b)=>a.localeCompare(b,'pt'));
  $('lstAssuntos').innerHTML=assuntos.map(a=>
    `<label><input type="checkbox" data-a="${esc(a)}" ${ASS.has(a)?'checked':''}> ${esc(a)}</label>`).join('');
}
$('lstPessoas').addEventListener('change',e=>{
  const b=e.target; if(!b.dataset.p) return;
  b.checked?RESP.add(b.dataset.p):RESP.delete(b.dataset.p); render();
});
$('lstAssuntos').addEventListener('change',e=>{
  const b=e.target; if(!b.dataset.a) return;
  b.checked?ASS.add(b.dataset.a):ASS.delete(b.dataset.a); render();
});
function limpaFiltros(){
  RESP.clear(); ASS.clear(); VISAO=''; BUSCA=''; $('busca').value='';
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  montaMenus(); render();
}

/* ── barra lateral ── */
document.querySelectorAll('.s-item[data-vis]').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.vis;
  VISAO = (v && VISAO===v) ? '' : v;    // clicar de novo desliga
  render();
}));
const TIT={kanban:'Quadro',tabela:'Tabela',relatorio:'Relatório',resumo:'Resumo'};
document.querySelectorAll('.s-item[data-ver]').forEach(b=>b.addEventListener('click',()=>{
  VER=b.dataset.ver;
  document.querySelector('.top h1').textContent=TIT[VER];
  render();
}));
$('busca').addEventListener('input',()=>{ BUSCA=$('busca').value.trim().toLowerCase(); render(); });
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('busca').focus(); }
  if(e.key==='Escape'){ fechaModal(); document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')); }
});

/* ── cliques e arrastar dentro do quadro ── */
const cols=$('cols');
cols.addEventListener('click',e=>{
  const tg=e.target.closest('[data-por]'); if(tg){ RESUMO_POR=tg.dataset.por; render(); return; }
  const tr=e.target.closest('tr[data-id]'); if(tr){ abreModal(tr.dataset.id); return; }
  const novo=e.target.closest('[data-novo]'); if(novo){ novoCard(novo.dataset.novo); return; }
  const rec=e.target.closest('[data-rec]');
  if(rec){ const k=rec.dataset.rec; RECOLHIDAS.has(k)?RECOLHIDAS.delete(k):RECOLHIDAS.add(k); render(); return; }
  const c=e.target.closest('.card'); if(c) abreModal(c.dataset.id);
});
cols.addEventListener('dragstart',e=>{
  const c=e.target.closest('.card'); if(!c) return;
  e.dataTransfer.setData('text/plain',c.dataset.id); e.dataTransfer.effectAllowed='move';
  c.classList.add('arrasta');
});
cols.addEventListener('dragend',e=>{const c=e.target.closest('.card');if(c)c.classList.remove('arrasta');});
cols.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(!c)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';c.classList.add('over');});
cols.addEventListener('dragleave',e=>{const c=e.target.closest('.col');if(c)c.classList.remove('over');});
cols.addEventListener('drop',async e=>{
  const c=e.target.closest('.col'); if(!c) return;
  e.preventDefault(); c.classList.remove('over');
  const id=e.dataTransfer.getData('text/plain'), etapa=c.dataset.etapa;
  const r=LINHAS.find(x=>x.id===id); if(!r||r.status===etapa) return;
  const antes=r.status; r.status=etapa; render();
  const {error}=await sb.from('planner').update({status:etapa}).eq('id',id);
  if(error){ r.status=antes; render(); alert('Erro ao mover: '+error.message); }
});

/* ── modal ── */
let ID=null;
const opcoes=(lista,sel)=>'<option value="">—</option>'+
  lista.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');
function preenche(r){
  $('mAcao').value=r.acao||'';
  $('mAssunto').innerHTML=opcoes([...new Set([...(r.assunto?[r.assunto]:[]),...ASSUNTOS])],r.assunto||'');
  $('mResp').innerHTML=opcoes([...new Set([...(r.resp?[r.resp]:[]),...NOMES])],r.resp||'');
  $('mPrazo').value=r.prazo||'';
  $('mStatus').innerHTML=STATUS.map(k=>
    `<option value="${esc(k)}"${k===(r.status||PADRAO)?' selected':''}>${ROTULO[k]||k}</option>`).join('');
  $('mObs').value=r.obs||'';
}
function abreModal(id){
  const r=LINHAS.find(x=>x.id===id); if(!r) return;
  ID=id; $('mTit').textContent='Editar ação'; $('mDel').style.display='';
  preenche(r); $('mbg').classList.add('open'); setTimeout(()=>$('mAcao').focus(),40);
}
function novoCard(etapa){
  ID=null; $('mTit').textContent='Nova ação'; $('mDel').style.display='none';
  preenche({status:etapa||PADRAO});
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  $('mbg').classList.add('open'); setTimeout(()=>$('mAcao').focus(),40);
}
function fechaModal(){ $('mbg').classList.remove('open'); ID=null; }
$('mbg').addEventListener('click',e=>{ if(e.target===$('mbg')) fechaModal(); });
async function salvar(){
  const dados={assunto:$('mAssunto').value,acao:$('mAcao').value.trim(),responsavel:$('mResp').value,
    prazo:$('mPrazo').value||null,status:$('mStatus').value,acompanhamento:$('mObs').value.trim()};
  if(!dados.acao && !dados.responsavel && !dados.assunto){ fechaModal(); return; }
  if(ID){
    const r=LINHAS.find(x=>x.id===ID);
    const {error}=await sb.from('planner').update(dados).eq('id',ID);
    if(error){ alert('Erro ao salvar: '+error.message); return; }
    if(r) Object.assign(r,doBanco({id:ID,...dados,created_at:r.criado}));
  }else{
    const {data,error}=await sb.from('planner').insert(dados).select('*').single();
    if(error){ alert('Erro ao criar: '+error.message); return; }
    LINHAS.push(doBanco(data));
  }
  montaMenus(); render(); fechaModal();
}
async function excluir(){
  if(!ID||!confirm('Excluir esta ação?')) return;
  const {error}=await sb.from('planner').delete().eq('id',ID);
  if(error){ alert('Erro ao excluir: '+error.message); return; }
  LINHAS=LINHAS.filter(x=>x.id!==ID); render(); fechaModal();
}

/* ── tema: mesmo layout, só as superfícies mudam ── */
function aplicaTema(t){
  document.body.classList.toggle('claro',t==='light');
  localStorage.setItem('bi_theme',t);
  $('btTema').textContent = t==='light' ? 'Modo escuro' : 'Modo claro';
}
function trocaTema(){ aplicaTema(document.body.classList.contains('claro')?'dark':'light'); }
aplicaTema(localStorage.getItem('bi_theme')||'dark');

/* ── início ── */
const ADMIN_EMAIL='fortesindicadores@gmail.com';
function semAcesso(msg){
  $('cols').className='cols solto';
  $('cols').innerHTML=`<div class="bloco" style="max-width:520px;margin:40px auto;text-align:center">
    <h3 style="color:var(--vermelho)">Acesso restrito</h3><p style="font-size:13px;color:var(--txt2);line-height:1.5">${esc(msg)}</p></div>`;
}
async function iniciar(){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ location.replace('../'); return; }
  let prof=null;
  try{ const r=await sb.from('fca_profiles').select('is_admin').eq('user_id',session.user.id).maybeSingle(); prof=r.data; }catch(e){}
  if(!((prof&&prof.is_admin)||session.user.email===ADMIN_EMAIL)){
    semAcesso('Você está logado, mas não tem perfil de administrador. Fale com o corporativo para liberar seu acesso.');
    return;
  }
  try{
    const {data:profs}=await sb.from('fca_profiles').select('user_id,nome').eq('is_admin',true);
    const lbl=new Map((profs||[]).map(p=>[p.user_id,(p.nome||'').trim()]));
    const ids=[...lbl.keys()];
    if(ids.length){
      try{
        const {data:apps}=await sb.from('user_approvals').select('user_id,name,email').in('user_id',ids);
        (apps||[]).forEach(a=>{ if(!lbl.get(a.user_id)) lbl.set(a.user_id,(a.name||a.email||'').trim()); });
      }catch(e){}
    }
    NOMES=[...new Set([...lbl.values()].map(nomeFmt).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
  }catch(e){}
  EU=nomeFmt((session.user.user_metadata&&session.user.user_metadata.name)||session.user.email||'');
  if(EU && !NOMES.includes(EU)) NOMES.unshift(EU);
  $('euNome').textContent=EU||'—';
  $('euAv').textContent=iniciais(EU);
  $('euAv').style.setProperty('--av',cor(EU));
  await carregar();
}
iniciar();
</script>
