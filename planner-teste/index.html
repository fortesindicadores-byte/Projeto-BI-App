<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="build" content="202608080200">
<title>Planner Corporativo · TESTE</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="../assets/planner-teste-shim.js?v=202608080200"></script>
<script src="../assets/gantt-view.js?v=202608080120"></script>
<style>
:root{--bg:#0C1017;--card:#141B26;--border:#1E2D40;--orange:#F97316;--blue:#38BDF8;--text:#F1F5F9;--text2:#94A3B8;--text3:#475569;--green:#3BB33B;--red:#FF6666;--amber:#F4A100;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:radial-gradient(ellipse at 10% 25%,rgba(249,115,22,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 75%,rgba(56,189,248,.05) 0%,transparent 50%),var(--bg);color:var(--text);font-family:'Montserrat',-apple-system,sans-serif;font-size:13px;min-height:100vh;}
.header{background:rgba(12,16,23,.75);border-bottom:1px solid rgba(255,255,255,.07);padding:10px 24px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.3);}
.brand{flex:1;}.brand h1{font-size:18px;font-weight:800;color:var(--orange);line-height:1.1;}.brand p{font-size:10px;color:var(--text2);margin-top:2px;font-style:italic;}
.brand-eyebrow{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:1.2px;font-weight:700;margin-bottom:2px;}
.hfilter{display:flex;flex-direction:column;gap:2px;}
.hfilter label{font-size:9px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.hfilter select{background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 10px;cursor:pointer;max-width:220px;outline:none;}
.hfilter select:hover{border-color:var(--orange);}
.hfilter select option{background:#0f1824;color:#fff;}
/* filtro multi-select padrão */
.ms-wrap{position:relative;}
.ms-btn{display:flex;align-items:center;gap:8px;background:#0a0f18;color:var(--text);border:1px solid #2a3a50;border-radius:4px;font-family:'Montserrat',sans-serif;font-size:11px;font-weight:700;padding:6px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;min-width:130px;}
.ms-btn:hover{border-color:var(--orange);}
.ms-lbl{flex:1;text-align:left;}
.ms-cnt{background:var(--orange);color:#000;border-radius:10px;padding:1px 6px;font-size:9px;font-weight:800;display:none;}
.ms-panel{display:none;flex-direction:column;position:absolute;top:calc(100% + 4px);right:0;z-index:500;background:#0f1824;border:1px solid #2a3a50;border-radius:4px;min-width:220px;max-height:320px;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.ms-panel.open{display:flex;}
.ms-search{padding:7px 10px;border-bottom:1px solid #1e2d40;flex-shrink:0;}
.ms-search input{width:100%;background:transparent;border:none;color:var(--text);font-family:'Montserrat',sans-serif;font-size:11px;outline:none;}
.ms-list{overflow-y:auto;flex:1;}
.ms-opt{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.3px;}
.ms-only{margin-left:auto;font-size:8px;color:var(--orange);padding:1px 6px;border-radius:3px;cursor:pointer;opacity:0;transition:opacity .12s;flex-shrink:0;}
.ms-opt:hover .ms-only{opacity:1;}.ms-only:hover{background:rgba(249,115,22,.2);}
.ms-opt:hover{background:rgba(255,255,255,.05);color:var(--text);}
.ms-opt.all-opt{border-bottom:1px solid #1e2d40;color:var(--text);font-weight:700;}
.ms-opt input[type=checkbox]{accent-color:var(--orange);cursor:pointer;width:14px;height:14px;flex-shrink:0;}
.btn{background:rgba(249,115,22,.15);border:1px solid rgba(249,115,22,.35);border-radius:6px;padding:7px 14px;cursor:pointer;color:var(--orange);font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;display:flex;align-items:center;gap:6px;}
.btn:hover{background:rgba(249,115,22,.3);}
.btn.active{background:rgba(249,115,22,.4);}
/* ── Relatório (formato FCA) ── */
.rel-section{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 12px 12px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
.rel-wrap{overflow-x:auto;}
table.rel{width:100%;border-collapse:collapse;font-size:12px;min-width:900px;}
table.rel thead th{position:sticky;top:0;background:#141B26;color:var(--text);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:10px 8px;border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap;z-index:2;}
table.rel tbody td{padding:11px 8px;border-bottom:1px solid rgba(255,255,255,.06);vertical-align:top;color:var(--text);line-height:1.45;}
table.rel tbody tr:hover{background:rgba(255,255,255,.03);}
table.rel td.txt{white-space:normal;min-width:220px;}
table.rel td.txtsm{white-space:normal;min-width:180px;color:var(--text2);}
table.rel td.center{text-align:left;white-space:nowrap;}
.rel .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle;}
.rel .chip{display:inline-block;padding:3px 9px;border-radius:5px;font-weight:700;font-size:11px;white-space:nowrap;}
body.light-mode table.rel thead th{background:#F0F0F0;}
body.light-mode table.rel tbody td{border-bottom-color:rgba(0,0,0,.08);}
body.light-mode .rel-section{background:rgba(128,128,128,.14)!important;border:none!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#666666;}
.btn.theme{padding:7px 9px;}
.main{padding:20px 24px 60px;}
.intro{font-size:12px;color:var(--text2);margin-bottom:18px;line-height:1.5;}
.intro b{color:var(--text);}
.saved-msg{display:none;font-size:12px;font-weight:700;color:var(--green);margin-left:8px;}
/* ── Painel de Aderência (hero, sem card — padrão visão financeira) ── */
.adere{margin-bottom:20px;}
.adere .hero-label{font-size:10px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px;}
.adere .hero-value{font-size:52px;font-weight:800;line-height:1;margin-top:4px;}
.adere .hero-deltas{display:flex;flex-wrap:wrap;gap:14px 28px;margin-top:16px;}
.adere .hero-delta{font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.adere .hero-delta b{font-size:18px;font-weight:800;display:block;margin-top:3px;color:var(--text);}
@media(max-width:680px){.adere .hero-value{font-size:40px;}.adere .hero-deltas{gap:12px 18px;}.adere .hero-delta b{font-size:15px;}}
.loading{text-align:center;color:var(--text3);padding:50px;font-size:14px;}
.restrito{max-width:520px;margin:40px auto;text-align:center;background:rgba(255,102,102,.08);border:1px solid rgba(255,102,102,.25);border-radius:12px;padding:34px 30px;}
.restrito h2{font-size:18px;color:var(--text);margin-bottom:8px;}
.restrito p{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:18px;}

/* ── Bloco / tabela ── */
.card-block{background:rgba(20,27,38,.55);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:6px 10px 12px;margin-bottom:16px;backdrop-filter:blur(16px);box-shadow:0 2px 12px rgba(0,0,0,.25);}
table.acoes{width:100%;border-collapse:collapse;font-size:12px;}
table.acoes thead th{background:var(--card);font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.12);white-space:nowrap;}
table.acoes td{padding:8px 8px;vertical-align:top;}
table.acoes tbody tr+tr td{border-top:1px solid rgba(255,255,255,.05);}
.col-assunto{width:15%;}
.col-acao{width:25%;}
.col-acomp{width:26%;}
.col-resp{width:12%;}
.col-prazo{width:10%;}
.col-status{width:12%;}
.col-x{width:26px;}
/* larguras mínimas: campos que mostram texto/data completos não podem cortar */
.acoes .f-assunto{min-width:186px;}
.acoes select.st{min-width:132px;}
.acoes .f-resp{min-width:150px;}
.acoes input[type=date]{min-width:134px;}
.acoes input,.acoes textarea,.acoes select{background:#0a0f18;border:1px solid #2a3a50;border-radius:6px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:12.5px;padding:7px 9px;outline:none;width:100%;min-height:38px;}
.acoes input:focus,.acoes textarea:focus,.acoes select:focus{border-color:var(--orange);}
.acoes textarea{resize:none;overflow:hidden;min-height:38px;line-height:1.4;display:block;}
.acoes select option{background:#0f1824;color:#fff;}
select.st[data-v="Concluída"]{background:#3BB33B;color:#fff;border-color:#3BB33B;}
select.st[data-v="Em andamento"]{background:#F4A100;color:#0C1017;border-color:#F4A100;font-weight:700;}
select.st[data-v="Não iniciada"]{background:#FF6666;color:#0C1017;border-color:#FF6666;font-weight:700;}
select.st[data-v="Cancelada"]{background:#333333;color:#fff;border-color:#333333;}
.rm-btn{background:transparent;border:none;color:var(--text3);font-size:18px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:5px;}
.rm-btn:hover{color:var(--red);background:rgba(255,102,102,.12);}
.add-row{padding:8px 4px 2px;}
.add-acao{background:rgba(249,115,22,.12);border:1px dashed rgba(249,115,22,.45);border-radius:6px;color:var(--orange);font-family:'Montserrat',sans-serif;font-weight:700;font-size:11.5px;padding:6px 12px;cursor:pointer;}
.add-acao:hover{background:rgba(249,115,22,.22);}
.cell-label{display:none;}

/* ── Kanban ── */
.kanban{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start;}
.kcol{background:rgba(20,27,38,.55);border:1px solid var(--border);border-radius:10px;min-height:120px;display:flex;flex-direction:column;overflow:hidden;}
.kcol.kover{border-color:var(--orange);background:rgba(249,115,22,.06);}
.kcol-head{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;}
.kcol-head.nao{background:var(--red);color:#0C1017;}
  body.light-mode .kcol-head.nao{color:#fff;}
.kcol-head.and{background:#F4A100;color:#0C1017;}
.kcol-head.con{background:var(--green);color:#fff;}
.kcount{background:rgba(0,0,0,.22);border-radius:10px;padding:1px 9px;font-size:11px;font-weight:700;}
.kcol-body{padding:10px;display:flex;flex-direction:column;gap:9px;}
.kempty{color:var(--text3);text-align:center;padding:14px 0;font-size:12px;}
.kcard{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 11px;cursor:grab;box-shadow:0 1px 4px rgba(0,0,0,.2);}
.kcard:active{cursor:grabbing;} .kcard.dragging{opacity:.4;}
.kadd{background:rgba(249,115,22,.10);border:1px dashed rgba(249,115,22,.45);border-radius:8px;color:var(--orange);font-family:'Montserrat',sans-serif;font-weight:700;font-size:11.5px;padding:8px 10px;cursor:pointer;width:100%;margin-top:2px;}
.kadd:hover{background:rgba(249,115,22,.20);}
.kcard-fato{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.28;}
.kcard-meta{font-size:10.5px;color:var(--text2);margin-top:7px;} .kcard-meta .dim{color:var(--text3);}
.kbadge{font-size:8.5px;font-weight:800;padding:1px 6px;border-radius:4px;text-transform:uppercase;letter-spacing:.3px;margin-left:6px;}
.kbadge.venc{background:rgba(255,102,102,.18);color:var(--red);}
  body.light-mode .kbadge.venc{background:rgba(255,0,0,.12);}
.kbadge.ok{background:rgba(59,179,59,.18);color:var(--green);}
.kbadge.sem{background:rgba(148,163,184,.15);color:var(--text2);}
.kdays{font-size:8.5px;font-weight:800;margin-left:6px;letter-spacing:.3px;}
.kdays.venc{color:var(--red);}
.kdays.ok{color:var(--text2);}
.kassunto{display:inline-block;background:rgba(249,115,22,.15);color:var(--orange);border:1px solid rgba(249,115,22,.3);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:1px 7px;border-radius:4px;margin-bottom:6px;}
body.light-mode .kcol{background:#fff;border-color:rgba(0,0,0,.10);}
/* cinza padrão dos cards no claro — mesmo rgba(128,128,128,.14) das seções
   dos demais painéis; o #F7F7F7 anterior quase sumia na coluna branca */
body.light-mode .kcard{background:rgba(128,128,128,.14);border-color:rgba(0,0,0,.10);}
/* no claro a letra laranja some no fundo claro: mantém o fundo/borda alaranjados, texto preto */
/* modo claro: laranja #F4800C CHEIO com letra preta (Renan) — transparência
   sobre fundo claro lava a cor e vira bege */
body.light-mode .kassunto,body.light-mode .kadd,body.light-mode .add-acao{
  color:#1a1a1a;background:#F4800C;border-color:#F4800C;}
body.light-mode .kadd:hover,body.light-mode .add-acao:hover{background:#DC730A;border-color:#DC730A;}
@media(max-width:768px){.kanban{grid-template-columns:1fr;}}

/* ── Modal ── */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:600;align-items:center;justify-content:center;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:#141B26;border:1px solid var(--border);border-radius:12px;width:100%;max-width:760px;padding:24px 28px;box-shadow:0 12px 40px rgba(0,0,0,.6);}
body.light-mode .modal{background:#fff;color:#1a1a1a;}
.modal h3{font-size:16px;color:var(--orange);margin-bottom:16px;}
.mfield{margin-bottom:14px;}
.mrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.mfield label{display:block;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px;}
.mfield input,.mfield textarea,.mfield select{width:100%;background:#0a0f18;border:1px solid #2a3a50;border-radius:6px;color:var(--text);font-family:'Montserrat',sans-serif;font-size:13px;padding:9px 11px;outline:none;}
body.light-mode .mfield input,body.light-mode .mfield textarea,body.light-mode .mfield select{background:#fff;border-color:#ccc;color:#1a1a1a;}
.mfield textarea{resize:vertical;line-height:1.45;overflow:hidden;}
/* ícone do calendário laranja (visível no escuro) */
input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;filter:invert(56%) sepia(96%) saturate(1700%) hue-rotate(360deg) brightness(102%);}
body.light-mode input[type=date]::-webkit-calendar-picker-indicator{filter:none;}
#m-acao{min-height:76px;}
#m-obs{min-height:140px;}
.modal-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;}
.mbtn{border:none;border-radius:6px;padding:8px 16px;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:800;font-size:12px;}
.mbtn.save{background:var(--orange);color:#0C1017;}
.mbtn.cancel{background:transparent;color:var(--text2);border:1px solid var(--border);}
.mbtn.del{background:transparent;color:var(--red);border:1px solid rgba(255,102,102,.35);}

/* modo claro */
/* na visão clara o vermelho é #FF0000, como no visao-financeira — tudo que
   pinta de vermelho passa por var(--red), então basta trocar aqui */
body.light-mode{background:#F0F0F0;--red:#FF0000;}
body.light-mode .header{background:rgba(12,16,23,.97);}
body.light-mode .main{--text:#1a1a1a;--text2:#444444;--text3:#666666;color:var(--text);}
body.light-mode .card-block{background:rgba(128,128,128,.14)!important;border:none!important;box-shadow:none!important;--text:#1a1a1a;--text2:#444444;--text3:#666666;}
body.light-mode table.acoes thead th{background:#F0F0F0;border-bottom-color:rgba(0,0,0,.12);}
body.light-mode table.acoes tbody tr+tr td{border-top-color:rgba(0,0,0,.07);}
body.light-mode .acoes input,body.light-mode .acoes textarea,body.light-mode .acoes select{background:#fff;border-color:#ccc;color:#1a1a1a;}
body.light-mode select.st[data-v="Concluída"]{background:#3BB33B;color:#fff;}
body.light-mode select.st[data-v="Em andamento"]{background:#F4A100;color:#0C1017;}
body.light-mode select.st[data-v="Não iniciada"]{background:var(--red);color:#fff;}
body.light-mode select.st[data-v="Cancelada"]{background:#333333;color:#fff;}

/* Telas estreitas (tablet/celular): tabela vira card empilhado — evita scroll horizontal */
@media(max-width:900px){
  .main{padding:16px;}
  table.acoes,table.acoes thead,table.acoes tbody,table.acoes tr,table.acoes td{display:block;width:100%;}
  table.acoes thead{display:none;}
  table.acoes tbody tr{border:1px solid rgba(255,255,255,.10);border-radius:8px;padding:8px;margin-bottom:10px;position:relative;}
  body.light-mode table.acoes tbody tr{border-color:rgba(0,0,0,.12);}
  table.acoes tbody tr+tr td{border-top:none;}
  table.acoes td{padding:5px 0;}
  .col-assunto,.col-acao,.col-acomp,.col-resp,.col-prazo,.col-status,.col-x{width:auto;}
  .acoes .f-assunto,.acoes select.st,.acoes .f-resp,.acoes input[type=date]{min-width:0;}
  .cell-label{display:block;font-size:9.5px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;}
  .col-x{position:absolute;top:4px;right:4px;padding:0;}
}
</style>
</head>
<body>
<header class="header">
  <div class="brand"><div class="brand-eyebrow">Gestão em Movimento · BI Frota</div><h1>Planner Corporativo <span style="font-size:11px;font-weight:800;background:#F4800C;color:#1a1a1a;border-radius:4px;padding:2px 8px;vertical-align:3px;">TESTE</span></h1><p>ambiente de teste · os dados ficam só no seu navegador, a base real não é tocada</p></div>
  <div class="hfilter" id="wrapAssunto"><label>Assunto</label><div class="ms-wrap" id="ms-assunto"><button class="ms-btn" onclick="toggleMs('ms-assunto')"><span class="ms-lbl">Todos</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  <div class="hfilter" id="wrapResp"><label>Responsável</label><div class="ms-wrap" id="ms-resp"><button class="ms-btn" onclick="toggleMs('ms-resp')"><span class="ms-lbl">Todos</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  <div class="hfilter" id="wrapStatus"><label>Status</label><div class="ms-wrap" id="ms-status"><button class="ms-btn" onclick="toggleMs('ms-status')"><span class="ms-lbl">Todos</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  <div class="hfilter" id="wrapPrazo"><label>Prazo</label><div class="ms-wrap" id="ms-prazo"><button class="ms-btn" onclick="toggleMs('ms-prazo')"><span class="ms-lbl">Todos</span><span class="ms-cnt"></span><svg width="10" height="6" viewBox="0 0 10 6"><path d="M0 0l5 6 5-6z" fill="#F97316"/></svg></button><div class="ms-panel"><div class="ms-search"><input type="text" placeholder="Pesquisar…"></div><div class="ms-list"></div></div></div></div>
  <button class="btn" onclick="plannerTesteResetar()" title="Zerar e voltar aos dados de exemplo">Resetar</button>
  <span class="btn" data-build style="cursor:default;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);color:#94A3B8;font-weight:600" title="Versão carregada"></span>
  <button class="btn theme" id="themeBtn" title="Modo claro/escuro">☀</button>
  <button class="btn" id="relBtn" onclick="showRelatorio()" title="Ver ações em formato de tabela (relatório, igual ao FCA)">Relatório</button>
  <button class="btn" id="viewBtn" onclick="toggleView()" title="Alternar entre Tabela e Kanban">Tabela</button>
  <button class="btn" id="ganttBtn" onclick="showGantt()" title="Ver as ações numa linha do tempo (Gantt)">Gantt</button>
  <button class="btn" id="addBtn onclick="addAction()" title="Adicionar ação">+ Ação</button>
  <span class="saved-msg" id="savedMsg">Salvo ✓</span>
</header>
<main class="main">
  <div class="adere" id="adere" style="display:none"></div>
  <div id="list"><div class="loading">Carregando…</div></div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Editar ação</h3>
    <div class="mfield"><label>Assunto</label><select id="m-assunto"></select></div>
    <div class="mfield"><label>Ação</label><textarea id="m-acao"></textarea></div>
    <div class="mrow">
      <div class="mfield"><label>Responsável</label><select id="m-resp"></select></div>
      <div class="mfield"><label>Prazo</label><input type="date" id="m-prazo"></div>
      <div class="mfield"><label>Status</label><select id="m-status"></select></div>
    </div>
    <div class="mfield"><label>Acompanhamento</label><textarea id="m-obs"></textarea></div>
    <div class="modal-actions">
      <button class="mbtn del" id="mDelBtn" onclick="deleteFromModal()">Excluir</button>
      <button class="mbtn cancel" onclick="closeModal()">Fechar</button>
    </div>
  </div>
</div>

<script>
// ── Supabase (mesmo projeto do hub/auth) ──
const SUPABASE_URL='https://lozwipoeacpvplgkrxkq.supabase.co';
const SUPABASE_KEY='sb_publishable_ggKEEebc5zjgQDVsF92Upw_6uoLmKe9';
let sb=null, SESSION=null;
const ADMIN_EMAIL='fortesindicadores@gmail.com';
const STATUS=['Não iniciada','Em andamento','Concluída','Cancelada'];
const DEFAULT_STATUS='Não iniciada';
const PRZ_OPTS=['Vencida','No prazo','Sem prazo'];
let ROWS=[];            // fonte da verdade (do Supabase)
let VIEW='kanban';   // abre direto no Kanban (pedido do Renan)
let ADMIN_NAMES=[];     // responsáveis possíveis = administradores
// nome em MAIÚSCULO, ideal "NOME SOBRENOME"; se só um termo, só ele
const NAME_FIX={'RENAN':'RENAN FORTES'};   // corrige nomes sem sobrenome no cadastro
function fmtName(s){s=String(s||'').trim().replace(/\s+/g,' ');if(!s)return '';const p=s.split(' ');const pick=(p.length>=2?(p[0]+' '+p[p.length-1]):p[0]).toUpperCase();return NAME_FIX[pick]||pick;}
const CACHE='planner_cache_v1';

// carrega a lista de administradores (nome) para o campo Responsável
async function loadAdmins(){
  const lbl=new Map();
  try{
    const {data:profs}=await sb.from('fca_profiles').select('user_id,nome').eq('is_admin',true);
    (profs||[]).forEach(p=>lbl.set(p.user_id,(p.nome||'').trim()));
    const ids=[...lbl.keys()];
    if(ids.length){
      try{
        const {data:apps}=await sb.from('user_approvals').select('user_id,name,email').in('user_id',ids);
        (apps||[]).forEach(a=>{ if(!lbl.get(a.user_id)) lbl.set(a.user_id,(a.name||a.email||'').trim()); });
      }catch(e){}
    }
  }catch(e){}
  // garante o próprio usuário logado (admin)
  if(SESSION&&SESSION.user&&!lbl.get(SESSION.user.id)){
    const me=SESSION.user; lbl.set(me.id,((me.user_metadata&&me.user_metadata.name)||me.email||'').trim());
  }
  ADMIN_NAMES=[...new Set([...lbl.values()].map(fmtName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
}
function respOptions(sel){
  const list=[...ADMIN_NAMES];
  if(sel && !list.includes(sel)) list.unshift(sel);   // preserva valor legado fora da lista
  return '<option value="">—</option>'+list.map(n=>`<option${n===sel?' selected':''}>${esc(n)}</option>`).join('');
}
// Assunto = blocos de Papéis e Responsabilidades + Manutenção
const ASSUNTOS=['Governança','Custos','Projetos','Disponibilidade','Xadrez de Frota','Capacitação Técnica','Contratos de Manutenção','Km Rodado','Descarte de Resíduos','Pneus','Stress Test','CIVF','Conformidade da Frota','Estoque','Demarco','DPO/VPO','Combustível','Manutenção','MTBF','MTTR','Blitz de Segurança','Checklist','Viagens','Processos'];
function assuntoOptions(sel){
  const list=[...ASSUNTOS];
  if(sel && !list.includes(sel)) list.unshift(sel);
  return '<option value="">—</option>'+list.map(a=>`<option${a===sel?' selected':''}>${esc(a)}</option>`).join('');
}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);

function prazoState(r){
  if(r.status==='Concluída'||r.status==='Cancelada') return 'No prazo';
  if(!r.prazo) return 'Sem prazo';
  const hoje=new Date(); hoje.setHours(0,0,0,0);
  const p=new Date(r.prazo+'T00:00:00');
  return p<hoje ? 'Vencida' : 'No prazo';
}
function prazoBR(iso){ if(!iso) return '—'; const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; }
function diasVenc(iso){ const h=new Date(); h.setHours(0,0,0,0); const p=new Date(iso+'T00:00:00'); return Math.round((p-h)/86400000); }
function prazoBadge(r){
  const st=prazoState(r);
  const cls=st==='Vencida'?'venc':(st==='Sem prazo'?'sem':'ok');
  const dt=r.prazo?prazoBR(r.prazo):'sem prazo';
  let dias='';
  const ativa=r.status!=='Concluída'&&r.status!=='Cancelada';
  if(r.prazo&&ativa){ const d=diasVenc(r.prazo); dias=`<span class="kdays ${d<0?'venc':'ok'}">${d>=0?'':''}${d}D</span>`; }
  return `${dt}<span class="kbadge ${cls}">${st}</span>${dias}`;
}

// ── DB <-> memória ──
function fromDB(d){return{id:d.id,assunto:d.assunto||'',acao:d.acao||'',resp:d.responsavel||'',prazo:d.prazo||'',status:d.status||DEFAULT_STATUS,obs:d.acompanhamento||'',criado:d.created_at||''};}
function toDB(r){return{assunto:r.assunto||'',acao:r.acao||'',responsavel:r.resp||'',prazo:r.prazo||null,status:r.status||DEFAULT_STATUS,acompanhamento:r.obs||''};}

async function loadRows(){
  // pinta do cache primeiro (instantâneo)
  try{const c=localStorage.getItem(CACHE); if(c){ROWS=JSON.parse(c); buildFilters(); aplicar();}}catch(e){}
  const {data,error}=await sb.from('planner').select('*').order('created_at',{ascending:true});
  if(error){ if(!ROWS.length) $('list').innerHTML=`<div class="restrito"><h2>Erro ao carregar</h2><p>${esc(error.message)}</p></div>`; return; }
  ROWS=(data||[]).map(fromDB);
  writeCache();
  buildFilters(); aplicar();
}
function writeCache(){try{localStorage.setItem(CACHE,JSON.stringify(ROWS));}catch(e){}}

// ── filtros multi-select (padrão do repositório) ──
function syncBadge(w){const c=w.querySelector('.ms-cnt'),n=w._sel?w._sel.size:0;if(c){c.textContent=n;c.style.display=n?'':'none';}}
function _buildMs(w,getItems){
  if(!w)return; if(!(w._sel instanceof Set))w._sel=new Set();
  const list=w.querySelector('.ms-list'),srch=w.querySelector('.ms-search input');
  w._render=(q='')=>{const sel=w._sel,f=(q||'').toLowerCase(),items=getItems(),shown=items.filter(v=>String(v).toLowerCase().includes(f)),all=sel.size===0;
    list.innerHTML=(!q?`<label class="ms-opt all-opt"><input type="checkbox" class="ms-all" ${all?'checked':''}> Todos</label>`:'')+shown.map(v=>`<label class="ms-opt"><input type="checkbox" data-v="${esc(v)}" ${all||sel.has(v)?'checked':''}> ${esc(v)}<span class="ms-only" data-v="${esc(v)}">só</span></label>`).join('');syncBadge(w);};
  list.addEventListener('change',e=>{const sel=w._sel,b=e.target;if(!b.matches('input[type=checkbox]'))return;if(b.classList.contains('ms-all')){sel.clear();}else if(sel.size===0){if(!b.checked)getItems().forEach(v=>{if(v!==b.dataset.v)sel.add(v);});}else{if(b.checked)sel.add(b.dataset.v);else sel.delete(b.dataset.v);const a=getItems();if(a.length&&a.every(v=>sel.has(v)))sel.clear();}w._render(srch.value);aplicar();});
  list.addEventListener('click',e=>{const sel=w._sel,o=e.target.closest('.ms-only');if(!o)return;e.preventDefault();e.stopPropagation();sel.clear();sel.add(o.dataset.v);w._render(srch.value);aplicar();});
  srch.addEventListener('input',()=>w._render(srch.value));srch.addEventListener('click',e=>e.stopPropagation());
  w._render();
}
function toggleMs(id){document.querySelectorAll('.ms-panel.open').forEach(p=>{if(p.closest('.ms-wrap').id!==id)p.classList.remove('open');});const p=document.querySelector('#'+id+' .ms-panel');if(p)p.classList.toggle('open');}
function getMsValues(id){const w=$(id);return w&&w._sel?[...w._sel]:[];}
document.addEventListener('click',e=>{if(!e.target.closest('.ms-wrap'))document.querySelectorAll('.ms-panel.open').forEach(p=>p.classList.remove('open'));});
const MSF=[['ms-assunto',()=>[...ASSUNTOS,...ROWS.map(r=>r.assunto).filter(a=>a&&!ASSUNTOS.includes(a))]],
           ['ms-resp',()=>[...new Set([...ADMIN_NAMES,...ROWS.map(r=>r.resp).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'pt'))],
           ['ms-status',()=>STATUS],
           ['ms-prazo',()=>PRZ_OPTS]];
function buildFilters(){ MSF.forEach(([id,get])=>{const w=$(id);if(!w)return;if(!w._render)_buildMs(w,get);else w._render('');}); }
function filtered(){
  const fa=getMsValues('ms-assunto'), fr=getMsValues('ms-resp'), fs=getMsValues('ms-status'), fp=getMsValues('ms-prazo');
  return ROWS.filter(r=>(!fa.length||fa.includes(r.assunto))&&(!fr.length||fr.includes(r.resp))&&(!fs.length||fs.includes(r.status||DEFAULT_STATUS))&&(!fp.length||fp.includes(prazoState(r))));
}

// ── render ──
function aplicar(){
  const vis=filtered();
  renderAdere(vis);
  if(VIEW==='kanban'){ $('list').innerHTML=kanbanHTML(vis); return; }
  if(VIEW==='gantt'){ $('list').innerHTML=GanttView.html(vis.map(r=>({id:r.id,label:r.acao,tag:r.assunto,resp:r.resp,status:r.status,start:r.criado,end:r.prazo}))); return; }
  if(VIEW==='relatorio'){ $('list').innerHTML=relatorioHTML(vis); return; }
  $('list').innerHTML=tableHTML(vis);
  wireTable();
}
// ── Relatório (formato FCA, somente leitura) ──
function chipStatusRel(st){
  st=String(st||'').trim();
  if(!st)return '<span style="color:var(--text3)">—</span>';
  if(/conclu/i.test(st))return `<span class="chip" style="background:rgba(59,179,59,.85);color:#06210a">${esc(st)}</span>`;
  if(/andamento/i.test(st))return `<span class="chip" style="background:rgba(244,161,0,.9);color:#241900">${esc(st)}</span>`;
  if(/cancel/i.test(st))return `<span class="chip" style="background:rgba(120,120,120,.5);color:#fff">${esc(st)}</span>`;
  if(/n[ãa]o inici/i.test(st))return `<span class="chip" style="background:rgba(227,52,52,.85);color:#2a0606">${esc(st)}</span>`;
  return `<span class="chip" style="background:rgba(148,163,184,.25);color:var(--text)">${esc(st)}</span>`;
}
function relatorioHTML(rows){
  if(!rows.length) return '<div class="loading">Nenhuma ação com os filtros selecionados</div>';
  const ord=[...rows].sort((a,b)=>(a.prazo||'9999-99-99').localeCompare(b.prazo||'9999-99-99'));
  let h='<div class="rel-section"><div class="rel-wrap"><table class="rel"><thead><tr>'+
    '<th>Assunto</th><th>Ação</th><th>Responsável</th><th>Acompanhamento</th><th>Prazo</th><th>Status Prazo</th><th>Status</th>'+
    '</tr></thead><tbody>';
  ord.forEach(r=>{
    const sp=prazoState(r), spCor=sp==='Vencida'?'var(--red)':'var(--green)';
    h+='<tr>'+
      `<td class="center">${esc(r.assunto)||'—'}</td>`+
      `<td class="txt">${(esc(r.acao)||'—').replace(/\n/g,'<br>')}</td>`+
      `<td class="center">${esc(r.resp)||'—'}</td>`+
      `<td class="txtsm">${(esc(r.obs)||'—').replace(/\n/g,'<br>')}</td>`+
      `<td class="center">${r.prazo?prazoBR(r.prazo):'—'}</td>`+
      `<td class="center"><span class="dot" style="background:${spCor}"></span>${sp}</td>`+
      `<td class="center">${chipStatusRel(r.status)}</td>`+
    '</tr>';
  });
  h+='</tbody></table></div></div>';
  return h;
}
// ── Aderência Geral (Prazo + Conclusão) ──
const adCor=p=>p>=90?'var(--green)':(p>=70?'var(--amber)':'var(--red)');
function renderAdere(rows){
  const box=$('adere'); if(!box) return;
  const ativas=rows.filter(r=>(r.status||DEFAULT_STATUS)!=='Cancelada');
  const base=ativas.length;
  if(!base){ box.style.display='none'; return; }
  const concl=ativas.filter(r=>r.status==='Concluída').length;
  const venc=ativas.filter(r=>prazoState(r)==='Vencida').length;
  const andar=ativas.filter(r=>r.status==='Em andamento').length;
  const nao=ativas.filter(r=>(r.status||DEFAULT_STATUS)==='Não iniciada').length;
  const pConcl=Math.round(concl/base*100);
  const pPrazo=Math.round((base-venc)/base*100);
  const geral=Math.round((pConcl+pPrazo)/2);
  const noPrazo=base-venc;
  const d=(lbl,val,cor)=>`<div class="hero-delta"><span>${lbl}</span><b${cor?` style="color:${cor}"`:''}>${val}</b></div>`;
  box.style.display='block';
  box.innerHTML=`
    <div class="hero-label">Aderência Geral (Prazo + Conclusão)</div>
    <div class="hero-value" style="color:${adCor(geral)}">${geral}%</div>
    <div class="hero-deltas">
      ${d('% Prazo',pPrazo+'%',adCor(pPrazo))}
      ${d('% Conclusão',pConcl+'%',adCor(pConcl))}
      ${d('Total de Ações',base,'')}
      ${d('No prazo',noPrazo,'var(--green)')}
      ${d('Fora do prazo',venc,venc?'var(--red)':'')}
      ${d('Não iniciadas',nao,'var(--red)')}
      ${d('Em andamento',andar,'var(--amber)')}
      ${d('Concluídas',concl,'var(--green)')}
    </div>`;
}
function tableHTML(rows){
  return `<div class="card-block">
    <table class="acoes"><thead><tr>
      <th class="col-assunto">Assunto</th><th class="col-acao">Ação</th><th class="col-resp">Responsável</th><th class="col-prazo">Prazo</th>
      <th class="col-status">Status</th><th class="col-acomp">Acompanhamento</th><th class="col-x"></th>
    </tr></thead><tbody id="tbody">${rows.map(rowHTML).join('')||''}</tbody></table>
    <div class="add-row"><button class="add-acao" onclick="addRow()">+ adicionar ação</button></div>
  </div>`;
}
function rowHTML(r){
  return `<tr data-id="${r.id||''}">
    <td class="col-assunto"><div class="cell-label">Assunto</div><select class="f-assunto">${assuntoOptions(r.assunto)}</select></td>
    <td class="col-acao"><div class="cell-label">Ação</div><textarea class="f-acao" placeholder="O que será feito?">${esc(r.acao)}</textarea></td>
    <td class="col-resp"><div class="cell-label">Responsável</div><select class="f-resp">${respOptions(r.resp)}</select></td>
    <td class="col-prazo"><div class="cell-label">Prazo</div><input type="date" class="f-prazo" value="${esc(r.prazo)}"></td>
    <td class="col-status"><div class="cell-label">Status</div><select class="st f-status" data-v="${esc(r.status)}">${STATUS.map(s=>`<option${s===r.status?' selected':''}>${s}</option>`).join('')}</select></td>
    <td class="col-acomp"><div class="cell-label">Acompanhamento</div><textarea class="f-obs" placeholder="Andamento / observações">${esc(r.obs)}</textarea></td>
    <td class="col-x"><button class="rm-btn" title="Remover" onclick="delRow(this.closest('tr'))">×</button></td>
  </tr>`;
}
function autoGrow(t){t.style.height='auto';t.style.height=(t.scrollHeight)+'px';}
function flashSaved(){const m=$('savedMsg');if(!m)return;m.style.display='inline';clearTimeout(m._t);m._t=setTimeout(()=>m.style.display='none',1500);}
// auto-save de uma linha da tabela (digitou/saiu do campo → salvo)
async function saveRow(tr){
  if(!sb||!tr) return;
  const get=c=>{const el=tr.querySelector('.'+c);return el?el.value:'';};
  const r={assunto:get('f-assunto'),acao:get('f-acao').trim(),resp:get('f-resp').trim(),prazo:get('f-prazo'),status:get('f-status'),obs:get('f-obs').trim()};
  const payload=toDB(r);
  const id=tr.dataset.id;
  if(id){
    const row=ROWS.find(x=>x.id===id); if(row) Object.assign(row,fromDB({id,...payload}));
    writeCache();
    const {error}=await sb.from('planner').update(payload).eq('id',id); if(error){console.error(error);return;}
    flashSaved();
  }else{
    if(!r.acao&&!r.resp&&!r.obs&&!r.prazo&&!r.assunto) return;   // linha vazia -> não cria
    const {data,error}=await sb.from('planner').insert(payload).select('*').single(); if(error){console.error(error);return;}
    tr.dataset.id=data.id; ROWS.push(fromDB(data)); writeCache(); flashSaved();
  }
}
async function delRow(tr){
  if(!tr) return;
  const id=tr.dataset.id;
  if(id&&sb){ if(!confirm('Excluir esta ação?')) return; const {error}=await sb.from('planner').delete().eq('id',id); if(error){alert('Erro ao excluir: '+error.message);return;} ROWS=ROWS.filter(x=>x.id!==id); writeCache(); }
  tr.remove(); renderAdere(filtered());
}
function wireTable(){
  document.querySelectorAll('#list textarea').forEach(t=>{autoGrow(t);t.addEventListener('input',()=>autoGrow(t));});
  document.querySelectorAll('#list tbody tr').forEach(tr=>{
    tr.querySelectorAll('.f-assunto,.f-resp,.f-status,.f-prazo').forEach(el=>el.addEventListener('change',()=>{if(el.classList.contains('f-status'))el.dataset.v=el.value; saveRow(tr).then(()=>renderAdere(filtered()));}));
    tr.querySelectorAll('.f-acao,.f-obs').forEach(el=>el.addEventListener('blur',()=>saveRow(tr)));
  });
}
function addRow(){
  const tb=$('tbody'); if(!tb) return;
  tb.insertAdjacentHTML('beforeend',rowHTML({id:'',acao:'',resp:'',prazo:'',status:DEFAULT_STATUS,obs:''}));
  wireTable();
  const last=tb.querySelector('tr:last-child textarea'); if(last) last.focus();
}
function addRowTop(){
  if(VIEW==='kanban'){ VIEW='tabela'; $('viewBtn').textContent='Kanban'; aplicar(); }
  const tb=$('tbody'); if(!tb) return;
  tb.insertAdjacentHTML('afterbegin',rowHTML({id:'',acao:'',resp:'',prazo:'',status:DEFAULT_STATUS,obs:''}));
  wireTable();
  const first=tb.querySelector('tr:first-child textarea'); if(first) first.focus();
}

// ── Kanban ──
const KCOLS=[{k:'Não iniciada',cls:'nao'},{k:'Em andamento',cls:'and'},{k:'Concluída',cls:'con'}];
function kanbanHTML(rows){
  return `<div class="kanban">${KCOLS.map(c=>{
    const cards=rows.filter(r=>(r.status||DEFAULT_STATUS)===c.k)
      .sort((a,b)=>(a.prazo||'9999-99-99').localeCompare(b.prazo||'9999-99-99'));
    return `<div class="kcol" data-status="${c.k}">
      <div class="kcol-head ${c.cls}">${c.k}<span class="kcount">${cards.length}</span></div>
      <div class="kcol-body">${cards.length?cards.map(kcard).join(''):'<div class="kempty">—</div>'}<button class="kadd" onclick="openNewModal('${c.k}')">+ nova ação</button></div>
    </div>`;
  }).join('')}</div>`;
}
function kcard(r){
  const acao=esc(r.acao)||'<span class="dim">(sem ação)</span>';
  const resp=r.resp?esc(r.resp):'<span class="dim">sem responsável</span>';
  const ass=r.assunto?`<span class="kassunto">${esc(r.assunto)}</span>`:'';
  return `<div class="kcard" draggable="true" data-id="${r.id}">
    ${ass}<div class="kcard-fato">${acao}</div>
    <div class="kcard-meta">${resp} · ${prazoBadge(r)}</div>
  </div>`;
}
function updateViewBtns(){$('viewBtn').textContent=VIEW==='kanban'?'Tabela':'Kanban';const rb=$('relBtn');if(rb)rb.classList.toggle('active',VIEW==='relatorio');const gb=$('ganttBtn');if(gb)gb.classList.toggle('active',VIEW==='gantt');}
function showGantt(){VIEW=(VIEW==='gantt')?'kanban':'gantt';updateViewBtns();aplicar();}
function toggleView(){VIEW=(VIEW==='kanban')?'tabela':'kanban';updateViewBtns();aplicar();}
function showRelatorio(){VIEW=(VIEW==='relatorio')?'tabela':'relatorio';updateViewBtns();aplicar();}

async function moveCard(id,status){
  if(!sb) return;
  const r=ROWS.find(x=>x.id===id); if(!r||(r.status||DEFAULT_STATUS)===status) return;
  const old=r.status; r.status=status; buildFilters(); aplicar();   // otimista
  const {error}=await sb.from('planner').update({status}).eq('id',id);
  if(error){ r.status=old; aplicar(); alert('Erro ao mover: '+error.message); return; }
  writeCache();
}

// drag & drop (delegado no #list, uma vez)
(function(){
  const c=$('list'); if(!c) return;
  c.addEventListener('click',e=>{const gv=e.target.closest&&e.target.closest('.gv-row');if(gv&&gv.dataset.id){openModal(gv.dataset.id);return;}const card=e.target.closest&&e.target.closest('.kcard');if(card&&VIEW==='kanban'){const id=card.dataset.id;if(id)openModal(id);}});
  c.addEventListener('dragstart',e=>{const card=e.target.closest&&e.target.closest('.kcard');if(card){e.dataTransfer.setData('text/plain',card.dataset.id);e.dataTransfer.effectAllowed='move';card.classList.add('dragging');}});
  c.addEventListener('dragend',e=>{const card=e.target.closest&&e.target.closest('.kcard');if(card)card.classList.remove('dragging');});
  c.addEventListener('dragover',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(col){e.preventDefault();e.dataTransfer.dropEffect='move';col.classList.add('kover');}});
  c.addEventListener('dragleave',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(col)col.classList.remove('kover');});
  c.addEventListener('drop',e=>{const col=e.target.closest&&e.target.closest('.kcol');if(!col)return;e.preventDefault();col.classList.remove('kover');const id=e.dataTransfer.getData('text/plain');if(id&&col.dataset.status)moveCard(id,col.dataset.status);});
})();

// ── Modal (criar ou editar ação) ──
let MODAL_ID=null;
function fillStatus(sel){$('m-status').innerHTML=STATUS.map(s=>`<option${s===sel?' selected':''}>${s}</option>`).join('');}
function growModal(){['m-acao','m-obs'].forEach(id=>{const t=$(id);if(t){t.style.height='auto';t.style.height=Math.max(t.scrollHeight,id==='m-obs'?140:76)+'px';}});}
['m-acao','m-obs'].forEach(id=>{const t=$(id);if(t)t.addEventListener('input',()=>growModal());});
function openModal(id){
  const r=ROWS.find(x=>x.id===id); if(!r) return;
  MODAL_ID=id;
  $('modalTitle').textContent='Editar ação';
  $('m-assunto').innerHTML=assuntoOptions(r.assunto);
  $('m-acao').value=r.acao; $('m-resp').innerHTML=respOptions(r.resp); $('m-prazo').value=r.prazo||'';
  fillStatus(r.status); $('m-obs').value=r.obs;
  $('mDelBtn').style.display='';
  $('modalBg').classList.add('open');
  setTimeout(growModal,10);
}
function openNewModal(status){
  MODAL_ID=null;
  $('modalTitle').textContent='Nova ação';
  $('m-assunto').innerHTML=assuntoOptions('');
  $('m-acao').value=''; $('m-resp').innerHTML=respOptions(''); $('m-prazo').value='';
  fillStatus(status||DEFAULT_STATUS); $('m-obs').value='';
  $('mDelBtn').style.display='none';
  $('modalBg').classList.add('open');
  setTimeout(growModal,10);
  setTimeout(()=>$('m-acao').focus(),50);
}
function addAction(){ if(VIEW==='tabela') addRowTop(); else openNewModal(DEFAULT_STATUS); }
function closeModal(){ persistModal(); $('modalBg').classList.remove('open'); MODAL_ID=null; }
// auto-save do modal (cada campo, ao alterar/sair → salvo)
let _persisting=false;
async function persistModal(){
  if(!sb||_persisting) return;
  const upd={assunto:$('m-assunto').value,acao:$('m-acao').value.trim(),responsavel:$('m-resp').value.trim(),prazo:$('m-prazo').value||null,status:$('m-status').value,acompanhamento:$('m-obs').value.trim()};
  _persisting=true;
  try{
    if(MODAL_ID){
      const r=ROWS.find(x=>x.id===MODAL_ID); if(r) Object.assign(r,fromDB({id:r.id,...upd}));
      writeCache(); buildFilters(); aplicar();
      const {error}=await sb.from('planner').update(upd).eq('id',MODAL_ID); if(!error) flashSaved();
    }else{
      if(!upd.acao && !upd.responsavel && !upd.acompanhamento && !upd.assunto) return;
      const {data,error}=await sb.from('planner').insert(upd).select('*').single(); if(error) return;
      ROWS.push(fromDB(data)); MODAL_ID=data.id; $('mDelBtn').style.display=''; $('modalTitle').textContent='Editar ação';
      writeCache(); buildFilters(); aplicar(); flashSaved();
    }
  }finally{ _persisting=false; }
}
['m-assunto','m-acao','m-resp','m-prazo','m-status','m-obs'].forEach(id=>{const el=$(id);if(el)el.addEventListener('change',()=>persistModal());});
async function deleteFromModal(){
  if(!MODAL_ID) return;
  if(!confirm('Excluir esta ação?')) return;
  const id=MODAL_ID;
  const {error}=await sb.from('planner').delete().eq('id',id);
  if(error){alert('Erro ao excluir: '+error.message);return;}
  ROWS=ROWS.filter(x=>x.id!==id); writeCache(); buildFilters(); aplicar(); closeModal();
}
$('modalBg').addEventListener('click',e=>{if(e.target===$('modalBg'))closeModal();});

// ── tema ──
function applyTheme(t){document.body.classList.toggle('light-mode',t==='light');localStorage.setItem('bi_theme',t);$('themeBtn').textContent=t==='light'?'🌙':'☀';}
$('themeBtn').addEventListener('click',()=>applyTheme(document.body.classList.contains('light-mode')?'dark':'light'));
applyTheme(localStorage.getItem('bi_theme')||'dark');

// ── acesso: só admins ──
function showRestricted(msg){
  ['wrapAssunto','wrapResp','wrapStatus','wrapPrazo','relBtn','viewBtn','ganttBtn','addBtn','adere','intro'].forEach(id=>{const el=$(id);if(el)el.style.display='none';});
  $('list').innerHTML=`<div class="restrito"><h2>Acesso restrito</h2><p>${esc(msg||'Este planner é exclusivo para administradores.')}</p></div>`;
}
async function initApp(){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ location.replace('../'); return; }
  SESSION=session;
  let prof=null;
  try{ const r=await sb.from('fca_profiles').select('is_admin').eq('user_id',session.user.id).maybeSingle(); prof=r.data; }catch(e){}
  const admin = (prof && prof.is_admin) || (session.user.email===ADMIN_EMAIL);
  if(!admin){ showRestricted('Você está logado, mas não tem perfil de administrador. Fale com o corporativo para liberar seu acesso.'); return; }
  await loadAdmins();
  await loadRows();
}
initApp();
