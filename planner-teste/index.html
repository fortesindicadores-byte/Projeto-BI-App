<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="build" content="202608081300">
<title>Task Board · TESTE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="../assets/planner-teste-shim.js?v=202608081300"></script>
<style>
/* ============================================================
   QUADRO DE TESTE — reconstruído do zero no molde da referência
   "Task Board". Página independente: não herda nada do planner
   de produção. Mesmo layout no claro e no escuro; só as
   superfícies trocam. Sem a faixa "CAPACITY" da referência.
   ============================================================ */

:root{
  /* fundo em degradê: base quase preta com um halo de cor sangrando da
     borda de cima (e um segundo, frio, no canto oposto). É o que dá a
     profundidade do modelo — nada de cor chapada. */
  --fundo: linear-gradient(160deg, #0A0C12 0%, #06080C 55%, #030407 100%);
  /* a moldura do modelo não é simétrica: nasce no canto superior direito,
     percorre o topo esmaecendo para a esquerda e desce pela direita até
     morrer embaixo. Um único radial ancorado em 100% 0% faz exatamente isso. */
  --aro: radial-gradient(125% 125% at 100% 0%,
           rgba(255,163,77,.95) 0%, rgba(249,115,22,.80) 16%, rgba(249,115,22,.42) 34%,
           rgba(249,115,22,.14) 54%, transparent 74%);
  --aro-esp: 26px;
  --app:      rgba(16,23,38,.46);
  --side:     rgba(13,19,34,.62);
  --linha:    rgba(255,255,255,.07);
  --card:     rgba(38,44,62,.58);
  --brilho:   linear-gradient(180deg, rgba(255,255,255,.055) 0%, rgba(255,255,255,0) 46%);
  --card-brd: rgba(255,255,255,.09);
  --txt:      #E8ECF4;
  --txt2:     #98A5BB;
  --txt3:     #6C7A94;
  --hover:    rgba(255,255,255,.07);
  --azul:     #29A9E0;
  --verde:    #3BB33B;
  --vermelho: #F1554C;
  --cinza:    #6B7C90;
  --trilho:   rgba(255,255,255,.15);
  --sombra:   0 2px 12px rgba(0,0,0,.30);
}
body.claro{
  /* mesmo desenho, na chave clara: o halo continua, o vidro fica branco */
  --fundo: linear-gradient(160deg, #F2F5FA 0%, #E7ECF4 55%, #DDE3EC 100%);
  --aro: radial-gradient(125% 125% at 100% 0%,
           rgba(255,163,77,.95) 0%, rgba(249,115,22,.78) 16%, rgba(249,115,22,.40) 34%,
           rgba(249,115,22,.12) 54%, transparent 74%);
  --aro-esp: 22px;
  --app:      rgba(255,255,255,.40);
  --side:     rgba(255,255,255,.62);
  --linha:    rgba(15,23,42,.10);
  --card:     rgba(255,255,255,.72);
  --brilho:   linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 46%);
  --card-brd: rgba(15,23,42,.10);
  --txt:      #17212F;
  --txt2:     #566277;
  --txt3:     #7B879B;
  --hover:    rgba(15,23,42,.05);
  --azul:     #1B92C9;
  --verde:    #0E8C0E;
  --vermelho: #E4483F;
  --cinza:    #7A879A;
  --trilho:   rgba(15,23,42,.14);
  --sombra:   0 2px 10px rgba(15,23,42,.10);
}

*{margin:0;padding:0;box-sizing:border-box;}
/* ARO DE LUZ na borda da tela — medido no modelo: no topo vai de
   #110505 (esquerda) a #CC3C3C (90%); na direita cai de #B63434 (topo)
   a #070300 (base); esquerda e rodapé praticamente pretos. O miolo
   volta ao preto em ~4% da altura, por isso é moldura e não halo.
   Truque da borda em degradê: pinta a border-box e recorta o miolo. */
body::before{content:'';position:fixed;inset:0;z-index:60;pointer-events:none;
  border:var(--aro-esp) solid transparent;background:var(--aro) border-box;
  -webkit-mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0);
  mask-composite:exclude;
  filter:blur(9px);}
html,body{height:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:13px;color:var(--txt);
  background:var(--fundo);
  overflow:hidden;
}

/* ── painel do app, flutuando sobre a foto ── */
.app{
  position:absolute;inset:22px;display:flex;
  border-radius:16px;overflow:hidden;
  border:1px solid var(--linha);box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.app::before{content:'';position:absolute;inset:0;background:var(--app);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:0;}
.side,.board{position:relative;z-index:1;}

/* ── barra lateral ── */
.side{
  width:228px;flex:0 0 228px;display:flex;flex-direction:column;
  background:var(--side);border-right:1px solid var(--linha);padding:16px 10px 12px;
}
.s-top{display:flex;align-items:center;gap:9px;padding:2px 8px 16px;}
.s-top b{flex:1;font-size:13.5px;font-weight:600;}
.s-search{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;margin-bottom:14px;}
.s-search:hover{background:var(--hover);}
.s-search input{flex:1;min-width:0;background:transparent;border:0;outline:0;
  font-family:inherit;font-size:12.5px;color:var(--txt);}
.s-search input::placeholder{color:var(--txt2);}
.s-kbd{font-size:10.5px;color:var(--txt3);white-space:nowrap;}
.s-sec{display:flex;align-items:center;gap:6px;padding:16px 8px 8px;
  font-size:10px;font-weight:600;color:var(--txt3);text-transform:uppercase;letter-spacing:1.1px;}
.s-sec b{flex:1;font-weight:600;}
.s-sec svg{opacity:.7;}
.s-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:0;border-radius:7px;
  background:transparent;color:var(--txt2);font-family:inherit;font-size:12.5px;font-weight:500;
  text-align:left;cursor:pointer;}
.s-item:hover{background:var(--hover);color:var(--txt);}
.s-item.on{background:var(--hover);color:var(--txt);font-weight:600;}
.s-item.pai{color:var(--txt);font-weight:600;cursor:default;}
.s-item.pai:hover{background:transparent;}
.s-item.filho{padding-left:26px;}
.s-item .n{margin-left:auto;font-size:11px;color:var(--txt3);font-weight:600;}
.s-user{margin-top:auto;display:flex;align-items:center;gap:9px;padding:12px 8px 2px;border-top:1px solid var(--linha);}
.s-user div{flex:1;min-width:0;}
.s-user b{display:block;font-size:12px;font-weight:600;line-height:1.2;}
.s-user i{display:block;font-size:9.5px;font-style:normal;color:var(--txt3);
  text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}

/* ── área do quadro ── */
.board{flex:1;min-width:0;display:flex;flex-direction:column;}
.top{display:flex;align-items:center;gap:6px;padding:20px 24px 14px;}
.top h1{flex:1;font-size:21px;font-weight:600;letter-spacing:-.3px;}
.tool{display:flex;align-items:center;gap:7px;background:transparent;border:0;border-radius:7px;
  padding:6px 10px;color:var(--txt2);font-family:inherit;font-size:12.5px;font-weight:500;cursor:pointer;}
.tool:hover{background:var(--hover);color:var(--txt);}
.tool.on{background:var(--hover);color:var(--txt);}
.menu-wrap{position:relative;}
.menu{display:none;position:absolute;top:calc(100% + 6px);right:0;z-index:40;min-width:214px;
  background:var(--brilho), var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--card-brd);border-radius:10px;padding:6px;
  box-shadow:0 18px 40px rgba(0,0,0,.5);}
body.claro .menu{box-shadow:0 18px 40px rgba(15,23,42,.16);}
.menu.open{display:block;}
.menu button,.menu label{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:7px;
  background:transparent;color:var(--txt);font-family:inherit;font-size:12.5px;text-align:left;cursor:pointer;}
.menu button:hover,.menu label:hover{background:var(--hover);}
.menu .tit{padding:8px 9px 4px;font-size:10px;font-weight:600;color:var(--txt3);
  text-transform:uppercase;letter-spacing:1px;}
.menu input[type=checkbox]{accent-color:var(--azul);width:14px;height:14px;flex:0 0 14px;cursor:pointer;}
.menu .rol{max-height:250px;overflow:auto;}

/* ── colunas ── */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;
  padding:0 24px 24px;overflow:auto;align-items:start;}
.col{display:flex;flex-direction:column;min-height:56px;border-radius:10px;}
.col.over{background:rgba(46,155,214,.10);box-shadow:0 0 0 1px rgba(46,155,214,.35) inset;}
.chead{display:flex;align-items:center;gap:8px;padding:2px 2px 12px;}
.cname{font-size:10.5px;font-weight:600;color:var(--txt2);text-transform:uppercase;letter-spacing:1.3px;}
.cnum{font-size:10.5px;font-weight:600;color:var(--txt3);}
.ic{display:flex;align-items:center;justify-content:center;width:20px;height:20px;flex:0 0 20px;
  background:transparent;border:0;border-radius:5px;color:var(--txt3);cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:500;line-height:1;padding:0;}
.ic:hover{background:var(--hover);color:var(--txt);}
.chead .ic:first-of-type{margin-left:auto;}
.cbody{display:flex;flex-direction:column;gap:10px;}
.col.rec .cbody{display:none;}

/* ── card ── */
.card{position:relative;overflow:hidden;background:var(--brilho), var(--card);
  border:1px solid var(--card-brd);border-radius:8px;padding:12px 13px 11px 17px;cursor:grab;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sombra);}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pz,var(--cinza));z-index:1;}
/* lavagem de cor no topo do card, esmaecendo para a direita — é o
   degradê dos "chips" do modelo, aqui na cor do prazo */
.card::after{content:'';position:absolute;left:0;right:0;top:0;height:38px;pointer-events:none;
  background:linear-gradient(90deg, var(--pz,var(--cinza)) 0%, transparent 52%);opacity:.20;}
body.claro .card::after{opacity:.13;}
.card>*{position:relative;z-index:1;}
.card.venc{--pz:var(--vermelho);} .card.ok{--pz:var(--azul);} .card.sem{--pz:var(--cinza);}
.card:active{cursor:grabbing;} .card.arrasta{opacity:.35;}
.card:hover{border-color:rgba(46,155,214,.35);}
.card.fim{opacity:.55;} .card.fim:hover{opacity:.95;}
.cid{font-size:9.5px;font-weight:500;color:var(--txt3);letter-spacing:.4px;margin-bottom:4px;}
.ctit{font-size:13px;font-weight:500;line-height:1.32;}
.cmeta{margin-top:6px;font-size:10.5px;color:var(--txt2);}
.cmeta .atraso{color:var(--vermelho);font-weight:600;}
.cfoot{display:flex;align-items:center;gap:10px;margin-top:12px;min-height:24px;}
.bar{flex:1;height:4px;border-radius:3px;background:var(--trilho);overflow:hidden;}
.bar i{display:block;height:100%;border-radius:3px;
  background:linear-gradient(90deg, var(--azul) 0%, rgba(41,169,224,.35) 100%);}
.bar.done i{background:var(--azul);}
.avs{display:flex;align-items:center;margin-left:auto;}
.av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:700;color:#0b1119;background:var(--av,#94A3B8);flex:0 0 24px;
  box-shadow:0 1px 4px rgba(0,0,0,.25);}
.add-av{width:24px;height:24px;border-radius:50%;margin-left:auto;background:transparent;
  border:1px dashed var(--trilho);color:var(--txt3);font-family:inherit;font-size:13px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;}
.add-av:hover{border-color:var(--azul);color:var(--azul);}
.cvazia{padding:12px 2px;font-size:12px;color:var(--txt3);}

/* ── modal ── */
.mbg{display:none;position:fixed;inset:0;z-index:80;background:rgba(3,6,11,.55);backdrop-filter:blur(2px);
  align-items:center;justify-content:center;padding:20px;}
.mbg.open{display:flex;}
.modal{width:100%;max-width:620px;max-height:92vh;overflow:auto;background:var(--brilho), var(--card);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--card-brd);border-radius:14px;padding:22px 24px;box-shadow:0 30px 70px rgba(0,0,0,.6);}
.modal h3{font-size:15px;font-weight:600;margin-bottom:16px;}
.f{margin-bottom:13px;}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.f3 .f{margin-bottom:0;}
.f label{display:block;font-size:10px;font-weight:600;color:var(--txt2);
  text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px;}
.f input,.f select,.f textarea{width:100%;background:var(--hover);border:1px solid var(--card-brd);
  border-radius:8px;color:var(--txt);font-family:inherit;font-size:13px;padding:9px 11px;outline:0;}
body.claro .f input,body.claro .f select,body.claro .f textarea{background:#fff;border-color:#d7dce4;}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--azul);}
.f textarea{resize:vertical;min-height:70px;line-height:1.45;}
.f select option{background:#141d2b;color:#fff;}
body.claro .f select option{background:#fff;color:#0f172a;}
input[type=date]::-webkit-calendar-picker-indicator{cursor:pointer;}
.macoes{display:flex;justify-content:space-between;gap:10px;margin-top:18px;}
.b{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;}
.b.pri{background:var(--azul);color:#fff;}
.b.gho{background:transparent;color:var(--txt2);border:1px solid var(--card-brd);}
.b.del{background:transparent;color:var(--vermelho);border:1px solid rgba(228,100,92,.4);}

/* ── telas menores ── */
@media(max-width:1180px){ .cols{grid-template-columns:repeat(2,1fr);} }
@media(max-width:860px){
  body{overflow:auto;}
  .app{position:static;inset:auto;min-height:100%;border-radius:0;flex-direction:column;box-shadow:none;}
  .side{width:auto;flex:none;flex-direction:row;flex-wrap:wrap;gap:6px;align-items:center;
    border-right:0;border-bottom:1px solid var(--linha);padding:10px;}
  .s-sec,.s-item.filho,.s-item.pai,.s-user,.s-top{display:none;}
  .s-search{margin:0;flex:1 0 100%;background:var(--hover);}
  .cols{grid-template-columns:1fr;overflow:visible;padding:0 14px 24px;}
  .top{padding:14px 14px 10px;}
  .top h1{font-size:18px;}
}
</style>
</head>
<body>

<div class="app">
  <!-- ══════════ barra lateral ══════════ -->
  <aside class="side">
    <div class="s-top">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="M2 13l10 5 10-5"/></svg>
      <b>Boards</b>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
    </div>

    <label class="s-search">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".8"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5 21 21"/></svg>
      <input type="text" id="busca" placeholder="Search" autocomplete="off">
      <span class="s-kbd">Ctrl + K</span>
    </label>

    <button class="s-item" data-vis="minhas">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg>
      My items <span class="n" data-n="minhas"></span>
    </button>
    <button class="s-item" data-vis="recentes">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>
      My recent <span class="n" data-n="recentes"></span>
    </button>
    <button class="s-item" data-vis="vencidas">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
      Notifications <span class="n" data-n="vencidas"></span>
    </button>

    <div class="s-sec"><b>All views</b>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div class="s-item pai">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      Build
    </div>
    <button class="s-item filho on" id="btQuadro" data-vis="">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 4h7v16H4zM13 4h7v10h-7z"/></svg>
      Task Board
    </button>
    <button class="s-item filho" data-vis="concl3s">Completed last 3w <span class="n" data-n="concl3s"></span></button>
    <button class="s-item filho" data-vis="semresp">Sem responsável <span class="n" data-n="semresp"></span></button>
    <button class="s-item" data-vis="semprazo">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>
      Sem prazo <span class="n" data-n="semprazo"></span>
    </button>

    <div class="s-user">
      <span class="av" id="euAv">—</span>
      <div><b id="euNome">—</b><i>administrador</i></div>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".55"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
    </div>
  </aside>

  <!-- ══════════ quadro ══════════ -->
  <main class="board">
    <div class="top">
      <h1>Task Board</h1>

      <div class="menu-wrap">
        <button class="tool" id="btPessoas" onclick="abreMenu('mPessoas')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/></svg>
          People
        </button>
        <div class="menu" id="mPessoas"><div class="tit">Responsável</div><div class="rol" id="lstPessoas"></div></div>
      </div>

      <div class="menu-wrap">
        <button class="tool" id="btFiltro" onclick="abreMenu('mFiltro')">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
          Filter
        </button>
        <div class="menu" id="mFiltro"><div class="tit">Assunto</div><div class="rol" id="lstAssuntos"></div></div>
      </div>

      <div class="menu-wrap">
        <button class="tool" onclick="abreMenu('mMais')" title="Mais">···</button>
        <div class="menu" id="mMais">
          <button onclick="novoCard('Backlog')">Nova ação</button>
          <button id="btTema" onclick="trocaTema()">Modo claro</button>
          <button onclick="limpaFiltros()">Limpar filtros</button>
          <button onclick="resetar()">Resetar dados de teste</button>
          <div class="tit">Ambiente de teste · dados só neste navegador</div>
        </div>
      </div>
    </div>

    <div class="cols" id="cols"></div>
  </main>
</div>

<!-- ══════════ modal ══════════ -->
<div class="mbg" id="mbg">
  <div class="modal">
    <h3 id="mTit">Editar ação</h3>
    <div class="f"><label>Título</label><textarea id="mAcao"></textarea></div>
    <div class="f"><label>Assunto</label><select id="mAssunto"></select></div>
    <div class="f3">
      <div class="f"><label>Responsável</label><select id="mResp"></select></div>
      <div class="f"><label>Prazo</label><input type="date" id="mPrazo"></div>
      <div class="f"><label>Etapa</label><select id="mStatus"></select></div>
    </div>
    <div class="f" style="margin-top:13px"><label>Acompanhamento</label><textarea id="mObs" style="min-height:110px"></textarea></div>
    <div class="macoes">
      <button class="b del" id="mDel" onclick="excluir()">Excluir</button>
      <div style="display:flex;gap:10px">
        <button class="b gho" onclick="fechaModal()">Fechar</button>
        <button class="b pri" onclick="salvar()">Salvar</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
const SUPABASE_URL='https://lozwipoeacpvplgkrxkq.supabase.co';
const SUPABASE_KEY='sb_publishable_ggKEEebc5zjgQDVsF92Upw_6uoLmKe9';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// as quatro etapas da referência
const ETAPAS=['Backlog','Planning','Doing','Done'];
const STATUS=[...ETAPAS,'Cancelada'];
const PADRAO='Backlog';
const PROG={Backlog:0,Planning:15,Doing:55,Done:100};
const ASSUNTOS=['Governança','Custos','Projetos','Disponibilidade','Xadrez de Frota','Capacitação Técnica',
  'Contratos de Manutenção','Contratos de Locação','Km Rodado','Descarte de Resíduos','Pneus','Stress Test','CIVF',
  'Conformidade da Frota','Estoque','Demarco','DPO/VPO','Combustível','Manutenção','MTBF','MTTR',
  'Blitz de Segurança','Checklist','Viagens','Processos'];

let sb=null, LINHAS=[], NOMES=[], EU='';
let BUSCA='', VISAO='', RESP=new Set(), ASS=new Set();
const RECOLHIDAS=new Set();

/* ── utilidades ── */
const hoje=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
function estadoPrazo(r){
  if(r.status==='Done'||r.status==='Cancelada') return 'ok';
  if(!r.prazo) return 'sem';
  return new Date(r.prazo+'T00:00:00') < hoje() ? 'venc' : 'ok';
}
const dias=iso=>Math.round((new Date(iso+'T00:00:00')-hoje())/86400000);
const dataBR=iso=>iso?iso.split('-').reverse().join('/'):'';
const desde=iso=>iso?(Date.now()-new Date(iso))/864e5:Infinity;
function iniciais(n){
  const p=String(n||'').trim().split(/\s+/).filter(Boolean);
  if(!p.length) return '?';
  return (p.length>1?p[0][0]+p[p.length-1][0]:p[0].slice(0,2)).toUpperCase();
}
function cor(n){let h=0;const s=String(n||'');for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;
  return `hsl(${Math.abs(h)%360} 52% 68%)`;}
const nomeFmt=s=>{s=String(s||'').trim().replace(/\s+/g,' ');if(!s)return '';
  const p=s.split(' ');return p.length>1?p[0]+' '+p[p.length-1]:p[0];};
// no lugar do número da referência: assunto + um id curto e estável
const idCurto=r=>String(r.id).replace(/[^0-9a-z]/gi,'').slice(-6).toUpperCase();

/* ── dados ── */
const doBanco=d=>({id:d.id,assunto:d.assunto||'',acao:d.acao||'',resp:d.responsavel||'',
  prazo:d.prazo||'',status:STATUS.includes(d.status)?d.status:PADRAO,
  obs:d.acompanhamento||'',criado:d.created_at||''});

async function carregar(){
  const {data,error}=await sb.from('planner').select('*').order('created_at',{ascending:true});
  if(error){ $('cols').innerHTML=`<div class="cvazia">Erro ao carregar: ${esc(error.message)}</div>`; return; }
  LINHAS=(data||[]).map(doBanco);
  montaMenus(); render();
}

/* ── filtros ── */
function daVisao(r,v){
  if(v==='minhas')   return !!EU && nomeFmt(r.resp)===EU;
  if(v==='vencidas') return estadoPrazo(r)==='venc';
  if(v==='semprazo') return !r.prazo;
  if(v==='semresp')  return !r.resp;
  if(v==='recentes') return desde(r.criado)<=7;
  if(v==='concl3s')  return r.status==='Done' && desde(r.criado)<=21;
  return true;
}
function passa(r){
  if(BUSCA && ![r.acao,r.assunto,r.resp,r.obs].some(x=>String(x||'').toLowerCase().includes(BUSCA))) return false;
  if(RESP.size && !RESP.has(r.resp)) return false;
  if(ASS.size && !ASS.has(r.assunto)) return false;
  return daVisao(r,VISAO);
}

/* ── render ── */
function card(r){
  const pz=estadoPrazo(r);
  const fim=(r.status==='Done'||r.status==='Cancelada')?' fim':'';
  const pct=PROG[r.status]!=null?PROG[r.status]:0;
  let meta;
  if(!r.prazo) meta='sem prazo';
  else if(pz==='venc') meta=`<span class="atraso">${dataBR(r.prazo)} · ${Math.abs(dias(r.prazo))}d de atraso</span>`;
  else meta=dataBR(r.prazo)+(r.status==='Done'||r.status==='Cancelada'?'':` · ${dias(r.prazo)}d`);
  const av=r.resp
    ? `<div class="avs"><span class="av" style="--av:${cor(r.resp)}" title="${esc(r.resp)}">${esc(iniciais(r.resp))}</span></div>`
    : `<button class="add-av" title="Definir responsável">+</button>`;
  const barra = r.status==='Backlog'
    ? '<div class="bar" style="visibility:hidden"></div>'
    : `<div class="bar${r.status==='Done'?' done':''}"><i style="width:${pct}%"></i></div>`;
  return `<article class="card ${pz}${fim}" draggable="true" data-id="${esc(r.id)}">
    <div class="cid">${esc(r.assunto||'—')} · ${idCurto(r)}</div>
    <div class="ctit">${esc(r.acao)||'(sem título)'}</div>
    <div class="cmeta">${meta}</div>
    <div class="cfoot">${barra}${av}</div>
  </article>`;
}
function render(){
  const vis=LINHAS.filter(passa);
  $('cols').innerHTML=ETAPAS.map(e=>{
    const cards=vis.filter(r=>(r.status||PADRAO)===e)
      .sort((a,b)=>(a.prazo||'9999-99-99').localeCompare(b.prazo||'9999-99-99'));
    return `<section class="col${RECOLHIDAS.has(e)?' rec':''}" data-etapa="${e}">
      <div class="chead">
        <span class="cname">${e}</span><span class="cnum">${cards.length}</span>
        <button class="ic" title="Nova ação" data-novo="${e}">+</button>
        <button class="ic" title="Recolher coluna" data-rec="${e}">···</button>
      </div>
      <div class="cbody">${cards.length?cards.map(card).join(''):'<div class="cvazia">—</div>'}</div>
    </section>`;
  }).join('');
  document.querySelectorAll('.n[data-n]').forEach(el=>{
    const n=LINHAS.filter(r=>daVisao(r,el.dataset.n)).length;
    el.textContent=n||'';
  });
  document.querySelectorAll('.s-item[data-vis]').forEach(b=>{
    if(b.id==='btQuadro') b.classList.toggle('on',!VISAO);
    else b.classList.toggle('on',!!b.dataset.vis && VISAO===b.dataset.vis);
  });
  $('btPessoas').classList.toggle('on',RESP.size>0);
  $('btFiltro').classList.toggle('on',ASS.size>0);
}

/* ── menus do topo ── */
function abreMenu(id){
  document.querySelectorAll('.menu.open').forEach(m=>{if(m.id!==id)m.classList.remove('open');});
  $(id).classList.toggle('open');
}
document.addEventListener('click',e=>{
  if(!e.target.closest('.menu-wrap')) document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
});
function montaMenus(){
  const pessoas=[...new Set([...NOMES,...LINHAS.map(r=>r.resp).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'pt'));
  $('lstPessoas').innerHTML=pessoas.length
    ? pessoas.map(n=>`<label><input type="checkbox" data-p="${esc(n)}" ${RESP.has(n)?'checked':''}> ${esc(n)}</label>`).join('')
    : '<div class="tit">ninguém cadastrado</div>';
  const assuntos=[...new Set([...LINHAS.map(r=>r.assunto).filter(Boolean),...ASSUNTOS])].sort((a,b)=>a.localeCompare(b,'pt'));
  $('lstAssuntos').innerHTML=assuntos.map(a=>
    `<label><input type="checkbox" data-a="${esc(a)}" ${ASS.has(a)?'checked':''}> ${esc(a)}</label>`).join('');
}
$('lstPessoas').addEventListener('change',e=>{
  const b=e.target; if(!b.dataset.p) return;
  b.checked?RESP.add(b.dataset.p):RESP.delete(b.dataset.p); render();
});
$('lstAssuntos').addEventListener('change',e=>{
  const b=e.target; if(!b.dataset.a) return;
  b.checked?ASS.add(b.dataset.a):ASS.delete(b.dataset.a); render();
});
function limpaFiltros(){
  RESP.clear(); ASS.clear(); VISAO=''; BUSCA=''; $('busca').value='';
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  montaMenus(); render();
}

/* ── barra lateral ── */
document.querySelectorAll('.s-item[data-vis]').forEach(b=>b.addEventListener('click',()=>{
  const v=b.dataset.vis;
  VISAO = (v && VISAO===v) ? '' : v;    // clicar de novo desliga
  render();
}));
$('busca').addEventListener('input',()=>{ BUSCA=$('busca').value.trim().toLowerCase(); render(); });
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('busca').focus(); }
  if(e.key==='Escape'){ fechaModal(); document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open')); }
});

/* ── cliques e arrastar dentro do quadro ── */
const cols=$('cols');
cols.addEventListener('click',e=>{
  const novo=e.target.closest('[data-novo]'); if(novo){ novoCard(novo.dataset.novo); return; }
  const rec=e.target.closest('[data-rec]');
  if(rec){ const k=rec.dataset.rec; RECOLHIDAS.has(k)?RECOLHIDAS.delete(k):RECOLHIDAS.add(k); render(); return; }
  const c=e.target.closest('.card'); if(c) abreModal(c.dataset.id);
});
cols.addEventListener('dragstart',e=>{
  const c=e.target.closest('.card'); if(!c) return;
  e.dataTransfer.setData('text/plain',c.dataset.id); e.dataTransfer.effectAllowed='move';
  c.classList.add('arrasta');
});
cols.addEventListener('dragend',e=>{const c=e.target.closest('.card');if(c)c.classList.remove('arrasta');});
cols.addEventListener('dragover',e=>{const c=e.target.closest('.col');if(!c)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';c.classList.add('over');});
cols.addEventListener('dragleave',e=>{const c=e.target.closest('.col');if(c)c.classList.remove('over');});
cols.addEventListener('drop',async e=>{
  const c=e.target.closest('.col'); if(!c) return;
  e.preventDefault(); c.classList.remove('over');
  const id=e.dataTransfer.getData('text/plain'), etapa=c.dataset.etapa;
  const r=LINHAS.find(x=>x.id===id); if(!r||r.status===etapa) return;
  const antes=r.status; r.status=etapa; render();
  const {error}=await sb.from('planner').update({status:etapa}).eq('id',id);
  if(error){ r.status=antes; render(); alert('Erro ao mover: '+error.message); }
});

/* ── modal ── */
let ID=null;
const opcoes=(lista,sel)=>'<option value="">—</option>'+
  lista.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');
function preenche(r){
  $('mAcao').value=r.acao||'';
  $('mAssunto').innerHTML=opcoes([...new Set([...(r.assunto?[r.assunto]:[]),...ASSUNTOS])],r.assunto||'');
  $('mResp').innerHTML=opcoes([...new Set([...(r.resp?[r.resp]:[]),...NOMES])],r.resp||'');
  $('mPrazo').value=r.prazo||'';
  $('mStatus').innerHTML=STATUS.map(s=>`<option${s===(r.status||PADRAO)?' selected':''}>${s}</option>`).join('');
  $('mObs').value=r.obs||'';
}
function abreModal(id){
  const r=LINHAS.find(x=>x.id===id); if(!r) return;
  ID=id; $('mTit').textContent='Editar ação'; $('mDel').style.display='';
  preenche(r); $('mbg').classList.add('open'); setTimeout(()=>$('mAcao').focus(),40);
}
function novoCard(etapa){
  ID=null; $('mTit').textContent='Nova ação'; $('mDel').style.display='none';
  preenche({status:etapa||PADRAO});
  document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  $('mbg').classList.add('open'); setTimeout(()=>$('mAcao').focus(),40);
}
function fechaModal(){ $('mbg').classList.remove('open'); ID=null; }
$('mbg').addEventListener('click',e=>{ if(e.target===$('mbg')) fechaModal(); });
async function salvar(){
  const dados={assunto:$('mAssunto').value,acao:$('mAcao').value.trim(),responsavel:$('mResp').value,
    prazo:$('mPrazo').value||null,status:$('mStatus').value,acompanhamento:$('mObs').value.trim()};
  if(!dados.acao && !dados.responsavel && !dados.assunto){ fechaModal(); return; }
  if(ID){
    const r=LINHAS.find(x=>x.id===ID);
    const {error}=await sb.from('planner').update(dados).eq('id',ID);
    if(error){ alert('Erro ao salvar: '+error.message); return; }
    if(r) Object.assign(r,doBanco({id:ID,...dados,created_at:r.criado}));
  }else{
    const {data,error}=await sb.from('planner').insert(dados).select('*').single();
    if(error){ alert('Erro ao criar: '+error.message); return; }
    LINHAS.push(doBanco(data));
  }
  montaMenus(); render(); fechaModal();
}
async function excluir(){
  if(!ID||!confirm('Excluir esta ação?')) return;
  const {error}=await sb.from('planner').delete().eq('id',ID);
  if(error){ alert('Erro ao excluir: '+error.message); return; }
  LINHAS=LINHAS.filter(x=>x.id!==ID); render(); fechaModal();
}
function resetar(){ if(typeof plannerTesteResetar==='function') plannerTesteResetar(); }

/* ── tema: mesmo layout, só as superfícies mudam ── */
function aplicaTema(t){
  document.body.classList.toggle('claro',t==='light');
  localStorage.setItem('bi_theme',t);
  $('btTema').textContent = t==='light' ? 'Modo escuro' : 'Modo claro';
}
function trocaTema(){ aplicaTema(document.body.classList.contains('claro')?'dark':'light'); }
aplicaTema(localStorage.getItem('bi_theme')||'dark');

/* ── início ── */
async function iniciar(){
  sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ location.replace('../'); return; }
  try{
    const {data:profs}=await sb.from('fca_profiles').select('user_id,nome').eq('is_admin',true);
    NOMES=[...new Set((profs||[]).map(p=>nomeFmt(p.nome)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt'));
  }catch(e){}
  EU=nomeFmt((session.user.user_metadata&&session.user.user_metadata.name)||session.user.email||'');
  if(EU && !NOMES.includes(EU)) NOMES.unshift(EU);
  $('euNome').textContent=EU||'—';
  $('euAv').textContent=iniciais(EU);
  $('euAv').style.setProperty('--av',cor(EU));
  await carregar();
}
iniciar();
</script>
