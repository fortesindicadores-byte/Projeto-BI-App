name: Prolog Diag (descarte)

# Diagnóstico temporário: descobre o campo de data do descarte na API /tires.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar diagnóstico
        run: node scripts/prolog-diag.mjs
        env:
          PROLOG_TOKEN: ${{ secrets.PROLOG_TOKEN }}
