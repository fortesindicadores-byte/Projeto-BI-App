name: Arvore Comb Inspect (auditoria)

# Compara os rótulos de projeto das três fontes da Árvore de Combustível
# (Frota, Dispersão de km e Km/L) para achar o projeto que não casa no filtro.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspecionar
        run: node scripts/arvore-comb-inspect.mjs
