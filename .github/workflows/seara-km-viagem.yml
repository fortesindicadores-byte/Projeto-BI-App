name: Seara KM por Viagem

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/epic-edison-ae21sz
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: KM por viagem × KM Rodado, placas e cobertura
        run: node scripts/seara-km-viagem.mjs
