name: Peso Boot (auditoria)

# Mede quantos bytes/quanto tempo cada consulta da abertura dos painéis custa.
# Só leitura.
on:
  workflow_dispatch:

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Medir
        run: node scripts/peso-boot.mjs
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
