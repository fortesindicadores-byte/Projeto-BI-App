name: RPM Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Reproduz o filtro do "Gerar Desvios da RPM" contra a Base RPM
        run: node scripts/rpm-inspect.mjs
