name: Pneus Desgaste Inspect

on:
  workflow_dispatch:
    inputs:
      branch_id:
        description: "branch_id da unidade (38=PIR, 1907=CBA T1, 20=FLP…)"
        required: false
        default: "38"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspecionar desgaste da unidade
        env:
          BRANCH: ${{ inputs.branch_id }}
        run: node scripts/pneus-desgaste-inspect.mjs
