name: DriverPro Check

on:
  workflow_dispatch:
    inputs:
      cpf:
        description: 'CPF de teste (só dígitos). Vazio = o motorista de teste teste:driverpro, que o check cria sozinho'
        required: false
        default: ''
      pin:
        description: 'PIN de 4 dígitos'
        required: false
        default: '1234'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Login, dados e saída do app com a chave anon
        env:
          DP_CPF: ${{ inputs.cpf }}
          DP_PIN: ${{ inputs.pin }}
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/driverpro-check.mjs
