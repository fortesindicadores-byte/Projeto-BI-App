name: Carta RLS Check (auditoria)

# Confere quem tem mais de uma unidade no perfil e se esses usuários já
# conseguiram lançar na Carta de Custos. Só leitura; nomes mascarados.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar check
        run: node scripts/carta-rls-check.mjs
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
