name: Gviz Robot

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"   # de hora em hora (o gviz-cache aceita snapshot de até 3h)

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Baixar abas do Sheets e gravar no Supabase
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/gviz-robot.mjs
