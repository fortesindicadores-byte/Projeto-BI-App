name: FCA Gantt Inspect (auditoria)

# Lista, por vigência, o intervalo de created_at/prazo das linhas do fca e as
# linhas com data fora da janela — é o que estica a escala do Gantt. Só leitura.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar inspeção
        run: node scripts/fca-gantt-inspect.mjs
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
