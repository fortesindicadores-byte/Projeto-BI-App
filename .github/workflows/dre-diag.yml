name: DRE Diag (comparar fontes)

# Diagnóstico temporário: compara Consolidado DRE × (Frota + Receita Líquida).
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar comparação
        run: node scripts/dre-diag.mjs
