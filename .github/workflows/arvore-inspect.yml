name: Árvore Inspect (dump abas-fonte)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dump abas-fonte da Árvore
        run: node scripts/arvore-inspect.mjs
