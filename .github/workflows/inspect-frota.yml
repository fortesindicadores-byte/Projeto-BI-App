name: inspect-frota
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and inspect Frota tab
        run: |
          SHEET=1qcTy2ppLCGBKKqZCxCYWCTL9kTAuWfHBMyBfWJOyih8
          curl -sL "https://docs.google.com/spreadsheets/d/$SHEET/gviz/tq?tqx=out:json&sheet=Frota" -o frota.txt
          echo "bytes: $(wc -c < frota.txt)"
          python3 - <<'PY'
          import json,re,collections
          raw=open('frota.txt',encoding='utf-8').read()
          body=re.sub(r'^[\s\S]*?\(','',raw); body=re.sub(r'\);?\s*$','',body)
          j=json.loads(body)
          cols=[c.get('label','') for c in j['table']['cols']]
          rows=j['table']['rows']
          print('COLS',cols)
          def val(r,i):
              c=r['c'][i] if 0<=i<len(r['c']) else None
              return c.get('v') if c else None
          def norm(s):
              import unicodedata
              return ''.join(ch for ch in unicodedata.normalize('NFD',str(s)) if unicodedata.category(ch)!='Mn').lower().strip()
          def idx(*names):
              nc=[norm(c) for c in cols]
              for n in names:
                  if norm(n) in nc: return nc.index(norm(n))
              for n in names:
                  for k,c in enumerate(nc):
                      if norm(n) in c: return k
              return -1
          iUni=idx('unidade'); iN3=idx('nível 3','nivel3'); iCta=idx('conta gerencial','conta'); iMes=idx('mês','mes'); iAno=idx('ano'); iOrc=idx('orçado','orcado'); iRem=idx('remunerado'); iReal=idx('realizado')
          print('IDX uni=%d nv3=%d cta=%d mes=%d ano=%d orc=%d rem=%d real=%d'%(iUni,iN3,iCta,iMes,iAno,iOrc,iRem,iReal))
          print('--- coluna UNIDADE (top 20) ---')
          for k,c in collections.Counter(str(val(r,iUni)) for r in rows).most_common(20): print(c,repr(k))
          print('--- ANOs presentes ---')
          for k,c in sorted(collections.Counter(int(val(r,iAno)) for r in rows if val(r,iAno)).items()): print(k,c)
          # ano mais recente
          anos=[int(val(r,iAno)) for r in rows if val(r,iAno)]
          amax=max(anos)
          print('ANO MAX',amax)
          print('--- MESES no ano %d (com soma de ORÇADO) ---'%amax)
          mm=collections.defaultdict(lambda:[0,0.0])
          for r in rows:
              if val(r,iAno) and int(val(r,iAno))==amax:
                  m=str(val(r,iMes)); mm[m][0]+=1; mm[m][1]+=float(val(r,iOrc) or 0)
          for m,(c,o) in mm.items(): print(repr(m),'linhas=%d orc_total=%.0f'%(c,o))
          # amostra CGR (via sufixo Nível 3) no ano max, conta manutencao
          print('--- CGR (sufixo Nível 3) · Manutenção de Veículos · ano %d ---'%amax)
          n=0
          for r in rows:
              nv3=str(val(r,iN3)); suf=nv3.split('-')[-1].strip().upper()
              cta=str(val(r,iCta))
              if suf=='CGR' and 'Manutenção de Veículos' in cta and val(r,iAno) and int(val(r,iAno))==amax:
                  print('mes=%r uni=%r nv3=%r orc=%s rem=%s real=%s'%(val(r,iMes),val(r,iUni),nv3,val(r,iOrc),val(r,iRem),val(r,iReal)))
                  n+=1
                  if n>=14: break
          print('encontrados',n)
          PY
