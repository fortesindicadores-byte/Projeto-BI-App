name: Conf Detalhe Check (auditoria)

# Audita o conformidade-detalhe gravado: linhas por filial em cada vigência,
# duplicatas exatas e distribuição de status. Só leitura.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar auditoria
        run: node scripts/conf-detalhe-check.mjs
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
