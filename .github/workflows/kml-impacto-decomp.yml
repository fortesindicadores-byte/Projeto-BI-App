name: Km/L Impacto Decomp

on:
  workflow_dispatch:
    inputs:
      vig_ate:
        description: 'Janela = jan até esta vigência (YYYY-MM)'
        required: false
        default: '2026-07'

jobs:
  decomp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/epic-edison-ae21sz
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decompõe a mudança do impacto
        env:
          VIG_ATE: ${{ inputs.vig_ate }}
        run: node scripts/kml-impacto-decomp.mjs
