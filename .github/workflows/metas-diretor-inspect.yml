name: Metas Diretor Inspect (dump abas)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dump das abas do workbook Metas Diretor
        run: node scripts/metas-diretor-inspect.mjs
