name: Contratos Robot (planilha → Carta de Custos)

# Sobe o custo de CONTRATO (manutenção por km) da planilha "Contratos Man."
# para a carta_custos. O valor lançado num mês compõe o custo do MÊS SEGUINTE
# (regra do Renan, 01/09/2026). Upsert por origem_chave: rodar de novo corrige
# em vez de duplicar, e não encosta em lançamento manual.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'previa (não grava) · gravar'
        required: true
        default: previa
        type: choice
        options: [previa, gravar]
      vig:
        description: 'Só uma vigência, formato AAAA-MM (vazio = todas)'
        required: false
      sheet:
        description: 'ID da planilha (vazio = Contratos Man.)'
        required: false
  schedule:
    # A unidade preenche no começo do mês; o robô passa todo dia 08h BRT e
    # atualiza o que já estiver lançado (upsert, sem duplicar).
    - cron: '0 11 * * *'

jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Subir contratos
        env:
          CT_MODE: ${{ github.event.inputs.modo || 'gravar' }}
          CT_VIG:  ${{ github.event.inputs.vig }}
          CONTRATOS_ID: ${{ github.event.inputs.sheet }}
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
        run: node scripts/contratos-robot.mjs
