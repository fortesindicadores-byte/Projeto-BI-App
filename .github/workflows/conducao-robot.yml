name: Conducao Robot

# Coletor de telemetria da Condução Econômica (vFleets · Geotab).
# A API DaaS aceita 1 requisição a cada 5 minutos, então cada dia coletado
# custa ~5 min de execução — um mês inteiro leva ~2h30.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'sonda (não grava) · ident (identificação por placa) · marcha (sonda do pilar Uso de Marchas) · marchacalc (marcha derivada de rpm÷velocidade, valida contra o gabarito) · rpmcov (placas que nunca reportam rpm no período) · base (motoristas com base para medir no mês) · banguela (quanto se roda em ponto morto) · ano (01/jan→ontem) · run · recalc · reproc'
        required: true
        default: sonda
        type: choice
        options: [sonda, ident, marcha, marchacalc, rpmcov, base, banguela, ano, run, recalc, reproc]
      de:
        description: 'Data inicial YYYY-MM-DD (vazio = ontem)'
        required: false
      ate:
        description: 'Data final YYYY-MM-DD (vazio = igual à inicial)'
        required: false
      refazer:
        description: 'Recoletar dias já gravados (CE_REFAZER=1)'
        required: false
        type: boolean
        default: false
      diag_lim:
        description: 'sonda: quantos diagnósticos candidatos varrer (99999 = todos)'
        required: false
      mes:
        description: 'base: mês a analisar, AAAA-MM (vazio = 2026-08)'
        required: false
      bang_vmin:
        description: 'banguela: km/h a partir do qual neutro conta (padrão 20)'
        required: false
      marcha_alto:
        description: 'Uso de Marchas: rpm acima do qual conta como esticando (padrão 1900)'
        required: false
      marcha_baixo:
        description: 'Uso de Marchas: rpm abaixo do qual conta como forçando (padrão 1000)'
        required: false
  schedule:
    # O painel mostra 01/jan → hoje, então o cron roda no modo `ano`: ele pula
    # os dias já gravados e coleta só o que falta. No dia a dia isso é um dia
    # só (~5 min); depois de um buraco, ele mesmo se recompõe.
    - cron: '20 10 * * *'   # 07:20 BRT

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Coletar
        env:
          CE_MODE: ${{ github.event.inputs.modo || 'ano' }}
          CE_DE:   ${{ github.event.inputs.de }}
          CE_ATE:  ${{ github.event.inputs.ate }}
          CE_REFAZER: ${{ github.event.inputs.refazer == 'true' && '1' || '' }}
          CE_DIAG_LIM: ${{ github.event.inputs.diag_lim }}
          CE_MES: ${{ github.event.inputs.mes }}
          CE_BANG_VMIN: ${{ github.event.inputs.bang_vmin }}
          CE_MARCHA_ALTO:  ${{ github.event.inputs.marcha_alto }}
          CE_MARCHA_BAIXO: ${{ github.event.inputs.marcha_baixo }}
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
          VFLEETS_TOKEN: ${{ secrets.VFLEETS_TOKEN }}
          GEOTAB_USER:   ${{ secrets.GEOTAB_USER }}
          GEOTAB_PASS:   ${{ secrets.GEOTAB_PASS }}
          GEOTAB_DB:     ${{ secrets.GEOTAB_DB }}
          GEOTAB_SERVER: ${{ secrets.GEOTAB_SERVER }}
        run: node scripts/conducao-robot.mjs
