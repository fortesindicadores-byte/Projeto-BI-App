name: KM R$/km Pacotes

on:
  workflow_dispatch:
    inputs:
      vig:
        description: 'Vigência MM/AAAA (vazio = última com dado)'
        required: false
        default: ''

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/epic-edison-ae21sz
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: R$/km remunerado dos 3 pacotes × impacto de hoje
        env:
          VIG: ${{ inputs.vig }}
        run: node scripts/km-rskm-pacotes.mjs
