name: Planner Nomes Check (auditoria)

# Lista as grafias do campo Responsável do Planner e aponta as que são a mesma
# pessoa escrita de dois jeitos. Só leitura; sobrenomes mascarados.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rodar check
        run: node scripts/planner-nomes-check.mjs
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
