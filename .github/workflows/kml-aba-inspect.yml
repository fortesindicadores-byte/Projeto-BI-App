name: KmL Aba Inspect (auditoria)

# Mostra o que o gviz devolve da aba Km/L (workbook Consumo) — a aba que
# alimenta os cards KM/L e R$/L da Árvore de Combustível. Só leitura.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspecionar
        run: node scripts/kml-aba-inspect.mjs
