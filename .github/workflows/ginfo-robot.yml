name: Ginfo Robot (Power BI -> Supabase)

# Exporta os visuais do BI do Ginfo e grava em ginfo_snapshot (Supabase).
# 1ª fase: rodar manualmente no modo "login" p/ validar o acesso (screenshots
# ficam nos artifacts do run). Depois de mapear as abas, ativar o cron.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: "login = só testa o acesso · run = exporta e grava"
        required: true
        default: "login"
        type: choice
        options: [login, run]
  # todo dia às 7:00 BRT (10:00 UTC) — baixa as 7 abas e atualiza o Supabase.
  # (só roda a partir da branch main — agendamento do GitHub é sempre na default)
  schedule:
    - cron: '0 10 * * *'

concurrency:
  group: ginfo-robot
  cancel-in-progress: false

jobs:
  robo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright + xlsx
        run: |
          npm init -y >/dev/null 2>&1
          npm i --no-audit --no-fund playwright xlsx
          npx playwright install --with-deps chromium
      - name: Rodar robô
        run: node scripts/ginfo-robot.mjs
        env:
          # dispatch manual usa o modo escolhido; o cron diário roda em 'run'
          GINFO_MODE:               ${{ github.event.inputs.modo || 'run' }}
          GINFO_USER:               ${{ secrets.GINFO_USER }}
          GINFO_PASS:               ${{ secrets.GINFO_PASS }}
          GINFO_URL:                ${{ secrets.GINFO_URL }}
          GINFO_EMPRESA:            ${{ secrets.GINFO_EMPRESA }}
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
      - name: Avisar por e-mail se falhar
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM:      ${{ vars.MAIL_FROM }}
          MAIL_TO:        ${{ vars.MAIL_TO }}
        run: |
          if [ -z "$RESEND_API_KEY" ]; then echo "RESEND_API_KEY ausente — aviso por e-mail desligado"; exit 0; fi
          FROM="${MAIL_FROM:-BI Frota <onboarding@resend.dev>}"
          # Sem domínio verificado, a Resend só entrega para o e-mail dono da
          # conta — por isso o destino é uma variável (vars.MAIL_TO).
          TO="${MAIL_TO:-renan.fortes@conlogsa.com.br}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RESP=$(curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(printf '{"from":"%s","to":["%s"],"subject":"⚠ %s falhou (%s)","html":"O robô <b>%s</b> falhou no run de %s.<br><br>Log: <a href=\\"%s\\">%s</a><br><br>Um dia isolado se cura sozinho (o cron do dia seguinte completa o que faltou). Se este e-mail repetir por 3 dias, algo mudou no Ginfo."}' \
              "$FROM" "$TO" "${{ github.workflow }}" "$(date -u -d '-3 hours' +%d/%m/%Y)" "${{ github.workflow }}" "$(date -u -d '-3 hours' '+%d/%m/%Y %H:%M') BRT" "$URL" "$URL")")
          echo "$RESP"
          # O curl devolve 0 mesmo quando a Resend recusa (403 de domínio não
          # verificado, destinatário fora da conta…). Sem esta checagem o robô
          # falhava em silêncio: em 08/2026 foram 7 dias sem coleta e sem aviso,
          # porque o e-mail era recusado todo dia e ninguém via.
          if echo "$RESP" | grep -q '"statusCode"'; then
            echo "::error::O AVISO POR E-MAIL NÃO FOI ENTREGUE — a Resend recusou (resposta acima)."
            echo "::error::Configure a variável MAIL_TO com o e-mail dono da conta Resend, ou verifique um domínio em resend.com/domains."
          fi

      - name: Publicar screenshots/downloads (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ginfo-artifacts
          path: ginfo-artifacts/
          if-no-files-found: ignore
          retention-days: 7
