name: Seara Abas Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/epic-edison-ae21sz
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lista abas e cabeçalhos do workbook Seara
        run: node scripts/seara-abas-inspect.mjs
