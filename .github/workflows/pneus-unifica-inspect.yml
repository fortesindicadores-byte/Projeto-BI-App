name: Pneus Unifica Inspect

# Inspeção pontual: lista tabelas/colunas do projeto Supabase antigo (pneus)
# para planejar a unificação no projeto principal. Só leitura, chave anon.
on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/pneus-unifica-inspect.mjs
