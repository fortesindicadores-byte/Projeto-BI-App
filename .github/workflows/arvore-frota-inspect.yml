name: Árvore Frota Inspect (valida painel /arvore-frota/)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Valida a Árvore de Custo da Frota a partir das abas-fonte
        run: node scripts/arvore-frota-validate.mjs
