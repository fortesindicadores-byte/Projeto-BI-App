name: Seara R$/km Decomp

on:
  workflow_dispatch:
    inputs:
      vigs:
        description: 'Vigências MM/AAAA separadas por vírgula (vazio = todas)'
        required: false
        default: ''

jobs:
  decomp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/epic-edison-ae21sz
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decompõe o R$/km por componente
        env:
          VIGS: ${{ inputs.vigs }}
        run: node scripts/seara-rskm-decomp.mjs
