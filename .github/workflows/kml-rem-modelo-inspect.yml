name: KML Rem Modelo Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspeciona Base Remunerado Modelo + Km/L
        run: node scripts/kml-rem-modelo-inspect.mjs
