name: Painel de Metas Inspect (dump aba fonte)

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Valida linhas de Custos/Ranking em Junho/26
        run: node scripts/painel-metas-validate.mjs
