name: Km/L Rem Abril Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Investiga salto do Km/L Rem Médio em abril (ACTROS)
        run: node scripts/kml-rem-abril-inspect.mjs
