name: inspect-seara
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ANG (Seara) in Frota
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,collections
          def gviz(id, sheet=None):
              base=f"https://docs.google.com/spreadsheets/d/{id}/gviz/tq?tqx=out:json"
              if sheet: base+="&sheet="+urllib.parse.quote(sheet)
              raw=urllib.request.urlopen(base, timeout=60).read().decode('utf-8')
              body=re.sub(r'^[\s\S]*?\(','',raw); body=re.sub(r'\);?\s*$','',body)
              return [[ (c.get('v') if c else None) for c in (r.get('c') or []) ] for r in json.loads(body)['table']['rows']]
          def uni(v):
              if not v: return ''
              v=str(v); i=v.find('-'); s=(v[i+1:] if i>=0 else v).strip()
              return re.sub(r'\s*\(INATIVO\)\s*','',s,flags=re.I).strip()
          def prefix(v): return str(v).split('-')[0].strip() if v else ''
          def vigfmt(v):
              m=re.match(r'Date\((\d+),(\d+),',str(v));
              return f"{int(m.group(2))+1:02d}/{m.group(1)}" if m else str(v)
          COST='1qcTy2ppLCGBKKqZCxCYWCTL9kTAuWfHBMyBfWJOyih8'
          frota=gviz(COST, sheet='Frota')
          proj=collections.Counter(); full=collections.Counter()
          bymonth=collections.defaultdict(lambda:[0.0,0.0])
          for r in frota:
              nv3=str(r[4]) if len(r)>4 and r[4] else ''
              if uni(nv3)!='ANG': continue
              rem=abs(float(r[9] or 0)) if len(r)>9 else 0
              real=abs(float(r[10] or 0)) if len(r)>10 else 0
              proj[prefix(nv3)]+=1; full[nv3]+=1
              bymonth[vigfmt(r[0])][0]+=rem; bymonth[vigfmt(r[0])][1]+=real
          print("=== ANG · projetos (prefixo Nível 3) ===")
          for p,c in sorted(proj.items()): print(f"  {p!r}: {c}")
          print("=== ANG · Nível 3 completos ===")
          for v,c in sorted(full.items()): print(f"  {v!r}: {c}")
          print("=== ANG · custo por vigência (rem/real) ===")
          for v,(rm,rl) in sorted(bymonth.items()): print(f"  {v}: rem={rm:.0f} real={rl:.0f}")
          PY
