name: inspect-seara
on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Frota projetos for Seara
        run: |
          python3 - <<'PY'
          import json,re,urllib.request,urllib.parse,collections
          def gviz(id, sheet=None):
              base=f"https://docs.google.com/spreadsheets/d/{id}/gviz/tq?tqx=out:json"
              if sheet: base+="&sheet="+urllib.parse.quote(sheet)
              raw=urllib.request.urlopen(base, timeout=60).read().decode('utf-8')
              body=re.sub(r'^[\s\S]*?\(','',raw); body=re.sub(r'\);?\s*$','',body)
              j=json.loads(body)
              return [[ (c.get('v') if c else None) for c in (r.get('c') or []) ] for r in j['table']['rows']]
          def prefix(v):
              return str(v).split('-')[0].strip() if v else ''
          COST='1qcTy2ppLCGBKKqZCxCYWCTL9kTAuWfHBMyBfWJOyih8'
          frota=gviz(COST, sheet='Frota')
          # vig=0 nv3=4 cta=5 rem=9 real=10
          prefixes=collections.Counter()
          seara_full=collections.Counter()
          seara_month=collections.defaultdict(lambda:[0.0,0.0])
          for r in frota:
              nv3=str(r[4]) if len(r)>4 and r[4] else ''
              p=prefix(nv3)
              rem=abs(float(r[9] or 0)) if len(r)>9 else 0
              real=abs(float(r[10] or 0)) if len(r)>10 else 0
              if rem or real: prefixes[p]+=1
              if 'SEAR' in nv3.upper():
                  seara_full[nv3]+=1
                  seara_month[str(r[0])][0]+=rem; seara_month[str(r[0])][1]+=real
          print("=== FROTA · prefixos Nível 3 (projetos) com custo ===")
          for p,c in sorted(prefixes.items()): print(f"  {p!r}: {c}")
          print("=== FROTA · Nível 3 completos contendo SEAR ===")
          for v,c in sorted(seara_full.items()): print(f"  {v!r}: {c}")
          print("=== FROTA · custo Seara por vigência (col 0) ===")
          for v,(rm,rl) in sorted(seara_month.items()): print(f"  vig={v!r} rem={rm:.0f} real={rl:.0f}")
          PY
