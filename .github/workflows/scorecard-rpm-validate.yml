name: Scorecard RPM Validate (Base RPM vs Consolidado ICs)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Valida o port da Base RPM para o Scorecard
        run: node scripts/scorecard-rpm-validate.mjs
