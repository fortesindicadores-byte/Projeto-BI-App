name: Pneus Unifica Migra

# Copia snapshot + historico_mensal do projeto Supabase antigo (pneus) para o
# principal. Rodar DEPOIS do SQL que cria as tabelas no principal. Idempotente.
on:
  workflow_dispatch:

jobs:
  migra:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/pneus-unifica-migra.mjs
        env:
          GEM_SUPABASE_SERVICE_KEY: ${{ secrets.GEM_SUPABASE_SERVICE_KEY }}
