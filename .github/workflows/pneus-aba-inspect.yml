name: Pneus Aba Inspect

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Inspeciona a aba Pneus do Frota de Elite
        run: node scripts/pneus-aba-inspect.mjs
